# ============================================================================
# application-docker.yml — 全棧 Docker（經 nginx）專用 profile（SPRING_PROFILES_ACTIVE=docker；契約 §0.4 第 4 點、附錄 D.2）
#
# 所有使用者都經 nginx 進來，連線位址相同：限流對「未認證請求」以客戶端 IP 為鍵，所以要讓 Tomcat 還原 nginx 轉送的
# 客戶端位址（server.forward-headers-strategy=native，只信任內網代理）。限流取處理後的 getRemoteAddr()，
# 不自行解析 X-Forwarded-For。
# 🔴 本檔刻意不含 allow-loopback／test-dns-overrides／mock-env（只在 e2e／test profile 載入）。
# ============================================================================
server:
  forward-headers-strategy: native
  tomcat:
    remoteip:
      # 🔴 O-20（契約附錄 D.2；C-16）：Tomcat 的 RemoteIpValve 預設信任「所有私網位址」為可信代理——主機（Docker 閘道）或內網客戶端
      # 進來的請求也是私網位址，其自填的 X-Forwarded-For 就會被採信、換掉未認證限流的桶。這裡縮小成「只信 compose 的 backend-net
      # 子網的 .2～.254」（nginx 在其中；.1 是 Docker 閘道＝主機端進來的位址，刻意排除）。
      # 環境變數 CONSOLE_INTERNAL_PROXIES 覆寫（Java 正規表示式，對 IP 字串整串比對）；子網改了（報 Pool overlaps）兩個要一起改：
      # compose 的 BACKEND_NET_SUBNET 與這個值。預設值與 docker-compose.yml 的 CONSOLE_INTERNAL_PROXIES 預設相同，說明見 backend/README.md。
      internal-proxies: ${CONSOLE_INTERNAL_PROXIES:172\.31\.250\.(?:[2-9]|[1-9]\d|1\d\d|2[0-4]\d|25[0-4])}
console:
  security:
    rate-limit:
      trust-forwarded-for: true
