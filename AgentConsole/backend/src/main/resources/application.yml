# AgentConsole console-api 主設定（所有環境相關值皆可由環境變數覆寫；PRD §9.4「配置外部化」）。
# Spring Boot 寬鬆綁定：環境變數 SPRING_DATASOURCE_URL／_USERNAME／_PASSWORD 會直接覆寫下方 spring.datasource.*。
spring:
  application:
    name: console
  datasource:
    url: jdbc:postgresql://localhost:5432/aisdlc
    username: aisdlc
    # password 刻意不給預設值：SPRING_DATASOURCE_PASSWORD 必填（缺則連線失敗，不是靜默用弱密碼）。
  servlet:
    multipart:
      # 匯入上傳（契約 §1.1.1、附錄 D.1）：檔案 10MB、整個 multipart 請求 11MB；設定檔匯入另有 1MB 的應用層檢查。
      max-file-size: 10MB
      max-request-size: 11MB
  jpa:
    open-in-view: false
    hibernate:
      # Flyway 擁有 DDL（ADR-001 D5）：實體與遷移不一致＝實體寫錯，啟動即失敗。
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: console
        jdbc:
          time_zone: UTC
  flyway:
    # 啟動即遷移（PRD §11.7 第 6 步的手動 Flyway 指令作廢，ADR-001 D14-11）。
    schemas: console
    default-schema: console
    locations: classpath:db/migration
  data:
    redis:
      # 🔴 host／port 刻意不給預設值（v1.4，D-19；契約 §1.9.2、附錄 D.2）：未設＝不連 Redis，refresh token 撤銷名單用單實例記憶體
      # （console.security.refresh-revocation.store=auto）。docker compose 設 SPRING_DATA_REDIS_HOST=redis／SPRING_DATA_REDIS_PORT=6379
      # （Spring Boot 寬鬆綁定直接覆寫）。Redis 只被撤銷名單使用；限流計數與 SSE 位移不用它（ADR-001 D16／D23）。
      # 逾時取短：Redis 不在線時每次呼叫最多等這麼久就降級為記憶體，不拖慢登入與換新。
      connect-timeout: 2s
      timeout: 2s
      # 不使用 Spring Data Redis 的 repository 掃描（本專案只用 StringRedisTemplate；免得與 JPA repository 互相掃描而多出一堆日誌）。
      repositories:
        enabled: false

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        # /actuator/health 與 /actuator/prometheus 免認證（SecurityConfig）；nginx 對外擋 /actuator/。
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    redis:
      # 🔴 必須（v1.4，D-19；契約 §1.9.2）：classpath 有 Redis 時 Spring Boot 會自動註冊 Redis 健康指標，Redis 不在線會讓
      # /actuator/health 變 DOWN、backend 容器 unhealthy——正好違背「Redis 不在線仍可用」的降級承諾（ADR-001 D16）。
      enabled: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  default-produces-media-type: application/json

logging:
  pattern:
    # traceId 由 TraceIdFilter 寫入 MDC（NFR-9.4-04）；容器內以 LOGGING_STRUCTURED_FORMAT_CONSOLE=logstash 改輸出 JSON。
    level: "%5p [traceId=%X{traceId:-}]"

console:
  auth:
    # JWT_SECRET 必填且 ≥ 32 字元；缺或過短＝啟動失敗（ConsoleAuthProperties 驗證，ADR-001 D4）。
    jwt-secret: ${JWT_SECRET:}
    access-token-ttl: 30m
    refresh-token-ttl: 7d
    # 使用者清單（無使用者管理 UI；PRD 沒要）。密碼為 BCrypt 雜湊，開發預設明文寫在 backend/README.md；
    # 正式環境必須以環境變數覆寫三個 *_PASSWORD_HASH。
    users:
      - username: admin
        password-hash: ${CONSOLE_ADMIN_PASSWORD_HASH:$2a$10$myHfP0e/FauNBUk.mYAcBOOktgGreDNSxZNgg4WH/3KaM7efYk9eu}
        role: ADMIN
      - username: operator
        password-hash: ${CONSOLE_OPERATOR_PASSWORD_HASH:$2a$10$nq.JZXFXxuHBaCUFBNz8/e6eGVtbvMsDXYFEqPO3wPEU8cbjXEeMC}
        role: OPERATOR
      - username: viewer
        password-hash: ${CONSOLE_VIEWER_PASSWORD_HASH:$2a$10$7Pw3phmCccJUxs4O8rsCHee3Y.a0q7ZPkAn4smLwM1dW3Hxc2CRoq}
        role: VIEWER
  cors:
    # 逗號分隔；全棧同源（經 nginx）時不會用到。NFR-9.2-05。
    allowed-origins: ${CONSOLE_CORS_ALLOWED_ORIGINS:http://localhost:3000}
  encryption:
    # 敏感參數（model.apiKey、autoclaude.dbDsn）的 AES-256-GCM 金鑰：base64 編碼的 32 bytes（openssl rand -base64 32）。
    # 缺少、不是合法 base64、或解碼後不是 32 bytes＝啟動失敗（EncryptionProperties；與 JWT_SECRET 同款 fail-fast）。
    key: ${CONSOLE_ENCRYPTION_KEY:}
  security:
    # SEC-04 外呼 host 白名單（精確比對）：預設與 Bridge 的 MiniMax 兩個網域對齊（契約 §0.7 D.2、AR-09）。
    # 要用其他供應商（api.anthropic.com／api.openai.com…）須由部署者明確加入，且 Bridge 的 BRIDGE_OUTBOUND_ALLOWLIST 也要含該 host。
    # 🔴 allow-loopback／test-dns-overrides 刻意不出現在這裡：只在 e2e／test profile 載入（application-e2e.yml）。
    outbound-allowlist: ${CONSOLE_SECURITY_OUTBOUND_ALLOWLIST:api.minimax.io,api.minimax.chat}
    # 評估指令（evaluatorCommand）首個 token 的可執行檔白名單（契約附錄 D.3）：去路徑前綴與 .exe／.cmd／.bat、不分大小寫比對；
    # 不在名單 → execute 回 422「評估指令不在可執行檔白名單」。刻意不含 shell 與 shell 內建（sh／bash／cmd／powershell／echo…）。
    evaluator-allowlist: ${CONSOLE_SECURITY_EVALUATOR_ALLOWLIST:pytest,python,python3,py,npm,npx,node,pnpm,yarn,mvn,mvnw,gradle,gradlew,java,dotnet,go,cargo,make,tsc,eslint,ruff,mypy,git}
    rate-limit:
      # NFR-9.2-06：每個使用者（JWT subject；未認證才以客戶端 IP）每 60 秒 100 次。
      enabled: true
      requests-per-minute: 100
      # production 直連維持 false；docker／e2e profile 為 true（並設 server.forward-headers-strategy=native）。
      trust-forwarded-for: false
    refresh-revocation:
      # refresh token 撤銷名單的儲存（v1.4，D-19；契約 §1.9.2、附錄 D.2）：auto＝spring.data.redis.host 有值才用 Redis
      # （不在線時降級為單實例記憶體並記 WARN），否則純記憶體；redis＝只用 Redis（降級照舊）；memory＝只用記憶體（本機 e2e、單元測試）。
      store: auto
  import:
    # 路徑 B 的 LLM 輸入（系統訊息＋使用者訊息）字元上限；超過不呼叫模型，直接 prompt_too_long（契約 §3.3.3）。
    max-prompt-chars: 120000
    # 每個目標任務數／目標數的上限：只准下調、不准上調（硬上限 24，ParsedResultValidator 夾回）。
    max-steps: 24
  bridge:
    # Engine Bridge 位址（契約 §3.1）：管理員在設定頁改過的 autoclaude.engineUrl／sdd.engineUrl 優先，否則用這個。
    url: ${ENGINE_BRIDGE_URL:http://localhost:8081}
    # SDD 寫入權杖（v1.5；契約附錄 D.2、ADR-XPLAT-016 §9）：與 Bridge 同名同值的環境變數 BRIDGE_SDD_WRITE_TOKEN，附在 X-Bridge-Token 標頭，
    # 只用於會觸發 FSM 寫入的四個呼叫（核准凍結、帶 sdd 的建立批次、SDD run 的 resume／restore）。
    # 空＝SDD 寫入面停用（預設；SDD 是選用引擎）：核准凍結回 503 sdd_write_disabled，execute 不送 sdd 區塊並以 token_not_configured 警告。
    # 🔴 有設但短於 32 字元，或仍是 <…> 佔位＝backend 啟動即失敗（BridgeProperties 驗證；不靜默退回停用）。repo 內不放任何真值，值只進環境變數；
    # 權杖值絕不進日誌、錯誤封包或 details。
    sdd-write-token: ${BRIDGE_SDD_WRITE_TOKEN:}
  execution:
    # 事件消費者（每個活躍 run 一條虛擬執行緒，契約 §3.5.4）：事件串流閒置逾 idle-timeout 視為斷線（Bridge 每 15 秒送 keep-alive），
    # 以指數退避 backoff-initial→backoff-max 重連，位移用 DB 的 console_last_seq。
    # 🔴 mock-env 刻意不出現在這裡：只在 e2e／test profile 載入（application-e2e.yml），production 與 docker profile 不得出現。
    consumer:
      idle-timeout: 45s
      backoff-initial: 1s
      backoff-max: 30s
  sse:
    # 前端 SSE（契約 §2.1）：連續 keep-alive-seconds 沒有任何事件就送一行 keep-alive 註解；每個連線 queue-size 個框架的送出佇列，
    # 滿了就由伺服器主動關閉（客戶端以 Last-Event-ID 重連即補齊）。e2e／test profile 另覆寫 keep-alive-seconds＝2。
    keep-alive-seconds: 15
    queue-size: 1000
  retention:
    # 軟刪除專案可復原的天數（契約 §1.6.5、ADR-001 D19；PRD NFR-9.3-04）；≥ 1。超過的專案不可經 API 復原（409 restore_window_expired），
    # 與清除排程是否開啟無關。環境變數：CONSOLE_RETENTION_SOFT_DELETE_DAYS。
    soft-delete-days: ${CONSOLE_RETENTION_SOFT_DELETE_DAYS:30}
    # 是否註冊每日清除排程（實體刪除逾期的軟刪除專案及其整棵子資料，不可逆）：🔴 預設關閉，部署者必須明確開啟；
    # 未開啟時軟刪除資料只會累積、不會消失。環境變數：CONSOLE_RETENTION_PURGE_ENABLED。
    purge-enabled: ${CONSOLE_RETENTION_PURGE_ENABLED:false}
  monitor:
    # 背景工作：啟動時 Bridge 探測與啟動對帳、每 tick-interval 一次的健康探測與純時間型告警（契約 §3.1、§3.7）；
    # 探測結果存記憶體環（probe-capacity 筆＝24 小時）。整合測試 profile 預設關閉，由測試自行驅動。
    background-enabled: true
    tick-interval: 30s
    probe-capacity: 2880
