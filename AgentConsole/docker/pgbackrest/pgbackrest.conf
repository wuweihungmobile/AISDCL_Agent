# docker/pgbackrest/pgbackrest.conf — primary（archive-push）與 sidecar（backup／restore／verify）共用（PRD §12.3.2）
#
# 🔴 pgbackrest.conf 不展開 ${...}（PRD 範例裡的 ${PGBACKREST_CIPHER_PASS} 等寫法在這裡是字面值）：
#    只放靜態設定；金鑰、bucket、endpoint、region、TLS 驗證開關一律由 docker-compose.yml 以
#    PGBACKREST_* 環境變數注入（環境變數優先於本檔）：
#      PGBACKREST_REPO1_CIPHER_PASS／PGBACKREST_REPO2_CIPHER_PASS   加密密碼（兩個 repo 同一把）
#      PGBACKREST_REPO2_S3_BUCKET／_ENDPOINT／_REGION／_URI_STYLE   離站 S3/MinIO
#      PGBACKREST_REPO2_S3_KEY／_KEY_SECRET                         S3 金鑰
#      PGBACKREST_REPO2_STORAGE_VERIFY_TLS                          自簽憑證的 MinIO 用 n
#      PGBACKREST_PG1_USER／PGBACKREST_PG1_DATABASE                 對應 POSTGRES_USER／POSTGRES_DB
#
# 🔴 pgBackRest 的設定檔不支援行內註解：`key=value # 說明` 會把「value # 說明」整串當成值（實測：
#    repo1-retention-full 報 [032] is not valid）。註解一律獨立成行。
#
# 兩個容器必須用「同一個路徑」看到資料目錄（pg1-path）與 socket（pg1-socket-path）：
# compose 把 pg_data 卷都掛在 /var/lib/postgresql/data、pg_socket 卷都掛在 /var/run/postgresql。

[global]
# ── repo1：本地備份（pg_backup 卷，primary 與 sidecar 共用）──
repo1-path=/var/lib/pgbackrest
# 完整備份保留 4 份（每週一次 = 28 天，與 §12.1/§12.4 一致）
repo1-retention-full=4
repo1-retention-diff=7
repo1-cipher-type=aes-256-cbc

# ── repo2：離站備份（S3/MinIO）— NFR-REL-03 列為必要，預設啟用（見 §12.7.2）──
repo2-type=s3
repo2-path=/aisdlc-backup
# 離站亦保留 28 天（與本地對齊）
repo2-retention-full=4
repo2-cipher-type=aes-256-cbc

process-max=2
log-level-console=info
log-level-file=detail
log-path=/var/log/pgbackrest

compress-type=zst
compress-level=6

delta=y
start-fast=y

[aisdlc]
pg1-path=/var/lib/postgresql/data/pgdata
# 本機模式：sidecar 經共用卷的 unix socket 連線（不設 pg1-host，不走 SSH／TLS）
pg1-socket-path=/var/run/postgresql
pg1-port=5432
pg1-user=aisdlc
pg1-database=aisdlc
