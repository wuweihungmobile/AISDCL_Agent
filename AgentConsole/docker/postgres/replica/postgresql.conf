# docker/postgres/replica/postgresql.conf — Streaming Replication Standby（PRD §12.2.4）
# 與 PRD 的差異（細節見 docker/README.md〈與 PRD 的差異〉）：
#   · primary_conninfo 不寫在這裡：postgresql.conf 不展開 ${REPLICATION_PASSWORD}（ADR-001 G-06），
#     由 setup-replica.sh（pg_basebackup -R）寫進資料目錄的 postgresql.auto.conf（含密碼，檔案權限 0600；
#     auto.conf 的優先序高於本檔）。這裡只保留 primary_slot_name 作為與 primary 對得上的明文紀錄。
#   · restore_command 不加「|| true」：PostgreSQL 以非零代表「歸檔裡沒有這個檔」，|| true 會讓複製失敗
#     （磁碟滿、權限）也被當成成功，之後以「檔案大小不符」的 FATAL 才暴露；先 test -f 讓「沒有該檔」靜默回非零。
#     本地歸檔改為 gzip 壓縮（見 primary 的 pgbackrest-archive-wal.sh），所以這裡 gunzip。
#   · WAL／複製參數與 primary 對稱（見下方〈WAL／複製〉說明）
#   · hba_file 與 primary 共用同一份 pg_hba.conf；shared_preload_libraries 與 primary 一致
#     （postgres_exporter 的 stat_statements 收集器在 replica 上也要能查 pg_stat_statements）。

# ── 連線設定 ──
listen_addresses = '*'
max_connections = 200
shared_buffers = 256MB
effective_cache_size = 768MB
hba_file = '/etc/postgresql/pg_hba.conf'
unix_socket_directories = '/var/run/postgresql'

# ── WAL／複製（與 primary 對稱）──
# 🔴 PostgreSQL 要求 standby 的 max_connections／max_wal_senders／max_worker_processes 等不得低於它的 primary
#    （實測：max_wal_senders = 5 的節點無法當 max_wal_senders = 10 節點的 standby，啟動即 FATAL）。
#    replica 升格後，原 primary 節點要重建成它的 standby（README〈手動 Failover〉），所以這幾項必須與 primary 一致。
wal_level = replica
max_wal_senders = 5
max_replication_slots = 5
wal_keep_size = '1GB'
max_slot_wal_keep_size = '4GB'

# ── Standby 模式 ──
hot_standby = on
hot_standby_feedback = on

# ── 連線到 Primary ──
primary_slot_name = 'replica_slot_1'
# 串流中斷時先從 primary 的本地歸檔補 WAL（pg_wal_archive 以唯讀掛載；歸檔檔是 gzip 壓縮的 <WAL>.gz）
restore_command = 'test -f /var/lib/postgresql/wal_archive/%f.gz && gunzip -c /var/lib/postgresql/wal_archive/%f.gz > %p'
recovery_target_timeline = 'latest'

# ── 效能 ──
max_standby_streaming_delay = 30s
max_standby_archive_delay = 60s

# ── 日誌 ──
logging_collector = off

# ── 監控 ──
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.max = 10000
pg_stat_statements.track = all
