# docker/postgres/primary/postgresql.conf — PostgreSQL 18 Primary（PRD §12.2.2）
# 與 PRD 的差異（細節見 docker/README.md〈與 PRD 的差異〉）：
#   · hba_file／unix_socket_directories 明確指定（PRD 以 config_file 啟動但沒設 hba_file，pg_hba.conf 會被忽略）
#   · archive_command 改為包裝腳本：同時寫本地歸檔複本（gzip；replica 的 restore_command 用）與 pgbackrest archive-push（PITR）
#   · logging_collector=off：日誌走 stderr，docker compose logs 才看得到（PRD §11.7 即以此為前提）
#   · max_slot_wal_keep_size：replica 長時間失聯時保護 primary 磁碟（PRD 無上限）

# ── 連線設定 ──
listen_addresses = '*'
max_connections = 200
shared_buffers = 512MB
effective_cache_size = 1536MB
work_mem = 4MB
maintenance_work_mem = 128MB
hba_file = '/etc/postgresql/pg_hba.conf'
# pgBackRest sidecar 經共用卷以本機模式連線，路徑必須兩邊一致
unix_socket_directories = '/var/run/postgresql'

# ── WAL 設定 ──
wal_level = replica
max_wal_senders = 5
max_replication_slots = 5
wal_keep_size = '1GB'
max_slot_wal_keep_size = '4GB'
archive_mode = on
# 🔴 包裝腳本：尚未 stanza-create 時略過（沒有基底備份，歸檔的 WAL 無法用於 PITR；也避免開發模式
#    沒起 sidecar 時 pg_wal 無限累積）；stanza 存在後本地複本＋archive-push 任一失敗即回非零，由 PG 重試。
archive_command = '/usr/local/bin/pgbackrest-archive-wal.sh %p %f'
archive_timeout = 60

# ── Replication ──
# 預設為「非同步串流複製」：synchronous_standby_names 留空即非同步。
# 故 RPO 為 < 數秒 ～ 1 分鐘（非 0）。若需 RPO≈0，須將 standby 名稱填入
# synchronous_standby_names（如 'FIRST 1 (replica1)'）並接受寫入延遲增加。
synchronous_commit = on
synchronous_standby_names = ''     # 空 = 非同步（與 §12.1 RPO<1分鐘、§12.3.1 一致）
hot_standby = on

# ── 效能調優 ──
random_page_cost = 1.1
effective_io_concurrency = 200
default_statistics_target = 100
checkpoint_completion_target = 0.9
wal_buffers = 16MB
min_wal_size = 256MB
max_wal_size = 1GB

# ── 日誌 ──
# PRD 為 logging_collector=on（寫進 PGDATA/pg_log，docker logs 看不到）；容器內改走 stderr。
logging_collector = off
log_min_duration_statement = 1000
log_checkpoints = on
log_connections = on
log_disconnections = on
log_lock_waits = on
log_temp_files = 0

# ── 監控 ──
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.max = 10000
pg_stat_statements.track = all
