# docker/postgres/primary/pg_hba.conf — Primary／Replica 共用（PRD §12.2.3）
# 與 PRD 的差異：增列 loopback（容器內 psql -h 127.0.0.1 才連得進來）；
#   replication 增列 192.168.0.0/16（Docker 的位址池在 172.16.0.0/12 用完後會落到 192.168.x，
#   PRD 只開 172.16/12 會讓 replica 在那種網段被拒）。
# TYPE  DATABASE        USER            ADDRESS                 METHOD

# Local（unix socket；pgBackRest sidecar 與容器內維運用，僅限共用卷內的容器可達）
local   all             all                                     trust

# Loopback
host    all             all             127.0.0.1/32            scram-sha-256
host    all             all             ::1/128                 scram-sha-256

# IPv4 - Application（Docker bridge 網段）
host    all             all             172.16.0.0/12           scram-sha-256
host    all             all             192.168.0.0/16          scram-sha-256

# Replication
host    replication     all             172.16.0.0/12           scram-sha-256
host    replication     all             192.168.0.0/16          scram-sha-256

# Reject all other
host    all             all             0.0.0.0/0               reject
