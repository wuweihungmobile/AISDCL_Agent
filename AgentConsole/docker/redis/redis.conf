# docker/redis/redis.conf — Redis 設定（PRD §11.3；用途見 ADR-001 D16：refresh token 撤銷名單、rate limit、SSE 位移）
# 🔴 無密碼：僅掛在 internal 的 db-net（外部與主機都連不到）；若改成對外發布，必須加 requirepass。
bind 0.0.0.0
port 6379
protected-mode no
tcp-keepalive 60
timeout 0

# 持久化：RDB 快照 ＋ AOF（everysec）
dir /data
save 900 1
save 300 10
save 60 10000
appendonly yes
appendfsync everysec

# 記憶體：容器限制 256M，留餘裕；只淘汰「有 TTL」的鍵——撤銷名單這類無 TTL 的鍵滿了寧可寫入失敗，也不能被悄悄淘汰（撤銷失效＝安全問題）
maxmemory 192mb
maxmemory-policy volatile-lru

loglevel notice
logfile ""
