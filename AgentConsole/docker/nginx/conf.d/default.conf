# docker/nginx/conf.d/default.conf — 反向代理（PRD §11.5）
# 與 PRD 的差異：
#   · 增 /nginx-health（nginx 自己回 200，供 compose healthcheck；不經上游）
#   · Connection 標頭改用 nginx.conf 的 $connection_upgrade（見該檔註解）
#   · location 全部移到 console-locations.inc（80 與 443 共用，見該檔檔頭）；443／憑證：PRD 發布了 443 並掛
#     nginx_certs 卷，但沒有 ssl server 區塊——範例在 https.conf.example（預設不啟用，步驟見 docker/README.md〈啟用 HTTPS〉）
upstream frontend {
    server frontend:3000;
}

upstream backend {
    server backend:8080;
}

server {
    listen 80;
    server_name localhost;

    # 預設：HTTP 直接服務整個應用。啟用 HTTPS 並要把 80 轉址到 443 時，把下一行換成
    #   include /etc/nginx/conf.d/https-redirect.inc;
    include /etc/nginx/conf.d/console-locations.inc;
}
