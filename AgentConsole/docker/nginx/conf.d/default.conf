# docker/nginx/conf.d/default.conf — 反向代理（PRD §11.5）
# 與 PRD 的差異：
#   · 增 /nginx-health（nginx 自己回 200，供 compose healthcheck；不經上游）
#   · Connection 標頭改用 nginx.conf 的 $connection_upgrade（見該檔註解）
#   · 443／憑證：PRD 發布了 443 並掛 nginx_certs 卷，但沒有 ssl server 區塊；下方留有註解範例，
#     憑證放進 nginx_certs 卷後取消註解即可。
upstream frontend {
    server frontend:3000;
}

upstream backend {
    server backend:8080;
}

server {
    listen 80;
    server_name localhost;

    # nginx 自身健康檢查（compose healthcheck 用）
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Frontend (Next.js)
    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # BRD/PRD 匯入（契約 §0.7 第 1 項）：10MB 檔案加 multipart 封裝 ≤ 11MB（nginx 預設只有 1m，10MB 上傳必被擋成 413）；
    # 解析是同步呼叫，最長約 model.timeout＋15 秒，所以讀取逾時放寬到 180 秒（部署時建議 model.timeout ≤ 150）。
    # 通則：proxy_set_header 不會從別的 location 繼承，必須重複；proxy_pass 不帶 URI，才會保留原始請求 URI。
    location /api/v1/import/ {
        client_max_body_size 11m;
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_read_timeout 180s;
    }

    # 設定檔匯入（契約 §0.7 第 2 項）：≤ 1MB 的 JSON 加 multipart 封裝
    location = /api/v1/settings/import {
        client_max_body_size 2m;
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
    }

    # Backend API
    location /api/ {
        proxy_pass http://backend/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 支援
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 86400s;
    }

    # Actuator (內部存取)
    location /actuator/ {
        deny all;
    }

    # 靜態資源快取
    location /_next/static/ {
        proxy_pass http://frontend;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}

