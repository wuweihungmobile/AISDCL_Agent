# docker/nginx/nginx.conf — nginx 主設定（PRD §11.5 只給 conf.d/default.conf；本檔為標準主設定）
# 官方映像把 /var/log/nginx/access.log 與 error.log 連到 stdout／stderr ⇒ docker compose logs nginx 可看。
user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;
    server_tokens   off;

    gzip  on;
    gzip_types  text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # WebSocket 升級（Next.js 開發模式 HMR 等）：只有帶 Upgrade 標頭的請求才送 Connection: upgrade，
    # 其餘請求維持 keep-alive（PRD 範例把 Connection 恆設為 upgrade）。
    map $http_upgrade $connection_upgrade {
        default  upgrade;
        ''       close;
    }

    include /etc/nginx/conf.d/*.conf;
}
