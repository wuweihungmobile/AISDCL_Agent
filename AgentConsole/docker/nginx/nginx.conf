# docker/nginx/nginx.conf — nginx 主設定（PRD §11.5 只給 conf.d/default.conf；本檔為標準主設定）
# 官方映像把 /var/log/nginx/access.log 與 error.log 連到 stdout／stderr ⇒ docker compose logs nginx 可看。
user  nginx;
worker_processes  auto;

# 🔴 error_log 等級刻意降到 crit（QA DEF-AC-008、契約 §0.7 第 5 項）：上游被切斷（例如 backend 重啟）時，nginx 在 [error]
# 等級會把客戶端的完整原始請求行印進 error_log——含 SSE 的 `?access_token=<JWT>`，而 log_format 管不到它（那只管 access_log）。
# 實測（重啟 backend 的演練）：81 行 [error] 中有 16 行含 token 值。降到 crit 以上就不會再印這類 error 級訊息。
# 誠實劃界：
#   · 代價是 nginx 平常的 error／warn 訊息（upstream timed out、connect() failed、client intended to send too large body…）
#     也不再出現在 `docker compose logs nginx`，上游失敗的細節看不到。要除錯時才暫時改回 error，重現問題後立刻改回 crit，
#     並讓已累積的日誌消失——`docker compose up -d --force-recreate nginx`（新容器＝新日誌檔）；只 restart 清不掉。
#   · 治本是前端改用 fetch 串流並帶 Authorization 標頭（契約 §2.1、§2.8），不再把 token 放進網址；EventSource 只是退路。
#   · crit 以上（crit／alert／emerg）仍會印：設定錯誤導致啟動失敗的 [emerg] 照樣看得到。
error_log  /var/log/nginx/error.log crit;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 🔴 access log 不得出現 access_token 的值（契約 §0.7 第 4 項、AR-05）：瀏覽器的 EventSource 不能帶標頭，只能把 token 放在
    # 查詢字串（/api/v1/stream/…?access_token=…）；$request 會把它原樣記進日誌（docker compose logs nginx 看得到）。
    # 所以日誌改記 $loggable_uri：查詢字串含 access_token（含 %5F 編碼的底線、不分大小寫）的請求，整串查詢遮罩成 ***——
    # 不挑參數位置，重複參數或順序不同都不會漏；/api/v1/stream/ 底下的請求不論有沒有 access_token 一律只留路徑。
    # 一般請求（沒有 access_token）的 URI 與查詢維持原樣，除錯用。
    # 誠實劃界：nginx 的 error_log 在上游出錯時會印出客戶端的原始請求行（含查詢字串），log_format 管不到那一條——
    # 那一條由本檔最上方的 `error_log … crit` 擋住（說明與代價見該處）；前端優先用 fetch 串流帶 Authorization
    # 標頭（契約 §2.1），把 token 放進 URL 的 EventSource 只是退路。
    map $request_uri $loggable_uri {
        ~*^(?<masked_path>[^?]*)\?.*access(?:_|%5f)token  "${masked_path}?***";
        ~^(?<stream_path>/api/v1/stream/[^?]*)\?          "${stream_path}?***";
        default                                            $request_uri;
    }

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request_method $loggable_uri $server_protocol" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;
    server_tokens   off;

    gzip  on;
    gzip_types  text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # WebSocket 升級（Next.js 開發模式 HMR 等）：只有帶 Upgrade 標頭的請求才送 Connection: upgrade，
    # 其餘請求維持 keep-alive（PRD 範例把 Connection 恆設為 upgrade）。
    map $http_upgrade $connection_upgrade {
        default  upgrade;
        ''       close;
    }

    include /etc/nginx/conf.d/*.conf;
}
