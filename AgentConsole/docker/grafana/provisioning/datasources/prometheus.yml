# docker/grafana/provisioning/datasources/prometheus.yml — 資料來源（uid 固定為 prometheus，dashboards JSON 以此引用）
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s
