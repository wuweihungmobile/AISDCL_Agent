openapi: 3.1.0
info:
  title: AISDLC Agent Console — console-api（Phase 3～6 契約）
  version: v1-p3-6
  description: |
    契約先行文件：BRD/PRD 匯入（Phase 3）、專案執行（Phase 4）、專案監控（Phase 5）、系統參數（Phase 6）。
    本檔只含 Phase 3～6 的端點與 schema；Phase 1+2 的專案／目標／任務／認證端點不在此重複（schema 名稱與其一致）。

    人類可讀的完整契約（逐端點錯誤 reason 常數、SSE 事件逐欄、Bridge 對映、E2E 情境）見同目錄的
    `API_Contract_P3-6.md`；兩份文件衝突時以 Markdown 為準，並回報主控修正本檔。

    共通約定（與 Phase 1+2 相同）：
    - 成功回應包 `{code,message,data,timestamp,traceId}`（`ApiResultXxx`）；分頁資料放在 `data` 內（`PageDataXxx`）。
    - 錯誤回應一律 `ApiError`：`{code,message,reason?,errors[{field,message}],details?,timestamp,traceId}`。
    - 時間一律 ISO-8601 帶 offset（`Instant` 輸出 `Z`）；列舉值全大寫；JSON 欄位 camelCase。
    - 本檔的列舉以具名 schema 表示以便閱讀；springdoc 實作時會內聯，值域以本檔為準。
    - `x-required-role` 是最低角色（VIEWER／OPERATOR／ADMIN），`x-rtm` 是 RTM 對照列。
servers:
  - url: http://localhost:8080
    description: 本機開發（backend bootRun；全棧經 nginx 時為同源）
security:
  - bearerAuth: []
tags:
  - name: BRD/PRD 匯入
    description: Phase 3；API-IMP／API-SGN
  - name: 專案執行
    description: Phase 4；API-EXE／API-AUT／API-DAG
  - name: 專案監控
    description: Phase 5；API-MON／API-ALR／API-NTF
  - name: SSE 推送
    description: Phase 4；API-SSE
  - name: 系統參數
    description: Phase 6；API-SET／NFR-SEC-04／NFR-SEC-05
paths:
  /api/v1/import:
    get:
      tags: [BRD/PRD 匯入]
      operationId: listImports
      summary: 查詢匯入歷史（分頁）
      description: |
        列表不含 `sourceContent`、`parsedResult`（用 `GET /api/v1/import/{id}` 取詳情）。預設依 `createdAt` 由新到舊。
      x-required-role: VIEWER
      x-rtm: [API-IMP-06, US-I-06]
      parameters:
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/SizeQuery'
        - name: status
          in: query
          required: false
          description: 依匯入狀態篩選
          schema:
            $ref: '#/components/schemas/ImportStatus'
        - name: q
          in: query
          required: false
          description: 來源檔名模糊搜尋（不分大小寫；萬用字元視為字面）
          schema:
            type: string
            maxLength: 200
        - name: sort
          in: query
          required: false
          description: 欄位[,asc|desc]；欄位限 createdAt／status；預設 createdAt,desc
          schema:
            type: string
            default: createdAt,desc
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResultPageDataImportRecordResponse'
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /api/v1/import/upload:
    post:
      tags: [BRD/PRD 匯入]
      operationId: uploadImport
      summary: 上傳 BRD/PRD 檔案
      description: |
        副檔名限 `.md／.pdf／.docx`（不分大小寫）、大小 ≤ 10MB。後端擷取純文字存入 `sourceContent`
        （.md 須為 UTF-8；.pdf 用 PDFBox；.docx 用 POI 抽段落與表格文字），建立 `status=UPLOADED`、`signedOff=false` 的匯入記錄。
        錯誤 reason 常數見 Markdown 契約 §1.1.1（413／415／422 各有固定字串）。
      x-required-role: OPERATOR
      x-rtm: [API-IMP-01, API-IMP-07, US-I-01]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: 要匯入的檔案（.md／.pdf／.docx，≤ 10MB）
      responses:
        '201':
          description: 已建立匯入記錄
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResultImportRecordResponse'
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /api/v1/import/text:
    post:
      tags: [BRD/PRD 匯入]
      operationId: importText
      summary: 貼上純文字建立匯入記錄
      description: |
        直接貼上需求文字（支援 Markdown）。`sourceType` 只接受 `PLAIN_TEXT`（預設）與 `MARKDOWN`。
        路徑判斷（高階目標 vs 結構化文件）在 parse 階段進行，見 Markdown 契約 §3.3。
      x-required-role: OPERATOR
      x-rtm: [API-IMP-02, US-I-02]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TextImportRequest'
      responses:
        '201':
          description: 已建立匯入記錄
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResultImportRecordResponse'
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /api/v1/import/{id}:
    get:
      tags: [BRD/PRD 匯入]
      operationId: getImport
      summary: 查詢匯入記錄詳情（補充端點）
      description: |
        含 `sourceContent` 與 `parsedResult`，供「歷史記錄」重新開啟審核與重新整理後還原預覽。PRD §7.1.4 未列，
        為設計稿「歷史記錄」頁籤所需（Markdown 契約 §6 D-05）。
      x-required-role: VIEWER
      x-rtm: [API-IMP-06, US-I-03, US-I-06]
      parameters:
        - $ref: '#/components/parameters/ImportIdPath'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResultImportRecordDetailResponse'
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /api/v1/import/{id}/parse:
    post:
      tags: [BRD/PRD 匯入]
      operationId: parseImport
      summary: 觸發 AI 解析（三條路徑擇一）
      description: |
        同步呼叫（UI 顯示「解析中」）；路徑 B 的逾時為 `model.timeout` 秒，nginx 需放寬 read timeout。

        路徑選擇（先到先得）：
        1. A `SDD`：`specDir` 有值，或 `executionPath` 下有 Bridge `/sdd/compile` 接受的凍結規格 → 規格驅動。
        2. C `DECOMPOSE`：`sourceType=PLAIN_TEXT` 且全文 < 2,000 字且無 Markdown 標題 → Bridge `/autoclaude/decompose`。
        3. B `LLM`：其餘 → OpenAI 相容 chat completions（`model.apiUrl`／`model.apiKey`／`model.name`）。

        三道有界閘（每個 Goal 任務數 ≤ 24、目標依賴 Kahn 無環、每個 Task 描述非空）與 `prompt_too_long`、
        `brain_unsupported`、`brain_failed` 任一不過 → 422（`ParseGateErrorResponse`），不截斷、不修剪（US-I-10），
        記錄狀態退回 `UPLOADED` 並把錯誤存入 `lastParseErrors`。
        規格被拒（凍結／污染／版本）→ 422（`ApiError`，reason＝「SDD 規格檢查未通過」）。
      x-required-role: OPERATOR
      x-rtm: [API-IMP-03, API-IMP-08, API-IMP-09, US-I-03, US-I-05, US-I-07, US-I-08, US-I-10, NFR-SEC-04]
      parameters:
        - $ref: '#/components/parameters/ImportIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParseOptions'
      responses:
        '200':
          description: 解析成功；記錄 `status=PARSED`、`signedOff=false`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResultParseResultResponse'
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422':
          description: 未通過有界閘或規格被拒
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ParseGateErrorResponse'
                  - $ref: '#/components/schemas/ApiError'
              examples:
                gate-max-steps:
                  summary: 單一 Goal 任務數超過 24
                  value:
                    code: 422
                    message: 解析結果未通過有界閘
                    reason: 解析結果未通過有界閘
                    errors:
                      - field: goals[0].tasks
                        message: 目標「建立基礎架構」的任務數 25 超過上限 24（不截斷、不修剪）
                        gate: max_steps
                        detail: 目標「建立基礎架構」的任務數 25 超過上限 24（不截斷、不修剪）
                        location: goals[0].tasks
                    details:
                      path: LLM
                    timestamp: '2026-10-15T08:30:12Z'
                    traceId: 0f7c2a58-4e1d-4b29-9d3e-6a1b5c8d9e02
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '502': {$ref: '#/components/responses/BadGateway'}
        '504': {$ref: '#/components/responses/GatewayTimeout'}
  /api/v1/import/{id}/result:
    put:
      tags: [BRD/PRD 匯入]
      operationId: editImportResult
      summary: 編輯解析結果（重新過有界閘）
      description: |
        以整棵樹覆寫 `parsedResult.project` 與 `parsedResult.goals`（陣列順序即排序；`sortOrder` 由伺服器依陣列順序重編為 0 起連續整數）。
        伺服器擁有的欄位（`path`／`aiModel`／`tokenUsed`／`reasoning`／`draftIds`／`specDigest`）以庫內值為準，請求帶了也忽略。
        成功後 `status=REVIEWING`；**編輯會撤銷既有 signoff**（`signedOff` 回 false、`signedOffBy／At` 清空），須重新 signoff。
        違反有界閘 → 422；命令含禁用字元或 regex 無法編譯 → 400（與 Phase 2 任務建立同規則）。
      x-required-role: OPERATOR
      x-rtm: [API-IMP-04, US-I-04, US-I-10]
      parameters:
        - $ref: '#/components/parameters/ImportIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditParsedResultRequest'
      responses:
        '200':
          description: 已儲存
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResultParseResultResponse'
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422':
          description: 未通過有界閘
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParseGateErrorResponse'
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /api/v1/import/{id}/signoff:
    post:
      tags: [BRD/PRD 匯入]
      operationId: signoffImport
      summary: 🔴 人工 signoff 匯入草案（只批准，不落庫）
      description: |
        `approver` 必填、非空白（不可匿名）。對路徑 C 的每個 `draftIds` 呼叫 Bridge `:approve`（審計）；任一失敗 → 502 且不改任何狀態；
        Bridge 回 `already_signed_off` 視為成功（冪等）。成功設 `signedOff／By／At`。
        **偏離 PRD §7.1.4.1 的回傳型別**：回 `ImportRecordResponse`（ADR-001 D12；`confirm` 才建立專案）。
      x-required-role: OPERATOR
      x-rtm: [API-SGN-01, US-I-09]
      parameters:
        - $ref: '#/components/parameters/ImportIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignoffRequest'
      responses:
        '200':
          description: 已 signoff
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResultImportRecordResponse'
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '502': {$ref: '#/components/responses/BadGateway'}
        '504': {$ref: '#/components/responses/GatewayTimeout'}
  /api/v1/import/{id}/confirm:
    post:
      tags: [BRD/PRD 匯入]
      operationId: confirmImport
      summary: 確認匯入（單一交易建立專案／目標／任務）
      description: |
        要求 `signedOff=true`，否則 409。成功時在單一交易內建立 Project（`status=DRAFT`）、Goals、Tasks 與目標依賴，
        全部 `signedOff=true`、`signedOffBy／At` 承襲匯入記錄；記錄轉 `IMPORTED` 並回填 `projectId`。
      x-required-role: OPERATOR
      x-rtm: [API-IMP-05, API-IMP-10, US-I-09]
      parameters:
        - $ref: '#/components/parameters/ImportIdPath'
      responses:
        '201':
          description: 已建立專案
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResultProjectResponse'
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /api/v1/import/{id}/reject:
    post:
      tags: [BRD/PRD 匯入]
      operationId: rejectImport
      summary: 放棄匯入（補充端點）
      description: |
        設計稿步驟 2 的「放棄」。`status` 轉 `REJECTED`；已 `IMPORTED` 者 409。PRD §7.1.4 未列（Markdown 契約 §6 D-05）。
      x-required-role: OPERATOR
      x-rtm: [API-IMP-10]
      parameters:
        - $ref: '#/components/parameters/ImportIdPath'
      responses:
        '200':
          description: 已放棄
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResultImportRecordResponse'
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /api/v1/projects/{projectId}/execute:
    post:
      tags: [專案執行]
      operationId: executeProject
      summary: 啟動專案執行
      description: |
        後端二次硬校驗（前端按鈕禁用只是體驗）。驗證順序固定（QA 依序斷言）：
        404 專案 → 400 欄位驗證 → 409 專案正在執行中 → 409 專案狀態不允許執行 → 409 未經人工審批的草案不可執行
        → 400 範圍 id 不屬於此專案 → 409 範圍問題（已完成／缺前置目標／無可執行任務）→ 409 目標依賴成環
        → 422 物化失敗（prompt 超過 20000 字元、評估指令消毒、regex 無法編譯）→ Bridge（409 鎖／422／502／504，並補償刪除剛建的 run 列）。

        成功：建立 `execution_runs`（`run_number` 同專案遞增）→ Bridge `POST /autoclaude/runs` → 專案 `EXECUTING`、
        範圍內任務 `QUEUED`、啟動事件消費者。`autonomyLevel`／`tokenBudget`／`scope` 皆可省略（預設見 schema）。
      x-required-role: OPERATOR
      x-rtm: [API-EXE-01, API-EXE-11, API-EXE-12, API-EXE-13, API-DAG-01, API-AUT-01, API-AUT-02, API-AUT-03, API-AUT-04, API-AUT-05, API-AUT-06, API-SET-10, US-E-01, US-E-02, US-E-10, NFR-SEC-03]
      parameters:
        - $ref: '#/components/parameters/ProjectIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartExecutionRequest'
            examples:
              level-1-all:
                summary: Level 1、全部範圍、預算 100,000
                value:
                  autonomyLevel: 1
                  tokenBudget: 100000
                  scope:
                    mode: ALL
      responses:
        '201':
          description: 已建立執行批次（Bridge 已接受）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResultExecutionRunResponse'
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: 草案未 signoff、狀態不允許、範圍問題或 Bridge 並發互斥
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                draft-not-signed-off:
                  summary: 未經人工審批（US-E-01）
                  value:
                    code: 409
                    message: 草案未經人工審批，禁止執行
                    reason: 未經人工審批的草案不可執行
                    errors: []
                    details:
                      unsignedProjectId: null
                      unsignedGoalIds: [a1f4c2d3-5b6e-4c7d-8e9f-0a1b2c3d4e12]
                      unsignedTaskIds: [c7e2b1a0-3d4f-4a5b-9c6d-7e8f9a0b1c23]
                    timestamp: '2026-10-15T08:30:12Z'
                    traceId: 0f7c2a58-4e1d-4b29-9d3e-6a1b5c8d9e02
                lock-held:
                  summary: 同專案同路徑已有執行中的批次（Bridge advisory lock）
                  value:
                    code: 409
                    message: 同專案同路徑已有執行中的批次
                    reason: 同專案同路徑已有執行中的批次
                    errors: []
                    details:
                      holderRunId: e5a7c3b9-2f1d-4b6a-8c0e-1d2f3a4b5c31
                    timestamp: '2026-10-15T08:30:12Z'
                    traceId: 0f7c2a58-4e1d-4b29-9d3e-6a1b5c8d9e02
        '422': {$ref: '#/components/responses/Unprocessable'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '502': {$ref: '#/components/responses/BadGateway'}
        '504': {$ref: '#/components/responses/GatewayTimeout'}
  /api/v1/projects/{projectId}/executions:
    get:
      tags: [專案執行]
      operationId: listProjectExecutions
      summary: 列出專案執行批次（補充端點，ADR-001 G-16）
      description: |
        分頁；預設 `startedAt,desc`。每列帶批次比較所需的 Token／時間／成功率（US-M-06），
        供執行頁挑選目前批次與監控頁「執行批次」下拉。
      x-required-role: VIEWER
      x-rtm: [API-EXE-14, US-M-06]
      parameters:
        - $ref: '#/components/parameters/ProjectIdPath'
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/SizeQuery'
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/RunStatus'
        - name: sort
          in: query
          required: false
          description: 欄位[,asc|desc]；欄位限 startedAt／runNumber；預設 startedAt,desc
          schema:
            type: string
            default: startedAt,desc
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResultPageDataExecutionRunSummaryResponse'
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /api/v1/executions/{runId}:
    get:
      tags: [專案執行]
      operationId: getExecution
      summary: 查詢執行狀態
      description: |
