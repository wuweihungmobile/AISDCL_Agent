components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Authorization 標頭帶 access token（30 分鐘）
    queryAccessToken:
      type: apiKey
      in: query
      name: access_token
      description: |
        只有 `/api/v1/stream/**` 接受（EventSource 不能帶標頭）；必須是 access token（refresh token 一律 401）。
        伺服器存取日誌須遮罩此參數，回應帶 `Cache-Control: no-store`。
  parameters:
    PageQuery:
      name: page
      in: query
      required: false
      description: 頁碼（0 起算）
      schema:
        type: integer
        format: int32
        minimum: 0
        default: 0
    SizeQuery:
      name: size
      in: query
      required: false
      description: 每頁筆數（1～100）
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 10
    ImportIdPath:
      name: id
      in: path
      required: true
      description: 匯入記錄 id
      schema:
        type: string
        format: uuid
    ProjectIdPath:
      name: projectId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RunIdPath:
      name: runId
      in: path
      required: true
      description: 執行批次 id（同時是 Bridge 的 run_id）
      schema:
        type: string
        format: uuid
    CheckpointIdPath:
      name: checkpointId
      in: path
      required: true
      description: checkpoints.id（同時是 Bridge 的 checkpoint_id）
      schema:
        type: string
        format: uuid
    ReviewIdPath:
      name: stepId
      in: path
      required: true
      description: 審核項 id＝review_requests.id（不是 playbook 的 step_id）
      schema:
        type: string
        format: uuid
    AlertIdPath:
      name: alertId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CategoryPath:
      name: category
      in: path
      required: true
      schema:
        type: string
        enum: [model, agent, execution, monitor, autoclaude, sdd]
    KeyPath:
      name: key
      in: path
      required: true
      description: 參數鍵名（區分大小寫，例：compactThresholdPct）
      schema:
        type: string
        maxLength: 200
    MonitorRunIdQuery:
      name: runId
      in: query
      required: false
      description: 只看此執行批次（必須屬於該專案，否則 404）；省略＝專案全部批次
      schema:
        type: string
        format: uuid
    MonitorFromQuery:
      name: from
      in: query
      required: false
      description: 視窗起點（ISO-8601 帶 offset）；預設 to 之前 24 小時
      schema:
        type: string
        format: date-time
    MonitorToQuery:
      name: to
      in: query
      required: false
      description: 視窗終點（ISO-8601 帶 offset）；預設現在。`from` 必須早於 `to`，否則 400
      schema:
        type: string
        format: date-time
    BucketQuery:
      name: bucket
      in: query
      required: false
      description: 分桶粒度；預設視窗 ≤ 48 小時用 HOUR，否則 DAY
      schema:
        type: string
        enum: [HOUR, DAY]
    RevealQuery:
      name: reveal
      in: query
      required: false
      description: true＝揭露加密值明文（僅 ADMIN；其他角色 403；每次寫審計）
      schema:
        type: boolean
        default: false
    ConfirmQuery:
      name: confirm
      in: query
      required: false
      description: 涉及加密參數的重置須明確帶 true，否則 409
      schema:
        type: boolean
        default: false
    AccessTokenQuery:
      name: access_token
      in: query
      required: false
      description: access token（與 Authorization 標頭擇一）
      schema:
        type: string
    LastEventIdHeader:
      name: Last-Event-ID
      in: header
      required: false
      description: 最後收到的事件 id（`<seq>` 或 `<seq>.<n>`）；伺服器從其後重播
      schema:
        type: string
        pattern: '^[0-9]+(\.[0-9]+)?$'
  responses:
    BadRequest:
      description: 請求格式或欄位驗證失敗（errors 列出每個欄位的問題；reason 常數見 Markdown 契約附錄 B）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unauthorized:
      description: 未登入，或 access token 無效／過期（reason：UNAUTHENTICATED／TOKEN_EXPIRED／TOKEN_INVALID）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Forbidden:
      description: 角色不足（reason：ACCESS_DENIED；`reveal=true` 非 ADMIN 時 reason 為「僅 ADMIN 可揭露敏感參數」）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: 資源不存在或已軟刪除
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Conflict:
      description: 與目前狀態衝突（reason 與 details 逐端點固定，見 Markdown 契約）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    PayloadTooLarge:
      description: 上傳檔案超過大小上限
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    UnsupportedMediaType:
      description: 副檔名或 Content-Type 不被支援
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unprocessable:
      description: Bridge 或後端消毒／有界閘拒絕（結構化原因逐字帶出）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    TooManyRequests:
      description: 超過每分鐘 100 次請求上限（每 IP；reason「超過每分鐘 100 次請求上限」）
      headers:
        Retry-After:
          description: 建議等待秒數
          schema:
            type: integer
            format: int32
        X-RateLimit-Limit:
          description: 視窗內上限（100）
          schema:
            type: integer
            format: int32
        X-RateLimit-Remaining:
          description: 視窗內剩餘次數（429 時為 0）
          schema:
            type: integer
            format: int32
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    BadGateway:
      description: Bridge 無法連線或回了非預期的錯誤（reason「引擎橋接服務無法連線」／「引擎橋接服務錯誤」）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    GatewayTimeout:
      description: Bridge 逾時（reason「引擎橋接服務逾時」）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotImplemented:
      description: 功能尚未提供（PDF 報表，reason「PDF 報表尚未提供（W5）」）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  schemas:
    ApiError:
      type: object
      description: 統一錯誤封包（Phase 1+2 同名 schema，逐字沿用）
      required: [code, message, errors, timestamp, traceId]
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
        reason:
          type: string
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
        details:
          type: object
          additionalProperties: true
        timestamp:
          type: string
          format: date-time
        traceId:
          type: string
    FieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
        message:
          type: string
    GateName:
      type: string
      description: 有界閘名稱（逐字常數）
      enum: [max_steps, cycle, empty_prompt, brain_unsupported, brain_failed, prompt_too_long]
    GateError:
      type: object
      description: 單一有界閘違規
      required: [gate, detail]
      properties:
        gate:
          $ref: '#/components/schemas/GateName'
        detail:
          type: string
          description: 給人看的完整原因（不截斷）
        location:
          type: string
          description: 違規位置，例如 goals[0].tasks[3].description
    GateFieldError:
      description: 422 有界閘回應的 errors 項目＝FieldError 加上 gate／detail／location（一般 client 當 FieldError 讀即可）
      allOf:
        - $ref: '#/components/schemas/FieldError'
        - $ref: '#/components/schemas/GateError'
    ParseGateErrorResponse:
      type: object
      description: parse／editResult 未通過有界閘時的 422 本文（ApiError 的特化：errors 項目帶 gate 欄位）
      required: [code, message, reason, errors, timestamp, traceId]
      properties:
        code:
          type: integer
          format: int32
          const: 422
        message:
          type: string
        reason:
          type: string
          const: 解析結果未通過有界閘
        errors:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/GateFieldError'
        details:
          type: object
          additionalProperties: true
        timestamp:
          type: string
          format: date-time
        traceId:
          type: string
    ImportSourceType:
      type: string
      enum: [MARKDOWN, PDF, DOCX, PLAIN_TEXT]
    ImportStatus:
      type: string
      description: |
        UPLOADED→PARSING→PARSED→REVIEWING→IMPORTED／REJECTED；解析失敗時 PARSING 退回 UPLOADED。
      enum: [UPLOADED, PARSING, PARSED, REVIEWING, IMPORTED, REJECTED]
    ParsePath:
      type: string
      description: 解析路徑：SDD＝規格驅動（Bridge /sdd/compile）；LLM＝OpenAI 相容 chat completions；DECOMPOSE＝Bridge /autoclaude/decompose
      enum: [SDD, LLM, DECOMPOSE]
    TextImportRequest:
      type: object
      required: [content]
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 2000000
          description: 需求文字（支援 Markdown）；不可全為空白
        sourceFileName:
          type: string
          maxLength: 500
          description: 選填的來源名稱（例：來自剪貼簿）
        sourceType:
          type: string
          enum: [PLAIN_TEXT, MARKDOWN]
          default: PLAIN_TEXT
    ParseOptions:
      type: object
      required: [executionPath]
      properties:
        autonomyLevel:
          type: integer
          format: int32
          minimum: 1
          maximum: 10
          default: 3
          description: 解析前選擇的自治等級；也成為落庫專案的 autonomyLevel
        executionPath:
          type: string
          maxLength: 500
          description: 專案執行路徑（絕對路徑格式：POSIX、磁碟機代號或 UNC）；Bridge 的 allowlist 在執行時才驗
        additionalPrompt:
          type: string
          maxLength: 4000
          description: 補充說明（引導 AI 解析方向）
        specDir:
          type: string
          maxLength: 500
          description: 明示的 SDD 規格目錄（絕對路徑）；省略則以 executionPath 探測是否有凍結規格
    ParsedProject:
      type: object
      required: [name, executionPath, passCriteria]
      properties:
        name:
          type: string
          maxLength: 200
        executionPath:
          type: string
          maxLength: 500
        passCriteria:
          type: string
          description: Markdown
        description:
          type: string
          description: Markdown
        autonomyLevel:
          type: integer
          format: int32
          minimum: 1
          maximum: 10
    ParsedTask:
      type: object
      required: [name, description, passCriteria]
      properties:
        name:
          type: string
          maxLength: 200
        description:
          type: string
          description: Markdown；不可為空白（空白→ 422 gate=empty_prompt）
        passCriteria:
          type: string
          description: Markdown；落庫時 NotBlank
        sortOrder:
          type: integer
          format: int32
          description: 伺服器依陣列順序重編（0 起連續）；請求帶了也忽略
        estimatedTokens:
          type: integer
          format: int64
          minimum: 0
        evaluatorCommand:
          type: string
          maxLength: 1000
          description: NFR-SEC-03；含禁用字元 → 400
        expectedOutputRegex:
          type: string
          maxLength: 1000
          description: 須可編譯，否則 400
        passCriteriaSpec:
          type: object
          additionalProperties: true
          description: 結構化通過標準（路徑 C 會放 {source, stepId, draftId}）
        maxRetries:
          type: integer
          format: int32
          minimum: 0
          maximum: 20
    ParsedGoal:
      type: object
      required: [key, name, passCriteria, tasks]
      properties:
        key:
          type: string
          minLength: 1
          maxLength: 64
          description: 樹內唯一的穩定鍵（伺服器解析時賦予 g1、g2…；前端新增目標自行產生）。dependsOn 引用它
        name:
          type: string
          maxLength: 200
        description:
          type: string
        passCriteria:
          type: string
        sortOrder:
          type: integer
          format: int32
        dependsOn:
          type: array
          description: 前置目標的 key；自依賴、不存在的 key、成環 → 422 gate=cycle
          items:
            type: string
        tasks:
          type: array
          description: 每個目標任務數 ≤ 24（超過 → 422 gate=max_steps）；至少 1 個
          items:
            $ref: '#/components/schemas/ParsedTask'
    ParsedResult:
      type: object
      description: 三層草案樹（PRD §5.2.4 輸出 JSON 的超集）。存於 import_records.parsed_result（JSONB）
      required: [project, goals]
      properties:
        project:
          $ref: '#/components/schemas/ParsedProject'
        goals:
          type: array
          description: 至多 24 個目標；陣列順序即排序
          items:
            $ref: '#/components/schemas/ParsedGoal'
        path:
          $ref: '#/components/schemas/ParsePath'
        aiModel:
          type: string
        tokenUsed:
          type: integer
          format: int64
        reasoning:
          type: string
          description: 路徑 C 的 Bridge decompose reasoning
        draftIds:
          type: array
          description: 路徑 C 的 Bridge draft_id 清單（signoff 時逐一 :approve）
          items:
            type: string
        specDigest:
          type: string
          description: 路徑 A 的 SDD 規格 digest
    EditParsedResultRequest:
      type: object
      required: [parsedResult]
      properties:
        parsedResult:
          $ref: '#/components/schemas/ParsedResult'
    ParseWarning:
      type: object
      description: 非阻擋提示（例如不安全的 evaluatorCommand 被清空）
      required: [code, detail]
      properties:
        code:
          type: string
          description: 例：evaluator_command_dropped、passcriteria_placeholder
        detail:
          type: string
        location:
          type: string
    ImportRecordResponse:
      type: object
      required: [id, sourceType, status, signedOff, createdAt]
      properties:
        id:
          type: string
          format: uuid
        sourceType:
          $ref: '#/components/schemas/ImportSourceType'
        sourceFileName:
          type: string
        status:
          $ref: '#/components/schemas/ImportStatus'
        signedOff:
          type: boolean
        signedOffBy:
          type: string
        signedOffAt:
          type: string
          format: date-time
        projectId:
          type: string
          format: uuid
          description: confirm 之後才有值
        createdAt:
          type: string
          format: date-time
        aiModel:
          type: string
        tokenUsed:
          type: integer
          format: int64
        parsePath:
          $ref: '#/components/schemas/ParsePath'
        lastParseErrors:
          type: array
          description: 最近一次 parse 被有界閘拒絕的原因（成功解析後清空）
          items:
            $ref: '#/components/schemas/GateError'
      example:
        id: 7d9f3b52-1c0a-4e8e-9a43-5f6b2c1d8e01
        sourceType: MARKDOWN
        sourceFileName: e2e-brd.md
        status: UPLOADED
        signedOff: false
        createdAt: '2026-10-15T08:30:12Z'
    ImportRecordDetailResponse:
      description: ImportRecordResponse ＋ 原文與解析結果
      allOf:
        - $ref: '#/components/schemas/ImportRecordResponse'
        - type: object
          required: [sourceContent]
          properties:
            sourceContent:
              type: string
            parsedResult:
              $ref: '#/components/schemas/ParsedResult'
    ParseResultResponse:
      type: object
      description: |
        parse／editResult 成功的回應。**有界閘違規不走這裡**（422 `ParseGateErrorResponse`），所以成功時 `errors` 恆為空陣列；
        欄位保留以維持主控裁決的形狀（Markdown 契約 §6 D-04）。
      required: [importId, status, path, parsedResult, signedOff, errors, warnings]
      properties:
        importId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/ImportStatus'
        path:
          $ref: '#/components/schemas/ParsePath'
        parsedResult:
          $ref: '#/components/schemas/ParsedResult'
        signedOff:
          type: boolean
          description: parse 成功時恆為 false；editResult 後為 false（編輯撤銷 signoff）
        aiModel:
          type: string
        tokenUsed:
          type: integer
          format: int64
        reasoning:
          type: string
        errors:
          type: array
          items:
            $ref: '#/components/schemas/GateError'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/ParseWarning'
    SignoffRequest:
      type: object
      description: Phase 2 同名 schema（逐字）
      required: [approver]
      properties:
        approver:
          type: string
          minLength: 1
          description: 審批者；不可為空白（人工 signoff 不可匿名）
    ProjectResponse:
      type: object
      description: Phase 2 同名 schema（逐字）；confirm 回傳
      required: [id, name, executionPath, passCriteria, status, autonomyLevel, signedOff, goalsCount, tasksCount, tasksDone, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        executionPath:
          type: string
        passCriteria:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [DRAFT, READY, EXECUTING, COMPLETED, FAILED, ARCHIVED]
        autonomyLevel:
          type: integer
          format: int32
        signedOff:
          type: boolean
        signedOffBy:
          type: string
        signedOffAt:
          type: string
          format: date-time
        goalsCount:
          type: integer
          format: int32
        tasksCount:
          type: integer
          format: int32
        tasksDone:
          type: integer
          format: int32
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        createdBy:
          type: string
    RunStatus:
      type: string
      description: PRD 附錄 B／§5.3.5 的六態（寫入 PG 的值域）
      enum: [INITIALIZING, RUNNING, PAUSED, COMPLETED, FAILED, CANCELLED]
    BridgeRunStatus:
      type: string
      description: Bridge 的八態（PAUSING／CANCELLING 是過渡態，寫 PG 時折回 RUNNING）
      enum: [INITIALIZING, RUNNING, PAUSING, PAUSED, CANCELLING, COMPLETED, FAILED, CANCELLED]
    ScopeMode:
      type: string
      enum: [ALL, SELECTED]
    ExecutionLimits:
      type: object
      description: US-E-10 的單一任務／單一目標 Token 上限（整體上限是 tokenBudget）；超過 → TOKEN_BUDGET_EXCEEDED 告警＋自動暫停
      properties:
        taskTokens:
          type: integer
          format: int64
          minimum: 1
        goalTokens:
          type: integer
          format: int64
          minimum: 1
    ExecutionScope:
      type: object
      description: |
        ALL＝全部「可執行」任務（排除 COMPLETED／SKIPPED）；SELECTED＝`goalIds` 的全部可執行任務 ∪ `taskIds`。
        `followUpOfRunId` 只出現在後續批次（follow-up run）的回應。
        請求中 `mode` 可省略（預設 ALL）；回應一律帶 `mode`。
      properties:
        mode:
          $ref: '#/components/schemas/ScopeMode'
        goalIds:
          type: array
          items:
            type: string
            format: uuid
        taskIds:
          type: array
          items:
            type: string
            format: uuid
        limits:
          $ref: '#/components/schemas/ExecutionLimits'
        followUpOfRunId:
          type: string
          format: uuid
    StartExecutionRequest:
      type: object
      description: 全部欄位可省略（body 可為 `{}`）。Architecture §11.2 把三者標必填，這裡放寬並給預設（Markdown 契約 §6 D-10）
      properties:
        autonomyLevel:
          type: integer
          format: int32
          minimum: 1
          maximum: 10
          description: 預設取專案的 autonomyLevel
        tokenBudget:
          type: integer
          format: int64
          minimum: 1
          description: 預設取系統參數 execution.globalTokenBudget
        scope:
          $ref: '#/components/schemas/ExecutionScope'
    ExecutionRunResponse:
      type: object
      required: [id, projectId, runNumber, status, autonomyLevel, scope, totalTokensUsed, startedAt]
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        runNumber:
          type: integer
          format: int32
          description: 同專案內遞增
        status:
          $ref: '#/components/schemas/RunStatus'
        bridgeStatus:
          $ref: '#/components/schemas/BridgeRunStatus'
        autonomyLevel:
          type: integer
          format: int32
        scope:
          $ref: '#/components/schemas/ExecutionScope'
        totalTokensUsed:
          type: integer
          format: int64
          description: Bridge 寫入 execution_runs.total_tokens_used（console-api 只讀）
        tokenBudget:
          type: integer
          format: int64
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
        followUpOfRunId:
          type: string
          format: uuid
      example:
        id: e5a7c3b9-2f1d-4b6a-8c0e-1d2f3a4b5c31
        projectId: 0b8c5d1e-6a47-4d3f-8f2a-9c1e7b3a5d02
        runNumber: 1
        status: RUNNING
        bridgeStatus: RUNNING
        autonomyLevel: 1
        scope:
          mode: ALL
          goalIds: []
          taskIds: []
        totalTokensUsed: 0
        tokenBudget: 100000
        startedAt: '2026-10-15T08:30:12Z'
    ExecutionRunSummaryResponse:
      type: object
      description: 批次列表（含 US-M-06 批次比較所需欄位）
      required: [id, projectId, runNumber, status, autonomyLevel, scopeMode, totalTokensUsed, startedAt, tasksTotal, tasksCompleted, tasksFailed]
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        runNumber:
          type: integer
          format: int32
        status:
          $ref: '#/components/schemas/RunStatus'
        autonomyLevel:
          type: integer
          format: int32
        scopeMode:
          $ref: '#/components/schemas/ScopeMode'
        totalTokensUsed:
          type: integer
          format: int64
        tokenBudget:
          type: integer
          format: int64
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
        durationSec:
          type: integer
          format: int64
          description: 已完成批次＝completedAt−startedAt；進行中＝現在−startedAt
        tasksTotal:
          type: integer
          format: int32
          description: 範圍內任務數（取自凍結的 dag）
        tasksCompleted:
          type: integer
          format: int32
          description: 該批次內有 COMPLETED 步驟列的相異任務數
        tasksFailed:
          type: integer
          format: int32
          description: 該批次內有 FAILED 步驟列的相異任務數
        successRate:
          type:
            - number
            - 'null'
          description: tasksCompleted÷(tasksCompleted＋tasksFailed)×100（小數 1 位）；兩者皆 0 為 null
    CurrentStep:
      type: object
      required: [stepId, stepNumber, taskName, attempt]
      properties:
        stepId:
          type: string
          description: playbook step_id（例：G1-T2）
        stepNumber:
          type: integer
          format: int32
          description: 該步驟在 playbook 內的位置（1 起算，Bridge 的 current_step_number）
        taskId:
          type: string
          format: uuid
        taskName:
          type: string
        goalId:
          type: string
          format: uuid
        attempt:
          type: integer
          format: int32
          description: 第幾次嘗試（1＝首次；RETRYING 為 2 起）
    BridgeInfo:
      type: object
      required: [connected, checkedAt]
      properties:
        connected:
          type: boolean
          description: Bridge 是否可達（網路層）；false 時進度欄位為 DB 衍生值
        instance:
          type: string
          description: Bridge 實例識別（bridge_instance）；不含 pid、lock key
        status:
          $ref: '#/components/schemas/BridgeRunStatus'
        runKnown:
          type: boolean
          description: Bridge 可達但回 404 run_not_found 時為 false（workspace 已清除）
        checkedAt:
          type: string
          format: date-time
    ReviewKind:
      type: string
      description: 與 V3 migration 的 CHECK 一致（不擴充）
      enum: [TASK_CONFIRM, GOAL_CONFIRM, GOAL_COMPLETED, ESCALATED]
    ReviewStatus:
      type: string
      enum: [PENDING, APPROVED, REJECTED, RETRIED, SKIPPED]
    ReviewDecision:
      type: string
      enum: [APPROVE, REJECT, RETRY, SKIP]
    ReviewRequestResponse:
      type: object
      description: 待審核／已處理的審核項；`allowedDecisions` 決定 UI 哪些按鈕可按
      required: [id, runId, kind, status, reason, requestedAt, allowedDecisions]
      properties:
        id:
          type: string
          format: uuid
          description: review_requests.id；也是 POST review/{stepId} 路徑的 {stepId}
        runId:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/ReviewKind'
        status:
          $ref: '#/components/schemas/ReviewStatus'
        stepId:
          type: string
          format: uuid
          description: 佐證步驟列 execution_steps.id（TASK_CONFIRM／GOAL_*＝剛完成的步驟；ESCALATED＝失敗步驟）
        taskId:
          type: string
          format: uuid
        goalId:
          type: string
          format: uuid
        taskName:
          type: string
        goalName:
          type: string
        reason:
          type: string
          description: 給人看的原因（樣板見 Markdown 契約 §3.6.4）
        requestedAt:
          type: string
          format: date-time
        decidedBy:
          type: string
        decidedAt:
          type: string
          format: date-time
        comment:
          type: string
        allowedDecisions:
          type: array
          items:
            $ref: '#/components/schemas/ReviewDecision'
      example:
        id: f0b1c2d3-e4f5-4a6b-8c7d-9e0f1a2b3c41
        runId: e5a7c3b9-2f1d-4b6a-8c0e-1d2f3a4b5c31
        kind: TASK_CONFIRM
        status: PENDING
        taskId: c7e2b1a0-3d4f-4a5b-9c6d-7e8f9a0b1c22
        goalId: a1f4c2d3-5b6e-4c7d-8e9f-0a1b2c3d4e11
        taskName: 設定
        goalName: 基礎
