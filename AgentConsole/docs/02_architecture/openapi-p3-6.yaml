  /api/v1/stream/executions/{runId}/logs:
    get:
      tags: [SSE 推送]
      operationId: streamExecutionLogs
      summary: 即時執行日誌（SSE）
      description: |
        事件：`log`、`status-change`、`review-request`、`alert`（`data` 形狀見各 `*EventData` schema 與 Markdown 契約 §2）。
        認證：`Authorization: Bearer` 與 `?access_token=` 兩者皆收（EventSource 不能帶標頭）。
        `id:` 沿用 Bridge `seq`；後端自產的事件用 `<seq>.<n>`。`Last-Event-ID` 重播未送達事件。
        每 15 秒無事件送 `: keep-alive` 註解。PAUSED 不結束串流；終態後送 `status-change` 並關閉；
        重連時若 run 已終態且無事件可重播 → **204**（EventSource 收到 204 不再重連）。
      x-required-role: VIEWER
      x-rtm: [API-SSE-01, API-SSE-03, US-E-03, US-E-07]
      security:
        - bearerAuth: []
        - queryAccessToken: []
      parameters:
        - $ref: '#/components/parameters/RunIdPath'
        - $ref: '#/components/parameters/AccessTokenQuery'
        - $ref: '#/components/parameters/LastEventIdHeader'
        - name: tail
          in: query
          required: false
          description: 沒有 Last-Event-ID 時，先重播最後 N 則事件再接即時（預設 200；0＝只收之後的新事件）
          schema:
            type: integer
            format: int32
            minimum: 0
            maximum: 5000
            default: 200
      responses:
        '200':
          description: text/event-stream
          headers:
            Cache-Control:
              schema:
                type: string
              description: no-cache
            X-Accel-Buffering:
              schema:
                type: string
              description: no
          content:
            text/event-stream:
              schema:
                type: string
                description: SSE 文字框架；每個事件 `id:`／`event:`／`data:`（單行 JSON）。
        '204':
          description: run 已終態且沒有可重播的事件（結束重連）
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
      x-event-schemas:
