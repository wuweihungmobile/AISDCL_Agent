#     且該人工宣稱是本 workflow 判定「非緊急」的唯一依據、會隨新增 .ps1 靜默過期。
#     故①刪去檔名列舉，改以不會過期的措辭：**掃描面以 root-infra-ci.yml 第 2 道為準**
