# SCAN-C-11（DEF-101-200 rider，R23 修復）：原本是 workflow 層級單一 concurrency
# group（`windows-compat-ci-${{ github.ref }}-${{ github.event_name }}`，
# cancel-in-progress:true）——R7 已修過 push vs schedule/workflow_dispatch 同組
# 的問題（併入 github.event_name），但**同一 event_name 內部仍共用一把鎖**：
# 兩次 workflow_dispatch 連發（例如手動驗證 simulate_nightly_failure）時，
# cancel-in-progress:true 對整個 workflow run 生效，會把先前那次 run 的
# windows-nightly-full（+其下游 windows-nightly-alert）一併取消——取消後
# conclusion=cancelled（≠failure），紅色路徑（開單/留言）靜默蒸發。改為 job
# 層級三組獨立 concurrency（比照 macos-compat-ci.yml 已於 R13/CI-5 完成的同款
# 修復，見該檔 macos-smoke／macos-nightly-full／macos-nightly-alert 三處）：
# windows-smoke 維持 per-ref + cancel-in-progress:true（取消過時的 smoke 重跑
# 本身合理）；windows-nightly-full／windows-nightly-alert 改用不含 github.ref
# 的固定字串 group + cancel-in-progress:false，兩者互不干擾，各自見下方對應
# job 的 concurrency 區塊。

# 純驗證、不寫回 repo → 最小權限唯讀。
permissions:
  contents: read

jobs:
  windows-smoke:
    name: Windows smoke（實際執行關鍵腳本，非僅語法解析）
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    # R57 修正（Scan C2）：原 25 分鐘。本 job 與 macos-compat-ci.yml 的 macos-smoke 是
    # 刻意鏡射的一對（同為 22 步、同一批被驗腳本、同款 concurrency），該對的另兩個 job
    # （nightly-full 60／nightly-alert 10）兩平台數字皆相同，唯獨 smoke 25 vs 35 不對稱，
    # 且較緊的那個 cap 落在較慢的平台：ONBOARDING.md §5 疑難排解自己就記載「Windows 上
    # 首次 pip install／pytest 異常緩慢——Windows Defender 即時掃描大量小型 Python 檔案
    # （.venv、__pycache__）」，而本 job 正是連跑 bootstrap.ps1 建 .venv ×2 + 三組
    # pip install + ci-gate.ps1 雙軌 pytest。方向與實際速度差相反的 cap 會讓阻斷式 push
    # 閘門偶發性 timeout 誤紅 → 對齊為 35（timeout 是上限不是預約，未逾時不多花額度；
    # DEF-101-081 帳務停擺期間本 workflow 從未真正跑起來過，無實測時長可佐證，故取
    # 「與鏡射對象一致」這個不需臆測的判準）。
    timeout-minutes: 35
    concurrency:
      group: windows-compat-ci-smoke-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Windows PowerShell 5.1 核心驗證（Get-PythonGeMin 開箱可解析；DEF-101-760 症狀級迴歸鎖，以文件教學引擎執行）
        # 🔴 R71 新增。（step name 刻意不寫「本 job 唯一的 5.1 步驟」這類絕對詞：本檔
        # 已因同款措辭三度失實，見檔頭 CLAIM-QUOTE 區；引擎分佈一律去看檔頭那張受
        # test_gha_action_versions.py::TestWindowsCiHeaderSnapshotLock 看守的實測表。）
        # WHY（三句話）：
        #  ① **R71 之前，本 job 沒有任何一步跑在 Windows PowerShell 5.1 上**，而 5.1 正是
        #     ONBOARDING／CLAUDE.md 教使用者用的引擎（`powershell -ExecutionPolicy
        #     Bypass -File …`）。原本承擔這件事的兩步住在 windows-nightly-full，實查後
        #     確認它們**一次都沒真的執行過**（檔頭 ③ 已逐項訂正：帳務平面 + 該 job 的
        #     `if:` 讓 push 一律 skipped）⇒ PS 5.1 的**行為**面在 PR 閘門上等於零覆蓋。
        #  ② 挑這一項而不是把上面二十餘步複製一份跑 5.1：5.1 與 pwsh 7 真正**行為不同**
        #     的面向裡，只有「原生指令引數傳遞」在本輪實際造成 P0，且它是唯一無法用靜態
        #     掃描抓到的（`tools/tests/test_ps51_compat.py` 的 12 條行級判準掃的是**已被
        #     剝除字串**的 code 段，而缺陷本體就住在那個字串裡）。其餘 5.1 差異（`??`／
        #     `?.`／`&&`／`||`／三元／`-AsHashtable`／`$IsWindows`）皆已由該檔的靜態鎖
        #     在三平台涵蓋，重跑一次 5.1 買不到新東西。
        #  ③ 為何斷言 `Get-PythonGeMin` 而不是只驗字串 round-trip：round-trip（同檔的
        #     `TestPs51NativeArgvRoundTrip`）驗的是**代理指標**（探測碼字串有沒有被改寫），
        #     本步驟驗的是**症狀本身**（開箱時真的挑得到直譯器嗎）。DEF-101-760 的實害是
        #     「全新 Windows 機器 tools/dev_start.ps1 開箱路徑整條死掉」，任何**其他**讓
        #     `Get-PythonGeMin` 在 5.1 上回 $null 的原因（DEF-101-759 的 pyenv shim、
        #     DEF-101-766 的 PATHEXT 過濾把候選全淘汰）也會被這一步逮到，代理指標不會。
        #
        # 位置（緊接 setup-python、在任何 pip install／bootstrap 之前）＝刻意貼近
        # 「全新機器開箱」狀態：DEF-101-760 只在那個狀態下有實害（有 .venv 的機器走另一條
        # 分支）。前一步 setup-python 已保證 PATH 上有 3.11，故「找不到合格直譯器」只可能
        # 是 guard 自己壞掉，不會是環境問題。
        #
        # 🔴 爆炸半徑（本步驟會在什麼情況下讓 windows-smoke 轉紅）：(a) DEF-101-760 家族
        # 回歸〔本意〕；(b) `Get-PythonGeMin` 在 5.1 下因任何原因回 $null／回不存在的路徑
        # 〔本意〕；(c) GitHub 的 `shell: powershell` 不再對應 5.1（第一道斷言 fail-loud，
        # 刻意不 fallback——退化成「第 N 支 pwsh 重複驗證」而默默通過，才是真正的損失）；
        # (d) runner 映像變更使 setup-python 不再把合格直譯器放上 PATH〔此時上一步會先紅〕。
        # 本步驟**不進 pre-push**：本機 5.1 側的對等由 `tools/tests/test_ps51_compat.py::
        # TestPs51NativeArgvRoundTrip`（pre-push root-infra leg 會跑到）承擔，那是代理指標
        # 而非等價物——如實記於 test_smoke_ci_sync.py 的載具登記表，標 PARTIAL。
        #
        # 🔴 `run:` 本體刻意**全 ASCII**（訊息因此是英文，與本 repo 其餘 step 不同——
        # 這是取捨不是疏漏）：`shell: powershell` 的腳本本體是**由 GitHub runner 寫成
        # 暫存 .ps1 檔**再交給 powershell.exe，而該檔的編碼由 runner 決定、本 repo 無從
        # 控制也**尚未實測過**。本機真機實證（本輪逐字量測）：同一段內容存成 UTF-8
        # **無 BOM** ⇒ zh-TW 的 5.1 以 CP950 誤讀，中文字串字面值當場 ParserError、
        # rc=1；改存 UTF-8 **有 BOM** ⇒ rc=0。這正是 tools/tests/test_ps1_bom.py 檔頭
        # 記載的 DEF-101-002 政策所治的病，只是那道政策的射程是**repo 內 tracked .ps1**，
        # 管不到 runner 生成的暫存檔。⇒ 讓一道**阻斷式 push 閘門**的成敗取決於一個未經
        # 驗證的第三方編碼行為，是拿全員的 push 去賭；全 ASCII 則此風險歸零。
        # （同款風險存在於 windows-nightly-full 那兩步 5.1 step 的中文 run 本體——它們
        # 從未執行過，故該假設在本 repo 至今零實證；已列入回報給主控的殘留風險，本輪
        # 不動它們〔射程外，且它們非阻斷〕。）
        # 中文 WHY 一律留在上方註解：註解不會被執行，不受編碼影響。
        #
        # 成本：本機真機（powershell.exe 5.1.26100.8875）實測 0.53s，可忽略。
        shell: powershell
        run: |
          if ($PSVersionTable.PSVersion.Major -ne 5) {
            throw "ENGINE-MISMATCH: this step's entire discriminating power rests on running under Windows PowerShell 5.1 (the engine the docs teach users). Measured: $($PSVersionTable.PSVersion). If 'shell: powershell' stops meaning 5.1, this step silently degrades into yet another pwsh duplicate -- failing loud instead. See the Chinese WHY in the step comment above."
          }
          . ./tools/lib/WindowsAppsGuard.ps1
          $py = Get-PythonGeMin
          if (-not $py) {
            throw "DEF-101-760 REGRESSION: Get-PythonGeMin returned null under native Windows PowerShell 5.1, which means the tools/dev_start.ps1 out-of-box path is dead on a fresh Windows machine. Most likely cause: the version-probe string embeds a double quote, which 5.1 eats while re-composing the native command line, so python receives syntactically invalid code (rc=1) and every candidate is rejected. Fix: see the PythonGeMinProbe comment in tools/lib/WindowsAppsGuard.ps1 -- write the empty string as str(), never as a quoted literal."
          }
          if (-not (Test-Path -LiteralPath $py)) {
            throw "Get-PythonGeMin returned a path that is not on disk: $py -- probe output looks truncated or polluted."
          }
          Write-Host "PS 5.1 core check passed: engine=$($PSVersionTable.PSVersion) Get-PythonGeMin=$py"

      - name: tools/tests 第三方相依（清單 SSOT＝tools/run_root_unittests.py 的 _THIRD_PARTY_PREREQS；漏裝時該 runner 會 fail-fast 指路）
        shell: pwsh
        # R68：tools/tests/ 有三支測試 import `autoclaude.*`，連帶拉進 yaml→pydantic→httpx。
        # 缺相依時 discovery 把它們整份覆蓋塌成佔位測試，122 支迴歸鎖靜默不跑而本 step 紅
        # 在一句「測試疑似大規模靜默消失」上——三平台實測同一數字，是環境維度不是平台維度。
        run: python -m pip install --quiet --disable-pip-version-check pyyaml pydantic httpx

      - name: tools/tests 外部工具相依（清單 SSOT＝tools/tests/test_run_root_unittests.py 的 _EXTERNAL_TOOL_PREREQS；runner 無此層 fail-fast，漏裝時由 ExternalToolPrereqDeclarationTest 多紅一支點名）
        shell: pwsh
        # R69：tools/tests/test_pre_push_dispatcher.py 有 5 支測試在 tmp repo 內**真跑**根層
        # dispatcher 並斷言 rc==0，而其 root-infra 快層第 ④ 段對缺 ruff 是 fail-loud（刻意不
        # 軟跳過，見 tools/ruff.toml 檔頭）⇒ 本目錄自此隱性需要 PATH 上有 ruff。此前只有
        # root-infra-ci.yml 裝 ruff，本 job 沒裝 ⇒ 同一批 tools/tests 在三平台有兩種結果
        # （SD 單變因 A/B 實測：有 ruff → Ran 17 OK；唯一差別拿掉 ruff → failures=5）。
        # 版本釘選對齊 root-infra-ci.yml 與 AutoClaude/pyproject.toml（勿單邊升版）。
        # 本 job 刻意**不**跑 `ruff check tools/`（那是 root-infra-ci.yml 第 16 道的職責）：
        # 這裡要的只是「跑 runner 的環境前置一致」，不是把 lint 閘門複製三份。
        run: python -m pip install --quiet --disable-pip-version-check 'ruff==0.15.21'

      - name: tools/tests/（SIGPIPE 回歸鎖 + dev_start.py 平台邏輯；R3 QA 發現：先前只在 root-infra-ci.yml 的 ubuntu-latest 上以 mock 跑過，從未在真實 Windows 執行過）
        shell: pwsh
        # R10 QA-2（DEF-101-127）：裸 discover 對「發現 0 個測試」回 rc=0——改走
        # tools/run_root_unittests.py（數量下限釘選，低於下限紅燈不執行）。
        run: python tools/run_root_unittests.py

      - name: install_windows_nightly.ps1 -WhatIf 預覽（R26 Scan-C 發現：從未在真實 CI 執行過；鏡射 macos-compat-ci.yml install_mac_nightly.sh --render-only 步驟，DEF-101-269）
        # -WhatIf 不需 elevation、不真的呼叫 Register-ScheduledTask，windows-latest runner
        # 可安全直跑。斷言寫法鏡射 tools/windows_smoke_local.ps1 [9/9]（獨立子行程呼叫，
        # ShouldProcess 的 WhatIf 訊息屬子行程原生 stdout，2>&1 合流後即可捕捉得到）。
        shell: pwsh
        run: |
          $whatIfOutput = & powershell.exe -NoProfile -ExecutionPolicy Bypass `
            -File ./tools/install_windows_nightly.ps1 -WhatIf 2>&1 | Out-String
          Write-Host $whatIfOutput
          if ($LASTEXITCODE -ne 0) { throw "install_windows_nightly.ps1 -WhatIf 失敗（rc=$LASTEXITCODE）" }
          if ($whatIfOutput -notmatch 'Register-ScheduledTask') { throw "install_windows_nightly.ps1 -WhatIf 輸出未含預期的 Register-ScheduledTask 內容" }
          Write-Host "install_windows_nightly.ps1 -WhatIf 預覽通過"

      - name: 執行 tools/bootstrap.ps1（R1 SA 發現：Windows 新人上手入口從未被實測）
        shell: pwsh
        run: |
          ./tools/bootstrap.ps1
          if (-not (Test-Path .venv)) { throw "bootstrap.ps1 執行後 .venv 未建立" }
          Write-Host "bootstrap.ps1 執行成功，.venv 已建立"

      # ── R59 DEF-101-518：此處與 macOS 側的已知不對稱（本輪只記錄、刻意不改）──────
      # macos-compat-ci.yml 在對應位置有一步「將 .venv/bin 加入 PATH（比照本機開發慣例，
      # 供後續步驟裸呼叫 python）」→ `echo "$PWD/.venv/bin" >> "$GITHUB_PATH"`。
      # 本 job **沒有**對等步驟，於是 bootstrap 之後所有裸 `python` 呼叫用的仍是 runner
      # 的 setup-python，而不是剛建好、裝了 AutoClaude editable 的 `.venv`——兩平台
      # 「smoke 實際受測的執行環境與依賴集」因此不對等，Windows 的 .venv 只被驗「存在」。
      #
      # **本輪刻意不照抄 macOS 那一步**，理由是實測查證後認定「照抄並非顯然安全」：
      # 本 job 下方有一個 macOS 側**不存在**的步驟（「觸發 dev_start.py 的 .venv 形狀
      # 換手分支」），它會 `Rename-Item -LiteralPath .venv -NewName .venv-cache-windows`
      # 把 .venv 整個搬走、並在原處造一個假的 `.venv\bin\python`。若先把 `.venv\Scripts`
      # 前置進 GITHUB_PATH，該步驟執行期間 PATH 上那一項會指向不存在的目錄，之後的
      # 裸 `python` 解析結果將取決於 PATH 跳過缺失項後的回退行為——這是**行為變更**，
      # 而 GitHub CI 目前因帳務停擺不啟動 runner（DEF-101-081/208），本輪拿不到任何
      # 實測證據。在唯一能驗證它的管道停擺時，對 CI 做無法驗證的行為變更不划算。
      #
      # 解鎖條件（做這件事需同時滿足，缺一不可）：① GitHub 帳務恢復、runner 能真的跑；
      # ② 新增的 PATH 步驟必須與下方「.venv 形狀換手」步驟決定明確的先後順序（或在換手
      # 步驟前後自行增補/移除該 PATH 項）；③ 以一次真實 windows-latest run 觀測到
      # 「bootstrap 之後的步驟確實用到 .venv 的 python」才算完成。

      - name: 重跑 tools/bootstrap.ps1（既有 .venv 沿用情境；R9 Fix-D）
        # R9 Fix-D：macos-compat-ci.yml 對 bootstrap.sh 跑兩次（全新 + 沿用），本 job
        # 先前只跑一次——tools/bootstrap.ps1 的「偵測到既有 .venv → 沿用」分支
        # （bootstrap.ps1 的 .venv 存在檢查 + Scripts\python.exe 形狀檢查）零覆蓋。
        # 斷言字串對照 bootstrap.ps1 沿用分支實際輸出：「偵測到既有 .venv → 沿用」。
        # Write-Host 走 information stream，需 *>&1 合流才捕捉得到。
        shell: pwsh
        run: |
          $out = ./tools/bootstrap.ps1 *>&1 | Out-String
          Write-Host $out
          if ($LASTEXITCODE -ne 0) { throw "既有 .venv 重跑 bootstrap.ps1 失敗（rc=$LASTEXITCODE）" }
          if (-not (Test-Path .venv\Scripts\python.exe)) { throw "既有 .venv 重跑後 .venv\Scripts\python.exe 不存在" }
          if ($out -notlike '*偵測到既有 .venv*沿用*') { throw "未見沿用訊息——bootstrap.ps1 未走既有 .venv 沿用分支" }
          Write-Host "bootstrap.ps1 既有 .venv 沿用情境通過"

      - name: dot-source tools/dev_start.ps1（同上，日常開工入口）
        shell: pwsh
        run: |
          # R13 CI-6：補 --no-sync 對齊 macos-compat-ci.yml 三處 dev_start 既有寫法
          # （CI 內不需 git 同步、省一次網路 fetch；dev_start.ps1 以
          # ValueFromRemainingArguments 的 $RestArgs 原樣透傳給核心 tools/dev_start.py）
          . ./tools/dev_start.ps1 --no-sync
          if ($LASTEXITCODE -ne 0) { throw "dev_start.ps1 核心邏輯（tools/dev_start.py）回報失敗，exit=$LASTEXITCODE" }
          Write-Host "dev_start.ps1 執行成功"

      - name: 觸發 tools/dev_start.py 的 .venv 形狀換手分支（posix→windows，僅 Windows runner 可測）
        shell: pwsh
        # R56 新增（SA／SD 各自獨立回報同一根因）：`tools/dev_start.py::_ensure_venv_shape()`
        # 在 Windows 上 `other = "posix"`，故 `.venv-cache-posix/` 與
        # `.venv-cache-posix.bak-<ts>/` 這兩個路徑**只會在 Windows 上被產生**；該分支
        # 的核心動作是對「內含數千檔的 venv 目錄」連續做 `Path.rename`，正是 Windows
        # 上最容易因 Explorer／防毒／殘留 python.exe 持有 handle 而拋
        # `OSError: [WinError 5/32]` 的操作，與 POSIX 幾乎不會失敗的 rename 語意完全
        # 不同——也就是「唯一需要真機驗證的那一側」此前恰好是沒有真機驗證的那一側。
        # 既有覆蓋的誠實界定：`tools/tests/test_dev_start.py` 確有以 tmpdir 模擬
        # flavor 走過整條路徑（含 .bak 回退），但那是在 macOS/Linux 上跑的，對 Windows
        # 檔案鎖定語意零鑑別力；本 repo 紀律（AutoClaude/tests/conftest.py、根層
        # ONBOARDING.md §10）明文「Windows 專屬路徑須至少於一次真實 Windows CI run
        # 驗證過，mock sys.platform 不算數」。對稱性：macOS 側對「僅 macOS runner 可測」
        # 的 cross_same_flavor 分支早有 macos-compat-ci.yml 專屬 step 並附同款理由註解，
        # Windows 側沿用同一論證卻從未落地（DEF-101-348 同類別）。
        #
        # 成本控制（刻意設計）：先把前面步驟建好的真 .venv park 成
        # `.venv-cache-windows`，換手發生後 dev_start 會走「自快取秒級換回」路徑，
        # 免掉一次完整 bootstrap 重建（CI 額度紀律）；且該換回本身又是第三次目錄
        # rename，對本 step 要驗的「Windows 目錄 rename 是否可靠」是加分不是減分。
        # 若快取信任判斷未過（_cache_restore_trust），dev_start 會自行 fallback 到
        # bootstrap 重建，最終斷言（.venv\Scripts\python.exe 存在）仍成立、不假紅。
        #
        # 斷言刻意不只看「rc=0」：dev_start 對「換手分支根本沒被觸發」也會回 0，
        # 只驗 rc 等於 fail-open 死斷言（本輪 macOS 側 hook 探針即栽在這個形狀），
        # 故一律機械比對 `_ensure_venv_shape()` 的兩句識別訊息與實際產出的目錄。
        run: |
          # 一律以 Where-Object -like 過濾而非 Get-ChildItem -Filter：-Filter 會下推到
          # Windows 檔案系統的萬用字元引擎（含 8.3 短檔名等歷史語意），對「以 . 開頭、
          # 中間又帶 . 的名稱」行為與 PowerShell 自身的 -like 不保證一致；本 step 的
          # 清場與斷言都不能有這種平台細節風險。
          Get-ChildItem -Path . -Force | Where-Object { $_.Name -like '.venv-cache-*' } |
            Remove-Item -Recurse -Force
          if (-not (Test-Path .venv\Scripts\python.exe)) {
            throw "前置條件不成立：本 step 之前應已有 windows 形狀 .venv（bootstrap.ps1 步驟）"
          }

          # ── 第 1 次：目的地無內容 → 直接換手 ────────────────────────────────
          Rename-Item -LiteralPath .venv -NewName .venv-cache-windows
          New-Item -ItemType Directory -Force -Path .venv\bin | Out-Null
          Set-Content -LiteralPath .venv\bin\python -Value '' -NoNewline
          $out1 = (. ./tools/dev_start.ps1 --no-sync *>&1 | Out-String)
          Write-Host $out1
          if ($LASTEXITCODE -ne 0) { throw "dev_start.ps1（換手第 1 次）失敗，exit=$LASTEXITCODE" }
          if ($out1 -notlike '*換手保留為 .venv-cache-posix*') {
            throw "未見換手訊息——_ensure_venv_shape() 的 posix→windows 換手分支未被觸發，本 step 對該分支的真機覆蓋宣稱落空"
          }
          if (-not (Test-Path .venv-cache-posix\bin\python)) {
            throw "換手後 .venv-cache-posix\bin\python 不存在——posix 形狀 .venv 未被保留"
          }
          if (-not (Test-Path .venv\Scripts\python.exe)) {
            throw "換手後 .venv\Scripts\python.exe 不存在——本平台 .venv 未被換回/重建"
          }
          $developing = (Get-Content .dev_env_state.json -Raw | ConvertFrom-Json).developing
          if ($developing -ne 'windows') { throw ".dev_env_state.json developing 應為 windows，實際=$developing" }
          Write-Host "換手第 1 次通過（.venv-cache-posix/ 已產生、.venv 已為 windows 形狀）"

          # ── 第 2 次：目的地已有內容 → `.venv-cache-posix.bak-<ts>/` 回退分支 ──
          # 正常路徑上 .venv-cache-windows 已於第 1 次被「秒級換回」消耗掉；但若
          # 快取信任判斷未過，dev_start 明文「不自動清除」而改走 bootstrap 重建，
          # 該目錄會殘留 → 下面的 Rename-Item 會以「目的地已存在」失敗並掩蓋真正的
          # 測試意圖。先無條件清掉，讓第 2 次的前置條件與第 1 次完全一致。
          if (Test-Path .venv-cache-windows) { Remove-Item -Recurse -Force .venv-cache-windows }
          Rename-Item -LiteralPath .venv -NewName .venv-cache-windows
          New-Item -ItemType Directory -Force -Path .venv\bin | Out-Null
          Set-Content -LiteralPath .venv\bin\python -Value '' -NoNewline
          $out2 = (. ./tools/dev_start.ps1 --no-sync *>&1 | Out-String)
          Write-Host $out2
          if ($LASTEXITCODE -ne 0) { throw "dev_start.ps1（換手第 2 次）失敗，exit=$LASTEXITCODE" }
          $baks = @(Get-ChildItem -Path . -Force -Directory |
            Where-Object { $_.Name -like '.venv-cache-posix.bak-*' })
          if ($baks.Count -lt 1) {
            throw "未產生 .venv-cache-posix.bak-<ts>/ ——目的地已有內容時的改名回退分支未被觸發"
          }
          Write-Host "換手第 2 次通過（回退目錄：$($baks[0].Name)）"

          # 清場：本 step 的探針目錄不得污染後續 step（.venv-cache-* 為 gitignored，
          # 但殘留會讓下一次換手判斷改走不同分支，且佔 runner 磁碟）。
          Get-ChildItem -Path . -Force | Where-Object { $_.Name -like '.venv-cache-*' } |
            Remove-Item -Recurse -Force
          if (-not (Test-Path .venv\Scripts\python.exe)) {
            throw "清場後 .venv\Scripts\python.exe 不存在——後續 step 依賴的 .venv 已被破壞"
          }
          Write-Host ".venv 形狀換手分支（僅 Windows runner 可測）驗證通過"

      - name: Install AutoClaude deps
        working-directory: AutoClaude
        # R15 SCAN-C-10：Windows runner 的 run 步驟預設 shell 即 pwsh，GitHub pwsh
        # 包裝只回傳「最後一條」native 指令的 exit code（$ErrorActionPreference 不攔
        # native）——pip 升級失敗會被最後一條成功吞沒。對非最後一條 native 指令逐條
        # 斷言（鏡射本檔既有 $LASTEXITCODE throw 慣例）。
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { throw "python -m pip 升級失敗（rc=$LASTEXITCODE）" }
          pip install -e ".[dev]"

      - name: pty_wrapper / hotkey_handler 平台解析單元測試
        working-directory: AutoClaude
        shell: pwsh
        run: python -m pytest tests/test_perception.py -q -rs --tb=short  # -rs：R59 ARCH-R59-NB1

      - name: AutoClaude 平台敏感測試子集（R76-11：push 閘門對 AutoClaude 生產樹此前零執行證據）
        working-directory: AutoClaude
        # 🔴 R76-11：`AutoClaude/tests/**` 100% 落在本檔 paths 內（本輪實測 340/340），
        # 但本 job 此前只跑 `tests/test_perception.py` 一支 ⇒ **觸發面有、執行面近乎零**。
        # 跑整棵樹的只有每週一次、`continue-on-error: true` 的 windows-nightly-full。
        # 「push 後全綠」對 AutoClaude 生產碼在 Windows 上的行為因此零證據力，而
        # `paths` 命中很容易被讀成「已覆蓋」——這一步把那個數字從 0 提到非 0。
        #
        # 為何取子集而非全樹：全樹是 nightly 的職責，PR/push 閘門要的是快速迴圈；
        # 這一步只買「平台假設在真 Windows 上還成立嗎」，不買回歸完整性。
        #
        # 🔴 為何用 `-k` 而不是新增 marker：新 marker 要逐支標，漏標＝掃描面靜默縮小
        # （本 repo 已有多起判例）。關鍵字選法對「日後新寫的平台相關測試」自動生效——
        # 檔名／測試名帶 path／encoding／platform／shell／subprocess 是本 repo 既有命名
        # 慣例。代價明說：會選進一些名字沾邊但與平台無關的測試，那是可接受的多跑。
        #
        # 🔴 成本為**本機真機實測值、非推估**（Windows 11 Pro 26200 ／ venv Python
        # 3.11.9 ／ 2026-08-05，同一條命令列）：`277 passed, 7 skipped, 3840 deselected
        # in 13.54s`。runner 會慢一些，但與本 job 既有的 bootstrap／ci-gate 步驟同數量級。
        #
        # 🔴 掃描面歸零的失效方向刻意是紅燈：若日後重構把這些關鍵字改光，`-k` 選出 0 支
        # 時 pytest 回 **rc=5**（本輪以 `-k zzz_no_such_keyword_r76` 實測 rc=5）⇒ 本步驟
        # 當場紅，不會靜默通過。故此處刻意不加任何 `|| true`／`continue-on-error` 兜底。
        shell: pwsh
        run: python -m pytest tests -q -rs -m 'not perf and not pg_real' -k 'path or encoding or platform or shell or subprocess'

      - name: 執行 tools/integration_gate.ps1 -SkipFull（實際執行，非僅語法解析；P1 Architect 發現修正）
        # Architect 發現：root-infra-ci.yml 對 .ps1 僅做 AST 語法解析，本 workflow
        # 先前把 6 個入口點升級為實際執行，但漏了 tools/integration_gate.ps1（monorepo
        # 整合層薄聚合閘門），仍停留在僅語法解析的曝險狀態。
        # -SkipFull 只跑 [3/5]SDD bridge 整合煙霧 + [4/5]回退驗證 + [5/5]cc-switch A/B
        # 偵測（未裝 CLI 時 SKIP，不計失敗），略過 [1/5]AutoClaude local_ci_gate 全套／
        # [2/5]AISDLC_SDD ci-gate 全套的完整重跑。
        # 已知覆蓋率限制（R34 一審 QA 於 macos-compat-ci.yml 同款措辭發現修正，本檔為
        # 同一失實敘述的原始出處，一併訂正）：[2/5] 確實由本 job 下一步涵蓋；但
        # [1/5]（`tools/local_ci_gate.{sh,ps1}` 全套，含 pytest 全套）**並未**在本
        # windows-smoke job 另跑，只靠每週一次的 `windows-nightly-full`
        # （continue-on-error 非阻斷）執行 `local_ci_gate.ps1`（見本檔頂部 R2 段落既有
        # 揭露）。🔴 R76-11 訂正：本段原文寫「AutoClaude 完整測試套件在本 PR/push 閘門
        # 上零覆蓋」——「完整套件」那半句今日仍成立，但「零覆蓋」自本輪起已失實：上方
        # 新增的「AutoClaude 平台敏感測試子集」步驟在本 job 實跑 AutoClaude/tests 的
        # 平台敏感子集（本機實測 277 passed）。故此處改為窄斷言：**完整**套件仍只在
        # nightly；平台敏感子集已進 push 閘門。如實記載，避免任一方向的失實宣稱；符合
        # PR-gate 快速迴圈定位；depends 僅需前面已安裝的 AutoClaude deps。
        shell: pwsh
        run: ./tools/integration_gate.ps1 -SkipFull

      - name: 安裝 AISDLC_SDD pinned deps
        working-directory: AISDLC_SDD/AISDLC_SDD_v0.01
        # R18 全面掃描：鏡射本檔「Install AutoClaude deps」步驟既有修復（R15
        # SCAN-C-10）——pwsh 只回傳「最後一條」native 指令的 exit code，pip 升級
        # 失敗會被 pip install -r 的成功吞沒，對非最後一條 native 指令逐條斷言。
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { throw "python -m pip 升級失敗（rc=$LASTEXITCODE）" }
          pip install -r requirements-ci.txt

      - name: 執行（非僅解析）ci-gate.ps1（凍結基線 + LATEST 雙軌）
        # 誠實揭露殘留覆蓋率限制（四方複審 R1/R2 Architect 發現，先前兩輪未回應）：
        # ci-gate.ps1 採「偵測到 Git Bash 就薄委派給 ci-gate.sh」設計；GitHub 官方
        # windows-latest runner 內建 Git for Windows（含 bash.exe），本步驟幾乎必然
        # 走委派分支（跑到的是 ci-gate.sh 的完整雙軌邏輯），ci-gate.ps1 自身原生
        # PowerShell fallback 分支（僅 v0.01 凍結基線單軌，找不到 Git Bash 時才會走）
        # 覆蓋率趨近於零——本步驟的綠燈不代表該原生分支已被驗證過。若要驗證原生
        # 分支本身，需另外在暫時隱藏/改名 bash.exe 的環境下重跑，目前未做（該分支
        # 邏輯遠簡於委派路徑、且僅在非標準 Windows 安裝下才會被觸發，暫列為已知
        # 限制而非本輪必須解決項）。
        #
        # DEF-101-062：windows-latest runner 的 Docker Linux 容器支援本身環境不穩定
        # （連續三次真實 CI run 1 成功/2 失敗，非確定性 bug）。LATEST(v0.30) 已改
        # requires_docker_success marker 在 Windows 上正確 skip，但 ci-gate.ps1 同時
        # 跑的凍結基線 v0.01 依框架治理規則不可原地修改（見 AISDLC_SDD/CLAUDE.md
        # 「凍結基線不可在原地修改」），其 test_phase_h.py 仍是舊版無條件 requires_docker。
        # 故在此以 CI 組態層級（而非改動凍結原始碼）用標準 PYTEST_ADDOPTS 對兩個
        # 「需要容器成功執行」的測試做 keyword 排除，兩條軌（v0.01 與 v0.30）皆吃得到
        # 這個環境變數；v0.30 的 requires_docker_success 本身已 skip，此排除對它是
        # 冗餘但無害的雙重保險。
        working-directory: AISDLC_SDD
        shell: pwsh
        env:
          PYTEST_ADDOPTS: -k "not test_docker_backend_real_pass and not test_docker_backend_e2e_through_fsm"
        run: ./scripts/ci-gate.ps1

      - name: install_git_hooks.ps1 安裝／解除往返驗證
        shell: pwsh
        run: |
          ./AutoClaude/tools/install_git_hooks.ps1
          $hooksPath = git config --get core.hooksPath
          if (-not $hooksPath) { throw "core.hooksPath 未設定" }
          Write-Host "core.hooksPath = $hooksPath"
          ./AutoClaude/tools/install_git_hooks.ps1 -Uninstall
          $hooksPathAfter = git config --get core.hooksPath
          if ($hooksPathAfter) { throw "core.hooksPath 卸載後仍殘留：$hooksPathAfter" }
          Write-Host "install_git_hooks.ps1 安裝／解除往返驗證通過"
          # git config --get 對已移除的 key 回報 rc=1（這正是本測試要斷言的期望結果），
          # 若不顯式歸零，pwsh 會把這個「預期中的非零」誤傳為本 step 的失敗結果。
          exit 0

      - name: GitHooksInstallCommon.ps1 Assert-NotLinkedWorktree 於 linked worktree 下應正確拒絕（fail-loud；獨立複審發現：macOS 側已測、Windows 側零覆蓋 P0）
        # 獨立複審發現：本輪「架構最佳化」把 linked worktree 防護抽成
        # tools/lib/GitHooksInstallCommon.ps1 共用函式，macos-compat-ci.yml 對兩個
        # 呼叫端（install_git_hooks.sh / install-hooks.sh）都各自驗證「於 linked
        # worktree 下應 fail-loud」，但 windows-compat-ci.yml 從未補上對等步驟——
        # 上面兩個既有 step 只在一般 checkout（非 worktree）下跑安裝/解除往返，從未
        # 觸發 Assert-NotLinkedWorktree 的拒絕分支。
        # 注意：pwsh 呼叫另一支 .ps1（`&`／直接路徑呼叫）時，被呼叫腳本內的
        # `exit N` 只會結束該腳本自身、不會終止呼叫端 run block 的其餘敘述，但會
        # 正確設定 $LASTEXITCODE 供呼叫端讀取——故用 $LASTEXITCODE 斷言、不依賴
        # 整個 step 因 exit 而提前結束。
        shell: pwsh
        run: |
          $wt = Join-Path $env:RUNNER_TEMP "wt-install-git-hooks-reject"
          git worktree add --detach $wt HEAD
          Push-Location $wt
          ./AutoClaude/tools/install_git_hooks.ps1
          $rc = $LASTEXITCODE
          Pop-Location
          git worktree remove --force $wt
          if ($rc -ne 1) { throw "預期在 linked worktree 下 install_git_hooks.ps1 應 exit 1，實際 rc=$rc" }
          Write-Host "install_git_hooks.ps1 worktree 拒絕驗證通過（rc=1 as expected）"
          exit 0

      - name: AISDLC_SDD/scripts/install-hooks.ps1 驗證（R1 SA 發現：第二入口從未被測到）
        shell: pwsh
        run: |
          ./AISDLC_SDD/scripts/install-hooks.ps1
          $hooksPath = git config --get core.hooksPath
          if (-not $hooksPath) { throw "core.hooksPath 未設定" }
          if ($hooksPath -match '/' -and $hooksPath -match '\\') { throw "core.hooksPath 含混合分隔符：$hooksPath" }
          Write-Host "install-hooks.ps1 驗證通過：core.hooksPath = $hooksPath"
          git config --unset core.hooksPath

      - name: AISDLC_SDD/scripts/install-hooks.ps1 於 linked worktree 下應正確拒絕（fail-loud；同上，第二入口同樣零覆蓋）
        shell: pwsh
        run: |
          $wt = Join-Path $env:RUNNER_TEMP "wt-install-hooks-reject"
          git worktree add --detach $wt HEAD
          Push-Location $wt
          ./AISDLC_SDD/scripts/install-hooks.ps1
          $rc = $LASTEXITCODE
          Pop-Location
          git worktree remove --force $wt
          if ($rc -ne 1) { throw "預期在 linked worktree 下 install-hooks.ps1 應 exit 1，實際 rc=$rc" }
          Write-Host "install-hooks.ps1 worktree 拒絕驗證通過（rc=1 as expected）"
          exit 0

      - name: 根層 dispatcher hooks：安裝 + 真實 git commit 經 core.hooksPath 觸發 dispatcher（R9 ARCH-F3）
        # R9 ARCH-F3：dispatcher 三支 hook（tools/git-hooks/pre-commit／post-commit／
        # pre-push）在 Windows 由 Git for Windows 的 msys bash 執行，此前本 workflow 只
        # 驗證安裝腳本寫入 core.hooksPath，從未讓真實 git commit 經 core.hooksPath 實際
        # 執行過 dispatcher 一次（零實跑覆蓋）；macos-compat-ci.yml 已有對等 step，此為鏡射。
        # 隔離做法照抄 macos 版：CI workspace checkout 本身即 throwaway（permissions:
        # contents: read，probe commit 不推送、事後 revert），git config 只寫進 CI 副本；
        # 結尾 --uninstall 還原，不影響本 job 其餘 step。
        # 可觀測訊號（兩道）：(1) probe 檔放 tools/ 下，dispatcher 根層基建 leg 會印
        # 「[pre-commit dispatcher]」marker，從 commit 輸出 grep 斷言 dispatcher 真的被
        # git 執行（而非 hooks 未生效、commit 裸通過）；(2) 負路徑：帶語法錯誤的
        # tools/*.sh 必須被 dispatcher 的 bash -n 閘擋下——macos 版負路徑用 CON.txt，
        # 在 NTFS 上該檔名根本建不出來，Windows 改用語法錯誤閘作對等負路徑。
        shell: bash
        run: |
          bash AutoClaude/tools/install_git_hooks.sh
          hp="$(git config --get core.hooksPath || true)"
          test -n "$hp" || { echo "::error::core.hooksPath 未設定"; exit 1; }

          printf '%s\n' '#!/usr/bin/env bash' 'echo ok' > tools/_ci_windows_hook_probe.sh
          git add tools/_ci_windows_hook_probe.sh
          set +e
          out="$(git -c user.email=ci@example.com -c user.name=ci -c commit.gpgsign=false \
            commit -m "ci: windows hook probe (throwaway, not pushed)" 2>&1)"
          rc=$?
          set -e
          echo "$out"
          if [ "$rc" -ne 0 ]; then
            echo "::error::probe commit 失敗（rc=$rc）——dispatcher 應放行乾淨變更"
            exit 1
          fi
          echo "$out" | grep -F "[pre-commit dispatcher]" >/dev/null || {
            echo "::error::commit 輸出未見 dispatcher marker——hooks 未經 core.hooksPath 實際執行"; exit 1; }
          echo "git commit 經 core.hooksPath 成功觸發 pre-commit dispatcher（exit 0 + marker 可觀測）"

          printf '%s\n' '#!/usr/bin/env bash' 'if true; then' > tools/_ci_windows_hook_probe_bad.sh
          git add tools/_ci_windows_hook_probe_bad.sh
          set +e
          git -c user.email=ci@example.com -c user.name=ci -c commit.gpgsign=false \
            commit -m "ci: windows bad probe (must be rejected)" -q
          rc=$?
          set -e
          git reset -q HEAD tools/_ci_windows_hook_probe_bad.sh
          rm -f tools/_ci_windows_hook_probe_bad.sh
          if [ "$rc" -eq 0 ]; then
            echo "::error::帶語法錯誤的 tools/*.sh 應被 dispatcher bash -n 閘擋下，commit 卻成功"
            exit 1
          fi
          echo "dispatcher 正確擋下語法錯誤的根層 .sh（rc=$rc as expected）"

          git rm -q tools/_ci_windows_hook_probe.sh
          git -c user.email=ci@example.com -c user.name=ci -c commit.gpgsign=false \
            commit -m "ci: revert windows hook probe (throwaway, not pushed)" -q
          bash AutoClaude/tools/install_git_hooks.sh --uninstall
          hp2="$(git config --get core.hooksPath || true)"
          test -z "$hp2" || { echo "::error::--uninstall 後 core.hooksPath 仍殘留：$hp2"; exit 1; }
          echo "dispatcher 真實 commit 驗證完成，hooks 已還原"

      - name: install_post_commit.ps1 執行 + 非 ASCII 路徑編碼損毀斷言（P1 回歸鎖，R1 SD 發現修正；R2 SD/Architect 發現再修正；2026-07-16 R8 SD 發現 linked-worktree 路徑解析 bug 修復後再修正）
        shell: pwsh
        run: |
          # R1 SD 發現：原斷言直接在 windows-latest 的純 ASCII checkout 路徑下跑，
          # 原始 P1 bug（-Encoding ascii 損毀非 ASCII 路徑）在此環境永遠測不到、是死斷言。
          # 用 git worktree 建一個路徑含中文字元的副本，重現原始觸發條件
          # （$RepoRoot/$HookSrcDrift/$HookSrcClosure 組出的字串含非 ASCII 字元）。
          #
          # R2 Architect 發現：AISDLC_SDD 版本路徑先前寫死 v0.30，與 root-infra-ci.yml
          # 動態解析 LATEST 版本（sort -V 取最高版語意）的慣例脫節——版本演化到 v0.31
          # 時本 step 不會有機械訊號提醒更新，會繼續測已非 LATEST 的舊版。改為與
          # root-infra-ci.yml 同一套動態解析邏輯，永遠鎖定當下真正的 LATEST 版本。
          # R10 DEF-101-133：LATEST 解析委派 scripts/sdd_version.py 單一真相源
          # （tracked 過濾＋錨定＋數值排序），不再內嵌 pwsh regex 重寫「等價邏輯」。
          $latestName = (& python AISDLC_SDD/scripts/sdd_version.py --sdd-root AISDLC_SDD | Out-String).Trim()
          if (-not $latestName) { throw "找不到任何 AISDLC_SDD_v* 版本目錄（sdd_version.py SSOT 解析失敗）" }
          $latest = Get-Item (Join-Path "AISDLC_SDD" $latestName)
          Write-Host "AISDLC_SDD LATEST 版：$($latest.Name)"
          $installScriptRel = "./AISDLC_SDD/$($latest.Name)/tools/install_hooks/install_post_commit.ps1"

          # 2026-07-16 R8 SD 發現的 P1 修復：install_post_commit.ps1 原本用
          # `git rev-parse --show-toplevel`（linked worktree 下回傳呼叫端 worktree 自己的
          # 根目錄）組出 drift/closure hook 來源路徑；修復後改用 --git-common-dir 反推
          # 「主 checkout 根目錄」，故不論從哪個 linked worktree 呼叫，寫入 hook 內容的來源
          # 路徑一律指向主 checkout（本 CI 下即 $env:GITHUB_WORKSPACE，恆為 ASCII 路徑）。
          # 這代表下面「用含中文字元的 linked worktree 名稱觸發非 ASCII 編碼損毀」這個 R1
          # 原本的重現手法，在 P1 修復後不再能讓 hook 內容出現非 ASCII 字元（來源路徑不再
          # 含呼叫端 worktree 的目錄名）。改用一個獨立本地 clone（非 linked worktree）建到
          # 中文路徑下——clone 自己的 --git-common-dir 就是自己，主 checkout 根目錄＝中文
          # 路徑本身——才能繼續驗證原本 Out-File -Encoding ascii → UTF8Encoding 的編碼修復
          # 仍然有效。
          $chineseDir = Join-Path $env:RUNNER_TEMP "測試目錄"
          $headSha = (git rev-parse HEAD).Trim()
          git clone --quiet . $chineseDir
          git -C $chineseDir checkout --quiet $headSha
          try {
            Push-Location $chineseDir
            try {
              if (-not (Test-Path $installScriptRel)) { throw "找不到 $installScriptRel（獨立 clone 內）" }
              & $installScriptRel
              # R2 SD 發現：`Push-Location` 只更新 pwsh 的 $PWD，不會同步
              # [Environment]::CurrentDirectory；原本以相對路徑 ".git/hooks/post-commit"
              # 讀回是靠 [System.IO.File]::ReadAllBytes 這種原生 .NET 呼叫照 CWD（而非
              # $PWD）解析，並未真正驗證「從 chineseDir 目錄出發解析相對路徑」這件事。
              # 改用 `git -C $chineseDir` 明確以該目錄解析出 common dir 再組絕對路徑讀回，
              # 不依賴任何 CWD 同步巧合。
              $commonDir = (git -C $chineseDir rev-parse --path-format=absolute --git-common-dir).Trim()
              $bytes = [System.IO.File]::ReadAllBytes((Join-Path $commonDir "hooks/post-commit"))
              $content = [System.Text.Encoding]::UTF8.GetString($bytes)
              if ($content -match "[?]") { throw "hook 內容含 '?' 替代字元 —— 非 ASCII 路徑遭編碼損毀（Out-File -Encoding ascii 回歸）" }
              if ($content -notmatch "測試目錄") { throw "hook 內容遺失非 ASCII 路徑片段，損毀方式與預期不同" }
              if ($content -notmatch "post_commit_drift\.py") { throw "hook 內容缺 drift hook 路徑" }
              if ($content -notmatch "closure_evidence_verify\.py") { throw "hook 內容缺 closure hook 路徑" }
              Write-Host "install_post_commit.ps1 非 ASCII 路徑編碼驗證通過（無損毀，LATEST=$($latest.Name)）"
            } finally {
              Pop-Location
            }
          } finally {
            Remove-Item -Recurse -Force $chineseDir
          }

      - name: install_post_commit.ps1 於 linked worktree 移除後仍應解析出有效路徑（P1 回歸鎖，2026-07-16 四方複審 SD 發現）
        shell: pwsh
        run: |
          # 2026-07-16 四方複審 SD 發現：install_post_commit.ps1 原本用 --show-toplevel
          # 算來源路徑，該路徑在 linked worktree 下回傳的是呼叫端 worktree 自己的根目錄；
          # worktree 一旦被移除，寫入共享 .git/hooks/post-commit 內嵌的路徑就會失效，而
          # hook 本身用 `|| true` 靜默吞掉這個失敗——drift（Rule 9.17.1）與 closure
          # （DEF-20-001）兩個 advisory 閘門會在主 checkout 上永久靜默失效、零告警。上面
          # 那個 step 的斷言全部是在 worktree 還存在時就讀取，原本的 bug 在 worktree 存在
          # 期間永遠測不到，必須等 worktree 移除後才會現形，這正是先前 CI 沒抓到本次 bug
          # 的原因。本 step 在 worktree 移除「後」才讀取 hook 內容，驗證其中路徑仍存在於磁碟。
          # R10 DEF-101-133：LATEST 解析委派 scripts/sdd_version.py 單一真相源
          # （tracked 過濾＋錨定＋數值排序），不再內嵌 pwsh regex 重寫「等價邏輯」。
          $latestName = (& python AISDLC_SDD/scripts/sdd_version.py --sdd-root AISDLC_SDD | Out-String).Trim()
          if (-not $latestName) { throw "找不到任何 AISDLC_SDD_v* 版本目錄（sdd_version.py SSOT 解析失敗）" }
          $latest = Get-Item (Join-Path "AISDLC_SDD" $latestName)
          $installScriptRel = "./AISDLC_SDD/$($latest.Name)/tools/install_hooks/install_post_commit.ps1"

          $wt = Join-Path $env:RUNNER_TEMP "wt-install-post-commit-removal"
          git worktree add --detach $wt HEAD
          Push-Location $wt
          try {
            & $installScriptRel
          } finally {
            Pop-Location
          }
          git worktree remove --force $wt

          $commonDir = (git rev-parse --path-format=absolute --git-common-dir).Trim()
          $hookTarget = Join-Path $commonDir "hooks/post-commit"
          $content = Get-Content -Raw $hookTarget
          if ($content -notmatch "post_commit_drift\.py") { throw "worktree 移除後 hook 內容缺 drift hook 路徑引用" }
          if ($content -notmatch "closure_evidence_verify\.py") { throw "worktree 移除後 hook 內容缺 closure hook 路徑引用" }
          # R11：hook 內容改為 `"$PY" "<路徑>"`（python fallback，DEF-101 家族），擷取
          # 改抓「引號包住的 .py 路徑」本身、不再錨定 `python ` 前綴（新舊格式皆匹配）。
          if ($content -match '"([^"]*post_commit_drift\.py)"') {
            $driftPath = $Matches[1]
          } else {
            throw "無法從 hook 內容擷取 drift hook 路徑"
          }
          if ($content -match '"([^"]*closure_evidence_verify\.py)"') {
            $closurePath = $Matches[1]
          } else {
            throw "無法從 hook 內容擷取 closure hook 路徑"
          }
          if (-not (Test-Path $driftPath)) { throw "worktree 移除後，hook 內嵌的 drift hook 路徑已不存在於磁碟：$driftPath（P1 回歸重現）" }
          if (-not (Test-Path $closurePath)) { throw "worktree 移除後，hook 內嵌的 closure hook 路徑已不存在於磁碟：$closurePath（P1 回歸重現）" }
          Write-Host "install_post_commit.ps1 worktree 移除後路徑仍有效驗證通過（LATEST=$($latest.Name)，drift=$driftPath，closure=$closurePath）"

      - name: tools/check_script_parity.py（雙平台腳本對等 + pytest 釘選一致；R4 複審發現：先前僅 macOS 側涵蓋）
        shell: pwsh
        run: python tools/check_script_parity.py

      - name: tools/check_ntfs_paths.py（NTFS 敵意檔名，全量 tracked 路徑；R4 複審發現：本工具本質為 Windows/NTFS 相容性檢查，先前卻只在 macOS/Linux 上被驗證過，從未在真正的目標平台 Windows 上跑過）
        shell: pwsh
        run: python tools/check_ntfs_paths.py

  windows-nightly-full:
    name: Windows nightly full suite（深度回歸，非阻斷）
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 60
    continue-on-error: true
    concurrency:
      group: windows-compat-ci-nightly-full
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Windows PowerShell 5.1（非 pwsh）驗證 bootstrap.ps1 + dev_start.ps1（R5/S8 發現：本 workflow 以 shell:pwsh 為主要引擎，與文件教使用者實際會用的引擎不同，此路徑此前從未被機械驗證過）
        # 文件（CLAUDE.md／docs/AISDLC_Agent_UserGuide.md）教使用者用
        # `powershell -ExecutionPolicy Bypass -File tools/bootstrap.ps1`（Windows 內建
        # PowerShell 5.1 引擎），而本 workflow 以 `shell: pwsh`（PowerShell 7 / Core）
        # 為主要引擎——CI 驗證的引擎與文件教學的引擎不同。實際 shell 分佈與三類刻意
        # 例外見檔頭「R57 訂正」段的逐 job 稽核表（本步驟自己就是該表 ③ 所列的例外
        # 之一，故此處不得再做任何絕對式概括）。R60 DEF-101-540 訂正：本註解原本以
        # 絕對式概括描述全檔 shell 分佈，與同 job 內緊接的下一步（同樣
        # `shell: powershell`）直接矛盾，且該概括在 R57 已兩度被 pyyaml 稽核證偽；
        # 被訂正的原措辭逐字留在檔頭 CLAIM-QUOTE 豁免區，不在此複述。掃描
        # bootstrap.ps1/dev_start.ps1 等關鍵腳本未見 PS7-only 語法，兩引擎預設輸出
        # 編碼（UTF-8 vs UTF-16LE）等差異仍從未機械驗證過「文件教的那條路」是否
        # 真的走得通。放在 windows-nightly-full（而非 windows-smoke）：這是文件路徑
        # 對等性的深度回歸，不需卡 PR 閘門節奏；用完即刪 .venv，不影響本 job 後續
        # 使用全域 python/pip 的步驟。
        #
        # 2026-07-16 四方複審 QA 發現：job 層級 continue-on-error 只影響「整個
        # workflow run 對外呈現的結論」，不會讓同一 job 內、失敗 step 之後的其餘
        # step 繼續執行（GitHub Actions 每個 step 預設隱含 if: success()）。若本
        # step 失敗，後面三步當晚完全不會執行，但 continue-on-error 讓 job 結論
        # 只顯示「失敗」而非「跳過大半」，nightly-alert 開的 issue 也看不出「深度
        # 回歸其實只跑了一步就死」。改用 if: ${{ !cancelled() }}（而非
        # always()——always() 連使用者手動取消都會硬跑，!cancelled() 才是「前面
        # 失敗仍照跑，但使用者主動取消時不硬跑」的正確語意）。
        #
        # 🔴 R76-02：`run:` 本體改為**全 ASCII**（訊息因此是英文），中文 WHY 一律留在
        # 本註解區——註解不會被執行，不受編碼影響。作法與判準逐字沿用同檔 windows-smoke
        # 的 PS 5.1 核心驗證 step 上方那段「`run:` 本體刻意全 ASCII」註解，**不另發明
        # 新方案**；那段當時明文把本步驟與下一步列為「已列入回報給主控的殘留風險，本輪
        # 不動它們」，R76 雲端實查證實該風險**早已發生且從未被任何人看見**：
        # run 30803941764 的本步驟輸出裡是 `Unexpected token` ＋
        # `CategoryInfo : ParserError`，前置行的中文被以 cp1252 解成拉丁字母亂碼
        # ⇒ runner 把 `shell: powershell` 的 run 本體寫成**無 BOM** 暫存 .ps1，
        # powershell.exe（5.1）以 ANSI codepage 誤讀，中文字串字面值當場 ParserError，
        # **整支腳本一行都沒執行**。本步驟自 R48 起「跑了四輪」全是這個形態；
        # 下一步（install_post_commit.ps1）則是靠亂碼後的引號恰好成對而偶然通過，
        # 那種「偶然」不是覆蓋。
        # 🔴 R13 CI-6（原本寫在 run 本體內、隨本輪一併搬上來）：補 --no-sync，同
        # windows-smoke dot-source step 的說明——對齊 macos 側既有寫法；$RestArgs
        # 透傳，PS5.1 與 pwsh 參數機制相同。
        # 機械物：tools/tests/test_gha_action_versions.py::TestPowershellRunBodyIsAscii
        if: ${{ !cancelled() }}
        shell: powershell
        run: |
          ./tools/bootstrap.ps1
          if (-not (Test-Path .venv\Scripts\python.exe)) { throw "bootstrap.ps1 (Windows PowerShell 5.1) did not create .venv\Scripts\python.exe" }
          Write-Host "bootstrap.ps1 (Windows PowerShell 5.1) succeeded, .venv created"
          . ./tools/dev_start.ps1 --no-sync
          if ($LASTEXITCODE -ne 0) { throw "dev_start.ps1 (Windows PowerShell 5.1) core logic (tools/dev_start.py) reported failure, exit=$LASTEXITCODE" }
          Write-Host "dev_start.ps1 (Windows PowerShell 5.1) succeeded"
          Remove-Item -Recurse -Force .venv

      - name: Windows PowerShell 5.1（非 pwsh）驗證 install_post_commit.ps1（R48 Architect 複審發現：DEF-101-389 反斜線修復從未被原生 PS5.1 實際驗證過）
        # R48 四方複審 Architect REJECT 理由（**R60 DEF-101-540 訂正措辭**：原文把理由
        # 建立在一句絕對式概括上（措辭與檔頭 CLAIM-QUOTE 豁免區所引者同款，此處不複述），
        # 而 `git log -S "shell: powershell"` 實查證明該 workflow 早在 commit 1175555／
        # 2026-07-15 就已有一步原生 `shell: powershell`，比 R48（0e346da／2026-07-26）
        # 早十一天——故那句概括在寫下的當時就已失實，不是「曾為真、後過期」的合法歷史
        # 記載；真正成立的只有下面那句窄斷言。理由的結論與本步驟的必要性不受影響）：
        # DEF-101-389
        # （install_post_commit.ps1 的
        # `$GuardSrcBash -replace "\\", "/"`）修復本身正確，且已有 pytest 單元測試
        # 鎖住此不變量，但在本步驟補上之前，本 workflow 沒有任何一步用原生
        # Windows PowerShell 5.1（shell: powershell）
        # 實際執行過 install_post_commit.ps1 一次——本專案文件教使用者實際會用的
        # 正是 Windows 內建 powershell.exe（PS5.1），而 pwsh 的 Join-Path 會自動
        # 正規化反斜線、PS5.1 不會，這正是本次 bug 的根因，故「用 pwsh 驗證過」不
        # 等於「用文件教的那個引擎驗證過」。比照上一 step（bootstrap.ps1/dev_start.ps1）
        # 同款先例延伸：本機 python 由前面 actions/setup-python 安裝於系統 PATH（非
        # 上一 step 建立、已於上一行移除的 .venv），install_post_commit.ps1 自己
        # dot-source tools/lib/WindowsAppsGuard.ps1 判斷 python 是否可用，兩者皆不
        # 依賴已移除的 .venv。
        #
        # 斷言兩件事（呼應 Architect 複審意見）：(1) 安裝器本身以原生 PS5.1 執行
        # 成功（$LASTEXITCODE -eq 0）；(2) 產出的 hook 內嵌的 windowsapps_guard.sh
        # 來源路徑字串不含反斜線——這正是 DEF-101-389 要守住的核心不變量：原生
        # PS5.1 的 Join-Path 不會自動正規化反斜線，若這裡殘留反斜線代表回歸。
        #
        # ⚠️ 誠實限制：本 step 依賴原生 Windows PowerShell 5.1，在本機 macOS（無
        # powershell.exe）上無法實際執行驗證，只能在真 Windows GitHub Runner 上跑
        # ——這是上一個既有 step（bootstrap.ps1/dev_start.ps1）從一開始就有的相同
        # 限制，非本次新增的額外問題。
        #
        # 🔴 R76-02：`run:` 本體改為**全 ASCII**，理由與上一步逐字同源（見該 step 的
        # R76-02 註解）。本步驟的實況比上一步更陰險：R76 位元組掃描顯示它的中文密度
        # 更高，而雲端 log 沒有留下它自己的 ParserError——因為上一步先炸，同 job 的
        # 後續 step 在 `if: ${{ !cancelled() }}` 下雖會續跑，但整段驗證從未被人讀過。
        # 「跑過」與「跑對」的差別在這裡是整整四輪。
        # 🔴 R11 DEF-101-133（原本寫在 run 本體內、隨本輪一併搬上來）：LATEST 解析
        # 委派 scripts/sdd_version.py 單一真相源，不寫死版本號（同上方 R2 Architect
        # 複審修正、下方 fsm_runtime pytest step 同款慣例）。
        # 機械物：tools/tests/test_gha_action_versions.py::TestPowershellRunBodyIsAscii
        if: ${{ !cancelled() }}
        shell: powershell
        run: |
          $latestName = (& python AISDLC_SDD/scripts/sdd_version.py --sdd-root AISDLC_SDD | Out-String).Trim()
          if (-not $latestName) { throw "No AISDLC_SDD_v* version directory found (sdd_version.py SSOT resolution failed)" }
          $installer = "./AISDLC_SDD/$latestName/tools/install_hooks/install_post_commit.ps1"
          if (-not (Test-Path $installer)) { throw "Installer not found: $installer" }

          & $installer
          if ($LASTEXITCODE -ne 0) { throw "install_post_commit.ps1 (Windows PowerShell 5.1) failed, exit=$LASTEXITCODE" }
          Write-Host "install_post_commit.ps1 (Windows PowerShell 5.1) succeeded (LATEST=$latestName)"

          $commonDir = (git rev-parse --path-format=absolute --git-common-dir).Trim()
          $hookTarget = Join-Path $commonDir "hooks/post-commit"
          if (-not (Test-Path $hookTarget)) { throw "install_post_commit.ps1 succeeded but produced no hook file: $hookTarget" }
          $content = Get-Content -Raw $hookTarget
          if ($content -match '"([^"]*windowsapps_guard\.sh)"') {
            $guardPath = $Matches[1]
          } else {
            throw "Hook body has no guard source path string (windowsapps_guard.sh) -- the DEF-101-383/389 fix looks lost"
          }
          if ($guardPath -match '\\') {
            throw "Guard source path embeds a backslash; under native Windows PowerShell 5.1 bash [ -f ] / source may not resolve it (DEF-101-389 regression): $guardPath"
          }
          Write-Host "install_post_commit.ps1 (Windows PowerShell 5.1) hook-embedded guard path is backslash-free: $guardPath"

      - name: 安裝 AutoClaude 開發 + lint 依賴（供 local_ci_gate.ps1 使用）
        # 2026-07-16 四方複審 QA 發現：見上一 step 註解——job 層級 continue-on-error
        # 不會讓失敗 step 之後的其餘 step 繼續跑（隱式 if: success()），加
        # !cancelled() 使後續深度回歸 step 不因前一步失敗而靜默 skip。
        # R18 SA 複審發現：本步驟與上方「Install AutoClaude deps」同款 R15
        # SCAN-C-10 缺陷（pwsh 只回傳最後一條 native 指令 exit code，pip 升級
        # 失敗會被之後成功的 pip install 吞沒）當時漏改，本輪補齊。
        if: ${{ !cancelled() }}
        working-directory: AutoClaude
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { throw "python -m pip 升級失敗（rc=$LASTEXITCODE）" }
          pip install -e ".[dev,lint]"

      - name: 執行 AutoClaude/tools/local_ci_gate.ps1（實際執行，非僅語法解析；P1 Architect 發現修正）
        # Architect 發現：本 workflow 先前只對 local_ci_gate.ps1 做 AST 語法解析
        # （root-infra-ci.yml），從未實際執行過。本腳本鏡像 autoclaude-ci.yml 的
        # push gating jobs（editable 哨兵 + LOC 預算 + CLAUDE.md 行數/長行 + snapshot
        # 可重現 + import-linter + pytest 全套），涵蓋範圍比原本單純呼叫 pytest 更完整，
        # 故取代（而非疊加）原本的裸 pytest 呼叫，避免同一 job 內重複跑一次全套測試。
        # 放進 nightly-full（非 windows-smoke）：pytest 全套 3,500+ case 在 Windows
        # runner 上執行時間較長，符合本 job continue-on-error 深度回歸網的定位。
        #
        # 2026-07-16 四方複審 QA 發現：加 !cancelled()，同上。
        if: ${{ !cancelled() }}
        working-directory: AutoClaude
        shell: pwsh
        run: ./tools/local_ci_gate.ps1

      - name: AISDLC_SDD LATEST fsm_runtime pytest（排除 chaos；動態解析 LATEST 版本，R2 Architect 發現修正）
        # Architect 發現：原寫死 v0.30，與 root-infra-ci.yml 動態解析 LATEST 版本
        # （sort -V 取最高版語意）的慣例脫節，版本演化到 v0.31 時本 step 不會有機械
        # 訊號提醒更新。改為同一套動態解析邏輯，永遠鎖定當下真正的 LATEST 版本。
        #
        # 2026-07-16 四方複審 QA 發現：加 !cancelled()，同上——本 step 與前一步彼此
        # 獨立（各自從頭 checkout 狀態算起），不應因前一步失敗而被跳過。
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          # R10 DEF-101-133：LATEST 解析委派 scripts/sdd_version.py 單一真相源
          # （tracked 過濾＋錨定＋數值排序），不再內嵌 pwsh regex 重寫「等價邏輯」。
          $latestName = (& python AISDLC_SDD/scripts/sdd_version.py --sdd-root AISDLC_SDD | Out-String).Trim()
          if (-not $latestName) { throw "找不到任何 AISDLC_SDD_v* 版本目錄（sdd_version.py SSOT 解析失敗）" }
          $latest = Get-Item (Join-Path "AISDLC_SDD" $latestName)
          Write-Host "AISDLC_SDD LATEST 版：$($latest.Name)"
          Push-Location $latest.FullName
          try {
            # R15 SCAN-C-10：pwsh 只回傳最後一條 native 指令 exit code——兩條 pip
            # 失敗會被結尾 pytest 成功吞沒（依賴裝失敗卻假綠）。逐條斷言（鏡射
            # 本檔既有 $LASTEXITCODE throw 慣例）；pytest 為最後一條，exit code
            # 由 GitHub pwsh 包裝自然傳遞（Pop-Location 為 cmdlet 不重置）。
            python -m pip install --upgrade pip
            if ($LASTEXITCODE -ne 0) { throw "python -m pip 升級失敗（rc=$LASTEXITCODE）" }
            pip install -r requirements-ci.txt
            if ($LASTEXITCODE -ne 0) { throw "requirements-ci.txt 安裝失敗（rc=$LASTEXITCODE）" }
            python -m pytest tools/fsm_runtime/tests/ -m "not chaos" -q -rs --tb=short  # -rs：R59 ARCH-R59-NB1
          } finally {
            Pop-Location
          }

  # QA 四方複審發現（P1）：windows-nightly-full 為 continue-on-error: true，失敗會
  # 永久靜默、無任何人工提醒機制（本 repo 已有 aisdlc-sdd-fsm-chaos-nightly.yml 的
  # streak-lock 前例，但這兩個新 job 完全沒有套用）。本 job 補上最小可行的提醒管道：
  # 用 GitHub Issue 追蹤失敗、恢復綠燈後自動關單，避免重覆開單洗版。
  # 刻意不比照 chaos-nightly 收緊 branch protection：(1) 本 repo 為單一開發者直推
  # main、不開 PR/分支（既有工作流慣例），required_pull_request_reviews 這類設定
  # 對此工作流無意義；(2) 已實測 `gh api repos/:owner/:repo/branches/main/protection`
  # 回應 403（此 repo 方案層級不支援 branch protection API），嘗試收緊只會是必然
  # 失敗的空動作。
  windows-nightly-alert:
    name: Windows nightly 失敗提醒（best-effort，不影響 nightly-full 本身的 continue-on-error）
    runs-on: ubuntu-latest
    timeout-minutes: 10   # R14 QA-R14-RR-1：輕量 alert job（發 gh issue），補 timeout 防卡死燒滿 360 分鐘
    needs: windows-nightly-full
    if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    concurrency:
      # SCAN-C-11／比照 macos-compat-ci.yml R13 CI-5：alert 若與 nightly-full 共用
      # 同一把 group，GitHub job 層 concurrency 在 cancel-in-progress:false 下同
      # group 仍只允許**一個 pending**：run A 的 nightly-full 佔住 group 時，若
      # run B 的 nightly-full 先排入 pending，稍後才 eligible 的 run A alert
      # （needs 下游）會把 pending 位驅逐/被驅逐，被驅逐方 conclusion=cancelled
      # （≠failure），告警路徑靜默蒸發、開單/關單分支永不執行。alert 本身輕量
      # 無重疊風險，獨立 group 即可根絕互踩。
      group: windows-compat-ci-nightly-alert
      cancel-in-progress: false
    permissions:
      actions: read
      issues: write
    steps:
      - name: 讀取本次 windows-nightly-full 實際結論
        # continue-on-error: true 會讓 needs.windows-nightly-full.result 恆為
        # success，無法用來判斷真實失敗，故直接查該 job 在本次 run 的實際 conclusion。
        #
        # R3 QA 四方複審發現（P1）：本 job 的「紅色路徑」（開單/留言分支）在此之前
        # 從未於真實環境執行過一次（nightly-full 至今從未真的失敗過）。補
        # simulate_nightly_failure 手動輸入，可在不需要真的搞壞 nightly-full 的前提下，
        # 一次性驗證開單/留言/自動關單三條分支邏輯是否正確。
        #
        # 🔴 R68 SCAN-C（P2，兩平台同款）：本判讀原為**黑名單 fail-open**——
        # 「只有 conclusion 等於字面 failure 才算紅」，其餘一律當綠（該判讀式的
        # 逐字形態刻意不寫在這裡：本檔受 test_workflow_permission_concurrency_lock
        # 的黑名單極性鎖全文掃描，散文引述舊式會被判為極性回歸）。沙箱以本
        # step 逐字複製的 jq 與判讀式餵合成 payload 實跑，六種情境中五種 fail-open：
        # cancelled／timed_out／skipped／conclusion 為 null（→ "unknown"）／job 顯示名
        # 被加前綴（startswith 落空 → "unknown"）全部得 failed=false，於是走下方
        # 「綠燈時自動關閉既有失敗 issue」分支、對一張仍然有效的 P1 單留言
        # 「已恢復綠燈」並關掉它——**告警器主動抹除紅燈證據**，比單純漏報更糟。
        # 觸發面不是理論的：本 repo 有「節省 CI 額度」紀律，人工取消一支 60 分鐘的
        # 深度回歸即得 cancelled；job 顯示名加輪次前綴也是本 repo 慣例。
        # 改為**白名單 fail-closed**：只有字面 "success" 才算綠，其餘（含 gh api
        # 自身失敗的 "api-error"）一律走開單／留言路徑，並把實際結論字串一併輸出，
        # 讓 issue body 能區分「真的跑完但失敗」與「根本沒跑起來」（2026-07-15～
        # 07-27 五次排程全紅的實況正是後者：三個 job 的 steps 長度皆為 0、
        # annotation 逐字為 'The job was not started because recent account payments
        # have failed…'，DEF-101-081 帳務停擺）。
        # `startswith("Windows nightly full")` ↔ nightly-full 的 `name:` 前綴由
        # tools/tests/test_workflow_permission_concurrency_lock.py 機械互鎖，改名即紅。
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SIMULATE: ${{ github.event.inputs.simulate_nightly_failure }}
        run: |
          set -euo pipefail
          if [ "${SIMULATE:-false}" = "true" ]; then
            echo "⚠️ simulate_nightly_failure=true，強制視為失敗（供驗證 alert 紅色路徑用，不代表 nightly-full 真的失敗）"
            echo "conclusion=simulated-failure" >> "$GITHUB_OUTPUT"
            echo "failed=true" >> "$GITHUB_OUTPUT"
          else
            # gh api 自身失敗（rate limit／權限／API 5xx）時不得讓整個 step 死掉：
            # step 死掉會使 outputs.failed 為空字串，下方兩個分支的 == 'true' /
            # == 'false' 皆不成立 ⇒ 告警靜默蒸發。改為降級成 "api-error" 並由
            # 白名單判讀當作「非綠」處理（fail-closed）。
            conclusion=$(gh api "/repos/${REPO}/actions/runs/${{ github.run_id }}/jobs" \
              --jq '[.jobs[] | select(.name | startswith("Windows nightly full"))][0].conclusion // "unknown"' \
              || echo "api-error")
            [ -n "$conclusion" ] || conclusion="unknown"
            echo "windows-nightly-full 本次結論：${conclusion}"
            echo "conclusion=${conclusion}" >> "$GITHUB_OUTPUT"
            if [ "$conclusion" = "success" ]; then
              echo "failed=false" >> "$GITHUB_OUTPUT"
            else
              echo "failed=true" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: 失敗時開單或於既有單留言（title 比對避免每日重覆開單）
        if: steps.check.outputs.failed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CONCLUSION: ${{ steps.check.outputs.conclusion }}
        run: |
          set -euo pipefail
          TITLE="[P1] windows-nightly-full 深度回歸失敗"
          existing=$(gh issue list --repo "${REPO}" --state open --search "\"${TITLE}\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "${REPO}" --body "再次失敗（實際結論：\`${CONCLUSION}\`）：${RUN_URL}"
          else
            gh issue create --repo "${REPO}" --title "${TITLE}" --label "p1,windows,nightly" --body "windows-nightly-full（continue-on-error 非阻斷 job，不會擋 push/PR）非綠燈，需人工排查，請勿長期忽略。本次實際結論：\`${CONCLUSION}\`（\`success\` 以外一律開單；\`unknown\`／\`api-error\` 代表**根本沒跑起來或查不到**，例如帳務停擺讓 job 完全未配置 runner，見 DEF-101-081）。首次偵測到的執行：${RUN_URL}。恢復 \`success\` 後本 job 會自動關閉本 issue。"
          fi

      - name: 綠燈時若有既有失敗 issue 則自動關閉（白名單：僅 conclusion == success）
        # 🔴 R68：本分支的守衛 `failed == 'false'` 現在等價於「上游判定 conclusion
        # 恰為 success」（白名單），修復前它等價於「conclusion 不是字面 failure」
        # （黑名單）——後者會在 cancelled／timed_out／job 改名／API 失敗時關掉一張
        # 仍然有效的 P1 單並留言「已恢復綠燈」。留言一併帶上實際結論字串以便稽核。
        if: steps.check.outputs.failed == 'false'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CONCLUSION: ${{ steps.check.outputs.conclusion }}
        run: |
          set -euo pipefail
          TITLE="[P1] windows-nightly-full 深度回歸失敗"
          existing=$(gh issue list --repo "${REPO}" --state open --search "\"${TITLE}\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue close "$existing" --repo "${REPO}" --comment "windows-nightly-full 已恢復綠燈（實際結論：\`${CONCLUSION}\`）：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
