# Windows 11 相容性驗證（Mac/Windows 架構優化，Architect/SA/SD/QA 四方複審前置）。
#
# 背景：三份獨立掃描報告一致確認 monorepo 既有 workflow（9 檔、19 處 runs-on）
# 100% 為 ubuntu-latest；root-infra-ci.yml 對 .ps1 僅做 pwsh AST 語法解析（不執行
# 腳本邏輯），容易被誤讀為「已驗證 Windows」。「Windows 11 相容性」長期只靠人工
# 對照與文件宣稱，從未被機器驗證過——這正是 pty_wrapper.py claude.cmd 啟動失敗
# （P0）、install_post_commit.ps1 用 -Encoding ascii 損毀非 ASCII 路徑（P1）等 bug
# 能長期潛伏的根本原因。本 workflow 補上這道機械驗證，並直接迴歸鎖定上述兩項修復。
#
# 設計（比照本 repo 既有「快速 PR 閘門 + 深度 nightly」兩層慣例，如
# autoclaude-mutation-on-change.yml / autoclaude-ci.yml 的 mutation-test-nightly）：
#   - windows-smoke：PR/push 閘門，只在觸及平台敏感路徑時觸發，實際「執行」關鍵
#     腳本（非僅語法解析），快速攔下 runtime 級回歸。
#   - windows-nightly-full：schedule + workflow_dispatch，continue-on-error 非阻斷，
#     跑兩子專案完整測試套件在 windows-latest 上的深度回歸網，避免 Windows runner
#     偶發性拖垮每次 PR。
#
# R1 四方複審修正（2026-07-13，Architect/SA/SD/QA 首輪 REJECT 後）：
#   - SA 發現「Windows 開發者從零開始」路徑最前段（tools/bootstrap.ps1、
#     tools/dev_start.ps1）從未被實際執行過，只靠 root-infra-ci.yml 的 AST 語法
#     解析頂替 → windows-smoke 新增實際執行這兩支腳本的步驟。
#   - SA 發現 AISDLC_SDD/scripts/install-hooks.ps1（ONBOARDING §6 同列為官方
#     入口）與 AutoClaude/tools/install_git_hooks.ps1 同一 bug 只修了一半、且
#     從未被本 workflow 觸及 → 補上對應驗證步驟 + paths 過濾。
#   - SD 發現原本的「hook 內容編碼損毀」斷言在 windows-latest 的純 ASCII checkout
#     路徑下永遠測不到損毀（原始 P1 bug 只在非 ASCII 路徑才觸發）→ 改用
#     `git worktree add` 建一個路徑含中文字元的副本重現原始觸發條件。
#
# R2 Architect/SD 複審修正（2026-07-13，修復包 D）：
#   - Architect 發現 tools/integration_gate.ps1 與 AutoClaude/tools/local_ci_gate.ps1
#     兩支腳本仍只靠 root-infra-ci.yml 的 AST 語法解析頂替，從未被本 workflow 實際
#     執行 → windows-smoke 新增 `integration_gate.ps1 -SkipFull`（快速迴圈）、
#     windows-nightly-full 新增 `local_ci_gate.ps1`（涵蓋 pytest 全套較耗時，故放
#     深度回歸網而非 PR 閘門）。
#   - SD 實測 pwsh 7.6.3（與 windows-latest runner 同引擎）證實 `Push-Location`
#     不會同步 `[Environment]::CurrentDirectory`，install_post_commit.ps1 worktree
#     驗證原本用 `[System.IO.File]::ReadAllBytes(".git/hooks/post-commit")` 這種
#     相對路徑讀回，實際是巧合式通過（該原生 .NET 呼叫照 CWD 而非 $PWD 解析）→
#     改用 `git -C $chineseDir rev-parse --git-common-dir` 明確解析後讀回。
#   - Architect 發現 AISDLC_SDD 版本路徑硬編碼 v0.30，與 root-infra-ci.yml 的動態
#     LATEST 解析慣例（sort -V 取最高版語意）脫節 → paths 過濾器改用
#     `AISDLC_SDD_v*` glob 涵蓋所有版本目錄，install_post_commit.ps1 驗證與
#     windows-nightly-full 的 fsm_runtime pytest 兩處皆改為動態解析 LATEST 版本目錄。
#
# R3 四方複審修正（2026-07-14，不採信既有 APPROVE 自稱、全新 session 重新獨立複核）：
#   - Architect 發現 paths 白名單漏根層消費檔（`.claude/hooks/sdd_hook_router.py`／
#     `.claude/settings.json`／`AutoClaude/.claude/settings.json`）—— DEF-101-061
#     聲稱的 fnmatch 驗證實際驗證的是版本化子目錄下的同名檔，非此處根層檔案 →
#     補 `.claude/**`／`AutoClaude/.claude/**` 兩條寬 pattern；另補
#     `AISDLC_SDD/scripts/**`（涵蓋 ci-gate.sh 本體／router_hook_coverage_lint.py／
#     scripts/tests/*.py，先前只列出 install-hooks.ps1 一支）。
#   - QA 發現 `tools/tests/**`（SIGPIPE 回歸鎖＋dev_start.py 平台邏輯 mock）先前既未
#     被本 workflow 的 paths 涵蓋，也從未被任何 step 實際執行過，只在
#     root-infra-ci.yml 的 ubuntu-latest 上以 mock 驗證——但這正是本 workflow 存在
#     的理由（於真實 Windows 驗證平台假設）→ 補 paths + windows-smoke 新增實際執行
#     該測試目錄的 step。
#   - QA 發現 windows-nightly-alert 的「紅色路徑」（開單/留言）從未在真實環境驗證
#     過（nightly-full 至今從未真的失敗過）→ 補 `simulate_nightly_failure`
#     workflow_dispatch 輸入，可一次性驗證三條分支邏輯而不需等待真實失敗。
#
# R4 複審修正（2026-07-14，S5 發現）：
#   - DEF-101-067⑤ 記載 tools/check_ntfs_paths.py 未被本 workflow 涵蓋的缺口重新
#     核對仍存在（先前輪次未真正修復）；且新發現 tools/check_script_parity.py
#     同樣缺席——對照組 macos-compat-ci.yml 的 paths 與執行步驟皆已涵蓋兩者，
#     形成「同一輪、同一設計模式，卻只有一邊做對」的不對稱。check_ntfs_paths.py
#     本質是 NTFS（Windows 檔案系統）相容性檢查，先前卻只在 macOS/Linux 上被驗證
#     過，從未在它真正要保護的目標平台上跑過，邏輯上本末倒置。補 paths 白名單
#     兩條 + windows-smoke 新增兩個實際執行步驟（比照 macos-compat-ci.yml 寫法）。
#
# R5 複審修正（2026-07-14，S8 發現）：
#   - 本 workflow 全部步驟一律 `shell: pwsh`（PowerShell 7 / Core），但官方文件
#     （CLAUDE.md 安裝段落／docs/AISDLC_Agent_UserGuide.md）教使用者用的是
#     `powershell -ExecutionPolicy Bypass -File ...`（Windows 內建 PowerShell 5.1）
#     ——CI 驗證的執行引擎與文件教使用者實際會用的執行引擎不同，此前從未被機械
#     驗證過。掃描 bootstrap.ps1／dev_start.ps1／install_git_hooks.ps1／
#     install-hooks.ps1／integration_gate.ps1／local_ci_gate.ps1／ci-gate.ps1 均未見
#     PS7-only 語法（??／?.／&&|| 鏈接／-AsHashtable／ForEach-Object -Parallel），
#     故非緊急阻斷項，但補在 windows-nightly-full（非 PR 閘門）新增一步驟，以
#     `shell: powershell` 實際執行文件教學的第一入口 tools/bootstrap.ps1 +
#     tools/dev_start.ps1，驗證「文件教的那條路」而非只驗證「CI 選的那條路」。
#
# R6 四方複審修正（2026-07-15，Architect 親自實測 fnmatch 逐一比對抓到）：
#   - 本輪新增的 4 支根層生產模組（tools/check_hooks_liveness.py／
#     check_defect_log_crossref.py／check_wrapper_thinness.py／_stdio_utf8.py）
#     皆漏列 paths，只改其中一支時本 workflow 完全不會觸發，回歸鎖須等每日
#     schedule 才跑到（DEF-101-042／DEF-101-068(a) 同構缺口，本 session 自己新增
#     的檔案自己踩進去）→ 補齊四條 paths。
#   - 同輪發現機械鎖 AISDLC_SDD/scripts/tests/test_ci_paths_cover_root_consumers.py
#     對此毫無反應的根因：其正則只認 `os.path.join(REPO_ROOT, ...)` / `REPO_ROOT /
#     "a" / "b"` 字串引用慣用法，未涵蓋 `import check_hooks_liveness as m` 這種
#     tools/tests/ 測試檔直接 import 根層同儕模組的慣用法（三支新測試檔皆用此
#     寫法）→ 已於該測試檔補一道 import-based BFS 掃描（含遞移一層，涵蓋
#     check_hooks_liveness.py 內部再 import _stdio_utf8.py 的情形），關閉此偵測盲區。

name: windows-compat-ci

on:
  push:
    branches: [main]
    paths:
      - "AutoClaude/autoclaude/perception/**"
      - "AutoClaude/autoclaude/utils/**"
      - "AutoClaude/pyproject.toml"
      - "AutoClaude/tests/**"
      - "AutoClaude/tools/install_git_hooks.ps1"
      - "AutoClaude/.claude/**"
      - "AISDLC_SDD/scripts/**"
      - "tools/bootstrap.ps1"
      - "tools/dev_start.ps1"
      - "tools/dev_start.py"
      - "tools/tests/**"
      - "tools/check_script_parity.py"
      - "tools/check_ntfs_paths.py"
      - "tools/check_hooks_liveness.py"
      - "tools/check_defect_log_crossref.py"
      - "tools/check_wrapper_thinness.py"
      - "tools/_stdio_utf8.py"
      - "**/*.ps1"
      - "tools/git-hooks/**"
      - ".claude/**"
      - "AISDLC_SDD/AISDLC_SDD_v*/tools/**"
      - "AISDLC_SDD/AISDLC_SDD_v*/.claude/**"
      - ".github/workflows/windows-compat-ci.yml"
  pull_request:
    paths:
      - "AutoClaude/autoclaude/perception/**"
      - "AutoClaude/autoclaude/utils/**"
      - "AutoClaude/pyproject.toml"
      - "AutoClaude/tests/**"
      - "AutoClaude/tools/install_git_hooks.ps1"
      - "AutoClaude/.claude/**"
      - "AISDLC_SDD/scripts/**"
      - "tools/bootstrap.ps1"
      - "tools/dev_start.ps1"
      - "tools/dev_start.py"
      - "tools/tests/**"
      - "tools/check_script_parity.py"
      - "tools/check_ntfs_paths.py"
      - "tools/check_hooks_liveness.py"
      - "tools/check_defect_log_crossref.py"
      - "tools/check_wrapper_thinness.py"
      - "tools/_stdio_utf8.py"
      - "**/*.ps1"
      - "tools/git-hooks/**"
      - ".claude/**"
      - "AISDLC_SDD/AISDLC_SDD_v*/tools/**"
      - "AISDLC_SDD/AISDLC_SDD_v*/.claude/**"
      - ".github/workflows/windows-compat-ci.yml"
  schedule:
    - cron: "0 6 * * *"   # windows-nightly-full：每日 06:00 UTC 深度回歸（非阻斷）
  workflow_dispatch:
    inputs:
      simulate_nightly_failure:
        description: "手動驗證 windows-nightly-alert 紅色路徑：覆寫視同 nightly-full 失敗（R3 QA 發現：紅色路徑從未在真實環境驗證過，不影響 nightly-full 本身執行結果）"
        type: boolean
        default: false

concurrency:
  group: windows-compat-ci-${{ github.ref }}
  cancel-in-progress: true

# 純驗證、不寫回 repo → 最小權限唯讀。
permissions:
  contents: read

jobs:
  windows-smoke:
    name: Windows smoke（實際執行關鍵腳本，非僅語法解析）
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: tools/tests/（SIGPIPE 回歸鎖 + dev_start.py 平台邏輯；R3 QA 發現：先前只在 root-infra-ci.yml 的 ubuntu-latest 上以 mock 跑過，從未在真實 Windows 執行過）
        shell: pwsh
        run: python -m unittest discover -s tools/tests -p "test_*.py" -v

      - name: 執行 tools/bootstrap.ps1（R1 SA 發現：Windows 新人上手入口從未被實測）
        shell: pwsh
        run: |
          ./tools/bootstrap.ps1
          if (-not (Test-Path .venv)) { throw "bootstrap.ps1 執行後 .venv 未建立" }
          Write-Host "bootstrap.ps1 執行成功，.venv 已建立"

      - name: dot-source tools/dev_start.ps1（同上，日常開工入口）
        shell: pwsh
        run: |
          . ./tools/dev_start.ps1
          if ($LASTEXITCODE -ne 0) { throw "dev_start.ps1 核心邏輯（tools/dev_start.py）回報失敗，exit=$LASTEXITCODE" }
          Write-Host "dev_start.ps1 執行成功"

      - name: Install AutoClaude deps
        working-directory: AutoClaude
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: pty_wrapper / hotkey_handler 平台解析單元測試
        working-directory: AutoClaude
        run: python -m pytest tests/test_perception.py -q --tb=short

      - name: 執行 tools/integration_gate.ps1 -SkipFull（實際執行，非僅語法解析；P1 Architect 發現修正）
        # Architect 發現：root-infra-ci.yml 對 .ps1 僅做 AST 語法解析，本 workflow
        # 先前把 6 個入口點升級為實際執行，但漏了 tools/integration_gate.ps1（monorepo
        # 整合層薄聚合閘門），仍停留在僅語法解析的曝險狀態。
        # -SkipFull 只跑 [3/5]SDD bridge 整合煙霧 + [4/5]回退驗證 + [5/5]cc-switch A/B
        # 偵測（未裝 CLI 時 SKIP，不計失敗），略過 [1/5]/[2/5] 兩段完整套件重複執行
        # （AutoClaude 全套測試已於本 job 另跑、AISDLC_SDD ci-gate.ps1 於下一步跑），
        # 符合 PR-gate 快速迴圈定位；depends 僅需前一步已安裝的 AutoClaude deps。
        shell: pwsh
        run: ./tools/integration_gate.ps1 -SkipFull

      - name: 安裝 AISDLC_SDD pinned deps
        working-directory: AISDLC_SDD/AISDLC_SDD_v0.01
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: 執行（非僅解析）ci-gate.ps1（凍結基線 + LATEST 雙軌）
        # 誠實揭露殘留覆蓋率限制（四方複審 R1/R2 Architect 發現，先前兩輪未回應）：
        # ci-gate.ps1 採「偵測到 Git Bash 就薄委派給 ci-gate.sh」設計；GitHub 官方
        # windows-latest runner 內建 Git for Windows（含 bash.exe），本步驟幾乎必然
        # 走委派分支（跑到的是 ci-gate.sh 的完整雙軌邏輯），ci-gate.ps1 自身原生
        # PowerShell fallback 分支（僅 v0.01 凍結基線單軌，找不到 Git Bash 時才會走）
        # 覆蓋率趨近於零——本步驟的綠燈不代表該原生分支已被驗證過。若要驗證原生
        # 分支本身，需另外在暫時隱藏/改名 bash.exe 的環境下重跑，目前未做（該分支
        # 邏輯遠簡於委派路徑、且僅在非標準 Windows 安裝下才會被觸發，暫列為已知
        # 限制而非本輪必須解決項）。
        #
        # DEF-101-062：windows-latest runner 的 Docker Linux 容器支援本身環境不穩定
        # （連續三次真實 CI run 1 成功/2 失敗，非確定性 bug）。LATEST(v0.30) 已改
        # requires_docker_success marker 在 Windows 上正確 skip，但 ci-gate.ps1 同時
        # 跑的凍結基線 v0.01 依框架治理規則不可原地修改（見 AISDLC_SDD/CLAUDE.md
        # 「凍結基線不可在原地修改」），其 test_phase_h.py 仍是舊版無條件 requires_docker。
        # 故在此以 CI 組態層級（而非改動凍結原始碼）用標準 PYTEST_ADDOPTS 對兩個
        # 「需要容器成功執行」的測試做 keyword 排除，兩條軌（v0.01 與 v0.30）皆吃得到
        # 這個環境變數；v0.30 的 requires_docker_success 本身已 skip，此排除對它是
        # 冗餘但無害的雙重保險。
        working-directory: AISDLC_SDD
        shell: pwsh
        env:
          PYTEST_ADDOPTS: -k "not test_docker_backend_real_pass and not test_docker_backend_e2e_through_fsm"
        run: ./scripts/ci-gate.ps1

      - name: install_git_hooks.ps1 安裝／解除往返驗證
        shell: pwsh
        run: |
          ./AutoClaude/tools/install_git_hooks.ps1
          $hooksPath = git config --get core.hooksPath
          if (-not $hooksPath) { throw "core.hooksPath 未設定" }
          Write-Host "core.hooksPath = $hooksPath"
          ./AutoClaude/tools/install_git_hooks.ps1 -Uninstall
          $hooksPathAfter = git config --get core.hooksPath
          if ($hooksPathAfter) { throw "core.hooksPath 卸載後仍殘留：$hooksPathAfter" }
          Write-Host "install_git_hooks.ps1 安裝／解除往返驗證通過"
          # git config --get 對已移除的 key 回報 rc=1（這正是本測試要斷言的期望結果），
          # 若不顯式歸零，pwsh 會把這個「預期中的非零」誤傳為本 step 的失敗結果。
          exit 0

      - name: AISDLC_SDD/scripts/install-hooks.ps1 驗證（R1 SA 發現：第二入口從未被測到）
        shell: pwsh
        run: |
          ./AISDLC_SDD/scripts/install-hooks.ps1
          $hooksPath = git config --get core.hooksPath
          if (-not $hooksPath) { throw "core.hooksPath 未設定" }
          if ($hooksPath -match '/' -and $hooksPath -match '\\') { throw "core.hooksPath 含混合分隔符：$hooksPath" }
          Write-Host "install-hooks.ps1 驗證通過：core.hooksPath = $hooksPath"
          git config --unset core.hooksPath

      - name: install_post_commit.ps1 執行 + 非 ASCII 路徑編碼損毀斷言（P1 回歸鎖，R1 SD 發現修正；R2 SD/Architect 發現再修正）
        shell: pwsh
        run: |
          # R1 SD 發現：原斷言直接在 windows-latest 的純 ASCII checkout 路徑下跑，
          # 原始 P1 bug（-Encoding ascii 損毀非 ASCII 路徑）在此環境永遠測不到、是死斷言。
          # 用 git worktree 建一個路徑含中文字元的副本，重現原始觸發條件
          # （$RepoRoot/$HookSrcDrift/$HookSrcClosure 組出的字串含非 ASCII 字元）。
          #
          # R2 Architect 發現：AISDLC_SDD 版本路徑先前寫死 v0.30，與 root-infra-ci.yml
          # 動態解析 LATEST 版本（sort -V 取最高版語意）的慣例脫節——版本演化到 v0.31
          # 時本 step 不會有機械訊號提醒更新，會繼續測已非 LATEST 的舊版。改為與
          # root-infra-ci.yml 同一套動態解析邏輯，永遠鎖定當下真正的 LATEST 版本。
          $latest = Get-ChildItem -Path AISDLC_SDD -Directory |
            Where-Object { $_.Name -match "^AISDLC_SDD_v[0-9]+\.[0-9]+$" } |
            Sort-Object { [version]($_.Name -replace "^AISDLC_SDD_v", "") } |
            Select-Object -Last 1
          if (-not $latest) { throw "找不到任何 AISDLC_SDD_v* 版本目錄" }
          Write-Host "AISDLC_SDD LATEST 版：$($latest.Name)"
          $installScriptRel = "./AISDLC_SDD/$($latest.Name)/tools/install_hooks/install_post_commit.ps1"

          $chineseDir = Join-Path $env:RUNNER_TEMP "測試目錄"
          git worktree add --detach $chineseDir HEAD
          try {
            Push-Location $chineseDir
            try {
              if (-not (Test-Path $installScriptRel)) { throw "找不到 $installScriptRel（worktree 內）" }
              & $installScriptRel
              # R2 SD 發現：`Push-Location` 只更新 pwsh 的 $PWD，不會同步
              # [Environment]::CurrentDirectory；原本以相對路徑 ".git/hooks/post-commit"
              # 讀回是靠 [System.IO.File]::ReadAllBytes 這種原生 .NET 呼叫照 CWD（而非
              # $PWD）解析、剛好落回 $GITHUB_WORKSPACE/.git（worktree 的 --git-common-dir
              # 也解回同一實體檔案）才「巧合式通過」，並未真正驗證「從 worktree 目錄出發
              # 解析相對路徑」這件事。改用 `git -C $chineseDir` 明確以 worktree 目錄解析
              # 出 common dir 再組絕對路徑讀回，不依賴任何 CWD 同步巧合。
              $commonDir = (git -C $chineseDir rev-parse --path-format=absolute --git-common-dir).Trim()
              $bytes = [System.IO.File]::ReadAllBytes((Join-Path $commonDir "hooks/post-commit"))
              $content = [System.Text.Encoding]::UTF8.GetString($bytes)
              if ($content -match "[?]") { throw "hook 內容含 '?' 替代字元 —— 非 ASCII 路徑遭編碼損毀（Out-File -Encoding ascii 回歸）" }
              if ($content -notmatch "測試目錄") { throw "hook 內容遺失非 ASCII 路徑片段，損毀方式與預期不同" }
              if ($content -notmatch "post_commit_drift\.py") { throw "hook 內容缺 drift hook 路徑" }
              if ($content -notmatch "closure_evidence_verify\.py") { throw "hook 內容缺 closure hook 路徑" }
              Write-Host "install_post_commit.ps1 非 ASCII 路徑編碼驗證通過（無損毀，LATEST=$($latest.Name)）"
            } finally {
              Pop-Location
            }
          } finally {
            git worktree remove --force $chineseDir
          }

      - name: tools/check_script_parity.py（雙平台腳本對等 + pytest 釘選一致；R4 複審發現：先前僅 macOS 側涵蓋）
        shell: pwsh
        run: python tools/check_script_parity.py

      - name: tools/check_ntfs_paths.py（NTFS 敵意檔名，全量 tracked 路徑；R4 複審發現：本工具本質為 Windows/NTFS 相容性檢查，先前卻只在 macOS/Linux 上被驗證過，從未在真正的目標平台 Windows 上跑過）
        shell: pwsh
        run: python tools/check_ntfs_paths.py

  windows-nightly-full:
    name: Windows nightly full suite（深度回歸，非阻斷）
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 60
    continue-on-error: true

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Windows PowerShell 5.1（非 pwsh）驗證 bootstrap.ps1 + dev_start.ps1（R5/S8 發現：本 workflow 其餘步驟一律 shell:pwsh，與文件教使用者實際會用的引擎不同，此路徑此前從未被機械驗證過）
        # 文件（CLAUDE.md／docs/AISDLC_Agent_UserGuide.md）教使用者用
        # `powershell -ExecutionPolicy Bypass -File tools/bootstrap.ps1`（Windows 內建
        # PowerShell 5.1 引擎），本 workflow 其餘所有步驟卻一律 `shell: pwsh`
        # （PowerShell 7 / Core）——CI 驗證的引擎與文件教學的引擎不同。掃描
        # bootstrap.ps1/dev_start.ps1 等關鍵腳本未見 PS7-only 語法，兩引擎預設輸出
        # 編碼（UTF-8 vs UTF-16LE）等差異仍從未機械驗證過「文件教的那條路」是否
        # 真的走得通。放在 windows-nightly-full（而非 windows-smoke）：這是文件路徑
        # 對等性的深度回歸，不需卡 PR 閘門節奏；用完即刪 .venv，不影響本 job 後續
        # 使用全域 python/pip 的步驟。
        shell: powershell
        run: |
          ./tools/bootstrap.ps1
          if (-not (Test-Path .venv\Scripts\python.exe)) { throw "bootstrap.ps1（Windows PowerShell 5.1）執行後 .venv\Scripts\python.exe 未建立" }
          Write-Host "bootstrap.ps1（Windows PowerShell 5.1）執行成功，.venv 已建立"
          . ./tools/dev_start.ps1
          if ($LASTEXITCODE -ne 0) { throw "dev_start.ps1（Windows PowerShell 5.1）核心邏輯（tools/dev_start.py）回報失敗，exit=$LASTEXITCODE" }
          Write-Host "dev_start.ps1（Windows PowerShell 5.1）執行成功"
          Remove-Item -Recurse -Force .venv

      - name: 安裝 AutoClaude 開發 + lint 依賴（供 local_ci_gate.ps1 使用）
        working-directory: AutoClaude
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,lint]"

      - name: 執行 AutoClaude/tools/local_ci_gate.ps1（實際執行，非僅語法解析；P1 Architect 發現修正）
        # Architect 發現：本 workflow 先前只對 local_ci_gate.ps1 做 AST 語法解析
        # （root-infra-ci.yml），從未實際執行過。本腳本鏡像 autoclaude-ci.yml 的
        # push gating jobs（editable 哨兵 + LOC 預算 + CLAUDE.md 行數/長行 + snapshot
        # 可重現 + import-linter + pytest 全套），涵蓋範圍比原本單純呼叫 pytest 更完整，
        # 故取代（而非疊加）原本的裸 pytest 呼叫，避免同一 job 內重複跑一次全套測試。
        # 放進 nightly-full（非 windows-smoke）：pytest 全套 3,500+ case 在 Windows
        # runner 上執行時間較長，符合本 job continue-on-error 深度回歸網的定位。
        working-directory: AutoClaude
        shell: pwsh
        run: ./tools/local_ci_gate.ps1

      - name: AISDLC_SDD LATEST fsm_runtime pytest（排除 chaos；動態解析 LATEST 版本，R2 Architect 發現修正）
        # Architect 發現：原寫死 v0.30，與 root-infra-ci.yml 動態解析 LATEST 版本
        # （sort -V 取最高版語意）的慣例脫節，版本演化到 v0.31 時本 step 不會有機械
        # 訊號提醒更新。改為同一套動態解析邏輯，永遠鎖定當下真正的 LATEST 版本。
        shell: pwsh
        run: |
          $latest = Get-ChildItem -Path AISDLC_SDD -Directory |
            Where-Object { $_.Name -match "^AISDLC_SDD_v[0-9]+\.[0-9]+$" } |
            Sort-Object { [version]($_.Name -replace "^AISDLC_SDD_v", "") } |
            Select-Object -Last 1
          if (-not $latest) { throw "找不到任何 AISDLC_SDD_v* 版本目錄" }
          Write-Host "AISDLC_SDD LATEST 版：$($latest.Name)"
          Push-Location $latest.FullName
          try {
            python -m pip install --upgrade pip
            pip install -r requirements-ci.txt
            python -m pytest tools/fsm_runtime/tests/ -m "not chaos" -q --tb=short
          } finally {
            Pop-Location
          }

  # QA 四方複審發現（P1）：windows-nightly-full 為 continue-on-error: true，失敗會
  # 永久靜默、無任何人工提醒機制（本 repo 已有 aisdlc-sdd-fsm-chaos-nightly.yml 的
  # streak-lock 前例，但這兩個新 job 完全沒有套用）。本 job 補上最小可行的提醒管道：
  # 用 GitHub Issue 追蹤失敗、恢復綠燈後自動關單，避免重覆開單洗版。
  # 刻意不比照 chaos-nightly 收緊 branch protection：(1) 本 repo 為單一開發者直推
  # main、不開 PR/分支（既有工作流慣例），required_pull_request_reviews 這類設定
  # 對此工作流無意義；(2) 已實測 `gh api repos/:owner/:repo/branches/main/protection`
  # 回應 403（此 repo 方案層級不支援 branch protection API），嘗試收緊只會是必然
  # 失敗的空動作。
  windows-nightly-alert:
    name: Windows nightly 失敗提醒（best-effort，不影響 nightly-full 本身的 continue-on-error）
    runs-on: ubuntu-latest
    needs: windows-nightly-full
    if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    permissions:
      actions: read
      issues: write
    steps:
      - name: 讀取本次 windows-nightly-full 實際結論
        # continue-on-error: true 會讓 needs.windows-nightly-full.result 恆為
        # success，無法用來判斷真實失敗，故直接查該 job 在本次 run 的實際 conclusion。
        #
        # R3 QA 四方複審發現（P1）：本 job 的「紅色路徑」（開單/留言分支）在此之前
        # 從未於真實環境執行過一次（nightly-full 至今從未真的失敗過）。補
        # simulate_nightly_failure 手動輸入，可在不需要真的搞壞 nightly-full 的前提下，
        # 一次性驗證開單/留言/自動關單三條分支邏輯是否正確。
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SIMULATE: ${{ github.event.inputs.simulate_nightly_failure }}
        run: |
          set -euo pipefail
          if [ "${SIMULATE:-false}" = "true" ]; then
            echo "⚠️ simulate_nightly_failure=true，強制視為失敗（供驗證 alert 紅色路徑用，不代表 nightly-full 真的失敗）"
            echo "failed=true" >> "$GITHUB_OUTPUT"
          else
            conclusion=$(gh api "/repos/${REPO}/actions/runs/${{ github.run_id }}/jobs" \
              --jq '[.jobs[] | select(.name | startswith("Windows nightly full"))][0].conclusion // "unknown"')
            echo "windows-nightly-full 本次結論：${conclusion}"
            if [ "$conclusion" = "failure" ]; then
              echo "failed=true" >> "$GITHUB_OUTPUT"
            else
              echo "failed=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: 失敗時開單或於既有單留言（title 比對避免每日重覆開單）
        if: steps.check.outputs.failed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          TITLE="[P1] windows-nightly-full 深度回歸失敗"
          existing=$(gh issue list --repo "${REPO}" --state open --search "\"${TITLE}\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "${REPO}" --body "再次失敗：${RUN_URL}"
          else
            gh issue create --repo "${REPO}" --title "${TITLE}" --label "p1,windows,nightly" --body "windows-nightly-full（continue-on-error 非阻斷 job，不會擋 push/PR）失敗，需人工排查，請勿長期忽略。首次偵測到失敗的執行：${RUN_URL}。修復並綠燈後本 job 會自動關閉本 issue。"
          fi

      - name: 綠燈時若有既有失敗 issue 則自動關閉
        if: steps.check.outputs.failed == 'false'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TITLE="[P1] windows-nightly-full 深度回歸失敗"
          existing=$(gh issue list --repo "${REPO}" --state open --search "\"${TITLE}\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue close "$existing" --repo "${REPO}" --comment "windows-nightly-full 已恢復綠燈：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
