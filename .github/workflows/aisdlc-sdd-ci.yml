# AISDLC-SDD — CI 離線閘門（push/PR）。
#
# 補齊先前缺口：原本沒有任何 workflow 在 push/PR 跑那整套離線測試
# （只有 nightly chaos + PR arch-fitness advisory）。本 workflow 與地端
# scripts/ci-gate.sh / docker compose ci-runner / pre-push hook / act 跑
# 同一份 ci-gate.sh，達成「地端通過 ⇒ 雲端通過」的高擬真平價。
#
# 設計：
#   - push 只在 main（驗證主線）；PR 涵蓋所有分支，避免 push+PR 雙跑。
#   - 不推送、不寫回 repo（純驗證），故不需 contents:write，也無推送競爭。
#   - artifact 上傳 continue-on-error（observability-only，配額耗盡不判紅）。
#   - chaos 留 nightly（aisdlc-sdd-fsm-chaos-nightly.yml；重，不上 PR 熱路徑）。
#   - 🔴 TLC-NO-AUTOMATED-CHANNEL（R77-38 訂正）：五軌完整 TLA+/TLC **目前沒有任何
#     自動通道**。本行原文把它與 chaos 併寫成同一句「仍留 nightly」，而實查三個方向
#     全部零命中：`SDD_RUN_TLC`／`--full-tlc` 在根層 workflow 全體、以及兩支
#     run_local_nightly（.ps1／.sh）內皆不出現；ci-gate.sh 自己也印「跳過完整 TLC」。
#     實際情形是：每一個通道、每一次執行，兩棵 SDD 樹各 4 支 TLC 測試一律 skip。
#     要跑只能人工 `bash scripts/ci-gate.sh --full-tlc`（需 Java ＋ tla2tools.jar；
#     R76 實測整套 333.01s、96 passed / skipped=0 ⇒ **成本已知、通道不存在**）。
#     刻意不在本輪補通道：新增雲端排程負載在 Actions 帳務停擺期間是負收益，且要引入
#     Java 外部相依——先讓這行說實話，通道另案。
#     誠實劃界（不是零防護）：離線可達性 BFS 不變量每次 pytest 都跑，缺的是完整 TLC
#     那一層；而能抓到 `_HAPPY_PATH` ↔ `formal/SDD_FSM.tla` 漂移的那支，正是被 skip 的
#     其中之一 ⇒ 根 CLAUDE.md 那條「改 _HAPPY_PATH 必須重跑 TLC」的紀律目前零機械強制。
#     機械物：tools/tests/test_workflow_schedule_sync.py::TestFullTlcChannelDisclosure
#     ——它**雙向**綁住：通道真的建起來的那天，這段揭露必須同時刪掉（否則轉紅），
#     所以樹裡不會留下一句方向相反的舊話。
#
# monorepo 根層接線（2026-07-10）：本 workflow 自 AISDLC_SDD/.github/workflows/ci.yml
# 遷入根層 .github/workflows/（GitHub Actions 只讀 repo 根層）。run step 以 defaults
# 定錨 working-directory: AISDLC_SDD（ci-gate.sh 以自身路徑解析 REPO_ROOT，雙軌
# 凍結基線 v0.01 + LATEST 測試不受影響）；paths 前綴 AISDLC_SDD/ 避免 AutoClaude
# 側變更誤觸發。
#
# 根層消費檔 paths（DEF-101-042，四方複審第五輪）：scripts/tests/ 的 contract test
# 消費 monorepo 根層檔案（test_ntfs_length_gate.py → tools/check_ntfs_paths.py 與
# tools/git-hooks/pre-commit；test_hook_wiring_cwd_safety.py → 根層與 AutoClaude 的
# .claude/settings.json；R38 新增 test_install_post_commit_windowsapps_guard.py →
# tools/lib/WindowsAppsGuard.ps1，Architect 一審 REJECT 收斂 install_post_commit.ps1
# 內嵌 WindowsApps guard 副本後改 dot-source 共用函式；R43 Scan-B 新增
# tools/lib/windowsapps_guard.sh——bash 側對稱實作，test_ci_gate_version_resolution.py
# 沙盒 fixture 現會複製此檔，ci-gate.sh 亦改 dot-source 之，DEF-101-353）——只改
# 這些根層檔的變更也必須觸發本 workflow，否則回歸鎖在「它專門要抓的那類變更」上
# 恰好不跑（DEF-101-037 同構）。

name: aisdlc-sdd-ci

on:
  push:
    branches: [main]
    paths:
      - "AISDLC_SDD/**"
      - ".github/workflows/aisdlc-sdd-ci.yml"
      - "tools/check_ntfs_paths.py"
      - "tools/git-hooks/pre-commit"
      - "tools/lib/bash_probe_spec.py"
      - "tools/lib/WindowsAppsGuard.ps1"
      - "tools/lib/windowsapps_guard.sh"
      - ".claude/settings.json"
      - ".claude/hooks/sdd_hook_router.py"
      - "AutoClaude/.claude/settings.json"
      # R68：AISDLC_SDD/scripts/tests/test_ntfs_length_gate.py 的「三站點長度政策」
      # 鎖跨樹 import 本檔並對它做行為斷言（站點②：logger 刻意不截斷）⇒ 只改本檔時
      # 該鎖必須跟著跑，否則 DEF-101-042 同構假綠。由
      # test_ci_paths_cover_root_consumers.py 當場攔下並要求補列。
      - "AutoClaude/autoclaude/utils/logger.py"
      # R80 收尾：scripts/tests/test_hook_wiring_cwd_safety.py 與
      # test_pretooluse_matcher_task.py 跨樹 import 本檔（hook wiring 解析 SSOT）並對它
      # 做行為斷言 ⇒ 只改本檔時該兩支鎖必須跟著跑，否則 DEF-101-042 同構假綠。
      # 由 test_ci_paths_cover_root_consumers.py 當場攔下並要求補列。
      - "tools/lib/hook_wiring.py"
  pull_request:
    paths:
      - "AISDLC_SDD/**"
      - ".github/workflows/aisdlc-sdd-ci.yml"
      - "tools/check_ntfs_paths.py"
      - "tools/git-hooks/pre-commit"
      - "tools/lib/bash_probe_spec.py"
      - "tools/lib/WindowsAppsGuard.ps1"
      - "tools/lib/windowsapps_guard.sh"
      - ".claude/settings.json"
      - ".claude/hooks/sdd_hook_router.py"
      - "AutoClaude/.claude/settings.json"
      # R68：AISDLC_SDD/scripts/tests/test_ntfs_length_gate.py 的「三站點長度政策」
      # 鎖跨樹 import 本檔並對它做行為斷言（站點②：logger 刻意不截斷）⇒ 只改本檔時
      # 該鎖必須跟著跑，否則 DEF-101-042 同構假綠。由
      # test_ci_paths_cover_root_consumers.py 當場攔下並要求補列。
      - "AutoClaude/autoclaude/utils/logger.py"
      # R80 收尾：scripts/tests/test_hook_wiring_cwd_safety.py 與
      # test_pretooluse_matcher_task.py 跨樹 import 本檔（hook wiring 解析 SSOT）並對它
      # 做行為斷言 ⇒ 只改本檔時該兩支鎖必須跟著跑，否則 DEF-101-042 同構假綠。
      # 由 test_ci_paths_cover_root_consumers.py 當場攔下並要求補列。
      - "tools/lib/hook_wiring.py"
  workflow_dispatch:

# 🔴 group 必須含 `github.event_name`（本輪 R77-55）：本 workflow 由 push(main)＋
# pull_request＋workflow_dispatch 三種事件觸發，而 `cancel-in-progress: true` 的語意是
# 「同 group 新 run 取消舊 run」。group 只綁 `github.ref` 時，在 main 上手動 dispatch
# 一次就會**取消掉正在跑的 push 驗證 run**，而被取消的 run 在 GitHub UI 上不是紅色
# ——「沒跑完」與「跑過且通過」在結論欄長得幾乎一樣。這是 R7／R15／R23 已在
# autoclaude-ci／兩支 compat-CI 上各修過一次的同一個缺陷，這裡是它的殘留站點。
concurrency:
  group: aisdlc-sdd-ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

# 純驗證、不寫回 repo → 最小權限唯讀（佐證無推送競爭）。
permissions:
  contents: read

defaults:
  run:
    working-directory: AISDLC_SDD

jobs:
  offline-gate:
    name: offline gate (pytest + arch-fitness)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install pinned deps
        working-directory: AISDLC_SDD/AISDLC_SDD_v0.01
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt
      - name: Run local CI gate (offline)
        run: bash scripts/ci-gate.sh
      - name: Upload arch-fitness findings
        if: always()
        continue-on-error: true   # observability-only；artifact 配額耗盡不得判紅
        uses: actions/upload-artifact@v6
        with:
          name: ci-arch-fitness-${{ github.run_id }}
          # glob 涵蓋雙軌（凍結基線 v0.01 + LATEST）：ci-gate.sh 對每個受測版各產一份
          # arch-fitness.json；原本寫死 v0.01 使 LATEST 軌取證物遺失（P3-1，2026-07-11）
          path: AISDLC_SDD/AISDLC_SDD_v*/arch-fitness.json
          retention-days: 7
          if-no-files-found: ignore
