        type: boolean
        default: false

# 純驗證、不寫回 repo → 最小權限唯讀。
permissions:
  contents: read

jobs:
  macos-smoke:
    name: macOS smoke（實際執行關鍵腳本，非僅語法解析）
    if: github.event_name != 'schedule'
    runs-on: macos-latest
    timeout-minutes: 35
    concurrency:
      group: macos-compat-ci-smoke-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v5

      # 🔴 R82 MAC-03 —— 這一步**遮住**了 mac 真機第一次開 session 的預設態，明文登記：
      #   setup-python 之後，本 job 全程的 `python3` 是 3.11；而 R83 在真機上開 session 時，
      #   PATH 上的 `python3` 是系統那支（macOS 常年 3.9）。POSIX hook 載具（`.claude/
      #   hooks/_hook_launcher.py` 的 `#!/usr/bin/env python3`）解析到的就是後者 ⇒
      #   `tools/lib/hook_wiring.posix_carrier_problems` 的版本告警在真機 day 1 必響，
      #   而本 job **結構上永遠走不到那條路**（同 root-infra-ci 對工作樹行尾恆綠的形狀：
      #   雲端天生看不到本機的預設環境）。
      #   ⇒ 本 job 的綠**不蘊含**「mac 真機上那道告警不會響／內容正確」。
      #   真的量到預設態的那條剖面刻意放在 `macos-nightly-full`（見該 job 第一個 step），
      #   不放在這裡：本 job 的每一個 step 都受
      #   `tools/tests/test_smoke_ci_sync.py::_CI_STEP_LOCAL_CARRIER`「必須登記本地承載」
      #   的雙向鎖管轄，而「預設態現查」在本機沒有對應的 smoke 情境可登記。
      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: tools/tests 第三方相依（清單 SSOT＝tools/run_root_unittests.py 的 _THIRD_PARTY_PREREQS；漏裝時該 runner 會 fail-fast 指路）
        # R68：tools/tests/ 有三支測試 import `autoclaude.*`，連帶拉進 yaml→pydantic→httpx。
        # 缺相依時 discovery 把它們整份覆蓋塌成佔位測試，122 支迴歸鎖靜默不跑而本 step 紅
        # 在一句「測試疑似大規模靜默消失」上——三平台實測同一數字，是環境維度不是平台維度。
        run: python3 -m pip install --quiet --disable-pip-version-check pyyaml pydantic httpx

      - name: tools/tests 外部工具相依（清單 SSOT＝tools/tests/test_run_root_unittests.py 的 _EXTERNAL_TOOL_PREREQS；runner 無此層 fail-fast，漏裝時由 ExternalToolPrereqDeclarationTest 多紅一支點名）
        # R69：tools/tests/test_pre_push_dispatcher.py 有 5 支測試在 tmp repo 內**真跑**根層
        # dispatcher 並斷言 rc==0，而其 root-infra 快層第 ④ 段對缺 ruff 是 fail-loud（刻意不
        # 軟跳過，見 tools/ruff.toml 檔頭）⇒ 本目錄自此隱性需要 PATH 上有 ruff。此前只有
        # root-infra-ci.yml 裝 ruff，本 job 沒裝 ⇒ 同一批 tools/tests 在三平台有兩種結果
        # （SD 單變因 A/B 實測：有 ruff → Ran 17 OK；唯一差別拿掉 ruff → failures=5）。
        # 版本釘選對齊 root-infra-ci.yml 與 AutoClaude/pyproject.toml（勿單邊升版）。
        # 本 job 刻意**不**跑 `ruff check tools/`（那是 root-infra-ci.yml 第 16 道的職責）：
        # 這裡要的只是「跑 runner 的環境前置一致」，不是把 lint 閘門複製三份。
        run: python3 -m pip install --quiet --disable-pip-version-check 'ruff==0.15.21'

      - name: tools/tests/（SIGPIPE 回歸鎖 + dev_start.py 平台邏輯；R3 QA 發現：paths 雖已涵蓋 tools/tests/**，但先前從未有任何 step 真的執行過，只在 root-infra-ci.yml 的 ubuntu-latest 上以 mock 跑過）
        # R10 QA-2（DEF-101-127）：裸 discover 對「發現 0 個測試」回 rc=0——改走
        # tools/run_root_unittests.py（數量下限釘選，低於下限紅燈不執行）。
        run: python3 tools/run_root_unittests.py

      - name: install_mac_nightly.sh --render-only（plist 產出＋plutil -lint；鏡射本機 smoke [6]，QA-R13-3 補齊四向互鎖缺角）
        run: |
          bash tools/install_mac_nightly.sh --render-only "$RUNNER_TEMP/com.autoclaude.nightly.plist"
          plutil -lint "$RUNNER_TEMP/com.autoclaude.nightly.plist"

      - name: 執行 tools/bootstrap.sh（全新 .venv 建立情境）
        run: |
          bash tools/bootstrap.sh
          test -x .venv/bin/python || { echo "::error::bootstrap.sh 執行後 .venv/bin/python 不存在"; exit 1; }
          echo "bootstrap.sh 全新 .venv 建立情境通過"

      - name: 將 .venv/bin 加入 PATH（比照本機開發慣例，供後續步驟裸呼叫 python）
        run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: 重跑 tools/bootstrap.sh（既有 .venv 沿用情境）
        run: |
          bash tools/bootstrap.sh
          test -x .venv/bin/python || { echo "::error::既有 .venv 重跑後 .venv/bin/python 不存在"; exit 1; }
          echo "bootstrap.sh 既有 .venv 重跑情境通過"

      - name: 執行 tools/dev_start.sh（一般 checkout 情境，首次記錄依賴基準）
        run: |
          rm -f .dev_env_state.json
          bash tools/dev_start.sh --no-sync
          test -f .dev_env_state.json || { echo "::error::dev_start.sh 執行後 .dev_env_state.json 未寫回"; exit 1; }
          echo "dev_start.sh 一般 checkout 情境通過"

      - name: 觸發 tools/dev_start.py 的 cross_same_flavor 分支（linux→mac，僅 macOS runner 可測）
        # _now_label() 只有真正跑在 sys.platform == "darwin" 才回傳 "mac"；本步驟偽造
        # 上次開發平台為 "linux"（與 mac 同為 posix venv 形狀，但 venv 二進位不相容），
        # 驗證 dev_start.py 正確移除既有 .venv 並強制重跑 bootstrap 重建。
        run: |
          python3 -c "
          import json
          state = json.load(open('.dev_env_state.json'))
          state['developing'] = 'linux'
          json.dump(state, open('.dev_env_state.json', 'w'))
          "
          bash tools/dev_start.sh --no-sync
          developing="$(python3 -c "import json; print(json.load(open('.dev_env_state.json'))['developing'])")"
          if [ "$developing" != "mac" ]; then
            echo "::error::cross_same_flavor 執行後 developing 應為 mac，實際=$developing"
            exit 1
          fi
          test -x .venv/bin/python || { echo "::error::cross_same_flavor 重建後 .venv/bin/python 不存在"; exit 1; }
          echo "cross_same_flavor（linux→mac）分支驗證通過"

      - name: zsh source tools/dev_start.sh（macOS 預設 shell 的 source 路徑；R9 Fix-E）
        # R9 Fix-E：dev_start.sh 有 zsh 專屬邏輯（ZSH_EVAL_CONTEXT 判定 sourced +
        # ${(%):-%x} 解析自身路徑），檔頭教學就是 `source tools/dev_start.sh`，而 macOS
        # 使用者預設 shell 是 zsh——但本 job 其餘步驟全用 bash 跑，zsh 分支此前零實跑
        # 覆蓋。dev_start.py 無可用於本步驟的 dry-run 模式，故沿用本 job bash 步驟同款
        # 的最小副作用模式 --no-sync；此時 .venv 已由前面步驟建好，本步驟收斂為快路徑。
        # （2026-07-27 訂正：main() 的旗標已不只 --no-sync／--force-bootstrap，另有
        # DEF-101-504 新增的 --check-nightly。但它**不適用於本步驟**——該旗標查完
        # nightly 鎖就立刻 return，完全不進整備七步、也不會 activate .venv，下方
        # 「VIRTUAL_ENV 已設定」的核心斷言將無從驗起。此處刻意保留 --no-sync。）
        # 斷言兩道：source 後 rc=0，且 VIRTUAL_ENV 已被 activate 設定（證明 zsh 分支
        # 的 sourced 偵測 + 自動啟用 .venv 真的走通，而非 fallback 到 bash 分支或未啟用）。
        run: |
          zsh --version
          zsh -c '
            source tools/dev_start.sh --no-sync
            rc=$?
            [ "$rc" -eq 0 ] || { echo "::error::zsh source dev_start.sh 失敗（rc=$rc）"; exit "$rc"; }
            [ -n "$VIRTUAL_ENV" ] || { echo "::error::zsh source 後 VIRTUAL_ENV 未設定——.venv 未被自動啟用（zsh sourced 偵測失效）"; exit 1; }
            echo "zsh 下 python → $(command -v python)"
          '
          echo "zsh source dev_start.sh 驗證通過（sourced 偵測 + .venv 自動啟用）"

      - name: AutoClaude/tools/install_git_hooks.sh 安裝／解除往返驗證（一般 checkout）
        run: |
          bash AutoClaude/tools/install_git_hooks.sh
          hp="$(git config --get core.hooksPath || true)"
          if [ -z "$hp" ]; then echo "::error::core.hooksPath 未設定"; exit 1; fi
          echo "core.hooksPath = $hp"
          bash AutoClaude/tools/install_git_hooks.sh --uninstall
          hp2="$(git config --get core.hooksPath || true)"
          if [ -n "$hp2" ]; then echo "::error::core.hooksPath 卸載後仍殘留：$hp2"; exit 1; fi
          echo "install_git_hooks.sh 安裝／解除往返驗證通過"

      - name: AutoClaude/tools/install_git_hooks.sh 於 linked worktree 下應正確拒絕（fail-loud）
        run: |
          wt="$RUNNER_TEMP/wt-install-git-hooks-reject"
          git worktree add --detach "$wt" HEAD
          set +e
          ( cd "$wt" && bash AutoClaude/tools/install_git_hooks.sh )
          rc=$?
          set -e
          git worktree remove --force "$wt"
          if [ "$rc" -ne 1 ]; then
            echo "::error::預期在 linked worktree 下 install_git_hooks.sh 應 exit 1，實際 rc=$rc"
            exit 1
          fi
          echo "install_git_hooks.sh worktree 拒絕驗證通過（rc=1 as expected）"

      - name: AISDLC_SDD/scripts/install-hooks.sh 安裝／解除往返驗證（一般 checkout）
        run: |
          bash AISDLC_SDD/scripts/install-hooks.sh
          hp="$(git config --get core.hooksPath || true)"
          if [ -z "$hp" ]; then echo "::error::core.hooksPath 未設定（install-hooks.sh）"; exit 1; fi
          echo "install-hooks.sh 驗證通過：core.hooksPath = $hp"
          git config --unset core.hooksPath || true

      - name: AISDLC_SDD/scripts/install-hooks.sh 於 linked worktree 下應正確拒絕（fail-loud）
        run: |
          wt="$RUNNER_TEMP/wt-install-hooks-reject"
          git worktree add --detach "$wt" HEAD
          set +e
          ( cd "$wt" && bash AISDLC_SDD/scripts/install-hooks.sh )
          rc=$?
          set -e
          git worktree remove --force "$wt"
          if [ "$rc" -ne 1 ]; then
            echo "::error::預期在 linked worktree 下 install-hooks.sh 應 exit 1，實際 rc=$rc"
            exit 1
          fi
          echo "install-hooks.sh worktree 拒絕驗證通過（rc=1 as expected）"

      - name: 根層 dispatcher hooks：安裝 + 真實 git commit 觸發 pre-commit（經 core.hooksPath）
        # R56 修正（SA finding，鏡射 windows-compat-ci.yml 同名 step 的三道可觀測
        # 訊號）：原探針是根層 `_ci_macos_hook_probe.txt`，對 pre-commit dispatcher
        # 的六個分流 pattern（AutoClaude/、AISDLC_SDD/、tools/、.github/、
        # .gitattributes、.editorconfig）全部不命中 → 三個 leg 皆 0，dispatcher 跑完
        # NTFS 閘即 exit 0、全程零輸出；本 step 唯一的斷言是「commit 沒失敗」，
        # 而 hooks 根本沒生效時 commit 一樣會成功——即 fail-open 死斷言，對
        # 「core.hooksPath 真的讓 git 執行了 dispatcher」零鑑別力。
        # 三道訊號（與 Windows 側對稱）：(1) core.hooksPath 非空；(2) probe 檔放
        # tools/ 下使根層基建 leg 必定觸發，從 commit 輸出 grep dispatcher marker；
        # (3) 負路徑：帶語法錯誤的 tools/*.sh 必須被 dispatcher 的 bash -n 閘擋下
        # （Windows 側用同款負路徑；本 job 另有 CON.txt NTFS 負路徑在下一 step）。
        run: |
          bash AutoClaude/tools/install_git_hooks.sh
          hp="$(git config --get core.hooksPath || true)"
          test -n "$hp" || { echo "::error::core.hooksPath 未設定"; exit 1; }

          printf '%s\n' '#!/usr/bin/env bash' 'echo ok' > tools/_ci_macos_hook_probe.sh
          git add tools/_ci_macos_hook_probe.sh
          set +e
          out="$(git -c user.email=ci@example.com -c user.name=ci -c commit.gpgsign=false \
            commit -m "ci: macos hook probe (throwaway, not pushed)" 2>&1)"
          rc=$?
          set -e
          echo "$out"
          if [ "$rc" -ne 0 ]; then
            echo "::error::probe commit 失敗（rc=$rc）——dispatcher 應放行乾淨變更"
            exit 1
          fi
          echo "$out" | grep -F "[pre-commit dispatcher]" >/dev/null || {
            echo "::error::commit 輸出未見 dispatcher marker——hooks 未經 core.hooksPath 實際執行"; exit 1; }
          echo "git commit 經 core.hooksPath 成功觸發 pre-commit dispatcher（exit 0 + marker 可觀測）"

          printf '%s\n' '#!/usr/bin/env bash' 'if true; then' > tools/_ci_macos_hook_probe_bad.sh
          git add tools/_ci_macos_hook_probe_bad.sh
          set +e
          git -c user.email=ci@example.com -c user.name=ci -c commit.gpgsign=false \
            commit -m "ci: macos bad probe (must be rejected)" -q
          rc=$?
          set -e
          git reset -q HEAD tools/_ci_macos_hook_probe_bad.sh
          rm -f tools/_ci_macos_hook_probe_bad.sh
          if [ "$rc" -eq 0 ]; then
            echo "::error::帶語法錯誤的 tools/*.sh 應被 dispatcher bash -n 閘擋下，commit 卻成功"
            exit 1
          fi
          echo "dispatcher 正確擋下語法錯誤的根層 .sh（rc=$rc as expected）"

          git rm -q tools/_ci_macos_hook_probe.sh
          git -c user.email=ci@example.com -c user.name=ci -c commit.gpgsign=false \
            commit -m "ci: revert macos hook probe (throwaway, not pushed)" -q

      - name: 根層 dispatcher hooks：/bin/bash（系統 bash 3.2，非 Homebrew 新版）直接執行驗證
        # 三支 dispatcher 的 shebang 為 #!/usr/bin/env bash，經 git commit/push 觸發時
        # 實際執行的 bash 版本取決於 runner PATH 解析、可能是較新版本，掩蓋 3.2 相容性
        # 問題。此處以 /bin/bash 明確指定系統 bash 直接呼叫，才能真正驗證 declare -A /
        # readarray / mapfile 等 bash 4+ 限定語法未被誤用。
        run: |
          /bin/bash --version | head -1

          # R56 修正（SA finding）：原探針是根層 `_ci_probe_clean.txt`，pre-commit
          # 的六個分流 pattern（AutoClaude/、AISDLC_SDD/、tools/、.github/、
          # .gitattributes、.editorconfig）全部不命中 → run_root_infra=0，dispatcher
          # 跑完 NTFS 閘即 exit 0，A4 根層基建 leg（本 dispatcher 內唯一含 while
          # read / heredoc / 巢狀 case 的區塊）從未在系統 bash 3.2 下被執行過——
          # 本 step 自述的「真正驗證 bash 4+ 限定語法未被誤用」對該區塊完全落空
          # （fail-open 死斷言）。改為暫存一支 tools/*.sh 使 leg 必定觸發，並機械
          # 斷言 leg 的識別訊息真的出現（否則探針再度失效時仍是靜默綠燈）。
          # R56 訂正（SD round 3）：擷取式 `out="$(…)"` 在本 job 預設 shell（`bash -e`）
          # 下，dispatcher 回非零時該 assignment 本身即失敗的 simple command → shell
          # 立刻結束，後面的 printf 永不執行、清場也不執行，於是「最需要診斷的失敗
          # 路徑」CI log 完全空白（scratchpad 實機重現：rc=1、輸出零行）。R56 之前是
          # 裸呼叫、stdout/stderr 直接串進 log，本輪為加 marker 斷言而改成擷取反而
          # 退化。改為與本 step 下方 NTFS 探針（及 tools/macos_smoke_local.sh 2a）
          # 對稱的三段式：set +e → 擷取 → 記 rc → set -e → 先印再判。
          printf '#!/usr/bin/env bash\necho ok\n' > tools/_ci_probe_clean.sh
          git add tools/_ci_probe_clean.sh
          set +e
          out="$(/bin/bash tools/git-hooks/pre-commit 2>&1)"
          rc=$?
          set -e
          printf '%s\n' "$out"
          # 清場先於 rc 判斷：失敗路徑上探針不得殘留污染後續 step。
          git reset -q tools/_ci_probe_clean.sh
          rm -f tools/_ci_probe_clean.sh
          if [ "$rc" -ne 0 ]; then
            # `${rc}` 必須帶大括號：bash 3.2 在 C.UTF-8 下把全形「）」的首位元組
            # 0xEF 視為識別字字元，裸 `$rc）` 會被解析成變數 `rc\xEF`（未設→空字串）
            # 並吐出殘位元組亂碼（本輪撰寫時實機重現 → 訂正）。本 repo 既有慣例即
            # 一律帶大括號，此註解僅記錄 WHY 供未來覆核。
            echo "::error::pre-commit dispatcher 於系統 bash 下非零退出（rc=${rc}）— 上方為其完整輸出"
            exit 1
          fi
          case "$out" in
            *"變更含根層基建"*) ;;
            *) echo "::error::pre-commit dispatcher 未觸發根層基建 leg（A4）— 探針失效，本 step 對該區塊的 bash 3.2 覆蓋宣稱落空"; exit 1 ;;
          esac
          echo "pre-commit dispatcher 於系統 bash 下執行成功（乾淨變更，含 A4 根層基建 leg）"

          touch "CON.txt"
          git add "CON.txt"
          set +e
          /bin/bash tools/git-hooks/pre-commit
          rc=$?
          set -e
          git reset -q "CON.txt" || true
          rm -f "CON.txt"
          if [ "$rc" -eq 0 ]; then
            echo "::error::預期 NTFS 保留裝置名（CON.txt）應被擋下，但 dispatcher 回報成功"
            exit 1
          fi
          echo "pre-commit dispatcher 正確擋下 NTFS 保留裝置名（rc=$rc as expected）"

          /bin/bash tools/git-hooks/post-commit
          echo "post-commit dispatcher 於系統 bash 下執行成功"

          ZERO_SHA='0000000000000000000000000000000000000000'
          head_sha="$(git rev-parse HEAD)"
          printf 'refs/heads/ci-probe %s refs/heads/ci-probe %s\n' "$ZERO_SHA" "$head_sha" \
            | /bin/bash tools/git-hooks/pre-push
          echo "pre-push dispatcher 於系統 bash 下執行成功（刪除分支跳過路徑）"

      - name: AISDLC_SDD LATEST/tools/install_hooks/install_post_commit.sh 於 worktree 執行，驗證寫入共用 .git/hooks/post-commit
        # R2 Architect 複審發現：原寫死 v0.30，與 windows-compat-ci.yml 已修正的動態解析
        # LATEST（sort -V 取最高版語意，鏡射 ci-gate.sh 慣例）慣例脫節，版本演化到 v0.31
        # 時本 step 不會有機械訊號提醒更新。改為同一套動態解析邏輯。
        run: |
          # R10 DEF-101-133：LATEST 解析委派 AISDLC_SDD/scripts/sdd_version.py 單一真相源
          # （tracked 過濾＋錨定＋數值排序）；原三重 glob 尾端未錨定，`.bak`／檔總管
          # 複製品目錄會汙染選版（R10 ARCH-3 實測重現）。
          latest_name="$(python3 AISDLC_SDD/scripts/sdd_version.py --sdd-root AISDLC_SDD || true)"
          test -n "$latest_name" || { echo "::error::找不到任何 AISDLC_SDD_v* 版本目錄（sdd_version.py SSOT）"; exit 1; }
          latest="AISDLC_SDD/${latest_name}"
          echo "AISDLC_SDD LATEST 版：$latest"
          wt="$RUNNER_TEMP/wt-install-post-commit"
          git worktree add --detach "$wt" HEAD
          ( cd "$wt" && bash "$latest/tools/install_hooks/install_post_commit.sh" )
          target="$(git rev-parse --path-format=absolute --git-common-dir)/hooks/post-commit"
          test -x "$target" || { echo "::error::post-commit 未正確安裝於 $target"; exit 1; }
          grep -q "post_commit_drift.py" "$target" || { echo "::error::post-commit 缺 drift hook 路徑"; exit 1; }
          grep -q "closure_evidence_verify.py" "$target" || { echo "::error::post-commit 缺 closure hook 路徑"; exit 1; }
          echo "install_post_commit.sh 於 worktree 執行、寫入共用 hooks 驗證通過：$target"
          git worktree remove --force "$wt"

          # 2026-07-16 四方複審 SD 發現的 P1 回歸鎖：上面的斷言都是在 worktree 還存在時
          # 就讀取，install_post_commit.sh 原本用 `git rev-parse --show-toplevel`（linked
          # worktree 下回傳呼叫端 worktree 自己的根目錄，非主 checkout）組出 drift/closure
          # hook 來源路徑，worktree 一旦被移除，寫入共享 hook 內嵌的路徑就會失效，而 hook
          # 本身用 `|| true` 靜默吞掉這個失敗——drift（Rule 9.17.1）與 closure（DEF-20-001）
          # 兩個 advisory 閘門會在主 checkout 上永久靜默失效、零告警。這個 bug 在 worktree
          # 存在期間永遠測不到，必須等 worktree 移除後才會現形，這正是先前 CI 沒抓到本次
          # bug 的原因。故在此追加：worktree 移除後重新讀取共用 hook 內容，擷取內嵌的 .py
          # 路徑並斷言其仍存在於磁碟（這才是真正證明修復有效的關鍵）。
          drift_path="$(grep -o '"[^"]*post_commit_drift\.py"' "$target" | tr -d '"' | head -1)"
          closure_path="$(grep -o '"[^"]*closure_evidence_verify\.py"' "$target" | tr -d '"' | head -1)"
          test -n "$drift_path" || { echo "::error::worktree 移除後無法從 hook 擷取 drift hook 路徑"; exit 1; }
          test -n "$closure_path" || { echo "::error::worktree 移除後無法從 hook 擷取 closure hook 路徑"; exit 1; }
          test -f "$drift_path" || { echo "::error::worktree 移除後，hook 內嵌的 drift hook 路徑已不存在於磁碟：$drift_path（P1 回歸重現）"; exit 1; }
          test -f "$closure_path" || { echo "::error::worktree 移除後，hook 內嵌的 closure hook 路徑已不存在於磁碟：$closure_path（P1 回歸重現）"; exit 1; }
          echo "install_post_commit.sh worktree 移除後路徑仍有效驗證通過：drift=$drift_path closure=$closure_path"

      - name: pty_wrapper / hotkey_handler 平台解析單元測試（AutoClaude tests/test_perception.py）
        working-directory: AutoClaude
        run: python -m pytest tests/test_perception.py -q -rs --tb=short  # -rs：R59 ARCH-R59-NB1

      - name: AutoClaude 平台敏感測試子集（R76-11：push 閘門對 AutoClaude 生產樹此前零執行證據）
        working-directory: AutoClaude
        # 🔴 R76-11：與 `windows-compat-ci.yml` 同一步的**對稱物**，完整 WHY 寫在該檔
        # （命名慣例、為何用 `-k` 而非新 marker、掃描面歸零時 pytest 回 rc=5 而非靜默
        # 通過）。此處只記與該檔不同的兩件事：
        #   ① 本 job 不宣告 `shell:`（沿用 macOS runner 預設 bash，同本檔其餘全部步驟；
        #      理由見檔頭「刻意不補顯式 shell: bash」段——補宣告會連帶開啟 pipefail）。
        #   ② 🔴 成本**在 macOS 上未實測**（R76 是 Windows 真機輪，無 mac 機器）。已測
        #      的是 Windows 側同一條命令列：`277 passed, 7 skipped, 3840 deselected in
        #      13.54s`。選中支數在兩平台可能不同（部分測試帶平台 skip），故此處刻意
        #      **不**把那個數字寫成 macOS 的實測值——第一次真跑後再回填。
        run: python -m pytest tests -q -rs -m 'not perf and not pg_real' -k 'path or encoding or platform or shell or subprocess'

      - name: 執行 tools/integration_gate.sh --skip-full（實際執行，非僅語法解析；R34 Scan-C 發現修正）
        # Scan-C 發現：windows-compat-ci.yml 先前已修過同一缺陷模式（P1 Architect 發現：
        # root-infra-ci.yml 對 .ps1/.sh 僅做語法解析，非實際執行），並補上 windows-smoke
        # 實跑 `integration_gate.ps1 -SkipFull`，但對等的 macOS/Linux 薄殼
        # tools/integration_gate.sh 一直漏補，只靠 root-infra-ci.yml 的 `bash -n` 語法檢查
        # 頂替，等同 windows 側修復前的原始曝險狀態。
        # --skip-full 僅跑 [3/5]SDD bridge 整合煙霧 + [4/5]回退驗證 + [5/5]cc-switch A/B
        # 偵測（未裝 CLI 時 SKIP，不計失敗），略過 [1/5]AutoClaude local_ci_gate 全套／
        # [2/5]AISDLC_SDD ci-gate 全套的完整重跑。
        # 已知覆蓋率限制（R34 一審 QA 發現修正，比照下方 ci-gate.sh 步驟既有誠實揭露
        # 慣例）：[2/5] 確實由本 job 下一步 `bash scripts/ci-gate.sh` 涵蓋；但 [1/5]
        # （`tools/local_ci_gate.{sh,ps1}` 全套，含 editable 哨兵/LOC 預算/import-linter/
        # pytest 全套）**並未**在本 smoke job 另跑，只靠每週一次的 `macos-nightly-full`
        # （continue-on-error 非阻斷）執行 `local_ci_gate.sh`。🔴 R76-11 訂正：本段原文
        # 寫「AutoClaude 完整測試套件在 macOS PR/push 閘門上零覆蓋」——「完整套件」那半句
        # 今日仍成立，但「零覆蓋」自本輪起已失實：上方新增的「AutoClaude 平台敏感測試
        # 子集」步驟在本 job 實跑 AutoClaude/tests 的平台敏感子集。故改為窄斷言：
        # **完整**套件仍只在 nightly；平台敏感子集已進 push 閘門。此為既有侷限（非本
        # 步驟新增），如實記載，避免任一方向的失實宣稱誤導後續維護者。
        run: bash tools/integration_gate.sh --skip-full

      - name: 執行（非僅解析）AISDLC_SDD/scripts/ci-gate.sh（凍結基線 v0.01 + LATEST 雙軌）
        # 已知覆蓋率限制（R3 QA 複審發現，比照 windows-compat-ci.yml 的誠實揭露慣例）：
        # GitHub-hosted macos-latest runner 沒有 Docker daemon，`docker_available()`
        # 恆回 False，v0.01/v0.30 的 3 個 docker 執行測試（test_docker_backend_real_pass／
        # test_docker_backend_real_runtime_fail／test_docker_backend_e2e_through_fsm）
        # 在此 job 恆被乾淨 skip（本機開發者 macOS 若已裝 Docker Desktop 則會真實執行，
        # 詳見 AutoSDD_Defect_Log.md DEF-101-062 相關記錄）。本步驟綠燈不代表這 3 個
        # docker 測試的邏輯已在 macOS CI 上被驗證過。
        working-directory: AISDLC_SDD
        run: bash scripts/ci-gate.sh

      - name: tools/check_script_parity.py（雙平台腳本對等 + pytest 釘選一致）
        run: python3 tools/check_script_parity.py

      - name: tools/check_ntfs_paths.py（NTFS 敵意檔名，全量 tracked 路徑）
        run: python3 tools/check_ntfs_paths.py

  macos-nightly-full:
    name: macOS nightly full suite（深度回歸，非阻斷）
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 60
    continue-on-error: true
    concurrency:
      group: macos-compat-ci-nightly-full
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v5

      # 🔴 R82 MAC-03 —— **唯一一條不經 setup-python 的剖面**（advisory，永不阻斷）。
      # WHY：`macos-smoke` 第一步就 setup-python 3.11，於是 repo 對「macOS 預設 python3
      # 是 3.9」這件事的全部宣稱，在雲端從來沒有被任何一步量到過——包含
      # `hook_wiring.posix_carrier_problems` 那道「day 1 必響」的版本告警：它宣稱什麼、
      # 響出來對不對，兩者都無人觀測。這一步把它變成**可觀測**（印版本＋真的跑一次
      # liveness 檢查），刻意不改任何判準、不擋任何東西。
      # 誠實劃界：runner 的系統 python3 版本會隨 macos-latest 映像漂移，所以本步只**印**
      # 不判；判準那一半在 `tools/tests/test_mac_readiness_r82.py`（機器無關）。
      - name: 【R82】runner 預設態現查：系統 python3 版本 + hook 載具 liveness（不經 setup-python）
        continue-on-error: true
        run: |
          echo "PATH 上的 python3 ＝ $(command -v python3 || echo '(找不到)')"
          python3 -c 'import sys; print("PATH python3 ->", sys.version_info[:2])' || true
          /usr/bin/python3 -c 'import sys; print("系統 /usr/bin/python3 ->", sys.version_info[:2])' || true
          echo "── 以系統直譯器跑 hook 載具 liveness（advisory；rc 不被消費）──"
          /usr/bin/python3 tools/check_hooks_liveness.py || true

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: 執行 AutoClaude/tools/local_ci_gate.sh（實際執行，非僅裸 pytest；2026-07-16 四方複審 SA 發現修正）
        # SA 發現：windows-compat-ci.yml 的 windows-nightly-full 已改執行
        # `local_ci_gate.ps1`（鏡像 autoclaude-ci.yml push gating jobs：editable 哨兵 +
        # LOC 預算 + CLAUDE.md 行數/長行 + snapshot 可重現 + import-linter + pytest 全套），
        # 本 job 卻仍停留在只裝 `[dev]` + 裸 pytest 的舊模式，涵蓋範圍比對岸窄很多。改裝
        # `[dev,lint]`（import-linter 需要）並執行 local_ci_gate.sh，取代（而非疊加）原本
        # 的裸 pytest 呼叫，避免同一 job 內重複跑一次全套測試。
        #
        # 2026-07-16 四方複審 QA 發現：job 層級 continue-on-error 只影響「整個
        # workflow run 對外呈現的結論」，不會讓同一 job 內、失敗 step 之後的其餘
        # step 繼續執行（GitHub Actions 每個 step 預設隱含 if: success()）。若本
        # step 失敗，下一步（AISDLC_SDD fsm_runtime pytest）當晚完全不會執行，但
        # continue-on-error 讓 job 結論只顯示「失敗」而非「跳過一半」，nightly-alert
        # 開的 issue 也看不出「深度回歸其實只跑了一步就死」。改用
        # if: ${{ !cancelled() }}（而非 always()——always() 連使用者手動取消都會
        # 硬跑，!cancelled() 才是「前面失敗仍照跑，但使用者主動取消時不硬跑」的
        # 正確語意）。
        if: ${{ !cancelled() }}
        working-directory: AutoClaude
        run: |
          python -m pip install --upgrade pip
          # 🔴 `hotkey` extra 必須裝（R76 四方複審 SD-03）：R76 把 `keyboard` 由核心
          # dependencies 移進 `[hotkey]` optional extra（理由是開發者本機 bootstrap
          # 不該被 pyobjc 傘包拖累）。副作用是 macOS CI 從此**不再**裝 keyboard ⇒
          # `AutoClaude/tests/test_perception_platform_honesty.py` 那支
          # `test_macos_non_root_register_reports_unavailable_for_real` 由 passed 變
          # skipped——而那支正是本次變更論證所引用的 R68 真機取證（`_darwinkeyboard`
          # 非 root 不可監聽）。論證與證據互相拆台，且方向是 passed→skipped（摘要看
          # 起來更乾淨），是本 repo 最怕的那個方向。CI 是 ephemeral 環境，pyobjc 的
          # 安裝面成本不是這次要省的那一個——要省的是**開發者本機**的 bootstrap。
          pip install -e ".[dev,lint,hotkey]"
          bash tools/local_ci_gate.sh

      - name: AISDLC_SDD LATEST fsm_runtime pytest（排除 chaos；動態解析 LATEST 版本，R2 Architect 複審發現修正）
        # R2 Architect 複審發現：原寫死 v0.30 於 working-directory 靜態欄位，與
        # windows-compat-ci.yml 已修正的動態解析 LATEST 慣例脫節。working-directory
        # 是靜態 YAML 欄位無法動態運算，改於 run: 內動態解析後 cd 進去。
        #
        # 2026-07-16 四方複審 QA 發現：加 !cancelled()，同上——本 step 與前一步彼此
        # 獨立，不應因前一步失敗而被跳過。
        if: ${{ !cancelled() }}
        run: |
          # R10 DEF-101-133：LATEST 解析委派 AISDLC_SDD/scripts/sdd_version.py 單一真相源
          # （tracked 過濾＋錨定＋數值排序）；原三重 glob 尾端未錨定，`.bak`／檔總管
          # 複製品目錄會汙染選版（R10 ARCH-3 實測重現）。
          latest_name="$(python3 AISDLC_SDD/scripts/sdd_version.py --sdd-root AISDLC_SDD || true)"
          test -n "$latest_name" || { echo "::error::找不到任何 AISDLC_SDD_v* 版本目錄（sdd_version.py SSOT）"; exit 1; }
          latest="AISDLC_SDD/${latest_name}"
          echo "AISDLC_SDD LATEST 版：$latest"
          cd "$latest"
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt
          python -m pytest tools/fsm_runtime/tests/ -m "not chaos" -q -rs --tb=short  # -rs：R59 ARCH-R59-NB1

  # QA 四方複審發現（P1，與 windows-compat-ci.yml 同款缺口）：macos-nightly-full 為
  # continue-on-error: true，失敗會永久靜默、無任何人工提醒機制。設計理由與
  # windows-compat-ci.yml 的 windows-nightly-alert 完全相同（見該檔同名 job 註解）：
  # 不比照 aisdlc-sdd-fsm-chaos-nightly.yml 收緊 branch protection（本 repo 直推
  # main、無 PR，且已實測此 repo 方案不支援 branch protection API），改用 GitHub
  # Issue 追蹤失敗、恢復綠燈後自動關單。
  macos-nightly-alert:
    name: macOS nightly 失敗提醒（best-effort，不影響 nightly-full 本身的 continue-on-error）
    runs-on: ubuntu-latest
    timeout-minutes: 10   # R14 QA-R14-RR-1：輕量 alert job（發 gh issue），補 timeout 防卡死燒滿 360 分鐘
    needs: macos-nightly-full
    if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    concurrency:
      # R13 CI-5：alert 改用獨立 group（原與 macos-nightly-full 共用同一把
      # macos-compat-ci-nightly-full）——GitHub job 層 concurrency 在
      # cancel-in-progress:false 下同 group 仍只允許**一個 pending**：run A 的
      # nightly-full 佔住 group 時，若 run B 的 nightly-full 先排入 pending，
      # 稍後才 eligible 的 run A alert（needs 下游）會把 pending 位驅逐/被驅逐，
      # 被驅逐方 conclusion=cancelled（≠failure），告警路徑靜默蒸發、開單/關單
      # 分支永不執行。alert 本身輕量無重疊風險，獨立 group 即可根絕互踩。
      group: macos-compat-ci-nightly-alert
      cancel-in-progress: false
    permissions:
      actions: read
      issues: write
    steps:
      - name: 讀取本次 macos-nightly-full 實際結論
        # R3 QA 四方複審發現（P1）：本 job 至此之前從未於真實環境執行過一次（0 筆
        # schedule/workflow_dispatch run），連 green path 都未驗證過，紅色路徑（開單/
        # 留言分支）更未驗證。補 simulate_nightly_failure 手動輸入，可在不需要真的
        # 搞壞 nightly-full 的前提下，一次性驗證開單/留言/自動關單三條分支邏輯。
        #
        # 🔴 R68 SCAN-C（P2，與 windows-compat-ci.yml 同款、同一次修復）：本判讀原為
        # **黑名單 fail-open**（只有字面 "failure" 算紅），cancelled／timed_out／
        # skipped／conclusion 為 null／job 顯示名被加前綴（startswith 落空）五種情境
        # 全部得 failed=false ⇒ 走下方「綠燈時自動關閉既有失敗 issue」分支，對一張
        # 仍然有效的單留言「已恢復綠燈」並關掉它。改為**白名單 fail-closed**：只有
        # 字面 "success" 算綠，其餘（含 gh api 自身失敗降級的 "api-error"）一律開單／
        # 留言，並輸出實際結論字串供 issue body 區分「跑完但失敗」與「根本沒跑起來」。
        # `startswith("macOS nightly full")` ↔ nightly-full 的 `name:` 前綴由
        # tools/tests/test_workflow_permission_concurrency_lock.py 機械互鎖，改名即紅。
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SIMULATE: ${{ github.event.inputs.simulate_nightly_failure }}
        run: |
          set -euo pipefail
          if [ "${SIMULATE:-false}" = "true" ]; then
            echo "⚠️ simulate_nightly_failure=true，強制視為失敗（供驗證 alert 紅色路徑用，不代表 nightly-full 真的失敗）"
            echo "conclusion=simulated-failure" >> "$GITHUB_OUTPUT"
            echo "failed=true" >> "$GITHUB_OUTPUT"
          else
            # gh api 自身失敗時不得讓 step 死掉（outputs.failed 為空 ⇒ 下方兩分支
            # 皆不成立、告警靜默蒸發）；降級為 "api-error" 交白名單當「非綠」處理。
            conclusion=$(gh api "/repos/${REPO}/actions/runs/${{ github.run_id }}/jobs" \
              --jq '[.jobs[] | select(.name | startswith("macOS nightly full"))][0].conclusion // "unknown"' \
              || echo "api-error")
            [ -n "$conclusion" ] || conclusion="unknown"
            echo "macos-nightly-full 本次結論：${conclusion}"
            echo "conclusion=${conclusion}" >> "$GITHUB_OUTPUT"
            if [ "$conclusion" = "success" ]; then
              echo "failed=false" >> "$GITHUB_OUTPUT"
            else
              echo "failed=true" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: 失敗時開單或於既有單留言（title 比對避免每日重覆開單）
        if: steps.check.outputs.failed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CONCLUSION: ${{ steps.check.outputs.conclusion }}
        run: |
          set -euo pipefail
          TITLE="[P1] macos-nightly-full 深度回歸失敗"
          existing=$(gh issue list --repo "${REPO}" --state open --search "\"${TITLE}\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "${REPO}" --body "再次失敗（實際結論：\`${CONCLUSION}\`）：${RUN_URL}"
          else
            gh issue create --repo "${REPO}" --title "${TITLE}" --label "p1,macos,nightly" --body "macos-nightly-full（continue-on-error 非阻斷 job，不會擋 push/PR）非綠燈，需人工排查，請勿長期忽略。本次實際結論：\`${CONCLUSION}\`（\`success\` 以外一律開單；\`unknown\`／\`api-error\` 代表**根本沒跑起來或查不到**，例如帳務停擺讓 job 完全未配置 runner，見 DEF-101-081）。首次偵測到的執行：${RUN_URL}。恢復 \`success\` 後本 job 會自動關閉本 issue。"
          fi

      - name: 綠燈時若有既有失敗 issue 則自動關閉（白名單：僅 conclusion == success）
        # 🔴 R68：守衛 `failed == 'false'` 現在等價於「conclusion 恰為 success」；
        # 修復前等價於「不是字面 failure」，會在 cancelled／timed_out／改名／API
        # 失敗時關掉仍有效的 P1 單並留言「已恢復綠燈」。
        if: steps.check.outputs.failed == 'false'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CONCLUSION: ${{ steps.check.outputs.conclusion }}
        run: |
          set -euo pipefail
          TITLE="[P1] macos-nightly-full 深度回歸失敗"
          existing=$(gh issue list --repo "${REPO}" --state open --search "\"${TITLE}\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue close "$existing" --repo "${REPO}" --comment "macos-nightly-full 已恢復綠燈（實際結論：\`${CONCLUSION}\`）：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
