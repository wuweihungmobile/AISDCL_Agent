    inputs:
      simulate_nightly_failure:
        # 🔴 R77-20 訂正：本欄原先夾帶一句「覆蓋度快照」，宣稱這條 alert 通道連綠路徑
        # 都還沒被真正觸發過。後續量測推翻了它——綠路徑（自動關單）已在一次真實排程
        # run 上執行成功。仍未被驗證的是**紅路徑**，而本輸入自建立起 dispatch 次數為 0。
        # 教訓與 root-infra-ci 第 15 道的豁免理由同型：量測快照不該長在一個會被人讀來
        # 判斷「還缺什麼覆蓋」的欄位裡，它從被推翻的那一刻起就開始說謊。故本欄改為只
