# macOS 相容性驗證（Mac/Windows 架構優化，四方複審發現的第二個 P0 缺口）。
#
# 背景：四方獨立審查交叉確認 `.github/workflows/` 下全部 workflow、21 處 `runs-on`
# 只有 ubuntu-latest 與 windows-latest，完全沒有 macos-latest job——但本 repo 的目標
# 是「Mac/Windows 11 皆能正常部署、執行、開發」，且開發實際上就在 macOS 機器上進行，
# macOS 端長期只靠人工對照與文件宣稱，從未被機器化驗證過。同一輪審查也證實：光靠
# 「四方複審 APPROVE」擋不住真實平台 bug——`5c180b2` 聲稱四輪 APPROVE 後，補上
# windows-latest CI（見 windows-compat-ci.yml）就連續抓到 4 個真實 bug（py launcher
# 誤判 / NTFS 保留裝置名搶先擋下測試 / install_git_hooks 往返驗證誤判 rc=1 / worktree
# 下 install_post_commit 寫入路徑錯誤）。本 workflow 補上 macOS 側同等的機械安全網。
#
# 設計（比照 windows-compat-ci.yml 的 smoke + nightly-full 兩層慣例）：
#   - macos-smoke      ：PR/push 閘門，只在觸及平台敏感路徑時觸發，實際「執行」關鍵
#                        腳本（非僅語法解析），快速攔下 runtime 級回歸。
#   - macos-nightly-full：schedule + workflow_dispatch，continue-on-error 非阻斷，
#                        跑兩子專案完整測試套件在 macos-latest 上的深度回歸網，
#                        避免 macOS runner 偶發性拖垮每次 PR。
#   - 可本地化 step 的本地聚合鏡射：tools/macos_smoke_local.sh（DEF-101-081 補償控制），
#     與本 workflow 對應 step 同步維護（改這邊記得改那邊；由
#     tools/tests/test_smoke_ci_sync.py 機械鎖本注記與 PASS 釘選）。
#
# 本 workflow 額外涵蓋兩個「連在 ubuntu-latest / windows-latest 上都測不到」的路徑：
#   1. `tools/dev_start.py` 的 `cross_same_flavor` 分支——`_now_label()` 在 Linux 上
#      恆為 `"linux"`、在 Windows 上恆為 `"windows"`，只有真正跑在 `sys.platform ==
#      "darwin"` 的 macOS runner 上，`_now_label()` 才會回傳 `"mac"`，讓「上次於 Linux
#      開發、這次切到 mac（同為 posix venv 形狀）」這條強制重建 `.venv` 的分支得以被
#      機械驗證（手法：偽造 `.dev_env_state.json` 的 `developing:"linux"` 後重跑
#      `dev_start.sh`，斷言 `.venv` 被移除重建、`developing` 寫回 `"mac"`）。
#   2. macOS 內建系統 bash（`/bin/bash`，3.2，2007 年凍結版，不支援 `declare -A` /
#      `readarray` / `mapfile` 等 bash 4+ 語法）——根層 `tools/git-hooks/` 三支
#      dispatcher 的 shebang 是 `#!/usr/bin/env bash`，若經由 `git commit`/`git push`
#      觸發，實際執行的 bash 版本取決於 runner PATH 上第一個 `bash`（可能是 Homebrew
#      裝的 5.x，掩蓋 3.2 相容性問題）。本 workflow 額外用 `/bin/bash <script>` 明確
#      指定系統 bash 直接執行，不依賴 PATH 解析，才能真正驗證這三支 dispatcher（已
#      在原始碼註解中聲明「bash 3.2 相容」）在最嚴苛環境下仍正確運作。
#
# R3 四方複審修正（2026-07-14，不採信既有 APPROVE 自稱、全新 session 重新獨立複核）：
#   - Architect 發現 paths 白名單同樣漏根層消費檔（`.claude/**`／
#     `AutoClaude/.claude/**`）與 `AISDLC_SDD/scripts/**`（`router_hook_coverage_lint.py`／
#     `scripts/tests/*.py` 等 `.py` 檔不受既有 `**/*.sh` 涵蓋）→ 補齊，詳見
#     windows-compat-ci.yml 同輪同款修正說明。
#   - QA 發現 paths 雖已涵蓋 `tools/tests/**`，但從未有任何 step 真的執行過這批
#     測試（SIGPIPE 回歸鎖＋dev_start.py 平台邏輯 mock），只在 root-infra-ci.yml
#     的 ubuntu-latest 上跑過 → macos-smoke 新增實際執行該測試目錄的 step。
#   - QA 發現 macos-nightly-alert 至此之前從未於真實環境執行過一次（0 筆
#     schedule/workflow_dispatch run），連 green path 都未驗證，遑論紅色路徑 →
#     補 `simulate_nightly_failure` workflow_dispatch 輸入。
#   - QA 發現本 workflow 對「docker 測試在 macos-latest 官方 runner 上因無 Docker
#     daemon 而恆被 skip」這個已知限制，不像 windows-compat-ci.yml 對其 ci-gate.ps1
#     fallback 覆蓋率限制那樣誠實揭露——已於下方 ci-gate.sh 執行步驟補註記。
#
# R6 四方複審修正（2026-07-15，與 windows-compat-ci.yml 同輪同款發現，見該檔同名
# 段落說明）：本輪新增的 4 支根層生產模組（tools/check_hooks_liveness.py／
# check_defect_log_crossref.py／check_wrapper_thinness.py／_stdio_utf8.py）皆漏列
# paths → 補齊四條；同時修復 test_ci_paths_cover_root_consumers.py 對
# `import X as m` 慣用法的偵測盲區（含遞移一層）。
#
# 獨立複審發現（2026-07-15，P1）：原 workflow 層級 concurrency
# `group: macos-compat-ci-${{ github.ref }}` 把 push 觸發的 macos-smoke 與
# schedule/workflow_dispatch 觸發的 macos-nightly-full（+macos-nightly-alert）
# 綁進同一把 key——push 期間會靜默取消整組深度回歸與告警（取消狀態非 failure，
# macos-nightly-alert 的失敗判斷式偵測不到，紅色路徑失效且無聲）。改為 job 層級
# concurrency：macos-smoke 維持 per-ref + cancel-in-progress:true（取消過時的
# smoke 重跑本身合理）；macos-nightly-full／macos-nightly-alert 改用不含
# github.ref 的固定字串 group + cancel-in-progress:false（比照本 repo
# aisdlc-sdd-fsm-chaos-nightly.yml／autoclaude-mutation-on-change.yml 既有前例），
# 兩者互不干擾。

name: macos-compat-ci

on:
  push:
    branches: [main]
    paths:
      - "AutoClaude/autoclaude/perception/**"
      - "AutoClaude/autoclaude/utils/**"
      - "AutoClaude/pyproject.toml"
      - "AutoClaude/tests/**"
      - "AutoClaude/tools/install_git_hooks.sh"
      - "AutoClaude/.claude/**"
      - "AISDLC_SDD/scripts/**"
      - "AISDLC_SDD/AISDLC_SDD_v0.01/requirements-ci.txt"
      - "tools/bootstrap.sh"
      - "tools/dev_start.sh"
      - "tools/dev_start.py"
      - "tools/tests/**"
      - "tools/run_root_unittests.py"
      # R94：tools/tests/test_context_budget_guard.py 直接讀取本檔內容做驗證，
      # 而該測試由本 workflow 執行（tools/tests/ ↔ macos-compat-ci.yml）；
      # 只改 PRD 不改測試檔時，本 workflow 此前不會被觸發（DEF-101-042 同構）。
      - "docs/01_requirements/AutoClaude_Token_監控與喚醒機制_PRD_v2.1.md"
      # R78：新增 tools/act/（act 自建 runner 映像的 Dockerfile）。
      # tools/tests/test_act_local_runner_image.py 對它做「映像三處一致」斷言，而
      # tools/tests/** 只涵蓋測試那一側——只改 Dockerfile 不改測試時該鎖不會被觸發、
      # 漏檢（DEF-101-874 同構：新增 tools/ 子目錄必須同時補這兩支的 paths）
      - "tools/act/**"
      # R78（同一筆漏做的第二半，由回填包實測揪出）：`.actrc` 與
      # tools/session_resume_planner.py 同樣被根層測試消費
      # （test_act_local_runner_image.py 讀 .actrc 的映像指向；
      #  test_context_budget_guard.py 讀 planner）——只改這兩者時鎖不會跑。
      # 收尾者第一次只補了 tools/act/**，是 test_ci_paths_cover_root_consumers.py
      # 把剩下這兩筆逐字點名出來的。
      - ".actrc"
      - "tools/session_resume_planner.py"
      # R79（同一個形態的第三次：新增判準消費了根層檔卻沒補 paths，由
      # AISDLC_SDD/scripts/tests/test_ci_paths_cover_root_consumers.py 逐字點名）。
      # tools/tests/test_platform_neutral_paths.py 讀 .editorconfig 的 .ps1 區塊
      # （驗它有沒有指名自己的執行者）；tools/tests/test_maturity_criteria_r79.py 讀
      # 成熟度 SSOT 的 M5/M6 列——只改這兩個被讀的檔時，讀它們的鎖不會被觸發。
      - ".editorconfig"
      - "docs/06_quality/CrossPlatform_Maturity_Criteria.md"
      # R79 收輪（同一形態的**第四次**，在單人窗口跑 ci-gate 時才顯形）：
      # tools/tests/test_platform_neutral_paths.py 的 _WORKTREE_EOL_POLICY 本輪改成
      # 從 .gitattributes 現查（不再寫死第二份表）——好處是新增 `*.xxx text eol=crlf`
      # 會自動進射程，代價是**該檔本身成了判準輸入**：只改它時讀它的鎖不會被觸發。
      - ".gitattributes"
      # R14：tools/tests/test_subprocess_encoding_hygiene.py 單檔掃描清單消費此檔
      #（樹外 tracked 零散 .py 納管）——只改該檔時其回歸鎖須跑（DEF-101-042 同構）
      # R10：tools/tests 內含讀取這兩支 workflow 的回歸鎖（test_root_infra_parity
      # / test_pre_push_dispatcher 經 pre-push 消費 aisdlc-sdd-ci paths）——只改
      # 該兩支 yml 時本 workflow 也須重跑該鎖（DEF-101-042 同構）
      - ".github/workflows/root-infra-ci.yml"
      - ".github/workflows/aisdlc-sdd-ci.yml"
      # R15：test_workflow_permission_concurrency_lock.py 新增消費這兩支 workflow
      # 內容（permissions/concurrency 結構斷言）——只改該兩支 yml 時本 workflow
      # 也須重跑該鎖（DEF-101-042 同構，test_ci_paths_cover_root_consumers 實測揪出）
      - ".github/workflows/aisdlc-sdd-arch-fitness.yml"
      - ".github/workflows/autoclaude-ci.yml"
      - "tools/check_script_parity.py"
      - "tools/check_ntfs_paths.py"
      - "tools/check_hooks_liveness.py"
      - "tools/check_defect_log_crossref.py"
      - "tools/check_wrapper_thinness.py"
      - "AutoClaude/tools/check_loc_budget.py"
      - "AutoClaude/.loc_baseline"
      - "tools/_script_scan_surface.py"
      - "tools/archive_defect_log.py"
      - "docs/06_quality/AutoSDD_Defect_Log.md"
      # 🔴 R67 round 2（SA-R67-01 第 4 項「自己再掃一次全 repo」的產物）：歸檔帳本
      # 是**執行期 glob 掃進來的**承重輸入——`tools/check_defect_log_crossref.py::main()`
      # 以 `_DEFECT_LOG.parent.glob("AutoSDD_Defect_Log_archive_*.md")` 量每份歸檔的
      # 大小上限並驗歸檔索引 bullet，而 `tools/tests/test_check_defect_log_crossref.py::
      # TestMain::test_main_against_real_repo_is_clean` 拿的就是**真實 repo** 跑那支
      # main()。主檔上一行早已列入 paths，歸檔卻沒有 ⇒ 同一支鎖的輸入被切成「有觸發的
      # 一半」與「沒觸發的一半」；只改歸檔（例如本輪新增的 _38／_39）時該鎖不會跑。
      # 用 `_*` 萬用字元＝隨輪替自動涵蓋新歸檔，不必每次輪替再補一條（DEF-101-042 同構；
      # 機械鎖見 test_ci_paths_cover_root_consumers.py 的 `_GIT_ENUMERATED_FAMILIES`）。
      - "docs/06_quality/AutoSDD_Defect_Log_archive_*.md"
      - "tools/check_pytest_baseline_sites.py"
      # R60（SD-R60-09）：tools/tests/test_doc_loc_baseline_freshness_r60.py 以
      # `sys.path.insert(0, parents[1])` + `import sync_onboarding_baselines` 消費此根層檔
      # （ONBOARDING §7 表① live 基線格的產生器＋--check SSOT；DEF-101-042 同構，
      # AISDLC_SDD/scripts/tests/test_ci_paths_cover_root_consumers.py 實測揪出）
      - "tools/sync_onboarding_baselines.py"
      # R55：tools/tests/test_check_gha_action_versions.py import 消費此根層檔
      # （DEF-101-042 同構，test_ci_paths_cover_root_consumers 實測揪出）
      - "tools/check_gha_action_versions.py"
      # R69 P3：tools/tests/test_subprocess_encoding_hygiene.py::TestRootToolsLintPolicy
      # 讀取此檔（根層護欄層 ruff 設定 SSOT），只改它時該鎖必須跑。
      - "tools/ruff.toml"
      - "tools/git_hooks_install_common.py"
      - "tools/_stdio_utf8.py"
      # R17：tools/tests/ 內含直接讀取/比對這兩支根層消費檔的回歸鎖
      # （test_platform_utils_dedup.py／test_find_git_bash_parity.py）——只改
      # 該兩檔時本 workflow 也須重跑該鎖（DEF-101-042 同構；.py 無 **/*.py 兜底
      # glob，需顯式列舉；.ps1 已由本檔另補的 tools/lib/Find-GitBash.ps1 涵蓋，
      # windows-compat-ci.yml 側則已被既有 **/*.ps1 覆蓋不需重複列舉）
      - "tools/integration_gate_core.py"
      - "tools/lib/Find-GitBash.ps1"
      # R37：tools/tests/test_windowsapps_guard_cross_consistency.py 直接讀取/
      # dot-source 此檔驗證 bootstrap.ps1／dev_start.ps1 共用同一份 WindowsApps
      # guard 實作（DEF-101-303 結構性收斂）；同款 .ps1 無 **/*.ps1 兜底 glob 缺口
      # （windows-compat-ci.yml 側已被既有 **/*.ps1 覆蓋不需重複列舉）
      - "tools/lib/WindowsAppsGuard.ps1"
      # R17 四方一審 Architect 發現（F1）：test_ci_paths_cover_root_consumers.py
      # 的 import 消費掃描器認不出 test_platform_utils_dedup.py 對 platform_utils
      # 採用的 `sys.path.insert(0, parents[1] / "lib")` 第三種匯入慣例，也認不出
      # 任何測試對 bootstrap_core.py 的引用慣用法，故這兩支本輪核心 SSOT 檔案本身
      # 未被機械鎖偵測為「消費檔」——若未來 commit 只改其中一份，本 workflow 不會
      # 被觸發（DEF-101-042 同款假綠盲區）。手動補列對稱涵蓋。
      - "tools/lib/platform_utils.py"
      - "tools/lib/bash_probe_spec.py"
      # R67：R66 收斂出的第三支 tools/lib/ SSOT（AISDLC_SDD LATEST 版本解析，
      # ADR-XPLAT-002 Phase 2-C/2-D），被 tools/tests/ 下 10 支測試檔 import 消費，
      # 卻是 tools/lib/ 八支檔案中唯一雙邊 paths 皆未列名者——因其全部消費者採用
      # `_REPO_ROOT = ...` + `sys.path.insert(0, str(_REPO_ROOT / "tools" / "lib"))`
      # 變數形態，被 test_ci_paths_cover_root_consumers.py 舊有逐字正則
      # `_SYSPATH_PARENTS_RE` 結構性漏抓，連機械鎖都零訊號（盲區 E；該鎖已於同輪
      # 改用 AST 解析修復，此後同類遺漏會當場轉紅）。DEF-101-042 同構。
      - "tools/lib/sdd_latest.py"
      # R68：本輪新增的第四支 tools/lib/ SSOT（GitHub 排程軌逐軌活性偵測），
      # 由 tools/dev_start.py 與 tools/tests/test_dev_start.py 消費。立案理由＝
      # DEF-101-703：兩支 *-nightly-full 18 天零成功而三道既有哨兵結構上都偵測不到。
      # 由 test_ci_paths_cover_root_consumers.py 當場攔下並要求雙邊補列（該鎖有效）。
      - "tools/lib/ci_liveness.py"
      # R74：本輪新增/新被消費的根層檔——test_ci_paths_cover_root_consumers.py 實測
      # 攔下（DEF-101-042 同構）。CLAUDE.md 由 tools/tests/
      # test_doc_loc_baseline_freshness_r60.py 的鐵律機械物盤點鎖逐行消費；
      # windows_skip_tags.py 是 skip 標籤家族 SSOT；後三支是本輪新建的排程漂移
      # 偵測器與其期望值 SSOT（DEF-101-794）與旗標解析共用層。
      - "CLAUDE.md"
      - "tools/lib/windows_skip_tags.py"
      - "tools/lib/skip_tag_policy.py"
      - "tools/lib/skip_static_scan.py"
      - "tools/lib/skip_source_io.py"
      # 🔴 R83：本輪新增的第 N 支 tools/lib/ SSOT（`schedule_backend.py`＝「這台機器用哪個
      # OS 排程器」的唯一提問點：Windows=schtasks／macOS=launchd／其餘明說做不到）。
      # 為何必須列名：它是**兩個平台的取證憑證差異**的家——Windows 靠 `NextRunTime` 的值
      # （`Get-ScheduledTask` 對不存在的工作回 rc=0＝假綠），macOS 靠 `launchctl print` 的
      # rc（113 vs 0）＋回讀的 trigger descriptor（launchd 從不報 next-run）。只改它而不跑
      # 兩支 compat-CI，等於讓「同一條紀律在兩平台需要相反實作」這件事失去回歸保護。
      - "tools/lib/schedule_backend.py"
      # 🔴 R83：PG skip 消除路徑的兩個載體。它們被 `tools/tests/test_skip_discoverability_r83.py`
      # 消費（該鎖驗「文件與錯誤訊息裡的示範指令不得只在單一平台成立」，而 PG 容器那條
      # 指令正是雙平台各給一份的主要案例）。只改這兩支而不跑 compat-CI，該鎖不會被觸發。
      - "AutoClaude/docker-compose.ci.yml"
      - "AutoClaude/tools/local_ci_gate.py"
      - "tools/lib/skip_runtime_report.py"
      # R80 收尾：本輪新增／新被消費的 tools/lib/ 共用層——由
      # test_ci_paths_cover_root_consumers.py 當場攔下並要求三支 workflow 補列
      # （DEF-101-042 同構；本輪落地時漏登記，收尾實跑 ci-gate 才顯形）。
      # skip_group_policy.py 是 skip 分群天花板 SSOT（既有檔、本輪起被 tools/tests/ 消費）；
      # 其餘四支為本輪新建：治理文件名冊／hook wiring 解析／rc-after-pipe 真值量測／
      # self-help 執行對等性。
      - "tools/lib/skip_group_policy.py"
      - "tools/lib/governance_docs.py"
      - "tools/lib/hook_wiring.py"
      - "tools/lib/rc_after_pipe_real.py"
      - "tools/lib/self_help_exec_parity.py"
      # R81 收尾：本輪六支新建 tools/lib/ 共用層，同樣由
      # test_ci_paths_cover_root_consumers.py 當場攔下（與 R80 同一形態、同一支判準）：
      # git_paths.py＝git quotepath SSOT；quota_meter.py＝額度水位取數；
      # quota_escalation.py＝撞線後的叫人與扇出快照；script_interface_parity.py＝
      # .sh／.ps1 介面等價判準；quota_limits.py＝額度撞線判讀（主題自 hook 外移）；
      # quota_ledger.py＝派發帳（一次派發＝一次目錄項）。
