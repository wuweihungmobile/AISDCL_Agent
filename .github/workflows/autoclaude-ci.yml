name: AutoClaude CI

# monorepo 根層接線（2026-07-10）：本 workflow 自 AutoClaude/.github/workflows/ci.yml
# 遷入根層 .github/workflows/（GitHub Actions 只讀 repo 根層）。所有 run step 以
# defaults.run.working-directory 定錨 AutoClaude/；uses step（checkout / artifact）
# 的路徑一律以 repo 根視角書寫。push/PR 加 AutoClaude 前綴 paths 過濾，避免
# AISDLC_SDD 側變更誤觸發；schedule / workflow_dispatch 不受 paths 影響。
on:
  push:
    branches: [main]
    paths:
      - "AutoClaude/**"
      - ".github/workflows/autoclaude-ci.yml"
      # 跨專案 bridge 測試盲區補洞（2026-07-11）：tests/integration/test_sdd_bridge/
      # 實際消費 AISDLC_SDD 凍結版檔案（test_topology_bridge_e2e.py subprocess 跑
      # v0.05 tools/fsm_runtime；test_rollback_compat.py 跑 v0.01/v0.02 state_loader）。
      # 這些版本目錄變更（依紀律不應發生，但 CI 不賭紀律）必須也觸發 bridge 測試。
      - "AISDLC_SDD/AISDLC_SDD_v0.01/**"
      - "AISDLC_SDD/AISDLC_SDD_v0.02/**"
      - "AISDLC_SDD/AISDLC_SDD_v0.05/**"
  pull_request:
    branches: [main]
    paths:
      - "AutoClaude/**"
      - ".github/workflows/autoclaude-ci.yml"
      # 同 push paths：bridge 測試消費的 AISDLC_SDD 凍結版（v0.01/v0.02/v0.05）
      - "AISDLC_SDD/AISDLC_SDD_v0.01/**"
      - "AISDLC_SDD/AISDLC_SDD_v0.02/**"
      - "AISDLC_SDD/AISDLC_SDD_v0.05/**"
  # SD_07 W2 T2-6（PM #2）：真實 PG e2e（實際 cron 見下方 schedule 區塊）
  # SD_09 W0 M-01：mutation cron 拆 3 job — TG active（cron 見下）；GS/Coord dormant，
  #   **目前沒有任何 cron**，只能 workflow_dispatch 手動觸發（待 W1/W2 才掛排程）
  # ADR-SD09-002 §2.3：單一時間 1 個 active pilot module
  # 🔴 本輪 R77-20 訂正：本段與下面兩支 dormant job 的**顯示名**原本各自寫死了一個
  #   時刻（04:00／05:00 UTC），而 schedule 區塊裡對應的兩條 cron 是**註解掉的**
  #   ⇒ 讀 GitHub UI 的人會以為它們每週各跑一次，實際上可觀測歷史內執行次數為 0
  #   （全歷史零筆 workflow_dispatch，排程 run 上它們一律 skipped、steps=0）。
  #   時刻宣稱一律以 schedule 區塊為準；沒有 active cron 的 job 名不得寫時刻。
  #   機械物＝tools/tests/test_workflow_schedule_sync.py::TestJobNameScheduleClaims。
  # R14 CI-2 額度裁決（2026-07-20，使用者核可）：pg-e2e/perf/mutation 由每日降為每週一，
  # 對齊 macos/windows-compat weekly 的「週一深度回歸窗口」。每日兜底＝本地 nightly，
  # 且深度三軌（pg-e2e/perf/mutation）僅由 Windows 7-stage（run_local_nightly.ps1 +
  # schtasks）承擔；mac 側為 4-stage 薄聚合器（run_local_nightly.sh + launchd，R11 D1
  # 拍板不載深度軌），不覆蓋此三軌（R14 SCAN-CI-1 精確化）。job id/name 依 R11 compat
  # 降頻先例保留 *-nightly 不改（文件引用面大；語意以本註記與 cron 為準）。
  # R16 SCAN-C-4：兩條 cron 原落在整點/半點（0 2 * * 1／0 3 * * 1），且分別與
  # aisdlc-sdd-fsm-chaos-nightly（每日 02:00→02:03 UTC）／
  # aisdlc-sdd-artifact-cleanup（每日 03:00→03:03 UTC）精準相撞同一分鐘；
  # 錯開至非整點/半點分鐘數，且維持「每日先跑、每週接著跑」順序不變。
  schedule:
    - cron: "7 2 * * 1"   # pg-e2e-nightly + perf-baseline（每週一 02:07 UTC，排在 fsm-chaos-nightly 02:03 之後）
    - cron: "7 3 * * 1"   # mutation-test-tokenguard-nightly（active pilot，每週一 03:07 UTC，排在 artifact-cleanup 03:03 之後）
    # - cron: "0 4 * * 1" # mutation-test-goalsynthesis-nightly（dormant，待 W1 啟用）
    # - cron: "0 5 * * 1" # mutation-test-coordinator-nightly（dormant，待 W2 啟用）
  workflow_dispatch:

# R13 CI-7：顯式最小權限（先前全檔未宣告 permissions → 各 job 繼承 repo 預設，
# 可能為 write-all）。全檔僅 checkout / setup-python / pytest / alembic /
# upload-artifact（artifact 上傳走 ACTIONS_RUNTIME_TOKEN，不受本區塊限制），
# 無 issue comment / label / push 等 GITHUB_TOKEN 寫行為 → contents: read 即足。
permissions:
  contents: read

# R15 SCAN-C-5：本 workflow 先前是唯一無 concurrency 的 push 閘——連續 push 疊跑
# 4 個 push 閘 job（test/claude-md-budget/equivalence/pg-contract）全跑到底、純
# 額度洩漏（R14 CI-2 額度裁決背景下更值得堵）。group 納入 event_name/event.schedule，
# 使兩條 nightly cron（7 2/7 3 * * 1）各自成組、互不取消（僅同 ref 的 push 組互相
# 取消，不影響 push 組），push 連發時僅同 ref 的舊 push run 被取消。
concurrency:
  group: autoclaude-ci-${{ github.ref }}-${{ github.event_name }}-${{ github.event.schedule }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: AutoClaude

jobs:
  test:
    name: Tests + LOC Budget
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # R14 SCAN-CI-6：push 閘四 job（test/claude-md-budget/equivalence/pg-contract）不隨
    # 每週一兩個 cron 重跑（先前每次 schedule 都完整重跑＝純額度洩漏；額度緊縮期裁決砍除，
    # 排程窗口只跑 *-nightly 三 job；push/PR/dispatch 行為不變）。
    if: github.event_name != 'schedule'

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          # monorepo：repo 根無 requirements.txt（setup-python pip cache 預設 glob 會
          # match 不到而報錯）→ 顯式指向子專案 pyproject.toml（repo 根視角）
          cache-dependency-path: AutoClaude/pyproject.toml

      - name: Install dependencies
        # R76（R76-14）：加 `sdk` extra。`tests/infra/adapters/test_sdk_executor_adapter.py`
        # 有 3 處 `pytest.importorskip("claude_agent_sdk")`，而 `sdk` extra **在全部 11 支
        # workflow 裡從來沒有被安裝過一次** ⇒ 那 3 支斷言（真 `PermissionResult` 型別的
        # can_use_tool 決策路徑）在兩個平台都零覆蓋。生產碼 `sdk_executor_adapter.py` 對它
        # 是 lazy import，裝了不改變預設後端（仍為 pty）。
        # 先量再改（Windows 11 真機、全新 venv、`pytest tests/ -q -rs` 全樹前後對照，
        # 見 docs/06_quality/Skipped_Test_Inventory_R76.md §4.5）：
        #   `pip install -e ".[dev]"`      → 3902 passed, 224 skipped, 86.98s, rc=0
        #   `pip install -e ".[dev,sdk]"`  → 3905 passed, 221 skipped, 88.64s, rc=0
        #   ⇒ 3 支由 skip 轉 passed、其餘 3902 支零變動、耗時 +1.66s。
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,sdk]"

      - name: Run pytest
        run: |
          # `-rs`：印出每支 skip 的理由（R59 ARCH-R59-NB1）。DEF-101-510 的原則是
          # 「因平台/環境而失去的覆蓋不得只併成一個數字」，而本 job 是 3740 支那一套的
          # push 主閘門——skip 理由只存在於 CI log，不印就永遠查不到。
          python -m pytest tests/ -q -rs --tb=short

      - name: Check LOC budget
        run: |
          python tools/check_loc_budget.py

      - name: Check import architecture (R-3 M5)
        run: |
          pip install -e ".[lint]" -q
          PYTHONUTF8=1 lint-imports

  # SD_08 W0 T0-E3（ADR-SD08-001 §4）：CLAUDE.md ≤ 400 行 + Snapshot freshness
  claude-md-budget:
    name: CLAUDE.md Budget + Snapshot Freshness
    runs-on: ubuntu-latest
    timeout-minutes: 3
    # R14 SCAN-CI-6：同 test job——schedule 事件不重跑 push 閘。
    if: github.event_name != 'schedule'

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0  # 需要 git log 拿 Snapshot 區段最後變更日

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Check CLAUDE.md <= 400 lines
        run: |
          LINES=$(wc -l < CLAUDE.md)
          if [ "$LINES" -gt 400 ]; then
            echo "::error::CLAUDE.md=$LINES lines > 400 (ADR-SD08-001)"
            exit 1
          fi
          echo "::notice::CLAUDE.md=$LINES lines <= 400 OK"

      - name: Check Snapshot freshness (<= 7 days)
        run: |
          LAST_SYNC=$(git log -1 --format="%at" -- CLAUDE.md | head -1)
          NOW=$(date +%s)
          DIFF_DAYS=$(( (NOW - LAST_SYNC) / 86400 ))
          if [ "$DIFF_DAYS" -gt 7 ]; then
            echo "::warning::Architecture Snapshot 已 $DIFF_DAYS 天未同步（>7 天告警）；請執行 python tools/snapshot_sync.py"
          fi

      - name: Verify snapshot_sync.py reproducible (dry-run)
        run: |
          python tools/snapshot_sync.py --check

      - name: Run check_loc_budget.py (含 SPECIAL_FILES)
        run: |
          python tools/check_loc_budget.py

  equivalence:
    name: Equivalence Snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # R14 SCAN-CI-6：同 test job——schedule 事件不重跑 push 閘。
    if: github.event_name != 'schedule'
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          # monorepo：repo 根無 requirements.txt（setup-python pip cache 預設 glob 會
          # match 不到而報錯）→ 顯式指向子專案 pyproject.toml（repo 根視角）
          cache-dependency-path: AutoClaude/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run equivalence snapshot tests (verbose)
        run: |
          python -m pytest tests/equivalence/ -v --tb=short

  # P1 #2：PG 契約測（pgvector/pgvector:pg17 service container）
  # SD_09 R56 P0-1d 揪修：原 postgres:17 無 pgvector extension，但 `alembic upgrade head`
  # 含 0007/0008 pgvector migration（CREATE EXTENSION vector）→ NotSupportedError
  # `extension "vector" is not available`。改用 pgvector 鏡像對齊 pg-e2e-nightly。
  pg-contract:
    name: PG Contract Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # R14 SCAN-CI-6：同 test job——schedule 事件不重跑 push 閘。
    if: github.event_name != 'schedule'
    needs: test
    # DEF-101-051（SD_10 PG-track）已補完三層 goal_task_id 接線 + alembic 0017 run_kind
    # 判別欄（CHECK 改為「僅三層 run 需 goal」，消除 playbook_runs 時間炸彈；playbook_versions
    # 平行炸彈另見 DEF-101-054），pg_state_repository contract 全綠 → 本 job 自即日轉「硬閘」
    # （移除 continue-on-error）。硬閘僅顯式覆蓋此檔；migration 語意（T8/T10）由本機/nightly 驗。
    # 歷史（R56）：曾因 P0-1f 連線跨 loop（NullPool 已修）+ goal_task_id 半成品時間炸彈
    # 而長期非阻塞。詳見 docs/06_quality/AutoSDD_Defect_Log.md DEF-101-051。

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: autoclaude
          POSTGRES_PASSWORD: autoclaude
          POSTGRES_DB: autoclaude
        options: >-
          --health-cmd "pg_isready -U autoclaude -d autoclaude"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

    env:
      AUTOCLAUDE_TEST_PG_DSN: "postgresql+asyncpg://autoclaude:autoclaude@localhost:5432/autoclaude"
      AUTOCLAUDE_DB_DSN: "postgresql+asyncpg://autoclaude:autoclaude@localhost:5432/autoclaude"
      AUTOCLAUDE_ALLOW_INSECURE_DB: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          # monorepo：repo 根無 requirements.txt（setup-python pip cache 預設 glob 會
          # match 不到而報錯）→ 顯式指向子專案 pyproject.toml（repo 根視角）
          cache-dependency-path: AutoClaude/pyproject.toml

      - name: Install postgres dependencies
        # R76（R76-14）：加 `pgvector` extra——`tests/contract/test_pg_existing_schema_lock.py`
        # 的 63 支「PG 既有 9 表 DDL 漂移鎖」需要它才會真的執行（缺它整檔 skip）。
        #
        # 🔴 `mako<1.4`：Mako 1.4.0 的 wheel 誤打包了一個**頂層** `tools/` 套件
        # （RECORD 逐字列出 `tools/__init__.py`／`tools/toxnox.py`／`tools/warn_tox.py`），
        # 而 `AutoClaude/tools/` 沒有 `__init__.py`（隱式 namespace package）。Python 的
        # 匯入規則是「regular package 一律勝過先掃到的 namespace portion」⇒ site-packages
        # 的 mako `tools` 會把 `AutoClaude/tools` 整個遮蔽，**與 sys.path 順序無關**。
        # Mako 是 alembic 的相依，所以只有裝了 `[postgres]` 的 job 會中招；本 job 先前
        # 只跑一支不 import `tools.*` 的檔案，故從未顯形。R76 本機實測（Windows 11 +
        # 同一組 extras）：不釘版 ⇒ `tests/contract/` 5 支模組 collection ImportError
        # (`No module named 'tools.check_loc_budget'` 等) ＋ `test_rollback_compat.py`
        # 的子行程 `No module named 'tools.fsm_runtime'`，rc=2/1；釘 mako 1.3.12 ⇒ 全消、
        # `tools` 正確解析到 `AutoClaude/tools`、`alembic upgrade head` 仍 rc=0。
        # 根治位置是 `AutoClaude/pyproject.toml` 的 postgres extra（PKG-C 無該檔授權，
        # 已列交棒 R77）；在那之前這裡釘版，讓本 job 的擴大射程不是建在流沙上。
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,postgres,pgvector]" "mako<1.4"

      - name: Run alembic migrations
        # DEF-101-049：持久化守門——env.py 交易語意缺陷曾使 upgrade「exit 0 但整包
        # rollback」（零輸出零資料表），下游測試 UndefinedTable 難歸因。current 必須
        # 已蓋 head，否則本步即紅、根因就地現形。
        run: |
          alembic upgrade head
          alembic current | grep -q "(head)" || { echo "❌ migration 未持久化（alembic current 未達 head）— env.py 交易語意回歸？"; exit 1; }

      - name: Run PG-gated contract + integration + infra tests
        # 🔴 R76（R76-14）：本步先前只跑 `tests/contract/test_pg_state_repository_contract.py`
        # 一支檔。R76 盤點實測：AutoClaude 224 支 skip 裡有 192 支（86%）在兩個平台與全部
        # 11 支 workflow 都沒有任何通道跑到，而本 job 早就備妥了救回它們所需的**整套**
        # 條件（service container ＋ postgres extras ＋ DSN env ＋ `alembic upgrade head`）
        # ——缺的只是把最後一行的射程從一支檔擴成兩個目錄。其中 alembic 0007~0012 的
        # migration 契約、三層 schema 契約、PG 既有 9 表 DDL 漂移鎖，都是**從未被執行過
        # 一次的斷言**。
        #
        # `tests/infra/` 一併納入的理由：另有 7 支同因（3 支模組級
        # `importorskip("sqlalchemy")` ＋ 4 支 `test_storage_factory.py` DSN 解析）住在那裡，
        # 而它們與本 job 的 extras 是同一個開關；主 `test` job 只裝 `[dev]` 永遠救不到。
        #
        # 先量再改（Windows 11 真機、同一組 extras、pgvector/pgvector:pg18 容器、
        # `alembic upgrade head` 後實測，指令與 rc 見
        # docs/06_quality/Skipped_Test_Inventory_R76.md §4.4）：
        #   改前（repo .venv，無 PG 相依、無 DSN）：1052 passed, 195 skipped, 15.79s, rc=0
        #   改後（本 recipe）                    ：1241 passed,  40 skipped, 21.66s, rc=0
        #   ⇒ **155 支由 skip 轉 passed**，pytest 耗時 +5.87s。
        #   （passed 淨增 189 > 155：3 支模組級 importorskip 解除後，其模組內原本連
        #     collect 都沒被算到的 34 支測試一併現身——ONBOARDING §7 記載的那個差額。）
        # 剩下的 40 支不是本步能救的，已逐支歸因（同檔 §4.4.2）：29 支無條件
        # `pytest.mark.skip`（AC matrix scaffolding 技術債）／2 支 absent-present 互斥對
        # （結構上必有一支 skip，健康）／2 支需 W3 G3 staging／3 支 `pg_real` 由
        # `pg-e2e-nightly` 覆蓋／3 支 `claude_agent_sdk` 由主 `test` job 的 sdk extra 覆蓋／
        # 1 支需 symlink 權限（ubuntu runner 原生有）。**刻意不把它們硬塞進來**。
        #
        # 🔴 本輪 R77-36：上面那段「155 支由 skip 轉 passed」是一次性的量測，而**整個
        # job 對「這 155 支到底有沒有真的跑」零斷言**——唯一的守門是上一步的
        # `alembic current | grep -q "(head)"`，它守的是 migration 有沒有持久化，不是
        # 測試有沒有執行。當回合注入實測（把四個 env 拿掉，等價於 env: 區塊被刪／
        # service container 改名／DSN 打錯）：`1150 passed, 131 skipped`、**rc 仍為 0**。
        # ⇒ 這批救回來的覆蓋可以整批靜默停跑而 job 照樣全綠，而且比原本更糟：原本是
        # 「沒人跑過」（盤點抓得到），變成「跑過一次、之後靜默停跑」（盤點會說已補）。
        # 故加一段 census 斷言。兩個門檻的角色**刻意不同**，不要混為一談：
        #   · MAX_SKIPPED 是**鑑別器**：健康 40 vs 環境掉了 131，取 80（健康值的兩倍）
        #     ——留足平台差異的餘裕（Windows-only 測試在 ubuntu 上會多 skip 幾支），
        #     同時距離 131 仍有 51 的距離。
        #   · MIN_PASSED 是**防塌陷地板**，不是 DSN 鑑別器（1100 < 1150，它抓不到那個
        #     形態，這裡明說以免下一個人誤讀）。它抓的是「目錄改名／collection 壞掉／
        #     大半測試消失」。健康值 1241。
        # ⚠️ 誠實劃界：兩組數字都是**本機**量測（R76 的 1241/40、本輪的 1150/131）。
        # GitHub Actions 帳務停擺中 ⇒ 本段**零雲端執行驗證**，只有 YAML 靜態驗證與
        # 本機 bash -n。ubuntu runner 的偏移預期是個位數，若首次雲端執行落在門檻外，
        # 正確處置是**用那次的實測值重釘門檻並記錄**，不是把門檻放寬到沒有鑑別力。
        env:
          PG_CONTRACT_MIN_PASSED: "1100"
          PG_CONTRACT_MAX_SKIPPED: "80"
        # run 本體刻意全 ASCII：runner 把它寫成暫存腳本，中文訊息在部分 shell/codepage
        # 組合下會壞掉（同本 repo 對 `shell: powershell` 步驟立下的紀律）。中文 WHY 全在
        # 上方註解裡——註解不會被執行。
        run: |
          python -m pytest tests/contract/ tests/integration/ tests/infra/ -q -rs --tb=short \
            | tee pg-contract-pytest.log
          python - <<'PY'
          import os, pathlib, re, sys

          log = pathlib.Path("pg-contract-pytest.log").read_text(
              encoding="utf-8", errors="replace")
          tail = "\n".join(log.strip().splitlines()[-3:])

          def count(word: str) -> int:
              hits = re.findall(r"(\d+) " + word, tail)
              return int(hits[-1]) if hits else 0

          passed, skipped = count("passed"), count("skipped")
          floor = int(os.environ["PG_CONTRACT_MIN_PASSED"])
          ceiling = int(os.environ["PG_CONTRACT_MAX_SKIPPED"])
          print(f"PG-CONTRACT-CENSUS passed={passed} skipped={skipped} "
                f"floor={floor} ceiling={ceiling}")

          # accumulate-then-report: report BOTH problems, never stop at the first one.
          problems = []
          if passed < floor:
              problems.append(
                  f"::error::PG-CONTRACT-CENSUS passed={passed} < floor={floor} -- "
                  "collection collapsed (renamed dir / import error / tests removed). "
                  "This floor is an anti-collapse guard, not the DSN discriminator.")
          if skipped > ceiling:
              problems.append(
                  f"::error::PG-CONTRACT-CENSUS skipped={skipped} > ceiling={ceiling} -- "
                  "the PG-gated tests this job exists to run are being skipped. Check the "
                  "job env: block (AUTOCLAUDE_TEST_PG_DSN / AUTOCLAUDE_DB_DSN / "
                  "AUTOCLAUDE_ALLOW_INSECURE_DB), the postgres service container name, "
                  "and that the postgres+pgvector extras really installed. A green rc "
                  "here without this check would mean 155 assertions silently stopped "
                  "running (measured: healthy 1241/40, env-less 1150/131, rc=0 both).")
          for line in problems:
              print(line)
          if problems:
              print("::error::PG-CONTRACT-CENSUS failed "
                    f"({len(problems)} of 2 checks). Skip reasons are in the -rs section "
                    "above; do not raise these thresholds to make it green.")
              sys.exit(1)
          PY

  # SD_07 W2 T2-6（PM #2）：真實 PG e2e（pgvector + recall@10 + p95 latency）
  # 觸發：nightly schedule + 手動 workflow_dispatch
  pg-e2e-nightly:
    name: PG E2E (pgvector recall + p95) - nightly
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # DEF-01-004（improving_02 W2）：綁定 pg-e2e 自身 02:07 UTC cron（R16 SCAN-C-4
    # 由 02:00 錯開），避免 03:07 mutation cron 也觸發致每晚雙跑（對齊 mutation
    # `7 3` / perf-baseline `7 2` 既有過濾）。
    # R14 CI-2：cron 降週頻後 if 比對字串同步改（漏改會使本 job 永不觸發）。
    if: (github.event_name == 'schedule' && github.event.schedule == '7 2 * * 1') || github.event_name == 'workflow_dispatch'
    # SD_09 W0 Z1 解除（2026-05-20，B-09）：X1/Y1/B-01/B-07/B-08 全綠後移除 continue-on-error: true

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: autoclaude
          POSTGRES_PASSWORD: autoclaude
          POSTGRES_DB: autoclaude
        options: >-
          --health-cmd "pg_isready -U autoclaude -d autoclaude"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

    env:
      AUTOCLAUDE_TEST_PG_DSN: "postgresql+asyncpg://autoclaude:autoclaude@localhost:5432/autoclaude"
      AUTOCLAUDE_DB_DSN: "postgresql+asyncpg://autoclaude:autoclaude@localhost:5432/autoclaude"
      AUTOCLAUDE_ALLOW_INSECURE_DB: "1"
      # SD_07 PM #2：opt-in flag — 啟用 tests/integration/test_pgvector_real_recall.py
      SD07_REAL_PG_E2E_ENABLED: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          # monorepo：repo 根無 requirements.txt（setup-python pip cache 預設 glob 會
          # match 不到而報錯）→ 顯式指向子專案 pyproject.toml（repo 根視角）
          cache-dependency-path: AutoClaude/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,postgres]"

      - name: Run alembic migrations (含 0007/0008 pgvector + halfvec)
        # DEF-101-049：持久化守門（同 pg-contract job 之守門，防 upgrade 靜默 rollback）
        run: |
          alembic upgrade head
          alembic current | grep -q "(head)" || { echo "❌ migration 未持久化（alembic current 未達 head）— env.py 交易語意回歸？"; exit 1; }

      # DEF-101-050：X1 seed 接線——recall 測試前置明載「seed_kb.py 已 seed 100 列」，
      # 但本 job 自 monorepo 匯入起即缺 seed 步驟 → knowledge_entries 空表、recall 恆 0.000
      # （fixture 檔在庫故測試不 skip）。seed 同時重生 queries/ground-truth fixture 於
      # runner 工作區，與當次 seed 資料嚴格配對。
      - name: Seed KB corpus + fixtures (X1, tools/seed_kb.py)
        run: |
          python tools/seed_kb.py --mock-pg-seed --pg-dsn "$AUTOCLAUDE_TEST_PG_DSN"

      - name: Run SD_07 W2 真實 PG e2e（pg_real marker）+ junit XML
        id: pgvector_run
        # SD_09 W0 Z1 解除（2026-05-20，B-09）：X1/Y1/B-01/B-07/B-08 全綠後移除 continue-on-error: true
        run: |
          python -m pytest tests/integration/test_pgvector_real_recall.py \
            -v --tb=short -m pg_real \
            --junitxml=.ac4_junit.xml

      # SD_08 W2 T2-C2：AC4 nightly metric collector（累計 14 天）
      - name: Collect AC4 metrics (SD_08 W2 T2-C2)
        if: always()
        run: |
          python tools/ac4_nightly_collector.py \
            --junit-xml .ac4_junit.xml \
            --history .ac4_history.jsonl

      # SD_08 W2 T2-C3：AC4 14 天進度檢查（黃/紅線告警，不阻塞 nightly）
      - name: Check AC4 progress (SD_08 W2 T2-C3)
        if: always()
        # SD_09 W0 Z1 解除（2026-05-20，B-09）：X1/Y1/B-01/B-07/B-08 全綠後移除 continue-on-error: true
        run: |
          python tools/ac4_progress_check.py --history .ac4_history.jsonl --json

      - name: Upload AC4 history artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ac4-history-${{ github.run_id }}
          path: |
            AutoClaude/.ac4_history.jsonl
            AutoClaude/.ac4_junit.xml
          retention-days: 30

  # SD_09 W0 M-01：mutation cron 拆 3 job（ADR-SD09-002 §2.3 落地）
  # 設計原則：單一時間 1 個 active pilot module，避免並行超時 + 互相干擾
  # 排程：只有 TG 有 active cron（見上方 schedule 區塊）；GS／Coord 為 dormant，
  #      無 cron、僅 workflow_dispatch（時刻宣稱一律以 schedule 區塊為準，見檔頭 R77-20）
  # 對應前身 mutation-test-nightly（SD_07 W5 T5-6 / SD_08 W3 T3-D2 pilot）
  #
  # === Job 1：TokenGuardPlugin（active pilot）===
  # ADR-SD09-002 §2.3：單一時間 1 個 active pilot module
  # 連續 7 次達 ≥ 70%（目標 75%，-5% 容忍）才鎖定 baseline
  mutation-test-tokenguard-nightly:
    name: Mutation Test - TokenGuardPlugin (active pilot) - 03:07 UTC
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # 觸發：每週一 03:07 UTC（R14 CI-2 降頻；R16 SCAN-C-4 由 03:00 錯開避開整點）
    # + 手動 workflow_dispatch
    if: (github.event_name == 'schedule' && github.event.schedule == '7 3 * * 1') || github.event_name == 'workflow_dispatch'
    # SD_09 W0 Z1 解除（2026-05-20，B-09）：X1/Y1/B-01/B-07/B-08 全綠後移除 continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          # monorepo：repo 根無 requirements.txt（setup-python pip cache 預設 glob 會
          # match 不到而報錯）→ 顯式指向子專案 pyproject.toml（repo 根視角）
          cache-dependency-path: AutoClaude/pyproject.toml

      - name: Install dependencies + mutmut
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install mutmut

      # ADR-SD09-002 §2.3：單一時間 1 個 active pilot module
      # 必須：--paths-to-mutate=autoclaude/plugins/token_guard 縮限
      # 必須：--tests-dir=tests/plugins/token_guard 對位測試集
      # 必須：-p no:xdist 鎖序列避免 hash 衝突
      - name: Run mutation test - TokenGuardPlugin SSOT (active pilot)
        run: |
          mutmut run --paths-to-mutate=autoclaude/plugins/token_guard \
                     --tests-dir=tests/plugins/token_guard \
                     --no-progress \
                     -p no:xdist || true  # mutmut 工具特性：survived mutation 退出碼 != 0；保留 || true 容忍
          mutmut results | tee mutation_token_guard.log

      # 連續 7 次達 ≥ 70%（目標 75% -5% 容忍）才鎖定 baseline
      # ADR-SD09-011（improving_101）：unique-sha 鎖定累積主通道已改為 autoclaude-mutation-on-change.yml
      # （token_guard 源碼變動觸發，解除日曆綁定）；本 nightly step 角色轉為「kill_rate 漂移監控
      # + flaky 偵測」。改 sha 去重後 idle 重跑同 sha 只更新最新、不稀釋 tail，故 nightly 保留無害。
      - name: Lock baseline if 7 consecutive runs >= target
        if: always()
        # SD_09 W0 Z1 解除（2026-05-20，B-09）：X1/Y1/B-01/B-07/B-08 全綠後移除 continue-on-error: true
        run: |
          python tools/mutation_baseline_lock.py token_guard \
            --log mutation_token_guard.log \
            --history .mutation_history.jsonl \
            --baseline .mutation_baseline.toml

      # survived diff 分類 + 補測 backlog 自動產出
      - name: Analyze survived mutations (補測 backlog)
        if: always()
        # SD_09 W0 Z1 解除（2026-05-20，B-09）：X1/Y1/B-01/B-07/B-08 全綠後移除 continue-on-error: true
        run: |
          python tools/mutation_analysis.py token_guard \
            --log mutation_token_guard.log \
            --output mutation_backlog_token_guard.md

      - name: Upload mutation reports + baseline + history
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: mutation-reports-token-guard-${{ github.run_id }}
          path: |
            AutoClaude/mutation_token_guard.log
            AutoClaude/mutation_backlog_token_guard.md
            AutoClaude/.mutation_history.jsonl
            AutoClaude/.mutation_baseline.toml
          retention-days: 30

  # === Job 2：GoalSynthesisPlugin（dormant，待 W1 啟用）===
