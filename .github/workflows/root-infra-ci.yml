# 根層基建 CI（四方複審 B4，2026-07-10；防禦縱深補洞 2026-07-11）：workflows / hooks /
# 工具腳本上移 monorepo 根層後，根層 tools/（bootstrap / integration_gate / git-hooks
# dispatcher）與 .gitattributes、.editorconfig、dependabot 等基建原本零 CI 覆蓋——壞掉
# 只會在開發者本機爆。本 workflow 做十道輕量守門（僅 actions/checkout，不引其他外部
# action，避免供應鏈風險）：
#   1. bash -n       — 根層 tools/git-hooks/ 與 tools/*.sh（遞迴涵蓋子目錄）語法檢查
#   2. pwsh parse    — active .ps1（根層 tools/ + AutoClaude/tools/ + AISDLC_SDD/scripts/
#                      + AISDLC_SDD LATEST 版；凍結版 v0.01~v0.(N-1) 有已知缺陷且依紀律
#                      不回改 → 排除）以 Parser::ParseFile 解析，parse error 即 fail；
#                      同 step 加 UTF-8 BOM 守門 — 含非 ASCII 的 active .ps1 必須有
#                      EF BB BF（.editorconfig utf-8-bom 政策的 CI 機械複核；本機僅
#                      Claude Code hook check_ps1_encoding.py 補 BOM，人工編輯器 /
#                      GitHub web 可繞過 → zh-TW PS5.1 以 CP950 誤讀亂碼/破壞 parser）
#   3. EOL 守門（.sh）— git ls-files --eol：tools/ 下 .sh/.bash 與無副檔名 git hooks 不得
#                      CRLF/mixed（取證紀律 #8；比照 AutoClaude pre-commit 檢法，作為
#                      根層 .gitattributes `eol=lf` 政策的機械複核）
#   4. EOL 守門（.ps1）— 反方向補洞：全庫 *.ps1 工作樹須為 CRLF（.gitattributes
#                      `eol=crlf`）；只查 `w/`（index 恆 lf 正規化非訊號）。Mac/Windows
#                      相容性優化四方複審發現 tools/dev_start.ps1 工作樹曾違規且
#                      git status/diff 均不可見，第 3 道既有守門完全不涵蓋 .ps1 方向
#                      （2026-07-13 補洞）
#   5. NTFS 檔名閘   — tools/check_ntfs_paths.py 掃 git ls-files 全量（本機 pre-commit
#                      A3 閘的 CI 對等；--no-verify / GitHub web / 未裝 hooks 可繞過本機閘）
#   6. 腳本對等閘    — tools/check_script_parity.py：四對 .sh/.ps1 的 gate/step 標籤
#                      清單一致（R9 起抽取兼容單/雙引號＋各對數量下限釘選）+ pytest
#                      釘選三處（pyproject.toml / v0.01 與 LATEST requirements-ci.txt）同版
#   7. py_compile    — 根層 tools/ 下所有 *.py（遞迴涵蓋子目錄；dev_start / check_* 等
#                      基建工具）語法檢查；這些 .py 過去僅語法檢查、零單元測試覆蓋，
#                      邏輯回歸可經 --no-verify / GitHub web 靜默入庫 → 第 8 道補上
#                      （dev_start 四方審查 P2，2026-07-12；子目錄遞迴盲區修復
#                      2026-07-13）
#   8. unittest      — tools/tests/ 下 dev_start.py 純邏輯函式與已修復迴歸點的單元測試
#                      （純 stdlib unittest，零依賴安裝，維持本 job 輕量原則；四方複審
#                      2026-07-13 REJECT 原因之一即「核心邏輯複雜度已超過 py_compile
#                      能守住的範圍」，本道步驟收斂該落差。R10 QA-2：改走
#                      tools/run_root_unittests.py——裸 discover 對 0 個測試回 rc=0，
#                      數量下限釘選堵住「測試大規模靜默消失仍全綠」fail-open）
#   9. 缺陷帳本跨文件狀態一致閘 — tools/check_defect_log_crossref.py：機械比對
#                      `ONBOARDING.md` 內對 DEF-\d+-\d+ 的狀態宣稱（open/fixed/wontfix/…）
#                      與 `docs/06_quality/AutoSDD_Defect_Log.md` 該 ID 最新狀態是否矛盾
#                      （DEF-101-066 這類「改帳本忘同步姊妹文件」曾真實發生一次，
#                      本道步驟即該問題類別的治本機械守護，DEF-101-068(e) 落地）
#   10. dev_start wrapper 薄殼守門 — tools/check_wrapper_thinness.py：獨立具名 step
#                      執行（先前唯一執行路徑是 tools/tests/test_check_wrapper_thinness.py
#                      裡一個不帶 mock 的測試方法，靠第 8 道 unittest 間接跑到，不像同批
#                      其他 check_*.py 有具名 step 可一眼看出有沒有被 CI 涵蓋；未來若該
#                      測試被改用 mock/fixture 或誤判精簡掉，這道機械回歸防護會無聲失效
#                      且無第二訊號可查覺——四方複審 P2 finding 修復）
#
# 注：上列編號為清單序，與 job 內實際執行順序無關（如第 7 道 py_compile 實體 step
# 緊接第 1 道 bash -n 之後執行）——R11 文件掃描[關注-3]澄清。
#
# 觸發不設 paths 過濾（2026-07-11 起）：NTFS 檔名閘守的是「任何路徑」新增的
# 敵意檔名（一旦入庫所有 Windows checkout 直接壞），paths 白名單必留盲區；本 job 全部
# 步驟輕量（< 1 分鐘、零依賴安裝），全變更觸發成本可忽略。

name: root-infra-ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: root-infra-ci-${{ github.ref }}
  cancel-in-progress: true

# 純驗證、不寫回 repo → 最小權限唯讀。
permissions:
  contents: read

jobs:
  root-infra:
    name: root infra guard (bash -n + pwsh parse/BOM + EOL(.sh) + EOL(.ps1) + NTFS + parity + py_compile + unittest + defect-log-crossref + wrapper-thinness)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: bash -n 語法檢查（tools/git-hooks/ + tools/*.sh，遞迴涵蓋子目錄）
        run: |
          fail=0
          while IFS= read -r -d '' f; do
            echo "bash -n ${f}"
            bash -n "$f" || { echo "::error::${f} bash 語法錯誤"; fail=1; }
          done < <(find tools -type f \( -path 'tools/git-hooks/*' -o -name '*.sh' \) -print0)
          exit "$fail"

      - name: py_compile 語法檢查（根層 tools/ 下所有 *.py，遞迴涵蓋子目錄）
        run: |
          fail=0
          while IFS= read -r -d '' f; do
            echo "py_compile ${f}"
            python3 -m py_compile "$f" || { echo "::error::${f} Python 語法錯誤"; fail=1; }
          done < <(find tools -name '*.py' -type f -print0)
          exit "$fail"

      - name: pwsh 語法解析 + UTF-8 BOM 守門（active .ps1）
        run: |
          pwsh -NoProfile -Command '
            # active .ps1 範圍：根層 tools/ + AutoClaude/tools/ + AISDLC_SDD/scripts/
            # + AISDLC_SDD LATEST 版（凍結版依紀律不回改 → 排除；LATEST 偵測委派
            # scripts/sdd_version.py 單一真相源——R10 DEF-101-133，不再內嵌 regex 重寫）
            $files = @(Get-ChildItem -Path tools -Recurse -Filter *.ps1 -File)
            $files += @(Get-ChildItem -Path AutoClaude/tools -Recurse -Filter *.ps1 -File)
            $files += @(Get-ChildItem -Path AISDLC_SDD/scripts -Filter *.ps1 -File)
            $latestName = (& python3 AISDLC_SDD/scripts/sdd_version.py --sdd-root AISDLC_SDD | Out-String).Trim()
            # R10 二審 SD P3：解析失敗改 fail-loud（對齊 windows-compat-ci 同款遷移的
            # throw 語意）——空值 silent skip 會讓 LATEST 版 .ps1 靜默逸出掃描面
            if (-not $latestName) { throw "sdd_version.py SSOT 解析失敗 - 找不到 LATEST 版本目錄" }
            Write-Host "AISDLC_SDD LATEST 版：$latestName（其餘凍結版排除）"
            $files += @(Get-ChildItem -Path (Join-Path "AISDLC_SDD" $latestName) -Recurse -Filter *.ps1 -File)
            Write-Host "待檢查 active .ps1 共 $($files.Count) 支"
            $errCount = 0
            foreach ($f in $files) {
              $tokens = $null; $parseErrors = $null
              [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$tokens, [ref]$parseErrors)
              if ($parseErrors -and $parseErrors.Count -gt 0) {
                Write-Host "::error::$($f.FullName) parse error"
                foreach ($e in $parseErrors) { Write-Host "  $($e.Extent.StartLineNumber): $($e.Message)" }
                $errCount += 1
                continue
              }
              # BOM 守門：含非 ASCII 的 .ps1 必須以 EF BB BF 開頭（.editorconfig
              # utf-8-bom 政策；無 BOM 時 zh-TW Windows PS5.1 以 CP950 誤讀）
              $bytes = [System.IO.File]::ReadAllBytes($f.FullName)
              $hasBom = ($bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF)
              if (-not $hasBom) {
                $nonAscii = $false
                foreach ($b in $bytes) { if ($b -gt 0x7F) { $nonAscii = $true; break } }
                if ($nonAscii) {
                  Write-Host "::error::$($f.FullName) 含非 ASCII 字元但無 UTF-8 BOM（.editorconfig 要求 utf-8-bom；zh-TW PS5.1 會以 CP950 誤讀）"
                  $errCount += 1
                  continue
                }
              }
              Write-Host "OK: $($f.FullName)"
            }
            if ($errCount -gt 0) { exit 1 }
          '

      - name: EOL 守門（.sh 與無副檔名 hooks 不得 CRLF）
        run: |
          # git ls-files --eol 以 TAB 分隔「i/… w/… attr/…」屬性區與路徑；index（i/）
          # 或 worktree（w/）出現 crlf / mixed 即違規（取證紀律 #8：CRLF 使 Linux bash
          # 噴 $'\r'）。範圍：tools/ 下 .sh/.bash ＋ tools/git-hooks/ 無副檔名 hooks。
          viol="$(git ls-files --eol -- tools/ | awk -F'\t' '$1 ~ /(i|w)\/(crlf|mixed)/ && ($2 ~ /\.(sh|bash)$/ || ($2 ~ /^tools\/git-hooks\// && $2 !~ /\.[^\/]*$/))')"
          if [ -n "$viol" ]; then
            echo "$viol"
            echo "::error::上列檔案含 CRLF/mixed 行尾 — .sh 與 git hooks 必須 LF（取證紀律 #8 / 根層 .gitattributes）"
            exit 1
          fi
          echo "EOL 檢查通過（tools/ 下 .sh/.bash 與 git-hooks 均為 LF）"

      - name: EOL 守門（.ps1 工作樹須為 CRLF，Mac/Windows 相容性優化補洞）
        run: |
          # 反方向補洞：`.gitattributes` 規定 `*.ps1 text eol=crlf`，但 git 內部物件儲存
          # 一律 LF 正規化（`i/` 恆為 lf，非違規訊號），只有工作樹（`w/`）出現 lf/mixed
          # 才代表 checkout/smudge 政策未生效。
          #
          # R1 四方複審 SA 發現並更正歸因：`actions/checkout@v5` 一律做全新 checkout，
          # 只要 `.gitattributes` 的 `*.ps1 eol=crlf` 規則本身完好，smudge 在 CI 上
          # 是**確定性**套用（每次都會產出 w/crlf）——CI 天生看不到、也重現不了
          # 「本機非 git-aware 工具繞過 smudge 直接寫壞已存在工作樹」這種本機專屬漂移
          # （四方複審發現 tools/dev_start.ps1 當時正是這種本機漂移，且已在該次修復
          # 单独處理，見同輪 commit）。本步驟真正能攔到的是：`.gitattributes` 規則
          # 本身未來被誤刪/改壞、或新增 .ps1 檔案不慎落在既有 pattern 涵蓋範圍外，
          # 屬於「政策本身回歸」的機械複核，而非本機漂移的偵測（結構上不可能做到，
          # 只能靠開發者本機自行 renormalize；本檢查是防線之一，非唯一防線）。
          # 另補 Architect 發現：w/mixed（部分行 CRLF、部分行仍 LF）先前遺漏，一併涵蓋。
          viol="$(git ls-files --eol -- '*.ps1' | awk -F'\t' '$1 ~ /w\/(lf|mixed)/')"
          if [ -n "$viol" ]; then
            echo "$viol"
            echo "::error::上列 .ps1 檔案工作樹非 CRLF（.gitattributes *.ps1 eol=crlf 規則可能已被破壞）"
            exit 1
          fi
          echo ".ps1 EOL 檢查通過（全部工作樹為 CRLF）"

      - name: NTFS 敵意檔名守門（pre-commit A3 閘的 CI 對等，掃全量 tracked 路徑）
        run: python3 tools/check_ntfs_paths.py

      - name: 雙平台腳本對等 + pytest 釘選一致（四對 .sh/.ps1 標籤清單）
        run: python3 tools/check_script_parity.py

      - name: unittest（tools/tests/：dev_start.py 純邏輯函式 + 已修復迴歸點；含數量下限釘選）
        run: python3 tools/run_root_unittests.py

      - name: 缺陷帳本跨文件狀態一致（ONBOARDING.md 對 DEF-* 狀態宣稱 vs 帳本實況）
        run: python3 tools/check_defect_log_crossref.py

      - name: dev_start wrapper 薄殼守門（tools/check_wrapper_thinness.py）
        run: python3 tools/check_wrapper_thinness.py
