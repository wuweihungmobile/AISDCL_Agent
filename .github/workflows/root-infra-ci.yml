# 根層基建 CI（四方複審 B4，2026-07-10；防禦縱深補洞 2026-07-11）：workflows / hooks /
# 工具腳本上移 monorepo 根層後，根層 tools/（bootstrap / integration_gate / git-hooks
# dispatcher）與 .gitattributes、.editorconfig、dependabot 等基建原本零 CI 覆蓋——壞掉
# 只會在開發者本機爆。本 workflow 做十六道輕量守門（只用 GitHub 第一方 actions，不引
# 任何第三方 action，避免供應鏈風險）：
# 🔴 R68 訂正（本段原文寫「僅 actions/checkout，不引其他外部 action」，且第 8 道原文
# 寫「純 stdlib unittest，零依賴安裝」）：這兩句自 2026-07-14 起就是**假宣稱**，而代價
# 是本 workflow 連續多輪全紅無人察覺。實況是 tools/tests/ 有三支 Windows 交叉一致性
# 測試 import `autoclaude.*`，連帶拉進 yaml→pydantic→httpx；零安裝環境下它們 import
# 失敗、被 unittest 收集成佔位測試，122 支迴歸鎖一支都沒跑。故本 job 現在改為
# setup-python + 一次 pip install（清單 SSOT＝tools/run_root_unittests.py 的
# `_THIRD_PARTY_PREREQS`，並由 tools/tests/ 的 CI 安裝步驟鎖機械綁定本檔）。
# 其餘十四道仍是純 stdlib、零安裝——「輕量」原則只在第 8 道與第 16 道（R69 新增，需
# `pip install ruff`）讓步，兩次都是為了讓那道守門真的跑得動而非 skip/假綠。
#   1. bash -n       — active *.sh（R56 起，原僅根層 tools/：AISDLC_SDD LATEST 版納入、
#                      凍結版 v0.01~v0.(N-1) 依紀律不回改 → 排除，政策與第 2 道一致）
#                      與三處無副檔名 git hooks 目錄（tools/git-hooks/、
#                      AutoClaude/tools/git-hooks/、AISDLC_SDD/.githooks/）語法檢查；
#                      掃描面以 git ls-files 取得，檔數下限依「.sh／git-hooks」兩段
#                      分別釘選，見該 step 內註解（刻意不在本檔頭複寫檔數——第二個
#                      計數站點即第二個會漂移的站點）
#   2. pwsh parse    — active .ps1（根層 tools/ + AutoClaude/tools/ + AISDLC_SDD/scripts/
#                      + AISDLC_SDD LATEST 版；凍結版 v0.01~v0.(N-1) 有已知缺陷且依紀律
#                      不回改 → 排除）以 Parser::ParseFile 解析，parse error 即 fail；
#                      🔴 R79 起掃描面不再由本 step 自行列舉，一律向 Python SSOT
#                      tools/_script_scan_surface.py（`--list --check-floors`）取，
#                      per-tree 檔數下限與 LATEST 解析都在該 SSOT 內強制、rc=1 即 throw；
#                      同一支工具亦已接進 pre-push root-infra leg 的快層守門迴圈
#                      同 step 加 UTF-8 BOM 守門 — 含非 ASCII 的 active .ps1 必須有
#                      EF BB BF（.editorconfig utf-8-bom 政策的 CI 機械複核；本機僅
#                      Claude Code hook check_ps1_encoding.py 補 BOM，人工編輯器 /
#                      GitHub web 可繞過 → zh-TW PS5.1 以 CP950 誤讀亂碼/破壞 parser）
#   3. EOL 守門（.sh）— git ls-files --eol：全庫 .sh/.bash（R13 CI-8 起，原僅 tools/）
#                      與三處無副檔名 git hooks 目錄不得 CRLF/mixed（取證紀律 #8；
#                      比照 AutoClaude pre-commit 檢法，作為根層 .gitattributes
#                      `eol=lf` 政策的機械複核；範圍依據見該 step 內註解）
#   4. EOL 守門（.ps1）— 反方向補洞：全庫 *.ps1 工作樹須為 CRLF（.gitattributes
#                      `eol=crlf`）；只查 `w/`（index 恆 lf 正規化非訊號）。Mac/Windows
#                      相容性優化四方複審發現 tools/dev_start.ps1 工作樹曾違規且
#                      git status/diff 均不可見，第 3 道既有守門完全不涵蓋 .ps1 方向
#                      （2026-07-13 補洞）
#   5. NTFS 檔名閘   — tools/check_ntfs_paths.py 掃 git ls-files 全量（本機 pre-commit
#                      A3 閘的 CI 對等；--no-verify / GitHub web / 未裝 hooks 可繞過本機閘）
#   6. 腳本對等閘    — tools/check_script_parity.py：成對 .sh/.ps1 的**註冊完整性**
#                      （每對必屬 標籤比對／薄殼 hash 釘選／成對豁免／單邊豁免 之一，
#                      且各清單無 stale）+ pytest 釘選三處（pyproject.toml / v0.01 與
#                      LATEST requirements-ci.txt）同版
#                      🔴 DEF-101-278（R28 立帳、R78 訂正）：本項原以「成對 .sh/.ps1 的
#                      step 標籤清單一致」概括，讀起來像「標籤比對是本道的主機制」——
#                      而 `_MARKER_PAIRS` **現為空清單**（四對已於 R12/R16 收斂為薄殼＋
#                      Python 單核心、改掛 hash 釘選，標籤比對隨之退場，見該檔 docstring
#                      與 ONBOARDING.md §6「雙腳本對等機械守護」）。標籤比對機制本身保留
#                      給未來的新對，非死碼；但**目前沒有任何一對掛在它身上**，故本項的
#                      實際守門力來自註冊完整性與 hash 釘選。R9/R12 的標籤抽取沿革
#                      （兼容單/雙引號、各對數量下限釘選、LATEST tools 遞迴納管、run_tlc
#                      FSM 軌鎖）逐字保留於 check_script_parity.py docstring，不在此複寫。
#   7. py_compile    — 根層 tools/ 下所有 *.py（遞迴涵蓋子目錄；dev_start / check_* 等
#                      基建工具）語法檢查；這些 .py 過去僅語法檢查、零單元測試覆蓋，
#                      邏輯回歸可經 --no-verify / GitHub web 靜默入庫 → 第 8 道補上
#                      （dev_start 四方審查 P2，2026-07-12；子目錄遞迴盲區修復
#                      2026-07-13）
#   8. unittest      — tools/tests/ 下 dev_start.py 純邏輯函式與已修復迴歸點的單元測試
#                      （R68 起本道**需要**第三方相依，見上方訂正段；四方複審
#                      2026-07-13 REJECT 原因之一即「核心邏輯複雜度已超過 py_compile
#                      能守住的範圍」，本道步驟收斂該落差。R10 QA-2：改走
#                      tools/run_root_unittests.py——裸 discover 對 0 個測試回 rc=0，
#                      數量下限釘選堵住「測試大規模靜默消失仍全綠」fail-open）
#   9. 缺陷帳本跨文件狀態一致閘 — tools/check_defect_log_crossref.py：機械比對
#                      `ONBOARDING.md` 內對 DEF-\d+-\d+ 的狀態宣稱（open/fixed/wontfix/…）
#                      與 `docs/06_quality/AutoSDD_Defect_Log.md` 該 ID 最新狀態是否矛盾
#                      （DEF-101-066 這類「改帳本忘同步姊妹文件」曾真實發生一次，
#                      本道步驟即該問題類別的治本機械守護，DEF-101-068(e) 落地）
#   10. wrapper 薄殼守門 — tools/check_wrapper_thinness.py（dev_start＋local_ci_gate 對子）：獨立具名 step
#                      執行（先前唯一執行路徑是 tools/tests/test_check_wrapper_thinness.py
#                      裡一個不帶 mock 的測試方法，靠第 8 道 unittest 間接跑到，不像同批
#                      其他 check_*.py 有具名 step 可一眼看出有沒有被 CI 涵蓋；未來若該
#                      測試被改用 mock/fixture 或誤判精簡掉，這道機械回歸防護會無聲失效
#                      且無第二訊號可查覺——四方複審 P2 finding 修復）
#   11. pytest 基線站點鎖 — tools/check_pytest_baseline_sites.py：pytest 基線數字
#                      （如 3,566 passed）只准住 SSOT（ONBOARDING.md §7），其餘高風險
#                      文件（CLAUDE.md／useMacWin.md／AutoClaude/{CLAUDE,README}.md）
#                      命中即紅；SSOT 自身零命中亦紅（anchor 自檢）。歷史紀錄性數字
#                      以行內 `baseline-ok:` 豁免並逐次列印稽核（DEF-101-045／
#                      ARCH-R12-7／R13 README 漂移三度實證，R13 ARCH-R13-1 落地）
#   12. GitHub Actions 版本一致性鎖 — tools/check_gha_action_versions.py：**全部
#                      `actions/*` 官方 action**（含子路徑 action，如 cache/restore）
#                      在全部 workflow 內版本必須唯一，不一致即紅；不判斷哪個版本
#                      才對。R56 起改為此通用規則——原本列舉四名 action 的白名單
#                      本身是 fail-open（打錯一個字即靜默少守 13 處宣告仍印綠燈，
#                      見該工具檔頭 ①），故本行**刻意不再列舉 action 名**
#                      （R54 round 1/2〔DEF-101-420/424〕連續兩輪靠人工 grep 逐檔比對
#                      才發現版本落差、且人工「已是穩定版」的自我宣稱本身失準，
#                      R55 落地機械鎖收斂此缺口）
#   13. 缺陷帳本保全稽核 — tools/archive_defect_log.py --check：帳本家族（主檔 ＋ 全部
#                      archive）的四項事後保全 — 行尾全 LF／同檔內 ID 無重複列／同 ID
#                      跨檔狀態分類不矛盾／全部「立帳見」指針帶可解析 DEF-ID 且居所
#                      宣稱與實況一致。與第 9 道（帳本**體積**硬閘＋跨文件狀態一致）
#                      互補：第 9 道守的是帳本與姊妹文件間的宣稱，本道守的是帳本家族
#                      **內部**因歸檔搬遷而腐化的指針與重複列。R60 立此道的直接理由是
#                      ARCH-R60-02／QA-R60-01：該工具本輪新增時「四道閘門零直接接線、
#                      唯一間接接線是一條恆真斷言」，稽核回報 5 筆問題而所有閘門仍全綠
#                      ——「可重跑但沒有任何閘門看它的 rc」與「不可重跑」等價
#   14. ONBOARDING §7 表② presumed-stale 觸發器 — tools/sync_onboarding_baselines.py
#                      --check-snapshot：比對四套測試樹（v0.01／v0.30 fsm_runtime tests、
#                      AISDLC_SDD/scripts/tests、AutoClaude/tests）的內容指紋與 §7 表②
#                      記載值，指紋一變即判該表 presumed stale。判準是**因果的**——
#                      表② 的四個計數只可能因測試樹變動而變，故指紋比對（毫秒級）可以
#                      取代重跑整套（分鐘級）。R60 round 3 立此道的直接理由是四方複審
#                      round 2 **全數獨立命中**同一根因（ARCH-R60R2-02／SA-R60R2-02／
#                      SD-R60-R2-02／QA2-R60-01）：round 1 填了 v0.30 當時值、round 2
#                      動了該測試樹使實測改變而沒人回填，而表頭同時宣稱「四格皆經
#                      獨立覆核」⇒ 假宣稱。同表的表① 兩格早有 live 鎖，本道補的是
#                      「機器算不出現場值、但算得出『該重測了』」這個中間帶。
#                      ⚠️ 誠實劃界：指紋只覆蓋測試樹 `*.py` 內容，生產碼改變
#                      `parametrize` 來源／docker daemon 可用性／平台差異都能改變計數
#                      而指紋不動 ⇒ 充分觸發器、非必要條件（會漏、不會冤）。
#   15. nightly-full 排程陳舊度哨兵 — 唯讀 `gh run list --event schedule --status success`
#                      查 windows-compat-ci.yml／macos-compat-ci.yml 兩支 `*-nightly-full`
#                      最近一次**排程成功**的時間，超過 `MAX_AGE_DAYS` 即紅。
#                      R68 立此道的直接理由（本輪最嚴重的一筆，P1）：兩支 nightly-full
#                      是**唯一**會在真 Windows／真 macOS 上跑完整 AutoClaude 測試樹的
#                      通道，而它們自 2026-07-14 起連續 5 次排程全紅、零成功達 18 天，
#                      橫跨 R48~R67（含 R67 一輪 40 筆修復）完全沒有人察覺；同期
#                      「四支 CI 全綠」的宣稱成立，因為那只是 **push 事件**的綠。
#                      三道既有哨兵在結構上都偵測不到：(a) `*-nightly-alert` 與被監控者
#                      同屬 GitHub Actions 計費平面（實查兩者 annotation 逐字相同：
#                      'The job was not started because recent account payments have
#                      failed…'）；(b) 根層 `dev_start.py::_check_ci_liveness` 只取
#                      `--limit 1`、不分事件類型；(c) `_check_nightly_heartbeat` 只讀
#                      本機 log mtime。
#                      ⚠️ 誠實劃界（不可讀成「這道補上了平面外偵測」）：本道與被偵測者
#                      **同屬 GitHub Actions 計費平面**——帳務停擺時本 workflow 自己也
#                      不會被配置 runner，故它抓不到停擺當下，只抓得到「cron 靜默沒觸發
#                      ／job 被停用／停擺恢復後沒人補跑」這一類非帳務型陳舊。
#                      🔴 本輪訂正（把一個會過期的量測快照換成現查判準）：本段原先以一組
#                      **寫死的日期**斷言帳務平面已回復正常，並據此判定當時的陳舊屬於上列
#                      第三型。後續量測推翻了那個判定——同一輪停擺在該日期之後仍持續產生
#                      job 層 steps 長度為 0 的 run。日期快照不該長在一道每次 push 都執行的
#                      哨兵的說明裡：它從被推翻的那一刻起就開始說謊，而沒有任何機械物在看。
#                      改為**現查**：本道 run: 段已逐 workflow 印出最近一次 schedule run 的
#                      job 層 steps 長度統計（`never-started=<零步驟 job 數>/<job 總數>`）。
#                      該值非 0/N ⇒ runner 從未被配置＝帳務／額度平面，本 repo 內無可修處；
#                      0/N ⇒ runner 真的跑過，陳舊就是上列前兩型或測試真紅。判「現在是不是
#                      停擺」一律看那一行，不要看任何寫死的日期。真正平面外的偵測只能長在
#                      本機 `dev_start.py`（純唯讀 gh API、零 Actions 額度），該項
#                      🔴 本段兩處刻意寫成不帶 `tools/` 前綴的 `dev_start.py`：帶前綴的
#                      字面是 test_root_infra_parity 的抽取標的（檔頭條目提及＝該道守門
#                      所用的工具），而此處只是**敘述性提及**別道的偵測缺口，不是本道用
#                      到的工具——同 ONBOARDING.md §9「文件散文不該長出第二個受抽取站點」。
#                      不在本檔可及範圍，見 DEF-101-081 與 R68 Pkg-4 的跨包訴求。
#                      本道刻意做成**阻斷**而非 warning：非阻斷正是 nightly-full 自己
#                      （continue-on-error: true）被忽略 18 天的機制，再加一層非阻斷等於
#                      複製病因。門檻取 10 天＝週頻 cron（週一 06:12／07:18 UTC）正常最長
#                      間隔 7 天 ＋ 3 天餘裕。
#                      🔴 R71 擴充「覆蓋面 vs 綁架主線」的取捨：原本阻斷清單只有那兩支，
#                      但同批陣亡的排程軌有四支，其餘含 cron 的 workflow 完全無人看。
#                      直接把阻斷射程改成「現掃所有含 cron 的 workflow」（今天 7 支、
#                      其中 4 支日頻）＝ 任何一條日頻軌紅一天就擋住全 repo 的 push，
#                      而本道與被偵測者同計費平面（帳務一掛一起紅）⇒ 那是把主線抵押
#                      給雲端狀態。故取**兩段式**：阻斷段維持兩支真機**週頻**軌
#                      （DEF-101-703 主角，且週頻軌結構上不可能被日常 push 順手發現），
#                      其餘一律走同 step 內的 advisory 段——現掃 workflow 目錄取得清單
#                      （不寫死第二份會腐化的字面清單）、逐軌印最近一次 schedule 觸發
#                      的結論／時間／url、非 success 或過齡即 ::warning::，但**不改
#                      本 step 的 rc**。同段順帶標記「同檔多條 cron 驅動不相交 job 集合」
#                      這個 run 層天生分辨不出的盲區。誠實劃界：advisory 是提醒不是閘門，
#                      它擋不住任何人無視；要當場擋下的判準請放進阻斷段並承擔其代價。
#   16. 根層護欄層 ruff — `ruff check tools/`（設定＝`tools/ruff.toml`，由 ruff 自己
#                      「從檔往上找最近設定檔」解析到）。R69 立此道的直接理由：該設定檔
#                      是 R69 新增的，落地時**全 repo 零執行者**——於是它自陳要治的病
#                      （「政策有宣告、卻沒有任何機械物在根層執行它」）原樣留著，只是把
#                      假綠從「ruff 出廠預設」換成「根本沒人跑 ruff」。本道與 pre-push
#                      dispatcher 的 root-infra **快層**互為本地/雲端兜底。
#                      ⚠️ 誠實劃界：射程只到根層 `tools/` 樹；`AISDLC_SDD/` 今日仍是零
#                      ruff 設定、零 ruff 閘門（納管它是另一個授權面的決定，見
#                      tools/ruff.toml 檔頭）。
#
# 注：上列編號為清單序，與 job 內實際執行順序無關（如第 7 道 py_compile 實體 step
# 緊接第 1 道 bash -n 之後執行）——R11 文件掃描[關注-3]澄清。
#
# 觸發不設 paths 過濾（2026-07-11 起）：NTFS 檔名閘守的是「任何路徑」新增的
# 敵意檔名（一旦入庫所有 Windows checkout 直接壞），paths 白名單必留盲區；本 job 十三道
# 步驟輕量，全變更觸發成本可忽略。
# 🔴 R68 訂正：原文寫「全部步驟輕量（< 1 分鐘、零依賴安裝）」——第 8 道 unittest 既非
# 零安裝（見檔頭訂正段）也非秒級（本機 macOS 實測全套 1371 支約 110 秒，CI runner 更慢），
# 故 timeout 由 10 分鐘放寬為 20 分鐘。該道之外的十三道仍維持原本的輕量零安裝性質。

name: root-infra-ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 🔴 group 含 `github.event_name`（本輪 R77-55，與兩支 SDD workflow 同批）：本檔由
# push(main)＋pull_request＋workflow_dispatch 觸發，`cancel-in-progress: true` 下若
# group 只綁 `github.ref`，在 main 上手動 dispatch 一次就會取消掉進行中的 push 閘門 run
# ——而被取消的 run 不是紅色，它在結論欄與「跑過且通過」幾乎無從分辨。連續兩次 push
# 仍會互相取消（同 event_name、同 ref），省額度的原意一字未變。
concurrency:
  group: root-infra-ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

# 純驗證、不寫回 repo → 最小權限唯讀。
# R68：第 15 道（nightly-full 排程陳舊度哨兵）需讀 Actions run 歷史，補 `actions: read`
# ——仍是唯讀，且不含 `issues: write`（本 workflow 不開單，開單留在 *-nightly-alert）。
permissions:
  contents: read
  actions: read

jobs:
  root-infra:
    name: root infra guard (bash -n + pwsh parse/BOM + EOL(.sh) + EOL(.ps1) + NTFS + parity + py_compile + unittest + defect-log-crossref + wrapper-thinness + pytest-baseline-sites + gha-action-versions + defect-log-preservation + onboarding-snapshot-fingerprint + nightly-schedule-staleness + ruff(tools/))
    runs-on: ubuntu-latest
    timeout-minutes: 20   # R68：第 8 道 unittest 現在會真的跑完全套（見檔頭訂正段）
    steps:
      - uses: actions/checkout@v5

      - name: bash -n 語法檢查（active tracked *.sh + 三處 git-hooks 目錄；凍結版排除）
        # R56 修正（Architect finding）：原範圍是 `find tools …`＝10 檔，只涵蓋
        # 23 支 active `.sh` 的 7 支（外加 3 支根 hook）；AutoClaude/tools/、
        # AISDLC_SDD/scripts/、AISDLC_SDD LATEST/tools/ 底下的 16 支 active `.sh`
        # 零 CI 語法閘。與**同一支 workflow 下一 step** 的 pwsh Parser::ParseFile
        # 閘（掃四棵樹皆 -Recurse＝全部 active `.ps1`）平台待遇不對稱：Windows
        # 專屬的 `.ps1` 有完整語法閘，macOS/Linux 主場的 `.sh` 反而沒有。
        # 委派鏈亦落空：`tools/git-hooks/pre-commit:170` 註解宣稱「子專案腳本由
        # 各自 hook 把關」，但兩子專案 hook 皆未做 `.sh` 語法檢查。
        # R56 二次修正①（Architect round 3）：本 step 初版擴為**全庫** 174 檔，其中
        # 145 支（83%）是 AISDLC_SDD 凍結版 .sh——與同一支 workflow 下一 step
        # （pwsh parse）明文「凍結版有已知缺陷且依紀律不回改 → 排除」的政策直接
        # 相反。初版援引的「與 EOL 守門同款、全庫盤點後放寬」先例並不成立：EOL 量
        # 的是 git attribute／位元組層事實（與工具版本無關，盤點過即永久成立），而
        # `bash -n` 的判定取決於**執行它的 bash 版本**（本 job 為 ubuntu-latest 的
        # bash 5.x，未來會隨 runner 映像升版）。某個未來 bash 若對凍結版任一支的寫法
        # 收緊（如既有棄用語法轉為錯誤），本 step 即永久紅燈，而依 Copy-on-Evolve
        # 凍結鐵律**不存在合規的改檔途徑**，只能回頭再改一次這道閘——正是第 2 道
        # 當年已預見並規避掉的坑。故改為與第 2 道同政策：只掃 active。
        # LATEST 一律委派 AISDLC_SDD/scripts/sdd_version.py SSOT 解析（DEF-101-133，
        # 禁止內嵌第二份版本 regex），解析失敗 fail-loud、不得靜默縮面。
        #
        # R56 二次修正②（Architect round 3）：下限釘選改按「會變動的那一半」分段。
        # 初版對總數 174 釘 150，而 150 是由 145 支不可回改的凍結版撐起的，對真正
        # 要保護的 active 腳本近乎零鑑別力——實測把三處 git-hooks 樣式全部踢出掃描面
        # （只留 `'*.sh'`）仍得 168 ≥ 150 而靜默綠燈，然而那 6 支無副檔名 hook 正是
        # 全 repo 改動最頻繁、且因無副檔名而最容易在樣式重構時被遺漏的一類（本
        # workflow 檔頭第 1 句自述的存在理由就是它們）。故 .sh 與 git-hooks 各自釘實數。
        run: |
          latest="$(python3 AISDLC_SDD/scripts/sdd_version.py --sdd-root AISDLC_SDD)"
          if [ -z "$latest" ]; then
            echo "::error::AISDLC_SDD LATEST 解析失敗（sdd_version.py 無輸出）— 掃描邊界不得靜默縮小"
            exit 1
          fi
          echo "AISDLC_SDD LATEST 版：${latest}（其餘凍結版排除）"
          fail=0
          n_sh=0
          n_hook=0
          n_frozen=0
          n_gone=0
          while IFS= read -r -d '' f; do
            case "$f" in
              AISDLC_SDD/AISDLC_SDD_v*/*)
                case "$f" in
                  "AISDLC_SDD/${latest}/"*) ;;
                  *) n_frozen=$((n_frozen+1)); continue ;;
                esac
                ;;
            esac
            case "$f" in
              *.sh) n_sh=$((n_sh+1)) ;;
              *) n_hook=$((n_hook+1)) ;;
            esac
            # git ls-files 列的是 **index**：工作樹已 rm 但尚未 git rm 的檔案仍在清單
            # 內，而 `bash -n <缺檔>` 回 rc=127，會被誤報成「語法錯誤」（R56 SA/SD
            # 各自實機重現）。CI 為全新 checkout 不會觸發，仍加同款守衛以與
            # tools/macos_smoke_local.sh [1/7] 維持「同一份清單、同一套判準」。
            # 刻意在計數**之後**才跳過：下限釘選守的是「ls-files 樣式有沒有被改壞」，
            # 若把未 commit 的刪除也扣掉，大量刪除會把計數壓破下限而變成另一種假紅。
            if [ ! -f "$f" ]; then
              echo "  略過 ${f}（index 內但工作樹不存在）"
              n_gone=$((n_gone+1))
              continue
            fi
            bash -n "$f" || { echo "::error::${f} bash 語法錯誤"; fail=1; }
          done < <(git ls-files -z -- '*.sh' 'tools/git-hooks/*' \
                     'AutoClaude/tools/git-hooks/*' 'AISDLC_SDD/.githooks/*')
          echo "bash -n 掃描面：active .sh ${n_sh} 檔 + 無副檔名 git-hooks ${n_hook} 檔"
          echo "（凍結版排除 ${n_frozen} 檔；index 內但工作樹不存在 ${n_gone} 檔）"
          # 下限釘選（兩段各自釘選）：ls-files 樣式被改壞／目錄搬家時掃描面靜默縮小，
          # `fail=0` 仍會綠燈——與本 step 存在的目的直接矛盾。
          if [ "$n_sh" -lt 23 ]; then
            echo "::error::active .sh 掃描面異常縮小（僅 ${n_sh} 檔，現況應 ≥23）— '*.sh' 樣式或凍結版排除式疑似被改壞"
            fail=1
          fi
          if [ "$n_hook" -lt 6 ]; then
            echo "::error::無副檔名 git-hooks 掃描面異常縮小（僅 ${n_hook} 檔，現況應 ≥6）— 三處 git-hooks 樣式疑似被改壞"
            fail=1
          fi
          exit "$fail"

      - name: py_compile 語法檢查（根層 tools/ 下所有 *.py，遞迴涵蓋子目錄）
        run: |
          fail=0
          while IFS= read -r -d '' f; do
            echo "py_compile ${f}"
            python3 -m py_compile "$f" || { echo "::error::${f} Python 語法錯誤"; fail=1; }
          done < <(find tools -name '*.py' -type f -print0)
          exit "$fail"

      - name: pwsh 語法解析 + UTF-8 BOM 守門（active .ps1）
        run: |
          # 🔴 R79 ARCH：掃描面（三棵固定樹 ＋ AISDLC_SDD LATEST 版樹、皆遞迴、凍結版
          # 排除）不再由本 step 自行 Get-ChildItem 列舉，一律向 Python SSOT
          # tools/_script_scan_surface.py 取。WHY：本 step 與 tools/windows_smoke_local.ps1
          # [1/9] 曾是同一份掃描面的第 2、第 3 份獨立實作，repo 因此養了 866 行對抗式
          # 正則錨（tools/tests/_ci_scan_anchors.py ＋ test_ci_scan_anchors.py）只為偵測
          # 三份是否同步，且那組錨自承有三種已實測抓不到的逃逸形態。複本消失後「不同步」
          # 結構上不可能發生，該 866 行同輪退場。
          # per-tree 檔數下限與 LATEST 解析（DEF-101-133 委派 sdd_version.py）都在 SSOT
          # 內強制：掃描面靜默縮小或 LATEST 解析失敗 → 該 CLI rc=1 → 本 step throw。
          pwsh -NoProfile -Command '
            $files = @(& python3 tools/_script_scan_surface.py --list --suffix .ps1 --with-latest --check-floors --absolute)
            if ($LASTEXITCODE -ne 0) { throw "tools/_script_scan_surface.py 掃描面列舉失敗（rc=$LASTEXITCODE）- 掃描邊界不得靜默縮小" }
            Write-Host "待檢查 active .ps1 共 $($files.Count) 支"
            $errCount = 0
            foreach ($f in $files) {
              $tokens = $null; $parseErrors = $null
              [void][System.Management.Automation.Language.Parser]::ParseFile($f, [ref]$tokens, [ref]$parseErrors)
              if ($parseErrors -and $parseErrors.Count -gt 0) {
                Write-Host "::error::$f parse error"
                foreach ($e in $parseErrors) { Write-Host "  $($e.Extent.StartLineNumber): $($e.Message)" }
                $errCount += 1
                continue
              }
              # BOM 守門：含非 ASCII 的 .ps1 必須以 EF BB BF 開頭（.editorconfig
              # utf-8-bom 政策；無 BOM 時 zh-TW Windows PS5.1 以 CP950 誤讀）
              $bytes = [System.IO.File]::ReadAllBytes($f)
              $hasBom = ($bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF)
              if (-not $hasBom) {
                $nonAscii = $false
                foreach ($b in $bytes) { if ($b -gt 0x7F) { $nonAscii = $true; break } }
                if ($nonAscii) {
                  Write-Host "::error::$f 含非 ASCII 字元但無 UTF-8 BOM（.editorconfig 要求 utf-8-bom；zh-TW PS5.1 會以 CP950 誤讀）"
                  $errCount += 1
                  continue
                }
              }
              Write-Host "OK: $f"
            }
            if ($errCount -gt 0) { exit 1 }
          '

      - name: EOL 守門（.sh 與無副檔名 hooks 不得 CRLF）
        run: |
          # git ls-files --eol 以 TAB 分隔「i/… w/… attr/…」屬性區與路徑；index（i/）
          # 或 worktree（w/）出現 crlf / mixed 即違規（取證紀律 #8：CRLF 使 Linux bash
          # 噴 $'\r'）。
          # R13 CI-8 放寬：原僅掃 tools/，AutoClaude/ 與 AISDLC_SDD/（含 smoke 實跑的
          # ci-gate.sh／install-hooks.sh）的 .sh 零 EOL 守門。範圍依據＝2026-07-19
          # `git ls-files --eol '*.sh' '*.bash'` 全庫盤點：166/166 皆 i/lf w/lf（含全部
          # 凍結版 AISDLC_SDD_v0.01~），全庫掃描不會使凍結版恆紅（凍結版鐵律不可回改，
          # 若有存量違規則必須排除；實測無），故直接放寬為**全庫** .sh/.bash ＋三處
          # 無副檔名 git hooks 目錄（tools/git-hooks/、AutoClaude/tools/git-hooks/、
          # AISDLC_SDD/.githooks/，盤點同為全 LF）。
          # -c core.quotePath=false：非 ASCII 檔名預設輸出為引號包裹＋八進位逸出形，
          # 行尾引號會使 $2 的 /\.(sh|bash)$/ 錨定不匹配而靜默漏掃（SD-R13-6）。
          viol="$(git -c core.quotePath=false ls-files --eol | awk -F'\t' '$1 ~ /(i|w)\/(crlf|mixed)/ && ($2 ~ /\.(sh|bash)$/ || (($2 ~ /^tools\/git-hooks\// || $2 ~ /^AutoClaude\/tools\/git-hooks\// || $2 ~ /^AISDLC_SDD\/\.githooks\//) && $2 !~ /\.[^\/]*$/))')"
          if [ -n "$viol" ]; then
            echo "$viol"
            echo "::error::上列檔案含 CRLF/mixed 行尾 — .sh 與 git hooks 必須 LF（取證紀律 #8 / 根層 .gitattributes）"
            exit 1
          fi
          echo "EOL 檢查通過（全庫 .sh/.bash 與三處 git-hooks 目錄均為 LF）"

      - name: EOL 守門（.ps1 工作樹須為 CRLF，Mac/Windows 相容性優化補洞）
        run: |
          # 反方向補洞：`.gitattributes` 規定 `*.ps1 text eol=crlf`，但 git 內部物件儲存
          # 一律 LF 正規化（`i/` 恆為 lf，非違規訊號），只有工作樹（`w/`）出現 lf/mixed
          # 才代表 checkout/smudge 政策未生效。
          #
          # R1 四方複審 SA 發現並更正歸因：`actions/checkout@v5` 一律做全新 checkout，
          # 只要 `.gitattributes` 的 `*.ps1 eol=crlf` 規則本身完好，smudge 在 CI 上
          # 是**確定性**套用（每次都會產出 w/crlf）——CI 天生看不到、也重現不了
          # 「本機非 git-aware 工具繞過 smudge 直接寫壞已存在工作樹」這種本機專屬漂移
          # （四方複審發現 tools/dev_start.ps1 當時正是這種本機漂移，且已在該次修復
          # 单独處理，見同輪 commit）。本步驟真正能攔到的是：`.gitattributes` 規則
          # 本身未來被誤刪/改壞、或新增 .ps1 檔案不慎落在既有 pattern 涵蓋範圍外，
          # 屬於「政策本身回歸」的機械複核，而非本機漂移的偵測（結構上不可能做到，
          # 只能靠開發者本機自行 renormalize；本檢查是防線之一，非唯一防線）。
          # 另補 Architect 發現：w/mixed（部分行 CRLF、部分行仍 LF）先前遺漏，一併涵蓋。
          # -c core.quotePath=false：同上一步（367 行）的理由——非 ASCII 檔名預設輸出
          # 為引號包裹＋八進位逸出形，`$2` 的 `.ps1` 錨定不匹配而靜默漏掃。R81 XPL-S1-01
          # 揪到「同一檔內 367 行有、391 行沒有」＝旗標靠每個站點各自記得的必然結果。
          viol="$(git -c core.quotePath=false ls-files --eol -- '*.ps1' | awk -F'\t' '$1 ~ /w\/(lf|mixed)/')"
          if [ -n "$viol" ]; then
            echo "$viol"
            echo "::error::上列 .ps1 檔案工作樹非 CRLF（.gitattributes *.ps1 eol=crlf 規則可能已被破壞）"
            exit 1
          fi
          echo ".ps1 EOL 檢查通過（全部工作樹為 CRLF）"

      - name: NTFS 敵意檔名守門（pre-commit A3 閘的 CI 對等，掃全量 tracked 路徑）
        run: python3 tools/check_ntfs_paths.py

      - name: 雙平台腳本對等 + pytest 釘選一致（成對 .sh/.ps1 標籤清單＋LATEST 納管）
        run: python3 tools/check_script_parity.py

      # R68：本 job 原本刻意不裝任何東西，而 tools/tests/ 早已（自 R33/R34/R57）有測試
      # import `autoclaude.*`。缺相依時 unittest discovery 不會報錯、只會把該模組整份
      # 覆蓋塌成一支佔位測試 ⇒ 122 支 Windows 迴歸鎖靜默不跑。改用 setup-python 而非對
      # 系統 python3 直接 pip install：後者在 externally-managed（PEP 668）的 runner 映像
      # 上會被擋，而 setup-python@v6 已是本 repo 其餘 workflow 的既有用法（同為 GitHub
      # 第一方 action，版本由 tools/check_gha_action_versions.py 跨 workflow 釘死）。
      # 副作用（明說）：本 step 之後的守門改用 3.11 而非 runner 預設版——3.11 正是本 repo
      # 各處宣告的目標版，且該批守門已在 3.11 實測全數 rc=0。
      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: tools/tests 第三方相依（清單 SSOT＝tools/run_root_unittests.py 的 _THIRD_PARTY_PREREQS；漏裝時該 runner 會 fail-fast 指路）
        run: python3 -m pip install --quiet --disable-pip-version-check pyyaml pydantic httpx

      # 第 16 道。刻意排在 unittest **之前**：tools/tests/test_subprocess_encoding_hygiene.py
      # 的 `test_the_config_actually_covers_the_root_tools_tree` 需要 PATH 上有 ruff 才驗得動
      # （沒有就 `[TOOL-MISSING]` skip），先裝好本道才是「真的有在跑」而非 skip 假綠。
      - name: 根層護欄層 ruff（tools/ruff.toml 的執行者；見檔頭第 16 道）
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --disable-pip-version-check 'ruff==0.15.21'
          # 🔴 刻意**不**寫 `--config tools/ruff.toml`：帶 `--config` 時 ruff 的 project root
          # 變成 cwd（repo 根）而非設定檔所在目錄，`[lint.per-file-ignores]` 的相對 pattern
          # （`run_root_unittests.py`／`tests/*.py`）與 isort 的 src 判定全部錯位——同機實測
          # 帶 `--config` 得 140 errors、不帶（走 ruff 由檔往上尋找）得 `All checks passed!`。
          # 兩者差的不是嚴格度，是**設定被錯誤解讀**。改成 `--config` 前請先重跑這組對照。
          # 下一行先把「ruff 到底讀了哪份設定」印進 log，讓「其實套的是出廠預設」這種假綠
          # 在 CI log 上留下可稽核痕跡（不只靠測試斷言）。
          ruff check --show-settings tools/run_root_unittests.py | sed -n '1,2p'
          # 🔴 R69 終審 P1：ruff 的 `warning:` 走 **stderr 且不改變 rc**——`Invalid noqa
          # directive`（指令寫壞 ⇒ 該行其實完全沒被豁免）就是這樣落地無人消費的，本 repo
          # 因此真的留了一個壞豁免整輪沒人發現。本道改為把 stderr 一併收下並在有任何
          # `warning:` 時 fail-loud：只看 rc 等於自願對 ruff 說出口的話裝作沒聽見。
          # `--no-cache` 不可省（同機實測）：ruff 的 noqa warning **只在冷 cache 時印**，
          # 第二次跑起就靜默 ⇒ 不帶它的話這道閘門的鑑別力取決於「這台機器剛好有沒有
          # cache」，那是最糟的一種閘門。本樹冷跑實測 0.02s，成本可忽略。
          set +e
          ruff check tools/ --no-cache 2>/tmp/ruff_stderr.txt
          rc=$?
          set -e
          cat /tmp/ruff_stderr.txt >&2
          if [ "$rc" -ne 0 ]; then exit "$rc"; fi
          if grep -q '^warning:' /tmp/ruff_stderr.txt; then
            echo "::error::ruff 印出 warning（rc=0 但 warning 不得靜默吞掉；最常見是壞掉的 noqa 指令＝該行根本沒被豁免）："
            grep '^warning:' /tmp/ruff_stderr.txt
            exit 1
          fi

      - name: unittest（tools/tests/：dev_start.py 純邏輯函式 + 已修復迴歸點；含數量下限釘選）
        run: python3 tools/run_root_unittests.py

      - name: 缺陷帳本跨文件狀態一致（ONBOARDING.md 對 DEF-* 狀態宣稱 vs 帳本實況）
        run: python3 tools/check_defect_log_crossref.py

      - name: pytest 基線站點鎖（tools/check_pytest_baseline_sites.py：基線數字只准住 ONBOARDING §7）
        run: python3 tools/check_pytest_baseline_sites.py

      - name: wrapper 薄殼守門（tools/check_wrapper_thinness.py：dev_start＋local_ci_gate）
        run: python3 tools/check_wrapper_thinness.py

      - name: GitHub Actions 版本一致性（tools/check_gha_action_versions.py：全部 actions/* 跨 workflow 同版）
        run: python3 tools/check_gha_action_versions.py

      - name: 缺陷帳本保全稽核（tools/archive_defect_log.py --check：立帳指針居所／同檔重複列／行尾／跨檔狀態）
        run: python3 tools/archive_defect_log.py --check
      - name: ONBOARDING §7 表② presumed-stale 觸發器（tools/sync_onboarding_baselines.py --check-snapshot：測試樹指紋）
        run: python3 tools/sync_onboarding_baselines.py --check-snapshot

      - name: nightly-full 排程陳舊度哨兵（唯讀 gh API；設計理由與誠實劃界見檔頭第 15 道）
        # 本 step 只做唯讀 `gh run list` 查詢（不觸發、不重跑任何 workflow），
        # 對 Actions 額度的消耗為零——與本 repo「節省 GitHub CI 額度」紀律相容。
        #
        # 🔴 R69 兩處訂正（原版 R68 出生即紅，且是**無法解除的死鎖**；DEF-101-703）：
        #   ① **處置指令與查詢條件實證互斥**：原版寫死 `--event schedule`，但它印給
        #      使用者的處置指令 `gh workflow run <wf>.yml` 產生的是 `event=workflow_dispatch`
        #      的 run ⇒ 照著處置做也永遠不會被查到、閘門永遠解不開。現改為
        #      schedule 與 workflow_dispatch **兩事件都查、取較新者**：兩事件都會把
        #      *-nightly-full 真的拉起來跑（該 job 的 `if:` 逐字就是
        #      `github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'`），
        #      對「那條真機通道還活著嗎」這個問句是等價證據。
        #   ② **無任何豁免途徑**：原版無 `if:`、無 `continue-on-error`、門檻是硬編字面量，
        #      於是「通道已死」這個**根因在 GitHub 帳務平面、本 repo 內無可修之處**的事實，
        #      被翻譯成「所有 push 一律紅」，把主線整條鎖死。現加一個**帶到期日、帶理由、
        #      有長度上限**的顯式豁免：豁免期內降為 ::warning::（哨兵照樣每次 push 大聲
        #      印出陳舊天數與處置，不是消音），到期**自動**恢復阻斷、缺陷自己紅回來。
        # 🔴 反 fail-open 三道保險（缺一就會退化成永久假綠；對應鎖見
        #    tools/tests/test_workflow_permission_concurrency_lock.py::TestRootInfraNightlyStalenessSentinel）：
        #   · WAIVER_UNTIL 為空字串＝無豁免，阻斷行為與 R68 原版**完全相同**；
        #   · WAIVER_UNTIL 無法解析、或 WAIVER_REASON 為空 ⇒ **當場 exit 1**（fail-loud：
        #     豁免設定壞掉時不得靜默當成「沒豁免」或「永久豁免」）；
        #   · 豁免視窗距今超過 MAX_WAIVER_DAYS 天 ⇒ **當場 exit 1**，杜絕「填 2099」這種
        #     變相永久停用；續期一次最多買三週，且必然留下 git diff 可稽核。
        # 誠實劃界（不因本次訂正而消失）：`gh run list --status success` 讀的是 **run 層**
        # 結論，而 *-nightly-full 是 `continue-on-error: true`、schedule 事件下 smoke job
        # 被 `if:` 跳過 ⇒ 本哨兵能證明的是「runner 有被配置、該 job 有跑到結束」，**不**
        # 等於「該 job 內每一步都綠」。它抓的是**通道死亡**（runner 根本沒起來——如
        # DEF-101-081/703 的帳務阻擋：job 的 steps 長度為 0、耗時 2 秒），不是測試紅。
        env:
          GH_TOKEN: ${{ github.token }}
          # 週頻 cron（週一 06:12／07:18 UTC）正常最長間隔 7 天，取 10 天＝3 天餘裕。
          MAX_AGE_DAYS: "10"
          # 顯式豁免（UTC，YYYY-MM-DD；**空字串＝無豁免**）。
          # 現行豁免的唯一理由（DEF-101-703 根因已查明，非猜測）：排程失敗的原因是 GitHub
          # 帳務阻擋——job annotation 逐字為 "The job was not started because recent account
          # payments have failed or your spending limit needs to be increased."，該 run 的
          # job 全部 steps 長度 0、耗時個位數秒 ⇒ **不是** workflow 定義缺陷，本 repo 內
          # 無可修之處。
          # 🔴 本輪訂正：上一版的續期理由是一句**帶日期的事實宣稱**（斷言帳務已在某日恢復、
          # 只要再等兩個排程窗口自證即可）。後續量測推翻了它——同一輪停擺在那個日期之後
          # 仍持續產生 job 層零步驟的 run，跨越十餘個日曆天。教訓不是「日期填錯了」，是
          # **續期理由不該綁在對未來的預測上**：預測被推翻時沒有任何機械物會說話，而豁免
          # 會照樣自動生效到期滿。故 WAIVER_REASON 改寫成一條「隨時可現查、且查得出真假」
          # 的解除判準（見下），並由 test_workflow_permission_concurrency_lock.py 的
          # TestRootInfraNightlyStalenessSentinel 機械禁止該欄再出現日曆日期。
          # WAIVER_UNTIL 仍是日期——那是**豁免視窗的界線**（反 fail-open 三道保險之一，
          # 到期即自動恢復阻斷），不是對世界的事實宣稱，兩者不可混為一談。
          WAIVER_UNTIL: "2026-08-26"
          WAIVER_REASON: "DEF-101-703／DEF-101-081：根因＝GitHub 帳務／額度平面阻擋 runner 配置（非 workflow 定義缺陷，本 repo 無可修處）。解除判準=本 step 印出的 never-started 統計回到 0/N（＝runner 真的被配置）後，把 WAIVER_UNTIL 清成空字串；不得以「日期到了」當解除依據"
          MAX_WAIVER_DAYS: "21"
          # advisory 巡檢的粗門檻（見 run: 內該段的取捨說明）。刻意單一數字而非
          # 逐檔依 cron 週期計算：advisory 不擋路，精算留給本機那支逐軌偵測器。
          ADVISORY_MAX_AGE_DAYS: "8"
        run: |
          set -euo pipefail
          now=$(date -u +%s)
          # --- 豁免設定的合法性先驗（壞掉一律 fail-loud，不進入判斷主體）---------
          waiver_deadline=0
          if [ -n "${WAIVER_UNTIL}" ]; then
            if ! waiver_deadline=$(date -u -d "${WAIVER_UNTIL} 23:59:59" +%s 2>/dev/null); then
              echo "::error::WAIVER_UNTIL='${WAIVER_UNTIL}' 無法解析為 UTC 日期（YYYY-MM-DD）——豁免設定壞掉時一律 fail-loud，不得靜默當成「沒有豁免」或「永久豁免」"
              exit 1
            fi
            if [ -z "${WAIVER_REASON}" ]; then
              echo "::error::設了 WAIVER_UNTIL 卻沒有 WAIVER_REASON——無理由的豁免＝無法稽核的 fail-open"
              exit 1
            fi
            if [ "$(( (waiver_deadline - now) / 86400 ))" -gt "${MAX_WAIVER_DAYS}" ]; then
              echo "::error::WAIVER_UNTIL='${WAIVER_UNTIL}' 距今超過 ${MAX_WAIVER_DAYS} 天——豁免視窗上限存在的唯一理由就是杜絕「填一個很遠的日期」把阻斷式哨兵變成永久假綠"
              exit 1
            fi
          fi
          if [ "$waiver_deadline" -gt "$now" ]; then lvl=warning; else lvl=error; fi
          # --- 逐 workflow 查活性（schedule 與 workflow_dispatch 兩事件都算）-------
          stale=0
          for wf in windows-compat-ci.yml macos-compat-ci.yml; do
            echo "── ${wf}"
            latest=$(gh run list --repo "${GITHUB_REPOSITORY}" --workflow "$wf" \
                       --event schedule --limit 1 --json conclusion,createdAt,url \
                       --jq '.[0] // {} | "\(.conclusion // "(無)")  \(.createdAt // "-")  \(.url // "-")"' \
                     || echo "(gh API 查詢失敗)")
            echo "   最近一次 schedule run：${latest}"
            # 🔴 R77：run 層 `conclusion` **結構上**分不出「runner 從未被配置」與「測試
            # 真的紅了」——兩者都是 failure。job 層的 `steps` 長度是唯一分得出來的欄位：
            # 帳務／額度阻擋時 GitHub 連 step 都不會建立，長度恆 0。本段把它算成
            # never-started=<零步驟 job 數>/<job 總數> 印出來，於是下方「處置」那段從
            # 「請你自己去查 job steps 長度」變成**已經查好的量測值**，而豁免理由的解除
            # 判準也因此有了可現查的載體（不必再靠一個會過期的日期宣稱）。
            # 刻意**不**讓它影響 rc：帳務平面本 repo 無可修處，升成阻斷就是 R68 死鎖形狀。
            run_id=$(gh run list --repo "${GITHUB_REPOSITORY}" --workflow "$wf" \
                       --event schedule --limit 1 --json databaseId \
                       --jq '.[0].databaseId // empty' \
                     || echo "")
            never="(查不到 run id：該軌從未產生過 schedule run，或 gh API 查詢失敗)"
            if [ -n "$run_id" ]; then
              never=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs" \
                        --jq '"\([.jobs[] | select((.steps|length)==0)] | length)/\(.jobs | length)"' \
                      || echo "(gh API 查詢失敗)")
            fi
            echo "   job 層 never-started（steps 長度為 0 的 job 數／job 總數）：${never}"
            case "$never" in
              0/*)
                ;;
              *)
                echo "::notice::${wf} 最近一次 schedule run 內有 job 從未啟動（${never}）——這是 runner 未被配置（GitHub 帳務／額度平面），**不是**測試紅；本 repo 內無可修處，解除判準見本 step 的 WAIVER_REASON"
                ;;
            esac
            last=""
            for ev in schedule workflow_dispatch; do
              t=$(gh run list --repo "${GITHUB_REPOSITORY}" --workflow "$wf" \
                    --event "$ev" --status success --limit 1 \
                    --json createdAt --jq '.[0].createdAt // empty' \
                  || echo "")
              echo "   最近一次 ${ev} 成功：${t:-（無）}"
              if [ -n "$t" ] && { [ -z "$last" ] || [[ "$t" > "$last" ]]; }; then last="$t"; fi
            done
            if [ -z "$last" ]; then
              echo "::${lvl}::${wf} 查無任何**成功**的 schedule／workflow_dispatch run（或 gh API 查詢失敗）——該 workflow 的 *-nightly-full 是唯一會在真 Windows／真 macOS 上跑完整測試樹的通道，查不到成功紀錄等同該通道從未被證實可用"
              stale=1
              continue
            fi
            age=$(( (now - $(date -u -d "$last" +%s)) / 86400 ))
            echo "   ⇒ 採計最近一次成功：${last}（${age} 天前）"
            if [ "$age" -gt "$MAX_AGE_DAYS" ]; then
              echo "::${lvl}::${wf} 的 *-nightly-full 已 ${age} 天沒有成功執行（門檻 ${MAX_AGE_DAYS} 天）——真機深度回歸通道處於死亡狀態，此期間任何「CI 全綠」宣稱都只涵蓋 push 事件"
              stale=1
            fi
          done
          # --- 其餘含 cron 的 workflow：advisory 巡檢（永不影響本 step 的 rc）-----
          # 🔴 R71 取捨（為何**不**把它們併進上面那個阻斷迴圈）：那道是 push 閘
          # （exit 1）。今天含 cron 的 workflow 有 7 支，其中 4 支是**日頻**——任何
          # 一條日頻軌紅一天，整個 repo 的 push 就被雲端狀態綁架，而本道自己的檔頭
          # 已經寫明它與被偵測者同屬 GitHub Actions 計費平面（帳務一掛全部一起紅）。
          # 阻斷射程刻意只留兩支**真機週頻**軌：它們是 DEF-101-703 的主角，且週頻
          # 軌結構上不可能被日常 push 順手發現（最新一筆 run 永遠是 push 的）。
          # 其餘一律「大聲印、不擋路」——覆蓋面補齊，代價不轉嫁到主線。
          # 掃描面**現查**（不寫死第二份清單）：凡 .github/workflows/*.yml 內有未被
          # 註解掉的 cron 即納入，扣掉上面已阻斷的那兩支。新增排程 workflow 自動納管。
          echo "── advisory：其餘含 cron 的排程軌（只印不擋，見上方取捨說明）"
          advisory_list=""
          for wf_path in .github/workflows/*.yml; do
            wf_base=$(basename "$wf_path")
            case "$wf_base" in windows-compat-ci.yml|macos-compat-ci.yml) continue;; esac
            if grep -qE '^[[:space:]]*-[[:space:]]*cron:' "$wf_path"; then
              advisory_list="${advisory_list} ${wf_base}"
            fi
          done
          for advisory_wf in $advisory_list; do
            row=$(gh run list --repo "${GITHUB_REPOSITORY}" --workflow "$advisory_wf" \
                    --event schedule --limit 1 --json conclusion,createdAt,url \
                    --jq '.[0] // {} | "\(.conclusion // "(無結論)")|\(.createdAt // "")|\(.url // "-")"' \
                  || echo "(gh 查詢失敗)||-")
            a_concl=${row%%|*}; a_rest=${row#*|}; a_when=${a_rest%%|*}; a_url=${a_rest#*|}
            a_age=-1
            if [ -n "$a_when" ]; then
              if a_epoch=$(date -u -d "$a_when" +%s 2>/dev/null); then
                a_age=$(( (now - a_epoch) / 86400 ))
              fi
            fi
            # E-1：同檔多條 cron 驅動不相交 job 集合時，run 層結論分辨不出哪條軌活著
            # （實證：autoclaude-ci.yml 的 `7 3` run 綠，而同一 run 裡 `7 2` 那組 job
            #  是 skipped/steps=0；同日 `7 2` 的 run 才是真實測試紅）。
            a_crons=$(grep -cE '^[[:space:]]*-[[:space:]]*cron:' ".github/workflows/${advisory_wf}")
            a_multi=""
            if [ "$a_crons" -gt 1 ]; then
              a_multi="；⚠️ 此檔 ${a_crons} 條 cron ⇒ run 層結論分辨不出哪一條軌活著"
            fi
            echo "   ${advisory_wf}：最近一次 schedule run＝${a_concl}（${a_when:-從未觸發}，${a_url}）${a_multi}"
            if [ "$a_concl" != "success" ] || [ "$a_age" -gt "$ADVISORY_MAX_AGE_DAYS" ]; then
              echo "::warning::${advisory_wf} 的排程軌最近一次觸發為 ${a_concl}（${a_when:-從未觸發}）——本段是 advisory、刻意不擋 push（避免把全 repo 的 push 綁在雲端狀態上），但這條兜底軌目前不成立，別把「四支 CI 全綠」讀成排程軌也綠"
            fi
          done
          if [ "$stale" -ne 0 ]; then
            echo "處置：先看上面印出的『最近一次 schedule run』結論——"
            echo "  · 結論為 failure 且該 run 的 job steps 長度為 0 ⇒ 帳務／額度停擺（DEF-101-081/703），須先恢復帳務，本 repo 內改不掉；"
            echo "  · 帳務正常但仍陳舊 ⇒ 對 HEAD 各補跑一次：gh workflow run windows-compat-ci.yml / gh workflow run macos-compat-ci.yml"
            echo "    （該指令產生 event=workflow_dispatch 的 run，本道**有**把它算進來，所以照著做真的能解除；R68 原版只查 schedule，照做也解不開）"
            if [ "$lvl" = "warning" ]; then
              echo "⚠️ 本次以**顯式豁免**通過：WAIVER_UNTIL=${WAIVER_UNTIL}（UTC 該日結束）／理由：${WAIVER_REASON}"
              echo "⚠️ 豁免到期後本道自動恢復阻斷——不續期就會自己紅回來，這是刻意設計，不是漏洞。"
              exit 0
            fi
            echo "🔴 本道刻意阻斷（非 warning）：nightly-full 自己就是非阻斷 job，再加一層非阻斷等於複製病因。"
            echo "🔴 若根因確定在本 repo 之外（例如帳務平面）而需要時間，請設 WAIVER_UNTIL/WAIVER_REASON（上限 ${MAX_WAIVER_DAYS} 天），不要拆掉本道。"
            exit 1
          fi
          echo "✅ 兩支 *-nightly-full 的最近一次成功執行皆在 ${MAX_AGE_DAYS} 天內"
          if [ -n "${WAIVER_UNTIL}" ]; then
            echo "::warning::兩軌皆新鮮，WAIVER_UNTIL='${WAIVER_UNTIL}' 已無必要——請刪除該豁免，避免它變成沒人記得的常駐家具（豁免留著＝下次真的死掉時會被靜默吃掉）"
          fi
