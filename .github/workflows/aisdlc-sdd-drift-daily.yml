# AISDLC-SDD — Drift Daily Report (Phase G M4 / ACT-040, Rule 9.17.4)
#
# Placement: **active workflow at repo root** (framework dogfood Rule 9.17.4).
# monorepo 根層接線（2026-07-10）：自 AISDLC_SDD/.github/workflows/drift-daily.yml
# 遷入 monorepo 根層 .github/workflows/；working-directory 改 AISDLC_SDD/ 前綴。
# Sibling actively-scheduled workflow: aisdlc-sdd-fsm-chaos-nightly.yml (Rule 9.9.4).
# Contrast with `AISDLC_SDD/AISDLC_SDD_v0.01/.github/workflows/hub-push.yml` which stays
# nested as reference-only (intended for downstream Hub Registry repo).
#
# Generates one DAILY-{YYYY-MM-DD}.md per day from accumulated COMMIT-*.yaml
# drift records. Advisory only — never fails main; never blocks PRs.
#
# Schedule rationale:
#   - 02:33 UTC offset from chaos (02:03) to avoid runner contention. Nudged
#     3 min off the exact half-hour (R16 SCAN-C-4: GitHub recommends avoiding
#     :00/:30 to reduce scheduling delay risk); the weekly arch-fitness
#     nightly-strict job is intentionally scheduled a few minutes after this
#     one (02:37 on Mondays), preserving "daily runs, then weekly follows".
#   - `workflow_dispatch` for ad-hoc backfill / verification.
#
# Output: AISDLC_SDD/AISDLC_SDD_v0.01/build/reports/drift/DAILY-YYYY-MM-DD.md
#         （R40 起：AISDLC_SDD_v0.01/build/reports/drift/DAILY-*.md 已 git-ignore
#          — v0.01 為 ci-gate 凍結基線，不可再被自動化 bot 原地寫入。本 job 仍每日
#          從已入庫的 COMMIT-*.yaml 重算報告，但只上傳為 CI artifact，不再
#          commit/push 回 main；歷史保留改依 artifact retention，不依賴 git log。）
# Spec:   cicd/SDD_CICD_BASE_LAYER.md §Drift Daily Report

name: drift-daily

on:
  schedule:
    - cron: "33 2 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Override report date (YYYY-MM-DD). Empty = today UTC."
        required: false
        default: ""

jobs:
  daily:
    name: emit DAILY drift report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # R40 起：本 job 不再 commit/push 回 main（DAILY-*.md 已 git-ignore，v0.01 凍結
    # 基線不可再被原地寫入），故先前與 arch-fitness nightly-strict 共用的
    # `main-push-serialize` 併發群組／push 競爭序列化已無必要，一併移除；
    # contents 權限降為 read-only（僅 checkout + upload-artifact，不再需要 write）。
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: AISDLC_SDD/AISDLC_SDD_v0.01
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Generate DAILY report
        id: gen
        working-directory: AISDLC_SDD/AISDLC_SDD_v0.01
        env:
          OVERRIDE_DATE: ${{ github.event.inputs.date }}
        run: |
          python - <<'PY'
          import os, sys
          from tools.fsm_runtime.drift_monitor import write_daily_report
          override = os.environ.get("OVERRIDE_DATE", "").strip()
          path = write_daily_report(date=override or None)
          print(f"GENERATED::{path}")
          # Surface to step summary
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write(f"## Drift Daily Report\n\nGenerated: `{path}`\n\n")
              f.write(
                  "> v0.01 為 ci-gate 凍結基線，本報告不再 commit 回 repo"
                  "（build/reports/drift/DAILY-*.md 已 git-ignore）；"
                  "僅供人工透過下方 artifact 訂閱查看。\n"
              )
          PY

      - name: Upload DAILY report (artifact — 凍結基線不回寫 git)
        if: always()
        continue-on-error: true   # observability-only；artifact 配額耗盡不得判紅（比照 arch-fitness）
        uses: actions/upload-artifact@v5
        with:
          name: drift-daily-report
          path: AISDLC_SDD/AISDLC_SDD_v0.01/build/reports/drift/DAILY-*.md
          retention-days: 90
