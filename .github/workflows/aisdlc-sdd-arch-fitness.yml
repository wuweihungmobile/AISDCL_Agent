# AISDLC-SDD — Architecture Fitness（演化式架構守門 / Framework Self-Evolution SENSE）
#
# 對應：
#   - workflow/sdd-self-evolution/SDD_SELF_EVOLUTION.md（FSE_SENSE / FSE_VERIFY 量測）
#   - tools/arch_fitness/arch_fitness.py（FF-1~FF-14 全數實作：三源/governance/孤兒/觀測態/§9/
#     連結/引用/規則強制可追溯/Scaffold-ROI/死規則/Skill frontmatter/critical 錯置/Agent YAML/
#     CI workflow 工具模組引用）
#   - nightly 以 --trend 把每次排程（R14 起每週一）score 寫入 build/reports/fse/TREND.yaml（R4 趨勢可觀測；
#     R40 起改僅上傳 CI artifact，不再 commit 回 build/reports/fse/TREND.yaml — 見下方 R40 說明）
#
# 雙軌（呼應框架 advisory vs blocking 哲學，Rule 9.11.3）：
#   1. pr-advisory   — 每個 PR 跑非 strict，把 fitness 報告貼進 Step Summary；
#                      永遠 exit 0、絕不阻擋（governance 遷移等屬漸進式 advisory）。
#   2. nightly-strict— 每週一 02:37 UTC 跑 --strict（R16 SCAN-C-4：由 02:30 錯開
#                      3~7 分避開整點/半點並讓 drift-daily 的 02:33 先行；R14
#                      CI-2 額度裁決由每日降週頻。
#                      每日兜底＝mac 本地 nightly sdd 軌：macos_smoke→ci-gate.sh 內含
#                      arch_fitness --strict 雙軌 v0.01+LATEST，覆蓋較本 job 的 v0.01
#                      單軌更廣；Windows 7-stage 無 arch-fitness 軌，此兜底為 mac 單腿
#                      且以心跳哨兵取證——R14 SCAN-CI-4 精確化）；structural fail（FF-1 不一致 /
#                      FF-3 孤兒 / FF-4 ∩Terminals / FF-8 規則無有效強制測試 /
#                      FF-9 scaffold_roi 基座缺漏 / FF-10 死規則 / FF-11 skill frontmatter 不全 /
#                      FF-12 critical 規則錯置 / FF-14 workflow 引用不存在的工具模組）即紅，
#                      作為架構回歸硬守門。
#                      R40 起：build/reports/fse/TREND.yaml 已 git-ignore（v0.01 凍結基線
#                      不可再被原地寫入，且比照 v0.05+ 既有政策——該檔本為純本地/單次
#                      執行磁碟輸出，非跨 CI run 累積），本 job 不再 commit/push 回 main；
#                      --trend 仍每次執行寫入單次 score entry，隨 arch-fitness.json 一併
#                      只上傳為 CI artifact（90 天保留，用以彌補失去 git 歷史後的可觀測期）。
#
# Runner：ubuntu-latest。downstream 採用者複製本檔到自家 repo root；
#         若框架碼不在 AISDLC_SDD_v0.01/ 下，僅需改 working-directory。
#
# monorepo 根層接線（2026-07-10）：自 AISDLC_SDD/.github/workflows/arch-fitness.yml
# 遷入根層；working-directory 與 artifact path 全部改 AISDLC_SDD/ 前綴（repo 根視角），
# PR 觸發加 AISDLC_SDD/** paths 過濾；schedule 不受 paths 影響。

name: arch-fitness

on:
  pull_request:
    paths:
      - "AISDLC_SDD/**"
      - ".github/workflows/aisdlc-sdd-arch-fitness.yml"
  schedule:
    - cron: "37 2 * * 1"   # 每週一 02:37 UTC（R14 CI-2 降頻；R16 SCAN-C-4 由 02:30 錯開避開整點/半點），排在 fsm-chaos-nightly(02:03)/drift-daily(02:33) 之後
  workflow_dispatch:

# PR-advisory 併發以分支序列化（同分支新 push 取消舊跑，省 runner）。
# R40 起 nightly-strict 不再 push main，先前與 drift-daily 共用的
# `main-push-serialize` 序列化群組已移除（見下方 job 註解）。
concurrency:
  group: arch-fitness-${{ github.ref }}
  cancel-in-progress: true

# R15 SCAN-C-4（比照 autoclaude-ci.yml R13 CI-7）：顯式最小權限——先前全檔未宣告
# workflow 層 permissions，pr-advisory job 零宣告即繼承 repo 預設（可能為 write-all）。
# pr-advisory 僅 checkout / setup-python / 跑 fitness / upload-artifact（artifact 走
# ACTIONS_RUNTIME_TOKEN，不受本區塊限制）→ contents: read 即足；R40 起 nightly-strict
# 亦不再需要 write（TREND.yaml 已 git-ignore，不再回寫），兩 job 統一繼承本層 read-only。
permissions:
  contents: read

jobs:
  pr-advisory:
    name: architecture fitness (advisory)
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install deps
        working-directory: AISDLC_SDD/AISDLC_SDD_v0.01
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt
      - name: Run fitness (advisory, never blocks)
        working-directory: AISDLC_SDD/AISDLC_SDD_v0.01
        run: |
          # 一次跑：印報告到 stdout 並寫 JSON artifact；|| true 確保永不阻擋 PR
          report="$(python -m tools.arch_fitness.arch_fitness --json arch-fitness.json || true)"
          {
            echo "### 架構適應度報告（advisory）"
            echo ""
            echo '```'
            echo "${report}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
      - name: Upload findings
        if: always()
        continue-on-error: true   # observability-only；artifact 配額耗盡不得判紅
        uses: actions/upload-artifact@v6
        with:
          name: arch-fitness-findings
          path: AISDLC_SDD/AISDLC_SDD_v0.01/arch-fitness.json
          retention-days: 7

  nightly-strict:
    name: architecture fitness (strict gate)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # R40 起：本 job 不再 commit/push 回 main（TREND.yaml 已 git-ignore），故先前
    # 與 drift-daily 共用、用來序列化推送的 `main-push-serialize` 併發群組已無必要，
    # 一併移除；contents 權限降回 workflow 層預設 read-only（不再需要 write）。
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install deps
        working-directory: AISDLC_SDD/AISDLC_SDD_v0.01
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt
      - name: Run fitness (strict + trend)
        id: fitness
        working-directory: AISDLC_SDD/AISDLC_SDD_v0.01
        run: |
          # --strict：structural fail → exit 2；advisory warn → exit 1。
          # --trend：把本次 score 寫進 TREND.yaml。R40 起 TREND.yaml 已 git-ignore，
          # ephemeral CI checkout 每次都讀不到前次入庫檔，故本檔僅含本次單筆 entry
          # （非跨 run 累積）；累積趨勢改依下方 artifact 逐週保留取得，不再靠 git 提交。
          set +e
          report="$(python -m tools.arch_fitness.arch_fitness --strict \
                      --json arch-fitness.json --trend build/reports/fse/TREND.yaml)"
          code=$?
          echo "arch_fitness exit=${code}"
          echo "code=${code}" >> "${GITHUB_OUTPUT}"
          {
            echo "### 架構適應度（nightly strict）— exit=${code}"
            echo ""
            echo '```'
            echo "${report}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
          exit 0
      - name: Upload findings + trend (artifact — 凍結基線不回寫 git)
        if: always()
        continue-on-error: true   # observability-only；artifact 配額耗盡不得判紅
        uses: actions/upload-artifact@v6
        with:
          name: arch-fitness-findings-nightly
          path: |
            AISDLC_SDD/AISDLC_SDD_v0.01/arch-fitness.json
            AISDLC_SDD/AISDLC_SDD_v0.01/build/reports/fse/TREND.yaml
          retention-days: 90   # R40 起彌補失去 git 歷史後的可觀測期（原 7 天）
      - name: Enforce strict gate
        if: always()
        run: |
          # structural fail（exit 2）才把 nightly 判紅；advisory warn（exit 1）放行。
          if [ "${{ steps.fitness.outputs.code }}" -ge 2 ]; then
            echo "::error::arch_fitness 偵測到 structural fail（FF-1/3/4 等）"
            exit 1
          fi
