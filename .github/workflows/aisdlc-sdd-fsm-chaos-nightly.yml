# AISDLC-SDD — FSM Runtime Chaos Nightly (ACT-029 P1-04, Rule 9.9.4)
#
# Dual purpose:
#   1. **Framework repo dogfood** — actively scheduled here at repo root so
#      AISDLC-SDD self-enforces Rule 9.9.4 (nightly Chaos verification of its
#      own runtime). Required, not optional.
#   2. **Downstream reference** — the same yaml is what downstream repos
#      adopting AISDLC-SDD should copy to their own `.github/workflows/`.
#      No path adjustment needed; only `working-directory` may differ if the
#      downstream repo doesn't keep framework code under `AISDLC_SDD_v0.01/`.
#
# monorepo 根層接線（2026-07-10）：自 AISDLC_SDD/.github/workflows/fsm-chaos-nightly.yml
# 遷入 monorepo 根層；working-directory / artifact path 改 AISDLC_SDD/ 前綴，
# track-streak 的 WORKFLOW_FILE 同步改為 aisdlc-sdd-fsm-chaos-nightly.yml。
#
# Schedule rationale:
#   - Daily at 02:03 UTC keeps chaos runs off the critical PR path while
#     exercising the full §ACT-029 suite (the chaos-marked pytest suite + 100-round sweep)
#     on a predictable cadence. Offset by a few minutes off the top of the
#     hour (R16 SCAN-C-4: GitHub recommends avoiding exact :00/:30 to reduce
#     scheduling delay risk); still the earliest of the 02:0x/02:3x/03:0x tier
#     chain (drift-daily / arch-fitness / artifact-cleanup / mutation-test-
#     tokenguard-nightly all intentionally scheduled after this one).
#   - `workflow_dispatch` allows manual re-runs during incident triage.
#
# Runner lock-in:
#   - `ubuntu-latest` only. POSIX-only substitutions (seed via Python) plus
#     the `pytest` marker scheme assume Unix semantics. See
#     cicd/SDD_CICD_BASE_LAYER.md §fsm_chaos_check for portability notes.

name: fsm-chaos-nightly

# 僅與「本 workflow 自身」序列化（防同一 nightly 重疊跑），不與其他 workflow 共用
# group——chaos 不 push，無推送競爭，故不需加入 main-push-serialize。永不取消進行中
# 的 chaos sweep（cancel-in-progress: false）。
concurrency:
  group: fsm-chaos-nightly
  cancel-in-progress: false

# R13 CI-7：workflow 層顯式最小權限——chaos job 先前未宣告（繼承 repo 預設，可能為
# write-all），其步驟僅 checkout / pytest / chaos_runner / upload-artifact（artifact
# 走 ACTIONS_RUNTIME_TOKEN，不受此限）→ contents: read 即足。track-streak-and-lock
# 已有 job 層 permissions（actions/contents/issues）——job 層宣告整塊覆寫本區塊，
# 其 gh issue create 等寫行為不受影響。
permissions:
  contents: read

on:
  schedule:
    # 02:03 UTC daily — out of the PR hotpath, before APAC working hours so
    # failures surface early for the engineering lead. 03 分偏移見上方
    # Schedule rationale（R16 SCAN-C-4，避開整點）。
    - cron: "3 2 * * *"
  workflow_dispatch:
    inputs:
      rounds:
        description: "Chaos rounds to run (default 100)"
        required: false
        default: "100"

jobs:
  chaos:
    name: fsm-runtime chaos suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: AISDLC_SDD/AISDLC_SDD_v0.01
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Compute reproducible seed from date
        id: seed
        run: |
          # Cross-runner safe: avoid `date +%Y%m%d` (GNU/BSD drift, no-op on
          # Windows). Python's stdlib is always present and deterministic.
          SEED=$(python -c "import datetime; print(datetime.date.today().strftime('%Y%m%d'))")
          echo "seed=${SEED}" >> "$GITHUB_OUTPUT"
          echo "Using seed=${SEED}"

      - name: Run chaos-marked pytest suite
        working-directory: AISDLC_SDD/AISDLC_SDD_v0.01
        run: |
          # 🔴 DEF-200-274 D6：實作階段偏離原設計，如實記錄——docs/06_quality/
          # CrossPlatform_DEF200274_Parallel_Tests_Evidence.md〈第九輪〉
          # 結構分析認為 chaos 測試對平行化無害，本輪原照掌舵者裁決加了
          # `-n auto --dist worksteal`，但實作階段對同一份 `tools/fsm_runtime/tests/`
          # （working-directory 固定 v0.01＝凍結基線）實測發現
          # `tools/fsm_runtime/snapshot.py::save_abort_report()` 對「同日同 category」
          # 的 abort 報告使用共用檔案路徑，多個 xdist worker 並行寫入同一路徑時會
          # 競態（`-m "not chaos"` 全套連續 9 次實測 3 次翻紅；根因與逐次結果見
          # ci-gate.sh 內對應註記與回報「先紅再綠 / 偏離設計」一節）。v0.01 是凍結
          # 基線、依規則不可原地改此檔修競態；chaos 套件雖本輪 4 次試跑未重現，但
          # 同一個不可修的根因存在、且本 job 只跑這一顆凍結基線，維持序列較保守。
          # 加速空間本就有限（34 支測試、序列 <10s），不值得為它保留一個無法在原地
          # 修復的競態風險。若日後想重新啟用，見上方分析與 §6.5 的可逆收斂建議。
          # `-p no:xdist`：本 job 無 addopts 強制平行，加此旗標只是把「本來就
          # 序列跑」的事實顯式化（零行為改變），供 pytest 呼叫站點普查鎖辨識。
          python -m pytest tools/fsm_runtime/tests/ -m chaos -v -p no:xdist

      - name: Run 100-round chaos sweep
        working-directory: AISDLC_SDD/AISDLC_SDD_v0.01
        env:
          CHAOS_ROUNDS: ${{ github.event.inputs.rounds || '100' }}
        run: |
          python -m tools.fsm_runtime.chaos_runner \
            --rounds "${CHAOS_ROUNDS}" \
            --seed "${{ steps.seed.outputs.seed }}" \
            --json > chaos-report.json
          cat chaos-report.json | python -c "import json,sys; d=json.load(sys.stdin); print(f\"bounded={d['bounded_rounds']}/{d['total_rounds']} avg_tokens={d['avg_tokens']} max_steps={d['max_steps']}\")"

      # Artifact upload is observability-only; it MUST NOT fail the gate. The
      # actual chaos verdict is the pytest + sweep steps above. GitHub artifact
      # storage quota exhaustion previously turned green chaos runs red here —
      # `continue-on-error` makes upload best-effort, low retention curbs quota.
      - name: Upload chaos report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: fsm-chaos-report-${{ steps.seed.outputs.seed }}
          path: AISDLC_SDD/AISDLC_SDD_v0.01/chaos-report.json
          retention-days: 7

  # DEF-200-379（掌舵者裁決：加軌＋觀察期）— LATEST 演化版軌，與上方 `chaos`
  # job（凍結基線 AISDLC_SDD_v0.01）獨立、並行、互不相依（無 needs）。
  #
  # 為何本軌能平行跑而 `chaos` job 不能：上方 `chaos` job 的
  # `-p no:xdist` 是刻意序列，因為凍結基線的 `tools/fsm_runtime/snapshot.py::
  # save_abort_report()` 仍是舊版固定檔名 `.tmp`，多 worker 並行寫入會競態
  # （見該 job 註解與 AISDLC_SDD/scripts/ci-gate.sh 同款差異化判準）。LATEST 版
  # 已把該函式改為 `_atomic_write_text` 原子寫入，不受此競態影響 ⇒ 本軌帶
  # `-n auto --dist worksteal`（本機 2026-09-24 連續 10 次實測全綠，rc=0、
  # 34 passed、wall 16.3~17.6s，見 DEF-200-379 回報）。
  #
  # 🔴 觀察期（DEF-200-379）：本 job 失敗**不計入** Rule 9.9.4「連 3 日 nightly
  # 失敗鎖定 main」——雙重機制保證，不是只靠 `needs`：
  #   (a) 下方 `track-streak-and-lock` 的 `needs: chaos` 未變，天然只綁上方
  #       凍結基線軌，本 job 不在其依賴圖內；
  #   (b) 更根本的一層——`track-streak-and-lock` 的連敗查詢邏輯本身已改讀
  #       **job 層**（見該 job 的 `GATING_JOB_NAMES` 環境變數，現值＝上方
  #       `chaos` job 的顯示名）：即使同一個 workflow run 內本 job 紅導致
  #       run 層 `conclusion=failure`，只要 `GATING_JOB_NAMES` 不含本 job 的
  #       顯示名，連敗計數就不會把這種夜晚算進去（三位複審一致命中：修復前
  #       只讀 run 層 conclusion，觀察期形同虛設）。
  # 觀察期＝**首次排程 run 起連續 7 次排程 run**（`workflow_dispatch` 手動
  # 觸發不計入觀察期計數），最早 **2026-10-03**（下一個排程 02:03 UTC）起算
  # 七次；出口條件與升級動作（觀察期滿後是否／如何把本 job 的顯示名
  # `fsm-runtime chaos suite (LATEST track — observation period, DEF-200-379)`
  # 加入 `GATING_JOB_NAMES`、進而併入 Rule 9.9.4 鎖 main 判定）由掌舵者於
  # 觀察期滿後裁決——本段註解與 `GATING_JOB_NAMES`／`track-streak-and-lock`
  # 的 `needs` 屆時再訂正（見缺陷帳本 DEF-200-379 後續列）。
  chaos-latest:
    name: fsm-runtime chaos suite (LATEST track — observation period, DEF-200-379)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # LATEST 版號不得寫死（AISDLC_SDD/CLAUDE.md〈版本狀態〉：LATEST 一律現查
      # `sdd_version.py`）；本步驟在 repo 根呼叫，輸出寫入 GITHUB_OUTPUT 供後續
      # step 的 `working-directory` 引用。
      - name: Resolve LATEST version
        id: latest_version
        run: |
          VERSION=$(python AISDLC_SDD/scripts/sdd_version.py)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Using LATEST version=${VERSION}"

      - name: Install dependencies
        working-directory: AISDLC_SDD/${{ steps.latest_version.outputs.version }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Compute reproducible seed from date
        id: seed
        run: |
          # Cross-runner safe: avoid `date +%Y%m%d` (GNU/BSD drift, no-op on
          # Windows). Python's stdlib is always present and deterministic.
          SEED=$(python -c "import datetime; print(datetime.date.today().strftime('%Y%m%d'))")
          echo "seed=${SEED}" >> "$GITHUB_OUTPUT"
          echo "Using seed=${SEED}"

      # 跨 leg CPU 預算（DEF-200-289 同款鏈：`ci-gate.sh`／`ci-gate.ps1` 的
      # `[cpu_budget] broadcast workers=N source=cpu_budget` 可稽核字面）。
      # `cpu_budget.py` 在 `GITHUB_ACTIONS=true`（Actions runner 恆真）下走
      # headless 分支（純邏輯核，CAP=18），不需要 psutil。算不出來（腳本缺席
      # 或執行失敗）一律靜默跳過、不擋本 job——worker 數只影響快慢。
      - name: Broadcast cpu_budget worker count
        run: |
          WORKERS="$(python tools/lib/cpu_budget.py --legs 1 2>/dev/null || true)"
          case "${WORKERS}" in
            ''|*[!0-9]*)
              echo "⚠️ cpu_budget 廣播跳過：tools/lib/cpu_budget.py 不存在或執行失敗（fail-open）"
              ;;
            *)
              echo "AUTOSDD_PARALLEL_TESTS_WORKERS=${WORKERS}" >> "$GITHUB_ENV"
              echo "PYTEST_XDIST_AUTO_NUM_WORKERS=${WORKERS}" >> "$GITHUB_ENV"
              echo "[cpu_budget] broadcast workers=${WORKERS} source=cpu_budget"
              ;;
          esac

      - name: Run chaos-marked pytest suite (LATEST track, parallel)
        working-directory: AISDLC_SDD/${{ steps.latest_version.outputs.version }}
        run: |
          # LATEST 版 `conftest.py` re-export 共用層的 `pytest_xdist_auto_num_workers`／
          # `pytest_xdist_setupnodes` hook（見本步驟 working-directory 所指的 LATEST
          # 版樹 conftest.py，DEF-200-353；版號一律經上方 Resolve LATEST version 步驟
          # 解析，此處不寫死）：本步驟會印 `[cpu_budget] xdist workers=<N> source=env`
          # （上一步已匯出 `PYTEST_XDIST_AUTO_NUM_WORKERS`）與
          # `[cpu_budget] xdist nodes confirmed=<N>` 兩行可稽核字面，接住上方的
          # broadcast 鏈。`-n auto --dist worksteal`：見本 job 頂部 WHY（原子寫入
          # 已修競態，本機連續 10 次實測全綠）。
          python -m pytest tools/fsm_runtime/tests/ -m chaos -v -n auto --dist worksteal

      - name: Run 100-round chaos sweep
        working-directory: AISDLC_SDD/${{ steps.latest_version.outputs.version }}
        env:
          CHAOS_ROUNDS: ${{ github.event.inputs.rounds || '100' }}
        run: |
          python -m tools.fsm_runtime.chaos_runner \
            --rounds "${CHAOS_ROUNDS}" \
            --seed "${{ steps.seed.outputs.seed }}" \
            --json > chaos-report.json
          cat chaos-report.json | python -c "import json,sys; d=json.load(sys.stdin); print(f\"bounded={d['bounded_rounds']}/{d['total_rounds']} avg_tokens={d['avg_tokens']} max_steps={d['max_steps']}\")"

      # 理由同上方 `chaos` job 的姊妹步驟：artifact 上傳僅供觀測，不得讓 gate 翻紅。
      # artifact 名稱加 `-latest` 後綴以與凍結基線軌區分（DEF-200-379）。
      - name: Upload chaos report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: fsm-chaos-report-latest-${{ steps.seed.outputs.seed }}
          path: AISDLC_SDD/${{ steps.latest_version.outputs.version }}/chaos-report.json
          retention-days: 7

  # QA Round-3 P1-02 — enforce Rule 9.9.4「連 3 日 nightly 失敗鎖定 main」.
  # Runs only when the chaos job failed. Queries the most recent completed
  # nightly runs; if ≥3 consecutive failures are confirmed, opens a P0 issue
  # and attempts to tighten branch protection on `main`. Both side-effects
  # are best-effort (`continue-on-error: true`) — the workflow never masks a
  # chaos failure because the post-fail automation threw.
  track-streak-and-lock:
    name: enforce 3-day streak lockdown
    runs-on: ubuntu-latest
    timeout-minutes: 10   # R14 QA-R14-RR-1：輕量 streak 判定 job，補 timeout 防卡死燒滿 360 分鐘
    needs: chaos
    if: failure()
    permissions:
      actions: read
      contents: read
      issues: write
      # NOTE: branch-protection API requires `repo` / `administration:write`
      # scope on the token, which CANNOT be granted via this `permissions:`
      # block (only `actions`, `contents`, `issues`, etc. are valid here per
      # GitHub's schema; using an invalid key like `administration` causes
      # the entire workflow to fail validation).
      # The "Tighten branch protection on main" step below thus runs with
      # GITHUB_TOKEN lacking admin scope; it will hit 403 and gracefully
      # log `::warning::` per its `continue-on-error: true`. To enable real
      # auto-tightening, store a PAT (or fine-grained token) with admin
      # scope as repo secret `BRANCH_PROTECTION_PAT` and switch the step's
      # `GH_TOKEN` env to `${{ secrets.BRANCH_PROTECTION_PAT }}`.
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Query recent nightly run conclusions
        id: streak
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WORKFLOW_FILE: aisdlc-sdd-fsm-chaos-nightly.yml
          # 🔴 DEF-200-379（三位複審一致命中）：本值必須與 `chaos` job 的顯示名
          # （上方 `jobs.chaos.name`）逐字一致——job 顯示名沒有共用來源（GitHub
          # Actions 的 `jobs.<id>.name` 不支援 `env` context），只能靠機械鎖
          # 互鎖（同型先例：test_workflow_permission_concurrency_lock.py 的
          # `TestNightlyJobNameSelectorInterlock`；本檔對等鎖見
          # `TestFsmChaosNightlyStreakReadsJobLayer`）。觀察期滿、掌舵者裁決
          # 升級後，才把 `chaos-latest` job 的顯示名也加進本值（見上方
          # `chaos-latest` job 頂部的觀察期註解）。
          GATING_JOB_NAMES: "fsm-runtime chaos suite"
        run: |
          # Fetch the last 5 completed runs of THIS workflow, ordered newest first.
          # We treat the failing run that triggered this job as the newest entry.
          #
          # 🔴 DEF-200-379：本 workflow 自本輪起有兩顆平行、互不相依的 job
          # （`chaos` 凍結基線／`chaos-latest` LATEST 觀察軌，見上方註解）——任一
          # 顆紅都會讓 run 層 `conclusion` 報 failure，run 層結構上無法分辨
          # 「凍結基線真的紅」與「只有觀察軌紅」。Rule 9.9.4「連 3 日鎖 main」
          # 只認凍結基線（`chaos` job），沿用 run 層會讓觀察期內只因
          # `chaos-latest` 紅的夜晚被誤計入連敗，違反掌舵者「觀察期內只出聲、
          # 不計入」的裁決。修法：對每一筆 run 逐一查 job 層
          # （`/actions/runs/<id>/jobs`），只取顯示名等於 `${GATING_JOB_NAMES}`
          # 的那個 job 的 conclusion，run 層 conclusion 不再是判準輸入。
          set -eu
          run_ids=$(gh api \
            "/repos/${REPO}/actions/workflows/${WORKFLOW_FILE}/runs?status=completed&per_page=5" \
            --jq '.workflow_runs[].id')
          echo "Recent run ids: ${run_ids}"
          # Count consecutive job-layer failures from newest end. `failure` and
          # `timed_out` count toward the streak; anything else (success /
          # cancelled / skipped / the gating job never ran / gh api error)
          # breaks it — fail-closed toward "don't count", matching Rule 9.9.4's
          # intent that only a *confirmed* chaos failure should ratchet the
          # streak.
          streak=0
          for run_id in ${run_ids}; do
            job_conclusion=$(gh api "/repos/${REPO}/actions/runs/${run_id}/jobs" \
              --jq ".jobs[] | select(.name == \"${GATING_JOB_NAMES}\") | .conclusion" \
              2>/dev/null || echo "api-error")
            job_conclusion="${job_conclusion:-missing}"
            echo "run ${run_id}: job=\"${GATING_JOB_NAMES}\" conclusion=${job_conclusion}"
            case "${job_conclusion}" in
              failure|timed_out)
                streak=$((streak + 1))
                ;;
              *)
                break
                ;;
            esac
          done
          # The current run is in-progress (conclusion=null) and not yet in
          # the list — add 1 to include the failure we're responding to. This
          # job (`track-streak-and-lock`) only runs when `chaos` itself failed
          # (`needs: chaos` + `if: failure()`), so the "+1" always refers to a
          # real `chaos` job failure, never `chaos-latest`.
          actual=$((streak + 1))
          echo "streak=${actual}" >> "$GITHUB_OUTPUT"
          echo "Consecutive job-layer failures including current (gating=${GATING_JOB_NAMES}): ${actual}"

      - name: Open P0 issue when streak >= 3
        if: steps.streak.outputs.streak >= '3'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          STREAK: ${{ steps.streak.outputs.streak }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create \
            --repo "${REPO}" \
            --title "[P0] FSM Chaos Nightly 連續 ${STREAK} 日失敗 — Rule 9.9.4 觸發" \
            --label "p0,chaos,fsm-runtime" \
            --body "$(cat <<EOF
          ## 事件

          \`fsm-chaos-nightly\` 已連續 ${STREAK} 次失敗，依 CLAUDE.md Rule 9.9.4 必須鎖定 main。

          ## 觸發來源

          - 最新失敗執行：${RUN_URL}
          - 連續失敗次數：${STREAK}（含本次）

          ## 需要的處置（24h 內）

          1. CODEOWNERS 必須阻止所有非 hotfix PR 合入 main，直到 chaos 綠燈。
          2. 指派 fsm-runtime owner 排查根因；首要嫌疑：ACT-029 保護鏈退化、FSM 轉換表與 \`_HAPPY_PATH\` 失同步。
          3. 修復後手動觸發 \`workflow_dispatch\` 於 workflows 頁驗證。
          4. 連續綠燈 1 次後可以關閉本 issue 並解除 branch-protection override。

          ## 自動化

          - 本 workflow 的 \`track-streak-and-lock\` job 已嘗試呼叫 branch-protection API；若 token 權限不足，請 repo admin 手動啟用 \`require_linear_history\` + restrict pushes。
          EOF
          )"

      - name: Tighten branch protection on main (best-effort)
        if: steps.streak.outputs.streak >= '3'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # Best-effort: tighten `main` branch protection. On insufficient
          # permissions we log a warning rather than failing the workflow.
          # Reference: https://docs.github.com/en/rest/branches/branch-protection
          if ! gh api -X PUT "/repos/${REPO}/branches/main/protection" \
               --input - <<'JSON'
          {
            "required_status_checks": {
              "strict": true,
              "contexts": ["fsm-runtime chaos suite"]
            },
            "enforce_admins": false,
            "required_pull_request_reviews": {
              "dismiss_stale_reviews": true,
              "require_code_owner_reviews": true,
              "required_approving_review_count": 2
            },
            "restrictions": null,
            "required_linear_history": true,
            "allow_force_pushes": false,
            "allow_deletions": false
          }
          JSON
          then
            echo "::warning::branch-protection tighten failed — GITHUB_TOKEN cannot grant admin scope (per GitHub schema). 請 repo admin 手動啟用 require_linear_history + restrict pushes，或於 repo secrets 加入 BRANCH_PROTECTION_PAT 並改用該 secret 作為 GH_TOKEN。"
          fi

      - name: Record streak signal as workflow summary
        if: always()
        env:
          STREAK: ${{ steps.streak.outputs.streak }}
        run: |
          {
            echo "### FSM Chaos Nightly — Streak Tracker"
            echo ""
            echo "- Consecutive failures (including this run): **${STREAK}**"
            echo "- Rule 9.9.4 threshold: 3 consecutive failures → lock main"
            if [ "${STREAK}" -ge 3 ]; then
              echo "- ✗ 已觸發：已嘗試開 P0 issue + 收緊 branch protection（best-effort）"
            else
              echo "- ✓ 未達鎖定門檻（仍在觀察中）"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
