# monorepo 根層 Dependabot（自動更新相依，免未來再撞 Node/action 退役或套件漏洞）。
# 2026-07-10 自 AISDLC_SDD/.github/dependabot.yml 遷入根層（GitHub 只讀根層）；
# pip directory 改以 repo 根視角指向子專案路徑。
#
# 對應 AISDLC_SDD ADR-001：Node20→Node24 是人工救火；Dependabot 讓 action 版本與
# pip 釘版日後自動進 PR，經 aisdlc-sdd-ci.yml offline-gate 驗證後再合入，避免重蹈覆轍。
version: 2
updates:
  # GitHub Actions：每週掃 .github/workflows/，action 有新版即開 PR。
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels: ["ci", "dependencies"]
    commit-message:
      prefix: "chore(ci)"

  # pip：框架 CI 釘版相依（requirements-ci.txt）有新版即開 PR。
  - package-ecosystem: "pip"
    directory: "/AISDLC_SDD/AISDLC_SDD_v0.01"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    commit-message:
      prefix: "chore(deps)"

  # pip：AutoClaude 應用相依（pyproject.toml，pip 生態可識別）有新版即開 PR。
  # 四方複審 B3（2026-07-10）：原僅涵蓋 AISDLC_SDD，AutoClaude 側漏掃 → 補齊。
  - package-ecosystem: "pip"
    directory: "/AutoClaude"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    commit-message:
      prefix: "chore(deps)"
