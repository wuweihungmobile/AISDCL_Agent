    - "🔴 裝置支援矩陣 (OS 版本、裝置)"
    - "🔴 離線功能需求"
    - "🔴 測試自動化工具選擇"
    - "🔴 效能目標 (啟動、電池、資料)"
    - "🔴 應用商店提交時程及需求"
    - "🔴 推播通知及深度連結範圍"

  asking_triggers:
    - "裝置支援需求不明確"
    - "離線功能範圍模糊"
    - "效能期望未定義"
    - "自動化工具選項有權衡"
    - "應用商店合規需求不確定"

  decision_support:
    - "目標受眾的裝置市場佔有率資料"
    - "Mobile 自動化工具比較"
    - "裝置測試雲端平台選項"
    - "應用商店提交檢查清單"
    - "效能基準建議"

mobile_testing_best_practices:
  do:
    - "✅ 在真實裝置上測試，而非僅模擬器"
    - "✅ 徹底測試離線功能"
    - "✅ 驗證應用生命週期轉換"
    - "✅ 使用不佳的網路條件測試"
    - "✅ 監控電池及資料使用"
    - "✅ 在不同螢幕尺寸測試"
    - "✅ 驗證應用商店指南合規"
    - "✅ 啟用無障礙性功能測試"
    - "✅ 處理中斷 (來電、通知)"

  dont:
    - "❌ 僅依賴模擬器/模擬器測試"
    - "❌ 僅在最新 OS 版本測試"
    - "❌ 假設網路永遠可用"
    - "❌ 忽略電池及記憶體優化"
    - "❌ 跳過低階裝置測試"
    - "❌ 忽略製造商客製化 (Android)"
    - "❌ 跳過應用商店合規測試"
    - "❌ 忘記橫向方向"
    - "❌ 忽略應用生命週期狀態"

