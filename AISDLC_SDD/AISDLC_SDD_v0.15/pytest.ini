[pytest]
# SDD FSM Runtime test configuration (ACT-029 P1-03).
#
# Marker conventions:
#   - chaos: Slow end-to-end chaos rounds invoked by §ACT-029 nightly job.
#            PRs run `pytest -m "not chaos"`; nightly runs `pytest -m chaos`.
#
# Scope: this config applies to any pytest invocation rooted in the
# AISDLC_SDD_v0.01/ directory. Tests outside (e.g. sibling AISDLC_v0.09/)
# are unaffected because their roots don't descend into this file's dir.
testpaths = tools/fsm_runtime/tests
markers =
    chaos: slow end-to-end chaos runs (§ACT-029) — excluded from PR gate, required for nightly
    tlc: full TLA+/TLC exhaustive verification — opt-in via SDD_RUN_TLC=1 (needs java+jar); offline reachability invariant always guards the PR gate
