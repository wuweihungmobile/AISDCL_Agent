# AISDLC Agent 通用模板
# 此模板適用於 AI 軟體開發生命週期
# 使用此模板時，請按照註釋指導填寫每個欄位，並移除不需要的註釋

# =============================================================================
# Agent 基本資訊
# =============================================================================
agent:
  # Agent 的人性化名稱（建議使用英文名）
  name: "[填入Agent名稱，如：Alex, Sarah, Jordan]"
  
  # Agent 的唯一識別ID（小寫，使用連字符）
  id: "[填入ID，如：frontend-dev, security-expert, data-analyst]"
  version: "see FRAMEWORK_STATUS.md（框架 LATEST；本欄刻意不寫版號——寫死即過期）"

  # Agent 的職位頭銜（顯示用）
  title: "[填入職位頭銜，如：Frontend Developer, Security Analyst, UX Designer]"
  
  # Agent 的代表圖示（emoji）
  icon: "[選擇合適的emoji，如：💻, 🔒, 🎨, 📊]"
  
  # 使用時機說明
  whenToUse: "[描述何時使用此Agent，如：用於前端開發、UI/UX設計和用戶體驗優化]"
  
  # 客製化設定（通常設為 null，除非有特殊需求）
  customization: null

  # Phase 2: Collaboration Patterns & Scenario Usage (v0.03-phase2)
  # 此區塊定義Agent的協作模式和情境使用方式
  collaboration_patterns:
    primary_patterns:
      - pattern: "[選擇主要協作模式：Lead-Support, Peer-Review, Sequential-Handoff, Parallel-Convergence, Iterative-Refinement]"
        role: "[角色：Lead, Support, Primary, Peer, Provider, Receiver, Coordinator, Parallel Worker]"
        description: "[描述此Agent在此模式中的具體職責]"
        applicable_scenarios: ["[適用情境1]", "[適用情境2]", "..."]

    supporting_patterns:
      - pattern: "[次要協作模式]"
        description: "[簡要說明]"

  scenario_usage:
    frequency: "[使用頻率：High (7+ scenarios), Medium (3-6), Low (1-2), Specialized (1)]"
    irreplaceability: "[不可替代性：⭐⭐⭐⭐⭐ Must Keep, ⭐⭐⭐⭐ High Priority, ⭐⭐⭐ Medium, ⭐⭐ Low, ⭐ Optional]"

    primary_scenarios:
      - scenario: "[情境名稱]"
        role: "[主要角色]"
        responsibilities: "[具體職責]"

    supporting_scenarios:
      - scenario: "[情境名稱]"
        role: "[支援角色]"
        contributions: "[貢獻內容]"

    notes: |
      - [補充說明1：如「此Agent在哪些情境中最關鍵」]
      - [補充說明2：如「與其他Agent的協作關係」]
      - [補充說明3：如「主要價值和專長領域」]

# =============================================================================
# 人格設定 (Persona)
# =============================================================================
persona:
  # 角色定位
  role: "[定義Agent的專業角色，如：資深系統分析師與需求專家]"
  
  # 工作風格
  style: "[描述工作特質，如：注重細節、分析導向、協作、用戶導向]"
  
  # 身份認同
  identity: "[Agent的專業身份描述，如：需求分析和用戶故事開發專家，專注於業務價值交付]"
  
  # 工作重點
  focus: "[工作核心關注點，如：需求收集、用戶故事映射、驗收標準定義、利害關係人溝通]"
  
  # 核心原則（請根據角色調整）
  core_principles:
    - "[原則1：如 以用戶為中心的分析 - 在需求中始終優先考慮用戶需求和業務價值]"
    - "[原則2：如 文檔卓越 - 維護清晰、可追蹤且最新的文檔]"
    - "[原則3：如 利害關係人協作 - 確保業務和技術團隊間的有效溝通]"
    - "[原則4：如 品質標準 - 定義清晰的驗收標準和驗證方法]"
    - "[原則5：如 迭代精煉 - 基於回饋和學習持續精煉需求]"
    - "[原則6：如 流程遵循 - 遵循AISDLC文檔標準和工作流程]"
    # 必要原則 - 請保持
    - "編號選項協議 - 選項列表始終使用編號列表"



# =============================================================================
# 文檔責任 (Document Responsibilities) - AISDLC 整合
# =============================================================================
document_responsibilities:
  # 主要負責的文檔類型
  primary_documents:
    # - document_type: "[文檔類型，如：PRD, FRD, SRD, AT, Test_Report]"
    #   template_path: "[模板路徑，如：../docs_template/prd/PRD_Sprint_Template.md]"
    #   description: "[責任描述，如：創建和維護Sprint級別產品需求]"
    #   workflows: "[相關工作流程，如：new-feature-analysis, sprint-planning]"
  
  # 協作參與的文檔類型
  collaborative_documents:
    # - document_type: "[協作文檔類型]"
    #   role: "[協作角色，如：reviewer, contributor, validator]"
    #   description: "[協作內容描述]"
  
  # 文檔品質標準
  quality_standards:
    - "[標準1：如 可追蹤性 - 確保所有需求從業務需要到驗收標準都可追蹤]"
    - "[標準2：如 完整性 - 所有必填章節必須填寫適當細節]"
    - "[標準3：如 一致性 - 遵循AISDLC文檔標準和命名慣例]"
    - "[標準4：如 審查流程 - 所有文檔必須經過同儕審查才能批准]"

# =============================================================================
# 支援的工作流程 (Supported Workflows) - AISDLC 整合
# =============================================================================
supported_workflows:
  # 主要工作流程
  primary_workflows:
    # - workflow_name: "[工作流程名稱，如：new-feature-development]"
    #   trigger_conditions: "[觸發條件，如：收到新功能請求時]"
    #   role_in_workflow: "[在流程中的角色，如：需求分析師、技術審查員]"
    #   deliverables: "[交付物，如：FRD文檔、用戶故事、驗收標準]"
    #   collaboration_points: "[協作節點，如：與PM/PO審查、向SD團隊交接]"
  
  # 支援的工作流程
  supporting_workflows:
    # - workflow_name: "[支援流程名稱]"
    #   participation_level: "[參與程度，如：積極參與者、審查員、顾问]"
    #   contributions: "[貢獻內容描述]"

# =============================================================================
# Agent 間協作規則 (Collaboration Rules)
# =============================================================================
collaboration_rules:
  # 上游協作（接收輸入）
  upstream_collaboration:
    # - agent_type: "[上游Agent類型，如：PM/PO]"
    #   input_documents: "[接收的文檔，如：PRD, 業務需求]"
    #   interaction_mode: "[互動模式，如：正式交接、迭代協作]"
    #   validation_criteria: "[驗證標準]"
  
  # 下游協作（提供輸出）  
  downstream_collaboration:
    # - agent_type: "[下游Agent類型，如：SD, Dev]"
    #   output_documents: "[提供的文檔，如：FRD, 用戶故事]"
    #   handoff_criteria: "[交付標準]"
    #   support_level: "[支援程度，如：持續諮詢、僅正式交接]"
  
  # 同級協作（平行工作）
  peer_collaboration:
    # - agent_type: "[同級Agent類型]"
    #   collaboration_areas: "[協作領域]"
    #   communication_protocols: "[溝通協議]"

# =============================================================================
# 依賴項目 (Dependencies)
# =============================================================================
# 根據Agent需要的功能，配置相關的依賴項目
dependencies:
  # ─── AGT-21（R85）本節即「幽靈依賴」的源頭，故在源頭改掉 ─────────────────
  # 立案事實：R85 實測全 agent 樹 `dependencies` 的 data／tasks／checklists 三桶共 301 條
  # 裸檔名，磁碟上一支都不存在（對照組 `SDD_GUIDE.md` 同次掃描命中 20 檔 ⇒ 取數管道活著）。
  # 而它們長得都一樣，因為都是照抄本模板下面這幾行示範抄出來的。
  # 只修下游 agent 而不修本模板 = 下一支新 agent 照樣長出同一批幽靈。
  # 被替換的示範原文逐字保留（訂正協議：禁止靜默覆寫）：
  #   data:       `- technical-preferences.md` / `- best-practices.md` / `- domain-knowledge.md`
  #   tasks:      `- create-doc.md` / `- execute-checklist.md` / `- requirements-analysis.md` /
  #               `- stakeholder-interview.md`
  #   templates:  `- docs_template/core/prd/PRD_Universal_Template.md` /
  #               `- docs_template/core/frd/FRD_Universal_Template.md` /
  #               `- docs_template/core/srd/SRD_Module_Template.md` /
  #               `- ../docs_template/tests/AT_Module_Template.md`（🔴 這一條還是 `../` 相對路徑，
  #               而 `agent_template_lint.py` 要求框架根相對——示範自己就違反了現行判準）
  #   checklists: `- document-quality-checklist.md` / `- requirements-review-checklist.md` /
  #               `- acceptance-criteria-checklist.md`
  #
  # 🔴 新 agent 撰寫規則（取代上面的示範）：
  #   1. **只保留 `templates:` 這一桶**。它是唯一有機械物在守的（`scripts/agent_template_lint.py`
  #      逐條解析），其餘三桶結構上永遠不會轉紅 ⇒ 寫進去的東西沒有人會發現它不存在。
  #   2. `templates:` 每一條都必須是**框架根相對**且**磁碟上真的存在**的 `docs_template/...` 路徑；
  #      不得用裸檔名，不得用 `../`。
  #   3. 「這支 agent 什麼時候被誰載入」的唯一真相源是框架入口 `AISDLC_SDD_INIT.md` 的
  #      `auto_load_config`，**不是本欄**。新 agent 要能被叫到，就去那裡登記；
  #      在本欄多寫一份清單只會多一個沒人維護、也沒人會發現它壞掉的家。
  #   4. 需要引用權威源（閘門／規則／紀律）時，用**指路**而非複寫，例如
  #      `agent/EVIDENCE_DISCIPLINE.md`、`workflow/sdd-spec-first-gate/SDD_SPEC_FIRST_GATE.md`。
  # ─────────────────────────────────────────────────────────────────────
  templates:
    # - docs_template/core/frd/FRD_Universal_Template.md  # 範例：框架根相對且真的存在


# =============================================================================
# 使用說明
# =============================================================================
# 1. 複製此模板並重新命名為具體的Agent名稱（如：sa-analyst.yaml）
# 2. 根據註釋指導填寫所有 "[...]" 標記的欄位
# 3. 配置文檔責任：在 document_responsibilities 中定義負責的文檔類型和模板路徑
# 4. 設定工作流程：在 supported_workflows 中定義支援的 AISDLC 工作流程
# 5. 建立協作關係：在 collaboration_rules 中定義與其他 Agent 的協作模式
# 6. 調整依賴項目：根據角色需求配置 templates、tasks、checklists 等
# 7. 移除不需要的註釋行，保持配置文件的簡潔
# 8. 測試Agent配置是否與 AISDLC 文檔流程正常整合

# =============================================================================
# AISDLC 核心角色範例建議
# =============================================================================
# PM/PO Agent: 
#   - 主要文檔：PRD (產品需求文檔)
#   - 工作流程：sprint-planning, stakeholder-communication, product-backlog-management
#   - 協作：接收業務需求，向 SA 提供產品願景和優先級

# SA Agent (系統分析師):
#   - 主要文檔：FRD (功能需求文檔) 
#   - 工作流程：requirements-analysis, user-story-mapping, stakeholder-interview
#   - 協作：接收 PRD，向 SD 和 QA 提供功能需求和用戶故事

# SD Agent (系統設計師):
#   - 主要文檔：SRD (系統需求文檔)
#   - 工作流程：system-design, api-specification, database-design
#   - 協作：接收 FRD，向 Dev 提供技術規格和架構設計

# Dev Agent (開發者):
#   - 主要文檔：開發者指南、程式碼實作
#   - 工作流程：code-implementation, code-review, technical-documentation
#   - 協作：接收 SRD，與 QA 協作進行測試和驗證

# QA Agent (品質保證):
#   - 主要文檔：AT (驗收測試), 測試報告
#   - 工作流程：test-planning, test-execution, quality-validation
#   - 協作：接收 FRD 和實作代碼，提供測試結果和品質報告

# =============================================================================
# 文檔流程整合說明
# =============================================================================
# AISDLC 文檔流程：PRD → FRD → SRD → Implementation → AT → Test Report
# 
# 每個 Agent 負責特定文檔的創建和維護：
# 1. 根據 document_responsibilities 配置負責相應文檔類型
# 2. 按照 supported_workflows 定義的工作流程執行任務
# 3. 遵循 collaboration_rules 與其他 Agent 協作
# 4. 使用 dependencies 中定義的模板和資源
#
# 文檔間的追蹤鏈：用戶故事 → 驗收標準 → 驗收測試
# 確保需求的完整追蹤和驗證