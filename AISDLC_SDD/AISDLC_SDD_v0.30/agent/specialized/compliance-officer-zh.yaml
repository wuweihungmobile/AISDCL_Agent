sdd_skills:
  generate_adr:
    description: "Architecture Decision Record 生成"
    trigger: "任何技術或架構決策時觸發"
    output: "docs/02_architecture/adr/ADR-{NNN}-{title}.md"
    template: "docs_template/sdd/adr/ADR-TEMPLATE.md"
  spec_compliance_check:
    description: "規格符合性自我驗證"
    trigger: "任何文件產出前自動執行"
    checklist:
      completeness: ["所有必填欄位已填寫", "追溯鏈完整", "相關 ADR 已建立"]
      format: ["文件命名符合規範", "目錄位置正確", "Markdown 格式通過 Lint"]
      cross_reference: ["上游文件引用正確", "下游文件連結已預留", "ID 格式統一"]
      sdd_specific: ["規格產出先於任何實作描述", "每個架構決策有對應 ADR", "API 定義使用 OpenAPI 格式"]
  traceability_matrix:
    description: "需求追溯矩陣生成"
    trigger: "SCG-0（FRD 後）、SCG-1（SRD 後）、RG-TEST（測試策略閘門後；SCG-3 後、測試開始前）、需求變更後 — AT 欄位須於 SCG-5（RTM Completeness Gate）前 100% 覆蓋"
    output: "docs/03_testing/RTM-{project}-{date}.md"
    template: "docs_template/sdd/testing/RTM-TEMPLATE.md"
    format: "| EPIC | Feature | User Story | AC | AT | API | NFR | Status |"

# ─────────────────────────────────────────────────────────
# SDD Phase 05 Skills 升級（2026-04-13）
# 情境：Security — 合規對照矩陣 + 多框架並行合規
# ─────────────────────────────────────────────────────────
sdd_phase05_compliance:
  # 5.8.4 合規對照矩陣格式
  compliance_matrix_format:
    description: "合規對照矩陣格式 — GDPR/PCI-DSS/ISO 27001 條款對應標準格式"
    trigger: "Security 情境 Stage 3：SAD 完成後，合規要求確認時"
    output: "docs/06_quality/security/COMPLIANCE-MATRIX-{system}-{date}.md"
    template: "docs_template/sdd/testing/COMPLIANCE-MATRIX-TEMPLATE.md"
    spec_gate: "RG-SEC 安全規格閘門（角色 sub-gate）"
    matrix_format:
      columns: ["條款", "要求摘要", "實作方式", "證據文件", "狀態"]
      status_options: ["✅ 合規", "⚠️ 部分合規", "❌ 不合規", "N/A"]
    required_frameworks:
      gdpr:
        key_articles: ["Art.5", "Art.13", "Art.17", "Art.25", "Art.32", "Art.33", "Art.35"]
        trigger: "系統處理 EU 公民個人資料時強制"
      pci_dss:
        key_requirements: ["Req.3", "Req.4", "Req.6", "Req.7", "Req.8", "Req.10", "Req.11"]
        trigger: "系統處理支付卡資料時強制"
      iso_27001:
        key_controls: ["A.8.8", "A.8.15", "A.8.16", "A.8.24"]
        trigger: "需要 ISO 27001 認證時"
    gap_analysis:
      mandatory: true
      format: ["缺口 ID", "法規條款", "當前狀態", "缺口描述", "修復計畫", "截止日期"]

  # 5.8.5 多合規框架並行能力
  multi_framework_compliance:
    description: "多框架並行合規 — 同時管理 GDPR + PCI-DSS + ISO 27001 控制映射"
    trigger: "任何需要多法規遵從的系統（金融/醫療/歐盟市場）"
    spec_gate: "RG-SEC 安全規格閘門（角色 sub-gate）"
    cross_framework_mapping:
      encryption:
        gdpr: "Art.32"
        pci_dss: "Req.3, Req.4"
        iso_27001: "A.8.24"
        unified_implementation: "AES-256 + TLS 1.3（SAD 加密規格）"
      access_control:
        gdpr: "Art.32"
        pci_dss: "Req.7, Req.8"
        iso_27001: "A.5.15"
        unified_implementation: "RBAC + MFA（SAD 授權規格）"
      audit_log:
        gdpr: "Art.30"
        pci_dss: "Req.10"
        iso_27001: "A.8.15"
        unified_implementation: "Immutable Audit Log（SAD 日誌規格）"
      incident_response:
        gdpr: "Art.33（72h 通報）"
        pci_dss: "Req.12"
        iso_27001: "A.5.26"
        unified_implementation: "INCIDENT-RESPONSE-SPEC（72h 通報流程）"
    overlap_optimization:
      principle: "一個控制措施盡量滿足多個法規要求，減少重複工作"
      output: "合規矩陣中的『共同實作』欄位"

