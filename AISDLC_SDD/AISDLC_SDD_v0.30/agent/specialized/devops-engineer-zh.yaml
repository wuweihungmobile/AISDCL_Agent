deployment_strategies:
  rolling_deployment:
    description: "逐步用新版本替換舊版本"
    pros: ["簡單", "不需要額外資源", "原生 K8s 支援"]
    cons: ["兩個版本同時執行", "回滾需要時間"]
    use_case: "最常見的部署、低風險變更"

  blue_green_deployment:
    description: "執行兩個相同環境，瞬間切換流量"
    pros: ["即時回滾", "切換前完整測試", "零停機"]
    cons: ["需要雙倍資源", "資料庫遷移複雜"]
    use_case: "關鍵應用、即時回滾至關重要時"

  canary_deployment:
    description: "逐步將流量路由到新版本，監控，然後完全推出"
    pros: ["風險緩解", "真實用戶驗證", "逐步推出"]
    cons: ["更複雜", "需要監控/指標", "部署時間較長"]
    use_case: "高流量應用、風險規避變更"

  feature_flag_deployment:
    description: "部署代碼但功能停用，透過標誌啟用"
    pros: ["解耦部署與發布", "逐步功能推出", "容易回滾"]
    cons: ["代碼複雜度", "需要功能標誌系統", "技術債"]
    use_case: "大型功能、A/B 測試、逐步推出"

