# ─────────────────────────────────────────────────────────
# SDD Phase 01 Skill 升級（2026-04-12）
# ─────────────────────────────────────────────────────────
sdd_skills:
  # ── DevOps Engineer 專屬 Skills ──
  iac_specification:
    description: "IaC 即規格 - Infrastructure as Code Specification"
    trigger: "任何基礎設施設計時，IaC 規格先於實作"
    output: "docs/08_deployment/iac/IaCS-{env}-{date}.md"
    spec_gate: "SCG-2 Architecture Spec Gate"
    steps:
      - "定義基礎設施需求規格（資源類型、規格、數量）"
      - "設計 IaC 模組結構（Terraform/Helm/Pulumi）"
      - "建立環境差異矩陣（dev/staging/prod）"
      - "定義秘密管理策略"
      - "規格化 Rollback 程序"
      - "建立基礎設施變更審查流程"

  pipeline_spec_doc:
    description: "Pipeline 規格文件化 - CI/CD Pipeline Specification"
    trigger: "任何 CI/CD Pipeline 設計或修改時"
    output: "docs/08_deployment/PIPELINE-SPEC-{project}-{date}.md"
    spec_gate: "SCG-2 Architecture Spec Gate"
    sections:
      - "Pipeline 階段定義（Build/Test/Security/Deploy）"
      - "每個階段的輸入/輸出規格"
      - "品質閘門設定（DocLint / SpecTrace / Test Coverage）"
      - "部署策略規格（Blue-Green / Canary / Rolling）"
      - "監控與告警規格"
      - "回滾觸發條件與程序"

  # ── 共通 Skills（全 Agent 適用）──
  generate_adr:
    description: "Architecture Decision Record 生成"
    trigger: "部署策略選擇、容器化決策、雲端服務選擇時"
    output: "docs/02_architecture/adr/ADR-{NNN}-{title}.md"
    template: "docs_template/sdd/adr/ADR-TEMPLATE.md"
    spec_gate: "SCG-2 Architecture Spec Gate"

# ─────────────────────────────────────────────────────────
# SDD Phase 04 Skills 升級（2026-04-13）
# 情境：Migration + DevOps + Integration
# ─────────────────────────────────────────────────────────
sdd_phase04_migration:
  # 4.2.4 Cutover Spec 生成
  cutover_spec_gen:
    description: "切換規格生成 — Migration 切換步驟的精確規格文件"
    trigger: "Migration 情境 Stage 3：遷移策略凍結後，強制生成"
    output: "docs/08_deployment/CUTOVER-SPEC-{system}.md"
    template: "docs_template/sdd/deployment/CUTOVER-SPEC-TEMPLATE.md"
    spec_gate: "🔴 Human 確認切換策略"
    mandatory_sections:
      - "切換前置條件（Pre-Cutover Checklist）"
      - "切換步驟（Step-by-Step，含時間點 T-Nh / T-0 / T+Nmin）"
      - "切換觸發條件（Go/No-Go Criteria）"
      - "回滾觸發條件（連結至 Rollback Spec）"
      - "通訊計畫"
    key_principle: "Cutover Spec 必須可執行（每步驟有命令/工具/預期結果），不可只有描述"

  # 4.2.5 Rollback Spec 生成
  rollback_spec_gen:
    description: "回滾規格生成 — Migration 回滾觸發條件與執行步驟規格"
    trigger: "Migration 情境 Stage 3：與 Cutover Spec 同步建立，強制"
    output: "docs/08_deployment/ROLLBACK-SPEC-{system}.md"
    template: "docs_template/sdd/deployment/ROLLBACK-SPEC-TEMPLATE.md"
    spec_gate: "🔴 Human 確認回滾策略"
    mandatory_sections:
      - "回滾觸發條件（含閾值：錯誤率/延遲/資料不一致）"
      - "回滾步驟（Step 1 決策 → Step 2 流量回滾 → Step 3 資料回滾 → Step 4 驗證）"
      - "不同遷移階段的回滾策略（Canary 5% vs 100% 切換後）"
      - "回滾後 Post-Mortem 要求"
    rollback_sla: "從觸發到完成，最大回滾時間 < {N 分鐘}（RTO）"

sdd_phase04_devops:
  # 4.5.1 IaC 規格（已存在於 sdd_skills，此處強化注解標準）
  iac_annotation_standard:
    description: "IaC 注解標準 — 每段 IaC 必須有對應規格說明"
    trigger: "任何 IaC 檔案（Terraform/Helm/Ansible）撰寫或修改時"
    mandatory_annotation_format: |
      # Spec: INFRA-{NNN} — {對應需求說明}
      # ENV: dev/staging/prod 均適用（差異見 {env}.tfvars）
      # Reason: {為何這樣配置}
    validation: "CI/CD L0 IaCS-Validate 自動檢查注解存在性"
    fail_if_missing: true

  # 4.5.3 IaC 注解整合（強化 pipeline_spec_doc）
  env_consistency_enforcement:
    description: "環境一致性強制 — Dev/Staging/Prod 使用相同 IaC 模板"
    trigger: "任何環境配置修改時"
    rule: "禁止直接修改生產環境配置，所有差異必須透過 {env}.tfvars 管理"
    env_contract_spec: "docs/03_testing/contracts/ENV-CONTRACT-SPEC-{project}.md"

sdd_phase04_integration:
  # 4.8.6 Contract Test CI 整合
  contract_test_ci_integration:
    description: "Contract Test CI 整合 — 確保 Consumer Contract Tests 在 CI L2 層自動執行"
    trigger: "Integration 情境：任何整合程式碼修改時"
    pipeline_spec: "cicd/SDD_INTEGRATION_CICD.md"
    ci_requirements:
      - "L2 Consumer Contract Tests 必須在 PR merge 前通過"
      - "Pact Broker can-i-deploy 檢查：通過才可部署"
      - "任何破壞性 API 變更自動阻擋 PR"
      - "每日排程：Provider Contract Verification"
    failure_actions:
      - "Block PR merge（任何 Contract 失敗）"
      - "即時通知 Integration Owner"
      - "標記 CONTRACT_VIOLATION"

# ─────────────────────────────────────────────────────────
# SDD Phase 05 Skills 升級（2026-04-13）
# 情境：Performance SLO 告警 + Security SAST/DAST CI 整合
# ─────────────────────────────────────────────────────────
sdd_phase05_devops:
  # 5.5.5 SLO 告警規格化
  slo_alert_spec:
    description: "SLO 告警規格化 — 每個 SLO 指標必須有對應監控告警"
    trigger: "Performance Stage 6：PBS 凍結後，監控規格建立時"
    output: "docs/08_deployment/MONITORING-ALERT-SPEC-{system}-{date}.md"
    template: "docs_template/sdd/deployment/MONITORING-ALERT-SPEC-TEMPLATE.md"
    spec_gate: "RG-PERF 效能基準閘門（角色 sub-gate）"
    alert_per_slo:
      latency_p95:
        alert_name: "P95LatencyExceeded"
        condition: "p95_latency > {PBS.latency_p95_ms} for 5m"
        severity: "P1"
        notify: "Slack #performance-alerts + PagerDuty"
      throughput:
        alert_name: "ThroughputDegraded"
        condition: "rps < {PBS.throughput_rps} * 0.8 for 5m"
        severity: "P1"
        notify: "Slack #performance-alerts"
      error_rate:
        alert_name: "ErrorRateHigh"
        condition: "error_rate > {PBS.error_rate_percent} for 2m"
        severity: "P0"
        notify: "PagerDuty（立即）"
    prometheus_yaml_output: true
    principle: "PBS 文件是告警規格的輸入，每個 SLO 必須有對應 Alert Rule"

  # 5.8.7 SAST/DAST CI 整合規格
  sast_dast_ci_spec:
    description: "SAST/DAST CI 整合規格 — 安全掃描基於 SAD 安全控制規格"
    trigger: "Security 情境 Stage 5：安全 CI/CD Pipeline 設計時"
    output: "docs/08_deployment/PIPELINE-SPEC-{project}-{date}.md（安全掃描章節）"
    pipeline_spec: "cicd/SDD_SECURITY_CICD.md"
    spec_gate: "RG-SEC 安全規格閘門（角色 sub-gate）"
    sast_integration:
      tool: "{SonarQube/Semgrep}"
      trigger: "每次 PR"
      ruleset_source: "docs/06_quality/security/SAD-*.md 的 SC-* 安全控制清單"
      gate: "Critical/High 漏洞 → 阻擋 PR"
    dast_integration:
      tool: "OWASP ZAP"
      trigger: "每次發布前（Staging 環境）"
      scope_source: "docs/03_testing/SECURITY-TEST-SPEC-*.md 的 DAST 掃描範圍"
      gate: "Critical/High 漏洞 → 阻擋部署"
    sca_integration:
      tool: "{Snyk/Dependabot}"
      trigger: "每次 PR + 每日排程"
      gate: "Critical CVE → 阻擋 PR"
    secret_scan:
      tool: "{TruffleHog/GitGuardian}"
      trigger: "每次 Commit（pre-commit hook + CI）"
      gate: "任何 Secret 發現 → 立即阻擋 + 通知"
