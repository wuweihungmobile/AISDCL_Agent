# ============================================================
# AISDLC v0.09 - Event-Driven Agent Notification System (P3)
# GitLab CI Template
# ============================================================
#
# 使用方式:
#   1. 在 .gitlab-ci.yml 中引入此範本:
#      include:
#        - local: 'ci/templates/agent-notification-template.yml'
#   2. 配置 CI/CD Variables:
#      - SLACK_WEBHOOK_URL
#      - NOTIFICATION_ENABLED (true/false)
#   3. 依情境調整觸發規則
#
# 參考文檔: Event_Driven_Agent_Notification_Template.md
# ============================================================

# ─── 階段定義 ───
stages:
  - notify-collect
  - notify-dispatch
  - notify-release

# ─── 全域變數 ───
variables:
  NOTIFICATION_ENABLED: "true"
  AGGREGATE_WINDOW: "60"

# ============================================================
# Job 1: 收集 Agent 執行結果（MR Pipeline）
# ============================================================
collect-agent-results:
  stage: notify-collect
  image: alpine:latest
  timeout: 5 minutes

  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: always
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: always
    - when: never

  before_script:
    - apk add --no-cache curl jq

  script:
    - echo "📊 收集 Agent 執行結果..."
    - |
      # 取得當前 Pipeline 的所有 Job 狀態
      PIPELINE_ID=$CI_PIPELINE_ID
      PROJECT_ID=$CI_PROJECT_ID

      # 透過 GitLab API 取得 Pipeline Jobs
      JOBS=$(curl -s --header "PRIVATE-TOKEN: ${CI_JOB_TOKEN}" \
        "${CI_API_V4_URL}/projects/${PROJECT_ID}/pipelines/${PIPELINE_ID}/jobs" \
        | jq -r '.[] | select(.name != "collect-agent-results" and .name != "notify-mr-comment" and .name != "notify-slack") | "\(.name)|\(.status)"')

      echo "Agent 結果:"
      ALL_PASSED=true
      FAILED_AGENTS=""
      SUMMARY=""

      while IFS='|' read -r name status; do
        [ -z "$name" ] && continue
        case "$status" in
          success)
            ICON="✅"
            ;;
          failed)
            ICON="🔴"
            ALL_PASSED=false
            FAILED_AGENTS="${FAILED_AGENTS}${name}, "
            ;;
          *)
            ICON="⚠️"
            ;;
        esac
        SUMMARY="${SUMMARY}| ${name} | ${ICON} ${status} |\n"
        echo "  ${ICON} ${name}: ${status}"
      done <<< "$JOBS"

      # 輸出結果供下游 Job 使用
      echo "ALL_PASSED=${ALL_PASSED}" > agent-results.env
      echo "FAILED_AGENTS=${FAILED_AGENTS}" >> agent-results.env
      echo "SUMMARY=${SUMMARY}" >> agent-results.env

  artifacts:
    reports:
      dotenv: agent-results.env
    expire_in: 1 day

# ============================================================
# Job 2: MR Comment 通知
# ============================================================
notify-mr-comment:
  stage: notify-dispatch
  image: alpine:latest
  timeout: 3 minutes
  needs: [collect-agent-results]

  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: always
    - when: never

  before_script:
    - apk add --no-cache curl

  script:
    - echo "💬 發送 MR Comment..."
    - |
      if [ "$ALL_PASSED" = "true" ]; then
        VERDICT="### ✅ 整體判定: 可合併"
      else
        VERDICT="### 🔴 整體判定: 需修復\n\n**失敗項**: ${FAILED_AGENTS}"
      fi

      BODY="## 🔔 CI/CD Agent 協作報告\n\n"
      BODY="${BODY}### 狀態摘要\n"
      BODY="${BODY}| Agent | 狀態 |\n|-------|------|\n"
      BODY="${BODY}${SUMMARY}\n\n"
      BODY="${BODY}${VERDICT}\n\n"
      BODY="${BODY}---\n"
      BODY="${BODY}⏰ 更新時間: $(date -u +%Y-%m-%dT%H:%M:%SZ)\n"
      BODY="${BODY}🤖 Generated by AISDLC Agent Notification System"

      # 發送 MR Note
      curl -s --request POST \
        --header "PRIVATE-TOKEN: ${CI_JOB_TOKEN}" \
        --header "Content-Type: application/json" \
        --data "{\"body\": \"$(echo -e "$BODY")\"}" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/merge_requests/${CI_MERGE_REQUEST_IID}/notes" \
        || echo "⚠️ MR Comment 發送失敗（不阻塞）"

# ============================================================
# Job 3: Slack 通知
# ============================================================
notify-slack:
  stage: notify-dispatch
  image: alpine:latest
  timeout: 2 minutes
  needs: [collect-agent-results]

  rules:
    - if: '$SLACK_WEBHOOK_URL && $CI_PIPELINE_SOURCE == "merge_request_event"'
      when: always
    - if: '$SLACK_WEBHOOK_URL && $CI_COMMIT_BRANCH == "main"'
      when: always
    - when: never

  # 通知失敗不阻塞 Pipeline
  allow_failure: true

  before_script:
    - apk add --no-cache curl

  script:
    - echo "📢 發送 Slack 通知..."
    - |
      if [ "$ALL_PASSED" = "true" ]; then
        COLOR="#36a64f"
        TITLE="✅ Pipeline 通過"
        TEXT="所有 Agent 檢查通過"
      else
        COLOR="#e01e5a"
        TITLE="🔴 Pipeline 失敗"
        TEXT="失敗項: ${FAILED_AGENTS}"
      fi

      curl -s -X POST "$SLACK_WEBHOOK_URL" \
        -H 'Content-type: application/json' \
        -d "{
          \"attachments\": [{
            \"color\": \"${COLOR}\",
            \"title\": \"${TITLE}\",
            \"text\": \"${TEXT}\",
            \"fields\": [
              {\"title\": \"Project\", \"value\": \"${CI_PROJECT_NAME}\", \"short\": true},
              {\"title\": \"Branch\", \"value\": \"${CI_COMMIT_REF_NAME}\", \"short\": true},
              {\"title\": \"Pipeline\", \"value\": \"${CI_PIPELINE_URL}\", \"short\": false}
            ],
            \"footer\": \"AISDLC Agent Notification\",
            \"ts\": $(date +%s)
          }]
        }" || echo "⚠️ Slack 通知發送失敗"

# ============================================================
# Job 4: Release 部署通知
# ============================================================
notify-release:
  stage: notify-release
  image: alpine:latest
  timeout: 3 minutes

  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/ && $SLACK_WEBHOOK_URL'
      when: always
    - when: never

  allow_failure: true

  before_script:
    - apk add --no-cache curl

  script:
    - echo "🚀 發送 Release 通知..."
    - |
      TAG="$CI_COMMIT_TAG"

      curl -s -X POST "$SLACK_WEBHOOK_URL" \
        -H 'Content-type: application/json' \
        -d "{
          \"attachments\": [{
            \"color\": \"#2eb886\",
            \"title\": \"🚀 版本 ${TAG} 開始部署\",
            \"text\": \"生產環境部署已啟動\",
            \"fields\": [
              {\"title\": \"版本\", \"value\": \"${TAG}\", \"short\": true},
              {\"title\": \"策略\", \"value\": \"Canary\", \"short\": true},
              {\"title\": \"Project\", \"value\": \"${CI_PROJECT_NAME}\", \"short\": true}
            ],
            \"footer\": \"AISDLC Agent Notification\",
            \"ts\": $(date +%s)
          }]
        }" || echo "⚠️ Slack 通知發送失敗"

# ============================================================
# Job 5: Pipeline 失敗通知
# ============================================================
notify-pipeline-failure:
  stage: notify-dispatch
  image: alpine:latest
  timeout: 2 minutes

  rules:
    - if: '$SLACK_WEBHOOK_URL'
      when: on_failure
    - when: never

  allow_failure: true

  before_script:
    - apk add --no-cache curl

  script:
    - echo "🔴 發送 Pipeline 失敗警報..."
    - |
      curl -s -X POST "$SLACK_WEBHOOK_URL" \
        -H 'Content-type: application/json' \
        -d "{
          \"attachments\": [{
            \"color\": \"#e01e5a\",
            \"title\": \"🔴 Pipeline 失敗警報\",
            \"text\": \"Pipeline 執行失敗，請檢查\",
            \"fields\": [
              {\"title\": \"Project\", \"value\": \"${CI_PROJECT_NAME}\", \"short\": true},
              {\"title\": \"Branch\", \"value\": \"${CI_COMMIT_REF_NAME}\", \"short\": true},
              {\"title\": \"Pipeline\", \"value\": \"${CI_PIPELINE_URL}\", \"short\": false}
            ],
            \"footer\": \"AISDLC Agent Notification\",
            \"ts\": $(date +%s)
          }]
        }" || true
