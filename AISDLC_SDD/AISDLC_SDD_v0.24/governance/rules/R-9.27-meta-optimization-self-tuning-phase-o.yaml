id: R-9.27
title: Phase O 自我調參的對抗式有界元最佳化
trigger_states:
  - LEARNING_COMMIT
  - MEMORY_CONSOLIDATION
severity: high
maturity: active
spec: >
  L10 完整之「離線活體元迴圈」切片：系統可自我學習目標函式權重，但受對抗式防自評 +
  既有 META_FSM 有界停機雙重封頂。9.27.1 調參有界（ObjectiveTuningBounded）：objective_tuner
  候選格點展開 ≤ SDD_OBJ_TUNE_BUDGET clamp[8,256] 預設 64；obj-profile 採納/退役 churn ≤
  SDD_META_CHURN_MAX（重用既有 META_FSM.ChurnBounded）；超限即停搜尋／導 MFSM_ESCALATION，
  絕不無限調參抖動或指數搜尋。9.27.2 反 Goodhart 對抗分離（Anti-Goodhart Separation）：候選
  profile 的 capability-delta tier 唯一合法來源為 tuner 不可見、content-hashed 凍結的 held-out
  現實代理勝率；objective_tuner 與 composition_objective_scorer 自評分數結構性禁止充當
  capability-delta；tuner 程式路徑禁止 import oracle / 讀寫 held-out 語料（編譯期隔離斷言）。
  9.27.3 調參 PROPOSED + 不自我裁決：objective_tuner 只產 proposed profile，
  OBJECTIVE_PROFILE_VERSION bump 必經人工 signoff（守 Rule 8 / 9.26.4）；adopt_profile
  human_signoff=False 直接拒絕；tuner/steersman 絕不自動 commit 改 scorer 權重、絕不自寫常數。
  9.27.4 元最佳化納入既有 META_FSM（不增第六軌）：obj-profile 採納/退役走 meta_halt_monitor 的
  obj-profile: 指紋命名空間，受既有 ChurnBounded/GraduationRatchet 納管；不改 META_FSM.tla
  狀態宇宙、不新增第六形式化軌；五軌 TLC（SDD 42 / META 13 / FLEET 7 / COMPOSITION 21 /
  OPTIMIZATION 12）全不回歸、obj-profile 不污染單軌 SDD_FSM.tla。9.27.5 最優性/進步性誠實：
  held-out 勝率 tier 為 capability_level 唯一合法來源，不得用 objective scorer 自身分數充當
  capability-delta（防自評）；提案報告須誠實附 held-out 勝率與樣本數。對應 objective_tuner /
  objective_replay_oracle / meta_halt/meta_halt_monitor。禁止：tuner 自動 commit/自寫 scorer
  權重常數繞過人工 bump、用自評分數充當 capability-delta tier、tuner 讀寫/影響 held-out 語料、
  obj-profile 採納退役繞過 meta_halt_monitor 或無 capability-delta re-adopt、候選搜尋無上限指數
  爆炸、obj-profile 元迴圈併入單軌 SDD_FSM.tla 污染 reachable、未經 OPEN-M.7 私自開 HTTP 外聯
  做活體元最佳化（破 OPEN-10.6）。
