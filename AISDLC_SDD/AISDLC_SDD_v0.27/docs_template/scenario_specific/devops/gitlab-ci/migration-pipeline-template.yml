# ═══════════════════════════════════════════
# Layer 2.3: Performance Comparison
# ═══════════════════════════════════════════

performance-compare:
  stage: perf-compare
  image: node:${NODE_VERSION}-alpine
  timeout: 10 minutes
  allow_failure: true           # 效能比對為警告級別
  script:
    - npm ci
    - echo "⚡ Running Performance Micro-Benchmark..."
    - npm run bench || echo "⚠️ Benchmark not configured"
    - echo "📊 Comparing with legacy baseline..."
    # 比對邏輯:
    # 1. 讀取舊系統基準 (從 artifact/cache)
    # 2. 比較 P50/P99/RPS
    # 3. 若 P99 > 1.5x，標記警告
  artifacts:
    reports:
      performance: performance-report.json
    expire_in: 30 days
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^(migration|migrate)\//'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# ═══════════════════════════════════════════
# Layer 3.1: DB Migration Dry-Run
# ═══════════════════════════════════════════

db-migration-dryrun:
  stage: db-dryrun
  image: node:${NODE_VERSION}-alpine
  timeout: 10 minutes
  allow_failure: false
  script:
    # 驗證回滾腳本存在
    - |
      if [ ! -f "deploy/rollback.sh" ]; then
        echo "🔴 deploy/rollback.sh not found"
        echo "Every migration PR must include a rollback script"
        exit 1
      fi
    - bash -n deploy/rollback.sh
    - echo "✅ Rollback script syntax valid"

    # DB Migration Dry-Run
    - echo "🗄️ Running DB migration dry-run..."
    # Flyway:
    # - flyway -url=$DB_URL -dryRunOutput=dryrun.sql migrate
    # Prisma:
    # - npx prisma migrate diff --from-schema-datasource --to-schema-datamodel
    # Django:
    # - python manage.py migrate --plan
    - echo "✅ DB migration dry-run passed"

    # DB Rollback 驗證
    - |
      if [ -f "deploy/db-rollback.sql" ]; then
        echo "✅ DB rollback SQL found"
      else
        echo "⚠️ No db-rollback.sql (may not be needed)"
      fi
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# ═══════════════════════════════════════════
# Layer 3.2: Canary Deploy (Staging)
# ═══════════════════════════════════════════

canary-deploy-staging:
  stage: canary-deploy
  image: bitnami/kubectl:latest
  timeout: 30 minutes
  allow_failure: false
  environment:
    name: staging
    url: https://staging.${CI_PROJECT_NAME}.example.com
    on_stop: rollback-staging
  script:
    - echo "🐤 Deploying canary to staging with 5% traffic..."
    # K8s + Istio:
    # - kubectl apply -f deploy/canary-config.yaml
    # - kubectl set image deployment/${CI_PROJECT_NAME}-canary app=${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHA}
    - echo "✅ Canary deployed at 5%"

    - echo "👀 Observing canary metrics for 5 minutes..."
    # 實際觀察邏輯:
    # - 查詢 Prometheus error_rate, latency_p99
    # - 若超過閾值，觸發回滾
    - echo "✅ Canary 5% metrics healthy"

    - echo "📈 Promoting canary to 25%..."
    - echo "✅ Canary at 25%, metrics healthy"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual                # 手動觸發 Staging Canary
      allow_failure: false

rollback-staging:
  stage: canary-deploy
  image: bitnami/kubectl:latest
  environment:
    name: staging
    action: stop
  script:
    - echo "🔄 Rolling back canary deployment..."
    - bash deploy/rollback.sh staging
    - echo "✅ Rollback completed"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual

# ═══════════════════════════════════════════
# Layer 3.3: Smoke + E2E Validation
# ═══════════════════════════════════════════

smoke-test:
  stage: validation
  image: node:${NODE_VERSION}-alpine
  timeout: 15 minutes
  allow_failure: false
  script:
    - npm ci
    - echo "🔍 Running smoke tests against canary..."
    # - npm run test:smoke -- --target=staging
    # - npm run test:e2e -- --target=staging
    - echo "✅ Smoke + E2E tests passed"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

