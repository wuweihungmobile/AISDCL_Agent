# ═══════════════════════════════════════════
# Layer 2.2: Contract Test
# ═══════════════════════════════════════════

contract-test:
  stage: contract-test
  image: node:${NODE_VERSION}-alpine
  timeout: 10 minutes
  allow_failure: false
  script:
    - npm ci
    - echo "📋 Running API Contract Tests..."
    - npm run test:contract
    # 或使用 OpenAPI Schema 驗證:
    # - npx swagger-cli validate api/openapi.yaml
    # 或使用 Pact:
    # - npx pact-provider-verifier --provider-base-url=http://localhost:3000
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^(migration|migrate)\//'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

