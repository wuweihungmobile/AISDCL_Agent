# ============================================================
# AISDLC v0.09 - Migration Pipeline (Canary + Rollback)
# GitLab CI Template
# ============================================================
#
# 使用方式:
#   1. 在 .gitlab-ci.yml 中引入:
#      include:
#        - local: 'ci-templates/migration-pipeline.yml'
#   2. 調整技術棧（舊棧/新棧建置命令）
#   3. 配置 Canary 部署目標
#
# 前置條件:
#   - Layer 0 (security-baseline stage) 已配置
#   - Layer 1 (lint/build/test stages) 已配置
#
# 參考文檔: Migration_Pipeline_Template.md
# ============================================================

# ─── Stage 定義（承接 Layer 0 + Layer 1） ───
stages:
  - security-baseline    # Layer 0
  - lint                 # Layer 1.1
  - build                # Layer 1.2
  - test                 # Layer 1.3
  - dual-build           # Layer 2.1 - Migration 專屬
  - contract-test        # Layer 2.2 - Migration 專屬
  - perf-compare         # Layer 2.3 - Migration 專屬
  - db-dryrun            # Layer 3.1 - Migration 專屬
  - canary-deploy        # Layer 3.2 - Migration 專屬
  - validation           # Layer 3.3 - Migration 專屬

# ─── 全域變數 ───
variables:
  NODE_VERSION: "20"
  LEGACY_DIR: "legacy"
  COVERAGE_THRESHOLD: "70"
  CANARY_NAMESPACE: "production"

# ═══════════════════════════════════════════
# Layer 2.1: Dual-Build
# ═══════════════════════════════════════════

build-new-stack:
  stage: dual-build
  image: node:${NODE_VERSION}-alpine
  timeout: 15 minutes
  allow_failure: false
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/
  script:
    - npm ci
    - npm run build
    - npm run test -- --coverage --ci
  artifacts:
    paths:
      - dist/
    expire_in: 7 days
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^(migration|migrate)\//'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

build-legacy-stack:
  stage: dual-build
  image: node:${NODE_VERSION}-alpine
  timeout: 15 minutes
  allow_failure: false
  cache:
    key:
      files:
        - ${LEGACY_DIR}/package-lock.json
    paths:
      - ${LEGACY_DIR}/node_modules/
  script:
    - cd ${LEGACY_DIR}
    - npm ci
    - npm run build
    - npm run test -- --ci
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^(migration|migrate)\//'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

