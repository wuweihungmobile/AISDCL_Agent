\* TLC config for SDD_FSM (Phase G M5 / ACT-042 / B5.3)
\* 對應 .tla:  tools/fsm_runtime/formal/SDD_FSM.tla
\* 對應規則:  CLAUDE.md Rule 9.18

SPECIFICATION
    Spec

\* ===== Small-Model 抽象（ACT-065 liveness）=====
\* 本模型的 retry/recovery/compact/hub 轉換結構為 **bound-parametric**：GateRetry
\* （retry<MAX 時 ++）/ GateExhaust（retry≥MAX 時 ESCALATION）等規則對任一 MAX 值
\* 結構完全相同 → reachable 的「狀態類型」與 bug 模式不隨 bound 值改變（small-model
\* 假說成立）。故 TLC 取最小有限 bound 即可同時窮舉驗證 safety 與 liveness；runtime
\* 仍 enforce 真實上限（PR_REVIEW retry=5 / 全 session recovery=3 /
\* MAX_AUTO_COMPACT_PER_STAGE=3）。小 bound 換得 liveness tableau 可解（秒級完成）。
CONSTANTS
    MAX_RETRY = 2         \* small-model（結構等價於 runtime 的 PR_REVIEW=5）
    MAX_RECOVERY = 1      \* small-model（結構等價於 Rule 9.14.1 全 session=3）
    MAX_COMPACT = 1       \* small-model（結構等價於 MAX_AUTO_COMPACT_PER_STAGE=3）
    MAX_HUB = 1           \* small-model（HUB_SYNC one-shot）

\* Safety invariants（必須恆真，否則 TLC 報 Invariant violation）
INVARIANT
    TypeOK
    RetryBounded
    RecoveryBounded
    NotInBothSets

\* Phase I M2 / ACT-065（根因修復後）：兩條液性性質皆啟用並由 TLC 窮舉驗證 PASS。
\* EventuallyTerminal 可成立的關鍵 = 在 .tla 加 compact/hub 有界計數器，消除
\* AUTO_COMPACT/HUB wildcard 假 2-cycle（與現實 MAX_AUTO_COMPACT_PER_STAGE 對齊），
\* 並對「推向 terminal」的單一 action 加精簡 SF（落在 TLC DNF 上限內）。
PROPERTY
    EventuallyTerminal
    ObservationsTransient

\* 探索深度上限：50 步（per 規劃文件 §M5）
\* 變數空間 = States(39) × retry(0..5) × recovery(0..3) × compact(0..3) × hub(0..2)
\*   Phase I 後：HappyStates 18 + ObservationStates 11 + EmergencyStates 4 + Terminals 3 = 36
\*   Phase J 後：HappyStates 19 + ObservationStates 13 + EmergencyStates 4 + Terminals 3 = 39
\*     （+ADVERSARIAL_EVALUATION gatekeep；+CAPABILITY_BENCHMARK / +SPEC_PATCH_PROPOSAL observation）
CHECK_DEADLOCK
    FALSE
\* CHECK_DEADLOCK=FALSE：terminals 透過 T_TerminalStutter 自我遷移，
\* TLC 預設將其偵測為 deadlock；安全性靠 INVARIANT 守。
