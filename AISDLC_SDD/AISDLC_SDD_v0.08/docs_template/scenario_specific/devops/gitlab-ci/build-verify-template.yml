# ═══════════════════════════════════════════
# Job 2: Compile / Build
# ═══════════════════════════════════════════

# --- Node.js ---
build-node:
  stage: build
  image: node:${NODE_VERSION}-alpine
  timeout: 10 minutes
  allow_failure: false
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/
  script:
    - npm ci
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 7 days
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH =~ /^(main|develop|release)/'

