# ============================================================
# AISDLC v0.09 - Layer 1 Build & Verify
# GitLab CI Template
# ============================================================
#
# 使用方式:
#   1. 在 .gitlab-ci.yml 中引入:
#      include:
#        - local: 'ci-templates/build-verify.yml'
#   2. 調整語言/框架設定
#   3. 設定 COVERAGE_THRESHOLD 變數
#
# 前置條件: Layer 0 security-baseline stage 已通過
# 參考文檔: Layer1_Build_Verify_Template.md
# ============================================================

# ─── Stage 定義（承接 Layer 0） ───
stages:
  - security-baseline    # Layer 0
  - lint                 # Layer 1.1
  - build                # Layer 1.2
  - test                 # Layer 1.3
  - quality              # Layer 2
  - deploy               # Layer 3

# ─── 全域變數 ───
variables:
  NODE_VERSION: "20"
  COVERAGE_THRESHOLD: "80"

# ═══════════════════════════════════════════
# Job 1: Lint + Format Check
# ═══════════════════════════════════════════

# --- Node.js ---
lint-node:
  stage: lint
  image: node:${NODE_VERSION}-alpine
  timeout: 5 minutes
  allow_failure: false
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/
  script:
    - npm ci --ignore-scripts
    - npm run lint
    - npx prettier --check "src/**/*.{ts,tsx,js,jsx}"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH =~ /^(main|develop|release)/'

