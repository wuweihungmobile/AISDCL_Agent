\* 對應規則:  CLAUDE.md Rule 9.26.1 / 9.26.5

SPECIFICATION
    Spec

\* ===== Small-Model 抽象 =====
\* expanded 為 bound-parametric：ExpandStay/ExpandPrune（expanded<MAX 時 ++）/ Exhaust*
\* （expanded≥MAX 時終局）對任一 MAX 值結構相同 → reachable 狀態類型與 bug 模式不隨 bound
\* 改變（small-model 假說成立）。取最小有限 bound 同時窮舉 safety + liveness；runtime 仍
\* enforce 真實上限（SDD_OPT_NODE_BUDGET 預設 256）。
CONSTANTS
    MAX_NODES = 2

\* Safety invariants（必須恆真）
INVARIANT
    TypeOK
    SearchBounded
    ScheduledImpliesFound
    EscalationExhausted
    StableIsFixpoint

\* Liveness（公平性下必抵 terminal）
PROPERTY
    EventuallyScheduled

\* terminals 透過 TerminalStutter 自我遷移，TLC 預設偵測為 deadlock；安全性靠 INVARIANT 守。
CHECK_DEADLOCK
    FALSE
