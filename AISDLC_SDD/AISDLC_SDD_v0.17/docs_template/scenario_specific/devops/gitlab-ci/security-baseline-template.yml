#     LICENSE_FINDER_CLI_OPTS: '--decisions-file=.license-decisions.yml'

# ═══════════════════════════════════════════
# Gate: Layer 0 通過才能繼續
# ═══════════════════════════════════════════
# GitLab CI 透過 stage 順序自動保證：
# security-baseline stage 中任何 allow_failure: false 的 job 失敗，
# 後續 stage（build, test, deploy）都不會執行。

# ═══════════════════════════════════════════
# Hotfix 旁路規則
# ═══════════════════════════════════════════
# 在 hotfix/* 分支上，dependency-scan 和 license-check 降級為警告：
#
# dependency-scan:
#   allow_failure:
#     exit_codes: [1]
#   rules:
#     - if: '$CI_COMMIT_BRANCH =~ /^hotfix\//'
#       allow_failure: true
#     - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
#
# 注意: secret-scan 永遠不可跳過，即使 hotfix 分支。
