# ============================================================
# AISDLC v0.09 - Layer 0 Security Baseline
# GitLab CI Template
# ============================================================
#
# 使用方式:
#   1. 在專案 .gitlab-ci.yml 中引入此模板:
#      include:
#        - local: 'ci-templates/security-baseline.yml'
#   2. 或複製內容至 .gitlab-ci.yml 的 stages 前段
#   3. 設定 CI/CD Variables（如 SNYK_TOKEN）
#
# 參考文檔: Layer0_Security_Baseline_Template.md
# ============================================================

# ─── Stage 定義 ───
stages:
  - security-baseline    # Layer 0（強制第一階段）
  - build                # Layer 1
  - test                 # Layer 1
  - quality              # Layer 2
  - deploy               # Layer 3

# ─── 全域變數 ───
variables:
  SECURITY_SCAN_TIMEOUT: "600"   # 10 分鐘超時
  SEVERITY_THRESHOLD: "HIGH"      # HIGH+ 阻塞

# ═══════════════════════════════════════════
# Job 1: Secret Detection
# ═══════════════════════════════════════════
secret-scan:
  stage: security-baseline
  image: trufflesecurity/trufflehog:latest
  timeout: 5 minutes
  allow_failure: false           # 永遠不可跳過
  script:
    - trufflehog git file://. --since-commit HEAD~1 --only-verified --fail
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH =~ /^(main|develop|release)/'

# 備選: gitleaks
# secret-scan-gitleaks:
#   stage: security-baseline
#   image: zricethezav/gitleaks:latest
#   script:
#     - gitleaks detect --source . --verbose --redact

# ═══════════════════════════════════════════
# Job 2: Dependency Scan (SCA)
# ═══════════════════════════════════════════

# --- Trivy（多語言通用，推薦） ---
dependency-scan:
  stage: security-baseline
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  timeout: 10 minutes
  allow_failure: false
  script:
    - trivy fs . --severity CRITICAL,HIGH --exit-code 1 --format table
  artifacts:
    when: always
    reports:
      # GitLab 原生依賴掃描報告
      dependency_scanning: gl-dependency-scanning-report.json
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH =~ /^(main|develop|release)/'

