# ═══════════════════════════════════════════
# Job 3: License Compliance
# ═══════════════════════════════════════════
license-check:
  stage: security-baseline
  image: node:20-alpine
  timeout: 5 minutes
  allow_failure: true            # 警告模式（可改為 false 阻塞）
  script:
    - |
      if [ -f "package.json" ]; then
        npm install -g license-checker
        npm ci --ignore-scripts
        license-checker --failOn "GPL-3.0;AGPL-3.0" --summary
      else
        echo "No package.json found, skipping Node.js license check"
      fi
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH =~ /^(main|develop|release)/'

# GitLab 原生 License Scanning（Ultimate 版本）
# license-scanning:
