# Phase P / ACT-118 — pipeline 級聯合 held-out 現實代理語料（凍結 + content-hashed）
#
# 接縫 Goodhart 假優（tuned scorer = objective）：弱化/放寬該評分器在 per-scorer 樸素視角『沒退步』，但整套套進 pipeline 聯合重放整體變差（接縫 Goodhart）。
# 某評分器 profile 對候選的成本 = Σ weight(name) × feature(name)；聯合選中 = 各評分器成本之和最低。
# 只有 joint_calibration_oracle 讀本檔；scorer_calibration_registry（生成器）看不到。
case_id: JOINT-019
expect: seam_goodhart
tuned_scorer: objective
candidate_profile: {namespace: "obj-profile:", weights: {batch_w: 1.0, latency_w: 0.0}}
candidates:
  - real_quality: 0.16          # 整體很差候選（唯有該評分器被弱化才被選中）
    features:
      objective: {latency_w: 1.0, batch_w: 1.0}
  - real_quality: 0.93          # 整體穩健候選（incumbent 選它）
    features:
      objective: {latency_w: 0.0, batch_w: 1.0}
