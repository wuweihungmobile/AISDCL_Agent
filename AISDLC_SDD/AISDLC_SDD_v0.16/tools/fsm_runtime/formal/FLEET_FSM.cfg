\* TLC config for FLEET_FSM (Phase I M5 / ACT-072)
\* 對應 .tla:  tools/fsm_runtime/formal/FLEET_FSM.tla
\* 對應藍圖:  SDD_improving_Automation_09.md §5.4 / PI-1

SPECIFICATION
    Spec

CONSTANTS
    Features = {A, B}     \* 2 並行 feature（symmetry 下足以驗 N 軌互斥/無死鎖）
    Locks = {L1}          \* 1 共享 spec 區段鎖（最強競爭）

\* Symmetry reduction：feature 可交換 → 縮減狀態空間（Apalache symmetry 精神）
SYMMETRY
    Symmetry

\* Safety invariants（symmetry 對 safety 健全）
INVARIANT
    TypeOK
    LockMutex
    NoPartialHold

\* ⚠️ Liveness（AllEventuallyDone）不在此 cfg 檢查：
\* TLC 在 SYMMETRY 啟用下檢查 liveness 可能「漏掉違規」（unsound），故 liveness
\* 改由 FLEET_FSM_LIVENESS.cfg（無 SYMMETRY）獨立窮舉驗證。run_tlc.sh Step 5 兩者皆跑。

CHECK_DEADLOCK
    FALSE
\* CHECK_DEADLOCK=FALSE：全 done 後無後繼為「正常終止」而非死鎖；
\* 真正的「無死鎖」由 NoPartialHold（無循環等待）+ AllEventuallyDone（必達 done，見 LIVENESS cfg）保證。
