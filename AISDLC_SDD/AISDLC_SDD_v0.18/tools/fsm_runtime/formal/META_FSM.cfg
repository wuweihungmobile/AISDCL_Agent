\* TLC config for META_FSM (Phase L M-L1 / ACT-090)
\* 對應 .tla:  tools/fsm_runtime/formal/META_FSM.tla
\* 對應規則:  CLAUDE.md Rule 9.24.1（ChurnBounded）/ 9.24.2（GraduationRatchet）

SPECIFICATION
    Spec

\* ===== Small-Model 抽象 =====
\* churn / cap 計數器為 bound-parametric：GrowReadopt（churn<MAX 時 churn++/cap++）與
\* ChurnEscalate（churn≥MAX 或 cap≥MAX 時→ESCALATION）的結構對任一 MAX 值完全相同 →
\* reachable 的「狀態類型」與抖動偵測模式不隨 bound 改變（small-model 假說成立）。故取
\* 最小有限 bound 即可同時窮舉 safety 與 liveness；runtime 仍 enforce 真實上限
\* （SDD_META_CHURN_MAX clamp[1,5] 預設 2）。
CONSTANTS
    MAX_CHURN = 2
    MAX_CAP = 2

\* Safety invariants（必須恆真）
INVARIANT
    TypeOK
    ChurnBounded
    GraduationRatchet
    ReadoptGated
    StableIsFixpoint
    CrossScorerChurnBounded
    DimensionCardinalityBounded
    SwapCadenceBounded
    VocabGenesisBounded
    BatchSwapCadenceBounded
    OperatorGenesisBounded
    OperatorComputabilityBounded
    AlphabetGenesisBounded
    ComputabilityClosureBounded
    DepthGenesisBounded
    DepthClosureBounded
    RecursionGenesisBounded
    RecursionClosureBounded
    EmbodiedGroundingBounded
    VisualizationBounded

\* Liveness：元迴圈最終必抵不動點 MFSM_STABLE 或人工閘 MFSM_ESCALATION（不永久 churn）。
PROPERTY
    EventuallyMetaStable

CHECK_DEADLOCK
    FALSE
\* CHECK_DEADLOCK=FALSE：terminals（STABLE/ESCALATION）透過 TerminalStutter 自我遷移，
\* TLC 預設將其偵測為 deadlock；有界停機靠 ChurnBounded + EventuallyMetaStable 保證。
