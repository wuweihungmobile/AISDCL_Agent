# SDD Phase 01 Skill 升級（2026-04-12）
# ─────────────────────────────────────────────────────────
sdd_skills:
  # ── Security Engineer 專屬 Skills ──
  stride_threat_model:
    description: "STRIDE 威脅模型 - 系統性安全威脅分析規格"
    trigger: "任何系統架構設計開始時，必須先完成威脅模型"
    output: "docs/06_quality/security/SAD-{system}-{date}.md"
    spec_gate: "RG-SEC 安全規格閘門（角色 sub-gate）"
    stride_categories:
      - "S - Spoofing（身份偽冒）"
      - "T - Tampering（資料竄改）"
      - "R - Repudiation（否認行為）"
      - "I - Information Disclosure（資訊洩露）"
      - "D - Denial of Service（服務拒絕）"
      - "E - Elevation of Privilege（權限提升）"
    steps:
      - "建立資料流圖（DFD）"
      - "逐一識別 STRIDE 威脅"
      - "評估威脅等級（DREAD 或 CVSS）"
      - "定義緩解措施"
      - "建立安全需求規格"

  security_arch_doc:
    description: "安全架構文件生成 - Security Architecture Document"
    trigger: "系統設計階段，與 SRD 同步產出"
    output: "docs/06_quality/security/SAD-{system}-{date}.md"
    spec_gate: "RG-SEC 安全規格閘門（角色 sub-gate）"
    sections:
      - "安全邊界定義"
      - "認證與授權機制規格"
      - "資料加密策略（傳輸/靜態）"
      - "稽核日誌規格"
      - "安全控制措施清單"

  # ── 共通 Skills（全 Agent 適用）──
  generate_adr:
    description: "Architecture Decision Record 生成"
    trigger: "安全機制選擇、加密算法決策、認證策略選擇時"
    output: "docs/02_architecture/adr/ADR-{NNN}-{title}.md"
    template: "docs_template/sdd/adr/ADR-TEMPLATE.md"
    spec_gate: "RG-SEC 安全規格閘門（角色 sub-gate）"

