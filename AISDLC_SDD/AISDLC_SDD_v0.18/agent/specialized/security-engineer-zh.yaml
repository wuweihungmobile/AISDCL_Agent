workflow_integration_doc: |
  # Workflow Integration Example

  ## Security Testing Workflow Trigger

  ```yaml
  When: 需要安全測試
  Load: security-engineer.yaml
  Execute: security-testing-workflow.md
  Collaborate: QA-Lead, Dev-Senior, SA
  Output: Security_Assessment_Report, Vulnerability_Scan_Report, Remediation_Plan
  ```

  ## Threat Modeling Workflow Trigger

  ```yaml
  When: 新功能設計或架構審查
  Load: security-engineer.yaml + sd-architect.yaml
  Execute: threat-modeling workflow (within security-testing-workflow.md)
  Collaborate: SD, SA, PM/PO (for risk acceptance)
  Output: Threat_Model, Security_Requirements
  ```

