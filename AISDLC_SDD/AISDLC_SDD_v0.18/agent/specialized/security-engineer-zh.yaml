sdd_phase05_security:
  # 5.8.3 資產分類規格標準格式
  asset_classification_spec:
    description: "資產分類規格 — 系統資產清單與信任邊界識別標準格式"
    trigger: "Security 情境 Stage 0：任何系統設計時，安全範圍確認前強制執行"
    output_asset_inventory: "docs/06_quality/security/ASSET-INVENTORY-{system}.md"
    output_trust_boundary: "docs/02_architecture/TRUST-BOUNDARY-MAP-{system}.md"
    template_asset: "docs_template/sdd/testing/ASSET-INVENTORY-TEMPLATE.md"
    template_boundary: "docs_template/sdd/architecture/TRUST-BOUNDARY-MAP-TEMPLATE.md"
    spec_gate: "RG-SEC 安全規格閘門（角色 sub-gate）"
    asset_classification_levels:
      critical:
        definition: "直接財務或法規影響（支付卡號、密碼 Hash）"
        encryption: "傳輸 + 靜態雙重加密（AES-256 + TLS 1.3）"
        access: "MFA + RBAC + 最小權限"
        retention: "依法規要求（PCI-DSS Req.3）"
      high_pii:
        definition: "個人識別資訊（姓名/Email/電話）"
        encryption: "傳輸加密 + 靜態加密（AES-256）"
        access: "RBAC + 最小權限"
        retention: "3 年或依 GDPR Art.5(1)(e)"
      internal:
        definition: "內部業務資料（訂單/日誌）"
        encryption: "傳輸加密（TLS）"
        access: "RBAC"
        retention: "1 年"
      public:
        definition: "公開資訊（產品目錄）"
        encryption: "傳輸加密（完整性）"
        access: "無特殊限制"
        retention: "無限制"
    trust_boundary_types:
      - "外部用戶 → API Gateway（Internet Boundary）"
      - "API Gateway → 內部服務（Internal Service Boundary）"
      - "服務 → 資料庫（Data Boundary）"
      - "服務 → 第三方 API（Third-party Boundary）"
      - "CI/CD → Production（Deployment Boundary）"

