# ─────────────────────────────────────────────────────────
# SDD Phase 01 Skill 升級（2026-04-12）
# ─────────────────────────────────────────────────────────
sdd_skills:
  # ── QA Lead 專屬 Skills ──
  test_strategy_spec:
    description: "測試策略規格化 - Test Strategy Specification（先於開發）"
    trigger: "SRD 完成後，開發開始前，強制產出測試策略規格"
    output: "docs/03_testing/TEST-STRATEGY-{project}-{date}.md"
    spec_gate: "RG-TEST 測試策略閘門（角色 sub-gate）"
    sections:
      - "測試範圍與目標"
      - "測試類型（Unit/Integration/E2E/Performance/Security）"
      - "測試環境規格"
      - "自動化策略與工具選擇"
      - "測試覆蓋率目標（Code Coverage / Feature Coverage）"
      - "缺陷管理流程"
      - "測試退出標準（Exit Criteria）"

  test_contract_gen:
    description: "測試契約生成 - Test Contract Specification"
    trigger: "任何 API 或服務整合點定義時"
    output: "docs/03_testing/contracts/TCS-{feature}-{date}.md"
    template: "docs_template/sdd/testing/RTM-TEMPLATE.md"
    spec_gate: "RG-TEST 測試策略閘門（角色 sub-gate）"
    steps:
      - "識別測試契約邊界（Interface Contract）"
      - "定義輸入/輸出規格"
      - "建立契約測試案例"
      - "確保與 Consumer-Driven Contract 對齊"
      - "納入 CI Pipeline 自動驗證"

  # ── 共通 Skills（全 Agent 適用）──
  generate_adr:
    description: "Architecture Decision Record 生成"
    trigger: "任何技術或架構決策時觸發（測試工具選型、測試策略重大變更）"
    output: "docs/02_architecture/adr/ADR-{NNN}-{title}.md"
    template: "docs_template/sdd/adr/ADR-TEMPLATE.md"

  traceability_matrix:
    description: "需求追溯矩陣生成"
    trigger: "SCG-0（FRD 後）、SCG-1（SRD 後）、SCG-4（測試計畫後）、需求變更後"
    output: "docs/03_testing/RTM-{project}-{date}.md"
    template: "docs_template/sdd/testing/RTM-TEMPLATE.md"
    format: "| EPIC | Feature | User Story | AC | AT | API | NFR | Status |"

# ─────────────────────────────────────────────────────────
# SDD Phase 05 Skills 升級（2026-04-13）
# 情境：Testing QA + Security Testing
# ─────────────────────────────────────────────────────────
sdd_phase05_testing:
  # 5.2.2 測試金字塔規格生成
  test_pyramid_spec_gen:
    description: "測試金字塔規格生成 — 明確定義各層測試比例與工具"
    trigger: "Test Strategy Spec 建立時，必須產出金字塔規格"
    output: "docs/03_testing/TEST-STRATEGY-{project}-{date}.md（金字塔規格章節）"
    spec_gate: "RG-TEST 測試策略閘門（角色 sub-gate）"
    pyramid_layers:
      unit:
        ratio: "40-50%"
        coverage_target: "≥ 80% line coverage"
        ownership: "開發者"
        tools: "{Jest/JUnit/pytest}"
      integration:
        ratio: "25-30%"
        coverage_target: "所有服務整合點"
        tools: "{Testcontainers/REST Assured}"
      api_contract:
        ratio: "25-30%"
        coverage_target: "所有 API 端點 + Contract Tests"
        tools: "{Pact/Spring Cloud Contract}"
      e2e:
        ratio: "10-15%"
        coverage_target: "關鍵使用者旅程 100%"
        tools: "{Playwright/Cypress}"
    quality_gate_thresholds:
      - "Unit Coverage < 80% → 阻擋 CI"
      - "關鍵 AC 無 AT → 阻擋 CI"
      - "E2E 關鍵路徑失敗 → 阻擋發布"

  # 5.8.6 Security Test Spec 格式（安全測試場景）
  security_test_spec_format:
    description: "安全測試規格格式 — 基於 STRIDE 威脅的 DAST 測試場景定義"
    trigger: "Security 情境 Stage 4：安全測試規格建立時"
    output: "docs/03_testing/SECURITY-TEST-SPEC-{system}-{date}.md"
    template: "docs_template/sdd/testing/SECURITY-TEST-SPEC-TEMPLATE.md"
    spec_gate: "RG-SEC 安全規格閘門（角色 sub-gate）"
    test_case_format:
      fields: ["STS ID", "測試名稱", "對應 STRIDE 威脅 ID", "測試方法", "預期結果", "Pass/Fail"]
      mandatory_coverage:
        - "每個 High+ STRIDE 威脅有至少 1 個 DAST 測試案例"
        - "OWASP Top 10 全覆蓋"
        - "認證/授權繞過測試"
    pass_criteria:
      fail_on: "CVSS ≥ 7.0 漏洞 / 認證授權繞過"
      warn_on: "CVSS 4.0-6.9 漏洞（1 個月修復 SLA）"
