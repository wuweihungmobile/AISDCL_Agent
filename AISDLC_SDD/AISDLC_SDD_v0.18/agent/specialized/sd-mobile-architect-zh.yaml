    - agent_type: "SA"
      input_documents: "FRD、用戶故事、驗收標準、Mobile 功能需求"
      interaction_mode: "需求對齊與技術可行性評估"
      validation_criteria: "功能需求清晰、Mobile 平台範圍已定義、技術約束已識別"

    - agent_type: "PM/PO"
      input_documents: "產品優先級、平台決策（iOS/Android/跨平台）、發布時程"
      interaction_mode: "諮詢式"
      validation_criteria: "平台策略與業務目標一致、優先級已理解"

  downstream_collaboration:
    - agent_type: "Dev-Senior"
      output_documents: "Mobile 架構設計、技術堆疊建議、架構模式、離線策略"
      handoff_criteria: "架構決策清晰、技術選型已記錄、平台模式已定義"
      support_level: "實作期間提供持續架構諮詢"

    - agent_type: "QA-Mobile-Tester"
      output_documents: "Mobile 架構約束、裝置相容矩陣、可測試性指引"
      handoff_criteria: "平台限制已記錄、測試切入點已識別"
