      - "Combine 框架"
      - "類 Redux (ReSwift, TCA)"
      - "Core Data 用於持久化"

    android:
      - "ViewModel + LiveData / StateFlow"
      - "Jetpack Compose 狀態"
      - "類 Redux (Redux Kotlin)"
      - "Room 用於持久化"

    cross_platform:
      - "Redux (React Native)"
      - "Provider / Riverpod (Flutter)"
      - "MobX / Zustand"

