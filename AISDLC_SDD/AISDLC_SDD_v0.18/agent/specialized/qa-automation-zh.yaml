    - "視覺化測試執行流程和時序"
    - "顯示測試可靠性趨勢和改進計畫"
    - "說明測試覆蓋率缺口和建議"

anti_patterns_to_avoid:
  - "❌ 錄製和回放而無結構（脆弱測試）"
  - "❌ 測試實作細節而非行為"
  - "❌ 過多 E2E 測試（倒置測試金字塔）"
  - "❌ 硬編碼等待而非智慧等待"
  - "❌ 具有隱藏依賴和設置的測試"
  - "❌ 忽略不穩定測試而非修復"
  - "❌ 不在 CI/CD 中執行測試（失去目的）"
  - "❌ 自動化所有內容（專注高價值測試）"

# ─────────────────────────────────────────────────────────
# SDD Phase 01 Skill 升級（2026-04-12）
# ─────────────────────────────────────────────────────────
sdd_skills:
  generate_adr:
    description: "Architecture Decision Record 生成"
    trigger: "任何技術或架構決策時觸發"
    output: "docs/02_architecture/adr/ADR-{NNN}-{title}.md"
    template: "docs_template/sdd/adr/ADR-TEMPLATE.md"
  spec_compliance_check:
    description: "規格符合性自我驗證"
    trigger: "任何文件產出前自動執行"
    checklist:
      completeness: ["所有必填欄位已填寫", "追溯鏈完整", "相關 ADR 已建立"]
      format: ["文件命名符合規範", "目錄位置正確", "Markdown 格式通過 Lint"]
      cross_reference: ["上游文件引用正確", "下游文件連結已預留", "ID 格式統一"]
      sdd_specific: ["規格產出先於任何實作描述", "每個架構決策有對應 ADR", "API 定義使用 OpenAPI 格式"]
  traceability_matrix:
    description: "需求追溯矩陣生成"
    trigger: "SCG-0（FRD 後）、SCG-1（SRD 後）、SCG-4（測試計畫後）、需求變更後"
    output: "docs/03_testing/RTM-{project}-{date}.md"
    template: "docs/03_testing/RTM-TEMPLATE.md"
    format: "| EPIC | Feature | User Story | AC | AT | API | NFR | Status |"

# ─────────────────────────────────────────────────────────
# SDD Phase 04 Skills 升級（2026-04-13）
# 情境：DevOps 環境契約測試 + Integration Contract Test CI
# ─────────────────────────────────────────────────────────
sdd_phase04_devops:
  # 4.5.5 環境契約測試規格（Environment Contract Testing）
  environment_contract_testing:
    description: "環境契約測試 — 確保 Dev/Staging/Prod 環境行為一致"
    trigger: "DevOps Stage 4：新環境建立後 / 每次 IaC 變更後"
    output: "docs/03_testing/contracts/ENV-CONTRACT-SPEC-{project}.md"
    template: "docs_template/sdd/testing/ENV-CONTRACT-SPEC-TEMPLATE.md"
    spec_gate: "🔴 Human 確認環境一致性"
    mandatory_test_cases:
      tcs_env_001:
        name: "Runtime 版本一致性"
        check: "所有環境 Runtime 版本相同（Node/JVM/Python 版本）"
        fail_condition: "任何版本不一致"
      tcs_env_002:
        name: "API 端點行為一致性"
        check: "相同請求在 Dev/Staging/Prod 產生等價回應"
        fail_condition: "業務邏輯結果不一致"
      tcs_env_003:
        name: "環境變數完整性"
        check: "所有必要環境變數在各環境均存在"
        fail_condition: "任何環境缺少必要變數"
      tcs_env_004:
        name: "DB Schema 版本一致性"
        check: "所有環境 DB Migration 版本相同"
        fail_condition: "Schema 版本不一致"
    env_drift_detection:
      schedule: "每日 06:00 自動執行"
      alert_channel: "#devops-alerts"
      action_on_drift: "立即通知 DevOps + 阻擋相關 Deploy"
    ci_integration:
      trigger_on: "IaC 變更 / 新環境建立 / 每次 Deploy 後"
      pipeline_stage: "L2 Contract Test Layer"
      fail_behavior: "Block Deploy + 通知 DevOps"
    iac_spec_coverage:
      principle: "IaC 即規格 — 每段 IaC 必須有對應規格注解"
      annotation_format: "# Spec: INFRA-{NNN} — {需求說明}"
      validation: "CI/CD IaCS-Validate 自動檢查注解完整性"

# ─────────────────────────────────────────────────────────
# SDD Phase 05 Skills 升級（2026-04-13）
# 情境：Testing 自動化框架 + Performance 測試場景
# ─────────────────────────────────────────────────────────
sdd_phase05_qa_automation:
  # 5.2.4 自動化框架 ADR（工具選型決策）
  automation_framework_adr:
    description: "自動化測試框架選型 ADR — 工具選擇必須有明確決策記錄"
    trigger: "Testing Stage 2：自動化測試框架選型時強制產出 ADR"
    output: "docs/02_architecture/adr/ADR-{NNN}-automation-framework.md"
    template: "docs_template/sdd/adr/AUTOMATION-FRAMEWORK-ADR-TEMPLATE.md"
    spec_gate: "RG-TEST 測試策略閘門（角色 sub-gate）"
    decision_criteria:
      - "技術棧相容性（語言/框架）"
      - "團隊學習曲線"
      - "CI/CD 整合成熟度"
      - "Contract Test 支援（Pact/Spring Cloud Contract）"
      - "報告格式（RTM Coverage 生成）"
    adr_sections:
      - "Context: 目前測試框架痛點"
      - "Options: 至少 3 個候選框架比較"
      - "Decision: 選定框架及理由"
      - "Consequences: 遷移成本 + 維護策略"

  # 5.5.4 效能測試場景規格格式
  performance_test_scenario_spec:
    description: "效能測試場景規格 — 基於 PBS 定義自動化效能測試腳本結構"
    trigger: "Performance Stage 1：效能測試框架選型後，腳本規格建立時"
    output: "docs/03_testing/PBS-{system}-{date}.md（測試場景章節）"
    spec_gate: "RG-PERF 效能基準閘門（角色 sub-gate）"
    scenario_format:
      normal_load:
        description: "正常業務負載場景"
        required_fields: ["concurrent_users", "duration", "target_endpoints", "think_time"]
      peak_load:
        description: "峰值負載場景"
        required_fields: ["concurrent_users", "ramp_up", "duration", "target_endpoints"]
      stress_load:
        description: "壓力測試場景（識別崩潰點）"
        required_fields: ["start_users", "increment", "max_users", "step_duration"]
    tools_spec:
      options: ["{k6}", "{JMeter}", "{Gatling}", "{Locust}"]
      ci_integration: "每次部署前自動執行 Normal + Peak Load 場景"
      report_format: "對照 PBS SLO 的自動化結果報告"
