# ─────────────────────────────────────────────────────────
# SDD Phase 03 Refactoring 強化（2026-04-12）
# ─────────────────────────────────────────────────────────
sdd_phase03_refactoring:
  # 3.6.5 漸進式重構策略提示詞
  progressive_refactoring_strategy:
    description: "Refactoring 情境漸進式重構策略選擇與執行指引"
    trigger: "Refactoring Stage 3：重構計畫制定"
    strategies:
      strangler_fig:
        name: "Strangler Fig Pattern"
        description: "在舊系統旁建立新實作，逐步將流量從舊系統導向新系統，直到舊系統可以廢棄"
        when_to_use:
          - "需要替換核心模組但無法停機"
          - "希望能漸進驗證新實作"
          - "需要長時間並行運行"
        implementation_steps:
          - "在新路徑實作新版本功能"
          - "使用 Feature Flag 控制流量比例"
          - "監控新舊版本行為一致性"
          - "逐步增加新版本流量 (5% → 20% → 50% → 100%)"
          - "確認穩定後廢棄舊版本"
        risk_level: "低（可隨時回滾）"
      branch_by_abstraction:
        name: "Branch by Abstraction"
        description: "先引入抽象層（Interface/Abstract Class），再逐步替換具體實作"
        when_to_use:
          - "需要替換高耦合的核心依賴"
          - "舊實作到處被直接引用"
          - "不適合 Feature Flag 的情境"
        implementation_steps:
          - "為要替換的元件建立抽象介面（Interface）"
          - "讓現有程式碼依賴抽象介面"
          - "建立新實作（實作同一介面）"
          - "在抽象層切換到新實作"
          - "清理舊實作"
        risk_level: "中（需要額外抽象層的引入）"
      parallel_run:
        name: "Parallel Run"
        description: "新舊實作同時執行，比對結果一致後切換"
        when_to_use:
          - "核心計算邏輯替換（財務/計費/結算）"
          - "結果必須 100% 一致才能切換"
          - "業務風險極高"
        implementation_steps:
          - "新舊邏輯同時執行"
          - "比對結果差異（Diff 分析）"
          - "記錄所有差異到 Log"
          - "差異率 < 0.01% 後切換"
        risk_level: "低（但成本高）"
    per_step_validation:
      requirement: "每個重構 STEP 必須是原子操作"
      atomicity_criteria:
        - "單一變更（只做一件事）"
        - "可在 1-2 天內完成"
        - "完成後可獨立執行不變量測試"
        - "有明確的 Rollback Plan"
    rollback_protocol:
      - "每個 STEP 前確認 git branch 狀態"
      - "STEP 完成後先執行不變量測試"
      - "不變量測試失敗 → 立即 git revert"
      - "禁止帶著失敗的不變量測試繼續下一個 STEP"
