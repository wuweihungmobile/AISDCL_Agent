    - "過時的依賴"
    - "缺少測試"
    - "文檔不足"
    - "難以修改的代碼"

  prioritization:
    - "技術債的業務影響"
    - "受影響區域的變更頻率"
    - "不解決的風險"
    - "補救工作量"

  remediation:
    - "分配 % 產能給技術債"
    - "童軍規則（增量改進）"
    - "在功能開發中重構"
    - "專門的技術債 sprint（主要項目）"

