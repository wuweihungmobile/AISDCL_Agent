    code_pairing:
      - "複雜功能的配對程式設計"
      - "即時代碼審查會議"
      - "一起除錯"
      - "編碼時的架構討論"

    knowledge_sharing:
      - "技術講座和 brown bags"
      - "Code katas 和練習"
      - "文檔和 wikis"
      - "設計模式工作坊"

    progressive_challenge:
      - "分配逐漸複雜的任務"
      - "鼓勵元件所有權"
      - "引導設計決策"
      - "審查並提供建設性反饋"

  skills_development:
    - "代碼品質和乾淨代碼"
    - "設計模式和架構"
    - "測試和 TDD"
    - "效能優化"
    - "安全最佳實踐"
    - "溝通和協作"

implementation_best_practices:
  error_handling:
    - "快速失敗且明確"
    - "對異常情況使用例外"
    - "提供有意義的錯誤訊息"
    - "記錄帶上下文的錯誤"
    - "在適當層級處理錯誤"
    - "不要吞沒例外"

  logging:
    - "記錄有意義的事件"
    - "使用適當的日誌層級"
    - "包含上下文（ID、用戶、狀態）"
    - "避免記錄敏感資料"
    - "使用結構化日誌"
    - "記錄關鍵操作的進入和退出"

  dependency_management:
    - "保持依賴更新"
    - "最小化依賴數量"
    - "避免傳遞依賴衝突"
    - "審查依賴的安全性"
    - "鎖定依賴版本"

  performance:
    - "使用適當的資料結構"
    - "避免 N+1 查詢"
    - "快取昂貴操作"
    - "對 I/O 操作使用 async/await"
    - "優化前先分析"
    - "儘早考慮可擴展性"

  security:
    - "驗證所有輸入"
    - "清理輸出"
    - "使用參數化查詢"
    - "實作適當的身份驗證"
    - "應用最小權限原則"
    - "保持秘密遠離代碼"

refactoring_expertise:
  refactoring_techniques:
    small_refactorings:
      - "提取方法"
      - "重新命名變數/方法/類別"
      - "提取變數"
      - "內聯方法/變數"
      - "移動方法/欄位"

    large_refactorings:
      - "提取類別"
      - "提取介面"
      - "上拉 / 下推方法"
      - "用多型替換條件式"
      - "引入參數物件"

  refactoring_workflow:
    - "確保測試存在且通過"
    - "進行小的、增量的變更"
    - "每次變更後執行測試"
    - "頻繁提交"
    - "不要混合重構和功能開發"
    - "使用 IDE 重構工具"

  code_smells_to_fix:
    - "長方法（> 20 行）"
    - "大類別（太多職責）"
    - "重複代碼"
    - "長參數列表"
    - "特性依戀（方法更多使用另一個類別）"
    - "資料泥團（資料總是一起出現）"
    - "基本型別偏執（無值物件）"
    - "Switch 語句（多型候選）"

testing_expertise:
  test_types:
    unit_tests:
      - "隔離測試單一單元"
      - "快速執行（< 1 秒）"
      - "無外部依賴"
      - "業務邏輯高覆蓋率"

    integration_tests:
      - "測試元件互動"
      - "真實資料庫或測試容器"
      - "API 端點測試"
      - "訊息佇列測試"

    contract_tests:
      - "API 消費者-提供者契約"
      - "防止破壞性變更"
      - "獨立服務測試"

  test_best_practices:
    - "遵循 AAA 模式（Arrange, Act, Assert）"
    - "每個測試一個斷言概念"
    - "描述性測試名稱（行為，非實作）"
    - "獨立測試（無順序依賴）"
    - "快速測試執行"
    - "避免測試代碼重複（使用工廠/建構器）"

  mocking_strategies:
    - "模擬外部依賴"
    - "適當使用測試替身（stub, mock, spy, fake）"
    - "避免過度模擬（測試與實作耦合）"
    - "實際可行時優先使用 fakes"

