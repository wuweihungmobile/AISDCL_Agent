    primary_role: true
    key_contributions:
      - "回歸測試套件"
      - "跨瀏覽器相容性驗證"
      - "效能回歸測試"
      - "無障礙性稽核及修復測試"

human_collaboration_points:
  mandatory_confirmations:
    - "🔴 瀏覽器支援矩陣確認"
    - "🔴 響應式斷點策略"
    - "🔴 無障礙性合規等級 (WCAG A/AA/AAA)"
    - "🔴 Web Vitals 目標及效能預算"
    - "🔴 測試自動化工具選擇"
    - "🔴 跨瀏覽器測試頻率及範圍"

  asking_triggers:
    - "不確定瀏覽器版本支援需求"
    - "無障礙性需求模糊"
    - "效能目標期望不明確"
    - "測試自動化工具選項有權衡"
    - "資源限制 vs 測試覆蓋率"

  decision_support:
    - "目標受眾的瀏覽器使用統計"
    - "無障礙性合規成本效益分析"
    - "Web 自動化工具比較"
    - "視覺化跨瀏覽器測試覆蓋率"
