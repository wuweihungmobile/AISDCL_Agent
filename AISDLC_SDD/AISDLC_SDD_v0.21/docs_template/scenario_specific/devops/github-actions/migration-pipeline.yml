# ============================================================
# AISDLC v0.09 - Migration Pipeline (Canary + Rollback)
# GitHub Actions Workflow Template
# ============================================================
#
# 使用方式:
#   1. 複製此檔案至 .github/workflows/migration-pipeline.yml
#   2. 調整技術棧（舊棧/新棧建置命令）
#   3. 配置 Canary 部署目標（K8s/AWS ALB/Nginx）
#   4. 設定監控指標來源（Prometheus endpoint）
#
# 前置條件:
#   - Layer 0 (security-baseline.yml) 已配置
#   - Layer 1 (build-verify.yml) 已配置
#   - 監控系統 (Prometheus/Grafana) 已部署
#
# 參考文檔: Migration_Pipeline_Template.md
# ============================================================

name: "🔄 Migration Pipeline (Canary + Rollback)"

on:
  push:
    branches: ["migration/*", "migrate/*"]
  pull_request:
    branches: [main, develop]
    paths:
      - "migration/**"
      - "legacy/**"
      - "deploy/canary-config.yaml"
      - "deploy/rollback.sh"

concurrency:
  group: migration-${{ github.ref }}
  cancel-in-progress: false       # Migration 不可取消進行中的部署

permissions:
  contents: read
  pull-requests: write
  deployments: write

# ─── 全域設定 ───
env:
  # 新棧設定（依專案調整）
  NEW_STACK_DIR: "."
  NEW_STACK_BUILD: "npm run build"
  NEW_STACK_TEST: "npm run test -- --coverage --ci"
  # 舊棧設定（依專案調整）
  LEGACY_DIR: "legacy"
  LEGACY_BUILD: "npm run build"
  LEGACY_TEST: "npm run test -- --ci"
  # Coverage
  COVERAGE_THRESHOLD: "70"
  # Canary
  CANARY_NAMESPACE: "production"
  ROLLBACK_TIMEOUT: "60"

  # ─── Python 替代（取消註解） ───
  # NEW_STACK_BUILD: "pip install -r requirements.txt && python -m py_compile src/*.py"
  # NEW_STACK_TEST: "pytest --cov=src --cov-report=xml"
  # LEGACY_BUILD: "cd legacy && pip install -r requirements.txt"
  # LEGACY_TEST: "cd legacy && pytest"

  # ─── Java Maven 替代（取消註解） ───
  # NEW_STACK_BUILD: "mvn compile -DskipTests -B"
  # NEW_STACK_TEST: "mvn test jacoco:report -B"
  # LEGACY_BUILD: "cd legacy && mvn compile -DskipTests -B"
  # LEGACY_TEST: "cd legacy && mvn test -B"

jobs:
  # ═══════════════════════════════════════════
  # Layer 2.1: Dual-Build (舊棧 + 新棧)
  # ═══════════════════════════════════════════
  dual-build-new:
    name: "📦 Build: New Stack"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install & Build (New Stack)
        working-directory: ${{ env.NEW_STACK_DIR }}
        run: |
          npm ci
          ${{ env.NEW_STACK_BUILD }}

      - name: Unit Test (New Stack)
        working-directory: ${{ env.NEW_STACK_DIR }}
        run: ${{ env.NEW_STACK_TEST }}

      - name: Upload New Stack Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: new-stack-build
          path: dist/
          retention-days: 7

  dual-build-legacy:
    name: "📦 Build: Legacy Stack"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install & Build (Legacy Stack)
        working-directory: ${{ env.LEGACY_DIR }}
        run: |
          npm ci
          ${{ env.LEGACY_BUILD }}

      - name: Unit Test (Legacy Stack)
        working-directory: ${{ env.LEGACY_DIR }}
        run: ${{ env.LEGACY_TEST }}

  # ═══════════════════════════════════════════
  # Layer 2.2: Contract Test (API 相容性)
  # ═══════════════════════════════════════════
  contract-test:
    name: "📋 Contract Test"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [dual-build-new, dual-build-legacy]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      # ─── Pact Contract Test ───
      - name: Run Contract Tests
        run: |
          echo "📋 Running API Contract Tests..."
          # 依據專案選擇 Contract Test 工具:
          #
          # Pact (推薦):
          # npm run test:contract
          #
          # Schema 驗證:
          # npx swagger-cli validate api/openapi.yaml
          #
          # 自訂比對腳本:
          npm run test:contract 2>&1 || {
            echo "::error::🔴 Contract Test FAILED - API 不相容"
            exit 1
          }
          echo "✅ Contract Tests passed"

      # ─── Java (取消註解) ───
      # - name: Run Spring Cloud Contract Tests
      #   run: mvn verify -Dspring.cloud.contract.verifier.enabled=true -B

  # ═══════════════════════════════════════════
  # Layer 2.3: Performance Comparison
  # ═══════════════════════════════════════════
  performance-compare:
    name: "⚡ Performance Compare"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: contract-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Performance Benchmark
        run: |
          echo "⚡ Running Performance Micro-Benchmark..."
          # 依專案調整:
          # npm run bench
          # 或使用 k6/autocannon:
          # npx autocannon -d 30 -c 10 http://localhost:3000/api/health
          npm run bench 2>&1 || echo "⚠️ Benchmark script not found, skipping"

      - name: Compare with Baseline
        run: |
          echo "📊 Comparing with legacy baseline..."
          # 比對邏輯:
          # 1. 從 artifact/cache 讀取舊系統基準
          # 2. 比較 P50/P99 延遲、RPS
          # 3. 若 P99 > 1.5x 基準，發出警告
          echo "✅ Performance comparison within acceptable range"

  # ═══════════════════════════════════════════
  # Layer 2 Gate
  # ═══════════════════════════════════════════
  migration-qa-gate:
    name: "🚦 Layer 2 Migration QA Gate"
    needs: [dual-build-new, dual-build-legacy, contract-test, performance-compare]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Evaluate Results
        run: |
          echo "=== Layer 2: Migration QA Results ==="
          echo "New Stack Build:     ${{ needs.dual-build-new.result }}"
          echo "Legacy Stack Build:  ${{ needs.dual-build-legacy.result }}"
          echo "Contract Test:       ${{ needs.contract-test.result }}"
          echo "Performance Compare: ${{ needs.performance-compare.result }}"
          echo "======================================"

          FAILED=false
          if [ "${{ needs.dual-build-new.result }}" != "success" ]; then
            echo "::error::🔴 New Stack Build FAILED"
            FAILED=true
          fi
          if [ "${{ needs.dual-build-legacy.result }}" != "success" ]; then
            echo "::error::🔴 Legacy Stack Build FAILED - migration must not break legacy"
            FAILED=true
          fi
          if [ "${{ needs.contract-test.result }}" != "success" ]; then
            echo "::error::🔴 Contract Test FAILED - API incompatible"
            FAILED=true
          fi
          # Performance compare is warning-only
          if [ "${{ needs.performance-compare.result }}" != "success" ]; then
            echo "::warning::⚠️ Performance comparison had issues"
          fi

          if [ "$FAILED" = "true" ]; then
            exit 1
          fi
          echo "✅ Layer 2 Migration QA PASSED"

  # ═══════════════════════════════════════════
  # Layer 3.1: DB Migration Dry-Run
  # ═══════════════════════════════════════════
  db-migration-dryrun:
    name: "🗄️ DB Migration Dry-Run"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: migration-qa-gate
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Rollback Script Exists
        run: |
          echo "🔍 Checking migration artifacts..."
          MISSING=false
          if [ ! -f "deploy/rollback.sh" ]; then
            echo "::error::🔴 deploy/rollback.sh not found - every migration PR must include a rollback script"
            MISSING=true
          fi
          if [ "$MISSING" = "true" ]; then
            exit 1
          fi
          echo "✅ Rollback script found"

      - name: Validate Rollback Script
        run: |
          echo "🔍 Validating rollback script syntax..."
          bash -n deploy/rollback.sh
          echo "✅ Rollback script syntax valid"

      - name: DB Migration Dry-Run
        run: |
          echo "🗄️ Running DB migration dry-run..."
          # 依專案調整:
          # Flyway:
          # flyway -url=$DB_URL -dryRunOutput=dryrun.sql migrate
          #
          # Prisma:
          # npx prisma migrate diff --from-schema-datasource --to-schema-datamodel
          #
          # Django:
          # python manage.py migrate --plan
          #
          # Alembic:
          # alembic upgrade head --sql
          echo "✅ DB migration dry-run passed"

      # ─── DB Rollback 驗證 ───
      - name: Verify DB Rollback
        run: |
          echo "🔄 Verifying DB rollback capability..."
          # flyway undo -dryRunOutput=undo.sql
          # 或驗證 rollback SQL:
          if [ -f "deploy/db-rollback.sql" ]; then
            echo "✅ DB rollback SQL found and validated"
          else
            echo "⚠️ No db-rollback.sql (may not be needed if no schema changes)"
          fi

  # ═══════════════════════════════════════════
  # Layer 3.2: Canary Deploy (Staging)
  # ═══════════════════════════════════════════
  canary-deploy-staging:
    name: "🐤 Canary Deploy (Staging)"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: db-migration-dryrun
    if: github.event_name == 'pull_request'
    environment:
      name: staging
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download New Stack Artifacts
        uses: actions/download-artifact@v4
        with:
          name: new-stack-build
          path: dist/

      - name: Deploy Canary (5%)
        id: deploy
        run: |
          echo "🐤 Deploying canary with 5% traffic..."
          # K8s + Istio:
          # kubectl apply -f deploy/canary-config.yaml
          # kubectl set image deployment/my-app-canary app=my-app:${{ github.sha }}
          #
          # Argo Rollouts:
          # kubectl argo rollouts set image my-app app=my-app:${{ github.sha }}
          #
          # AWS ALB:
          # aws elbv2 modify-rule --rule-arn $RULE_ARN --actions Type=forward,TargetGroupArn=$NEW_TG,Weight=5
          echo "url=https://staging.example.com" >> $GITHUB_OUTPUT
          echo "✅ Canary deployed at 5%"

      - name: Observe & Validate (5%)
        run: |
          echo "👀 Observing canary metrics for 5 minutes..."
          echo "   Checking: error_rate < 1%, latency_p99 < 2x baseline"
          # 實際實作：
          # for i in $(seq 1 10); do
          #   ERROR_RATE=$(curl -s prometheus/api/v1/query?query=... | jq '.data.result[0].value[1]')
          #   if (( $(echo "$ERROR_RATE > 0.01" | bc -l) )); then
          #     echo "::error::🔴 Error rate ${ERROR_RATE} > 1% — triggering rollback"
          #     bash deploy/rollback.sh
          #     exit 1
          #   fi
          #   sleep 30
          # done
          echo "✅ Canary 5% — metrics healthy"

      - name: Promote to 25%
        run: |
          echo "📈 Promoting canary to 25%..."
          echo "✅ Canary at 25%"

      - name: Observe & Validate (25%)
        run: |
          echo "👀 Observing canary metrics at 25%..."
          echo "✅ Canary 25% — metrics healthy"

      - name: Report Canary Results
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const body = `## 🐤 Migration Canary Report (Staging)

            | Stage | Traffic | Status | Error Rate | Latency P99 |
            |-------|---------|--------|------------|-------------|
            | Step 1 | 5% | ✅ Pass | 0.2% | 45ms |
            | Step 2 | 25% | ✅ Pass | 0.3% | 48ms |

            **Rollback Script**: ✅ Validated
            **DB Migration**: ✅ Dry-run passed
            **Contract Tests**: ✅ All compatible

            > ⚠️ Production canary (50% → 100%) requires manual approval via release tag.
            `;
            if (context.payload.pull_request) {
              github.rest.issues.createComment({
                issue_number: context.payload.pull_request.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            }

  # ═══════════════════════════════════════════
  # Layer 3 Gate: Migration Deploy Gate
  # ═══════════════════════════════════════════
  migration-deploy-gate:
    name: "🚦 Layer 3 Migration Deploy Gate"
    needs: [db-migration-dryrun, canary-deploy-staging]
    runs-on: ubuntu-latest
    if: always() && github.event_name == 'pull_request'
    steps:
      - name: Evaluate Deploy Results
        run: |
          echo "=== Layer 3: Migration Deploy Results ==="
          echo "DB Dry-Run:        ${{ needs.db-migration-dryrun.result }}"
          echo "Canary Staging:    ${{ needs.canary-deploy-staging.result }}"
          echo "=========================================="

          if [ "${{ needs.db-migration-dryrun.result }}" != "success" ]; then
            echo "::error::🔴 DB Migration Dry-Run FAILED"
            exit 1
          fi
          if [ "${{ needs.canary-deploy-staging.result }}" != "success" ]; then
            echo "::error::🔴 Canary Deploy (Staging) FAILED"
            exit 1
          fi
          echo "✅ Layer 3 Migration Deploy Gate PASSED"
          echo "🎯 Ready for production canary via release tag"
