# AISDLC-SDD ID 分配登記簿（單一真實來源 / Single Source of Truth）
#
# 目的：徹底解決「ACT / Rule(R-9.x) 編號徵用衝突」。以往編號靠人工散記於藍圖標頭與
#       memory，沒有權威「下一個可用號」，每隔幾個 Phase 就重演撞號（如 Phase K vs
#       backup 分支 M3 Hook Health 都想要 ACT-081+）。本檔為唯一分配權威，配 pytest
#       守門（tools/fsm_runtime/tests/test_id_registry.py），CI 每跑必檢，重疊即 fail。
#
# 查號（分配前必跑）：
#   python -m tools.fsm_runtime.id_registry next-act     # 印下一個可用 ACT
#   python -m tools.fsm_runtime.id_registry next-rule    # 印下一個可用 Rule
#   python -m tools.fsm_runtime.id_registry validate     # 驗證一致性（CI/pytest 等同）

allocation_policy:
  principle: "monotonic-from-next-free"
  rules:
    - "新 ACT/Rule 一律取 next_free，分配後立即在此登記並推進 next_free。"
    - "禁止『向前預留』未落地的號；停滯/備援分支不持有任何號（act_range/rule 必為 null）。"
    - "停滯分支復活時，從當下 next_free 重新取號，不得回頭認領舊號。"
    - "concrete range 不得重疊、不得跳號（contiguous from 1）。"
    - "status=active 的 Rule 必有對應 governance/rules/R-*.yaml；reserved 則尚無檔。"

# === 分配前緣（唯一權威）===
next_free:
