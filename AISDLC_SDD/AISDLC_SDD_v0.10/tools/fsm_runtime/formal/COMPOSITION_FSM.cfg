\* TLC config for COMPOSITION_FSM (Phase M M-M1 / ACT-098)
\* 對應 .tla:  tools/fsm_runtime/formal/COMPOSITION_FSM.tla
\* 對應規則:  CLAUDE.md Rule 9.25.1 / 9.25.2

SPECIFICATION
    Spec

\* ===== Small-Model 抽象 =====
\* reneg / conflicts 為 bound-parametric：Negotiate（reneg<MAX 時 ++）/ ConflictEscalate
\* （reneg≥MAX 時 ESCALATION）等規則對任一 MAX 值結構相同 → reachable 的狀態類型與 bug
\* 模式不隨 bound 改變（small-model 假說成立）。取最小有限 bound 同時窮舉 safety + liveness；
\* runtime 仍 enforce 真實上限（SDD_COMPOSITION_RENEG_MAX 預設 2）。
CONSTANTS
    MAX_RENEG = 2
    MAX_CONFLICTS = 2

\* Safety invariants（必須恆真）
INVARIANT
    TypeOK
    CompositionConsistent
    RenegotiationBounded
    ConflictResolvedOrEscalated
    StableIsFixpoint

\* Liveness（公平性下必抵 terminal）
PROPERTY
    EventuallyComposed

\* terminals 透過 TerminalStutter 自我遷移，TLC 預設將其偵測為 deadlock；安全性靠
\* INVARIANT 守，故關閉 deadlock 檢查。
CHECK_DEADLOCK
    FALSE
