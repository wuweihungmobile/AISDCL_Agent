# ═══════════════════════════════════════════
# Job 3: DAST - 動態應用安全測試 (OWASP ZAP)
# 適用: Enhanced only (或 Nightly 排程)
# ═══════════════════════════════════════════
dast-zap-baseline:
  stage: security-enhanced
  image: ghcr.io/zaproxy/zaproxy:stable
  timeout: 30 minutes
  allow_failure: true         # DAST 僅警告（誤報率高）
  script:
    - |
      echo "=== DAST Baseline Scan (OWASP ZAP) ==="
      echo "Target: $DAST_TARGET_URL"

      if [ -z "$DAST_TARGET_URL" ]; then
        echo "⏭️ DAST skipped: DAST_TARGET_URL not set"
        exit 0
      fi

      zap-baseline.py \
        -t "$DAST_TARGET_URL" \
        -g gen.conf \
        -r zap-report.html \
        -J zap-report.json \
        -l WARN \
        || SCAN_EXIT=$?

      if [ "${SCAN_EXIT:-0}" -gt 1 ]; then
        echo "⚠️ DAST: Potential vulnerabilities found (review recommended)"
      else
        echo "✅ DAST: No high-severity issues"
      fi
  artifacts:
    when: always
    paths:
      - zap-report.html
      - zap-report.json
    expire_in: 30 days
  rules:
    # Enhanced 等級
    - if: '$SECURITY_LEVEL == "enhanced" && $DAST_TARGET_URL != ""'
      when: on_success
    # Nightly 排程
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $DAST_TARGET_URL != ""'
      when: always
    - when: never

