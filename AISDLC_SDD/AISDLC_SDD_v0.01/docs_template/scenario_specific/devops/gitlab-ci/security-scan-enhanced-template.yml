# ═══════════════════════════════════════════
# Hotfix 旁路規則
# ═══════════════════════════════════════════
# hotfix/* 分支: SAST 降級為警告，Container/DAST 跳過
# 注意: Layer 0 (Secret Detection) 永遠不可跳過
#
# 使用方式: 在 hotfix 分支上設定 SECURITY_LEVEL=basic
# 並在 merge 後由 security-engineer 執行 post-merge audit
