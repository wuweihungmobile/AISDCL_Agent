# ============================================================
# AISDLC v0.09 - Enhanced Security Scans (P1)
# GitLab CI Template
# ============================================================
#
# 使用方式:
#   1. 在專案 .gitlab-ci.yml 中引入此模板:
#      include:
#        - local: 'ci-templates/security-scan-enhanced.yml'
#   2. 設定 CI/CD Variables:
#      - SECURITY_LEVEL: standard / advanced / enhanced
#      - DAST_TARGET_URL: Staging URL (Enhanced 等級需要)
#   3. 確保 Layer 0 (security-baseline-template.yml) 已引入
#
# 安全等級（參考 Security_Scan_Integration_Template.md）:
#   Basic    = L0 only                     → documentation
#   Standard = L0 + SAST                   → greenfield, brownfield, refactoring, testing
#   Advanced = L0 + SAST + Container       → migration, integration, performance, devops
#   Enhanced = L0 + SAST + Container + DAST → security
#
# 參考文檔: Security_Scan_Integration_Template.md
# ============================================================

# ─── Stage 定義（與 L0 合併使用）───
stages:
  - security-baseline    # Layer 0
  - security-enhanced    # 本範本: SAST + Container + DAST
  - build
  - test
  - quality
  - deploy

# ─── 全域變數 ───
variables:
  # 安全等級: standard / advanced / enhanced
  SECURITY_LEVEL: "standard"
  # DAST 目標 URL（Enhanced 需要）
  DAST_TARGET_URL: ""
  # SAST 超時
  SAST_TIMEOUT: "10 minutes"
  # Container Scan 超時
  CONTAINER_SCAN_TIMEOUT: "10 minutes"

# ═══════════════════════════════════════════
# Job 1: SAST - 靜態應用安全測試 (Semgrep)
# 適用: Standard / Advanced / Enhanced
# ═══════════════════════════════════════════
sast-semgrep:
  stage: security-enhanced
  image: semgrep/semgrep:latest
  timeout: 10 minutes
  allow_failure: false        # Critical/High 阻塞
  script:
    - |
      echo "=== SAST Scan (Semgrep) ==="
      echo "Security Level: $SECURITY_LEVEL"
      semgrep scan \
        --config "p/owasp-top-ten" \
        --config "p/security-audit" \
        --severity ERROR \
        --error \
        --json --output semgrep-results.json \
        . || SCAN_EXIT=$?

      # ERROR (Critical/High) 阻塞, WARNING 僅記錄
      if [ "${SCAN_EXIT:-0}" -ne 0 ]; then
        echo "🔴 SAST: Critical/High vulnerabilities found"
        cat semgrep-results.json | python3 -m json.tool || true
        exit 1
      fi
      echo "✅ SAST: No Critical/High vulnerabilities"
  artifacts:
    when: always
    paths:
      - semgrep-results.json
    expire_in: 30 days
  rules:
    # Standard 以上等級
    - if: '$SECURITY_LEVEL == "standard" || $SECURITY_LEVEL == "advanced" || $SECURITY_LEVEL == "enhanced"'
      when: on_success
    # 排程時始終執行
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: always
    # 預設不執行（Basic 等級）
    - when: never

