# ═══════════════════════════════════════════
# Job 2: Container Scan - 容器映像掃描 (Trivy)
# 適用: Advanced / Enhanced
# ═══════════════════════════════════════════
container-scan:
  stage: security-enhanced
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  timeout: 10 minutes
  allow_failure: false
  services:
    - docker:dind
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - |
      echo "=== Container Scan (Trivy) ==="
      echo "Security Level: $SECURITY_LEVEL"
  script:
    - |
      # 建置映像
      docker build -t scan-target:${CI_COMMIT_SHORT_SHA} .

      # Trivy 掃描
      trivy image \
        --severity CRITICAL,HIGH \
        --exit-code 1 \
        --ignore-unfixed \
        --format json \
        --output trivy-container-results.json \
        scan-target:${CI_COMMIT_SHORT_SHA} || SCAN_EXIT=$?

      if [ "${SCAN_EXIT:-0}" -ne 0 ]; then
        echo "🔴 Container Scan: Critical/High vulnerabilities found"
        trivy image --severity CRITICAL,HIGH scan-target:${CI_COMMIT_SHORT_SHA}
        exit 1
      fi
      echo "✅ Container Scan: No Critical/High vulnerabilities"
  artifacts:
    when: always
    paths:
      - trivy-container-results.json
    expire_in: 30 days
  rules:
    # Advanced 以上 + Dockerfile 存在
    - if: '$SECURITY_LEVEL == "advanced" || $SECURITY_LEVEL == "enhanced"'
      exists:
        - Dockerfile
      when: on_success
    # 排程時（有 Dockerfile）
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      exists:
        - Dockerfile
      when: always
    - when: never

# 備選: Grype
