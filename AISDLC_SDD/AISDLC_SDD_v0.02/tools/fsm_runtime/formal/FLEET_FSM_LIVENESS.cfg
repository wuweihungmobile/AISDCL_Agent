\* TLC config for FLEET_FSM — LIVENESS-only（Phase I M5 / ACT-072）
\* 對應 .tla:  tools/fsm_runtime/formal/FLEET_FSM.tla
\* 對應藍圖:  SDD_improving_Automation_09.md §5.4 / PI-1
\*
\* ⚠️ 為何獨立一個 cfg：TLC 在 SYMMETRY 下檢查 liveness 屬 unsound（官方警告
\* "Declaring symmetry during liveness checking is dangerous — might miss violations"）。
\* 故 AllEventuallyDone 必須在「無 SYMMETRY」下窮舉驗證才健全。
\* safety（LockMutex/NoPartialHold/TypeOK）仍由 FLEET_FSM.cfg（含 SYMMETRY）負責。

SPECIFICATION
    Spec

CONSTANTS
    Features = {A, B}     \* 2 並行 feature
    Locks = {L1}          \* 1 共享 spec 區段鎖（最強競爭）

\* 無 SYMMETRY — liveness 健全前提

\* Liveness：bounded join（所有 feature 終達 done）
PROPERTY
    AllEventuallyDone

CHECK_DEADLOCK
    FALSE
