version: "1.0"
project: "Equivalence_12_evolution_counter_esc_f12"

# 場景設計（SD_Improving_02.md v1.1 §0.1）：
#   驗證 Gap-048：per-step step_evolution_counter 跨 ESC+F12 中斷持久化
#   - 模擬演化步驟 + ESC+F12 中斷
#   - resume 後不超過 max_evolutions 上限
# dry_run 下：直接執行成功，step_evolution_counter 保持為空 dict（{}）作為 baseline

global_goal: |
  驗證 step_evolution_counter 跨 Session 完整保留。

global_invariants:
  max_retries_per_step: 3
  auto_compact_interval: 0

tasks:
  - step_id: "T01"
    name: "可能演化的步驟"
    prompt: "可能觸發演化並輸出 [EVO_STEP1]"
    expected_output_regex: "\\[EVO_STEP1\\]"

  - step_id: "T02"
    name: "演化後步驟"
    prompt: "演化後並輸出 [EVO_STEP2]"
    expected_output_regex: "\\[EVO_STEP2\\]"
