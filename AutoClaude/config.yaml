claude:
  command: claude
  extra_args:
    - "--yes"
  continue_flag: "--continue"       # 傳遞給 claude 以維持多步驟對話脈絡
  encoding: utf-8

minimax:
  # 🔴 設定治理（improving_90 統一）：base_url / model / timeout 為【非機密預設】，本檔（入庫共享）
  #    為唯一權威來源——請勿在 .env 重複設 MINIMAX_BASE_URL / MINIMAX_MODEL（會與此處漂移；
  #    improving_90 已從 .env 移除該兩鍵）。
  #    🔑【機密】api_key 絕不可填入本入庫檔！只能放 .env（gitignored）的 MINIMAX_API_KEY 或以環境變數注入。
  #    讀取優先序：env 變數 > 本檔（main.py:103-107）；env 變數僅作臨時覆寫（如切 mock / local LLM）。
  #    ⚠ AutoClaude 不自動載入 .env（無 python-dotenv）——env 須由啟動方式注入（shell 先 source .env 或 export）。
  api_key: ""   # 留空；機密由 .env 的 MINIMAX_API_KEY 或環境變數提供
  base_url: "https://api.minimax.io/v1/text/chatcompletion_v2"
  model: "MiniMax-M2.7"
  timeout_seconds: 30

embedder:
  # 🔴 設定治理（improving_91 方案 B）：embedder 非機密設定（base_url / model / dimension /
  #    timeout_seconds）為【非機密預設】，本檔（入庫共享）為唯一權威來源——對齊上方 minimax chat 治理。
  #    🔑【機密】api_key 絕不可填入本入庫檔！embedder 與 chat 共用 .env 的 MINIMAX_API_KEY（或環境變數）。
  #    🔑 group_id（帳號識別）不在本檔——維持只走 .env 的 MINIMAX_GROUP_ID（避免帳號識別碼入庫）。
  #    讀取優先序：建構參數 > env（MINIMAX_EMBED_BASE_URL / MINIMAX_EMBED_MODEL /
  #    MINIMAX_EMBED_DIMENSIONS）> 本檔兜底 > 硬編預設（minimax_embedder.py）。
  base_url: "https://api.minimax.io/v1/embeddings"
  model: "embo-01"
  dimension: 1024
  timeout_seconds: 30
  api_key: ""   # 留空；機密由 .env 的 MINIMAX_API_KEY 或環境變數提供
  # ── bge-m3 本地 TEI（improving_92 方案 B 收尾）：TEI 為本地容器端點、全非機密（無 api_key /
  #    帳號識別），對應 .env.example 的 TEI_URL / TEI_MODEL_ID / TEI_EMBED_DIMENSIONS。
  #    讀取優先序：建構參數 > env（TEI_URL / TEI_MODEL_ID / TEI_EMBED_DIMENSIONS）> 本檔兜底 >
  #    硬編預設（bgem3_local.py）。（DEF-92-001/002 修復：TEI_MODEL_ID / TEI_EMBED_DIMENSIONS
  #    先前 adapter 從未讀取，improving_92 起真正生效。）
  bge_m3_url: "http://localhost:8080"
  bge_m3_model: "BAAI/bge-m3"
  bge_m3_dimension: 1024
  bge_m3_timeout_seconds: 30

loop:
  max_iterations: 20
  completion_pattern: "執行完畢[,，]\\s*報告如下"
  auth_patterns:
    - "Do you want to proceed\\?"
    - "\\(y/n\\)"
    - "Press Enter to continue"
    - "Allow this action\\?"
  auth_response: "y"
  poll_interval_seconds: 0.2

playbook:
  step_timeout_seconds: 600         # 每個步驟最多等待 10 分鐘
  evaluator_timeout_seconds: 120    # evaluator_command 最多執行 2 分鐘

token_guard:
  enabled: true
  # Context >= 80% → 自動送出 /compact，壓縮對話脈絡後繼續執行
  compact_threshold_pct: 80.0
  # Context >= 90% → 儲存檢查點並暫停，等待排程時間後繼續
  halt_threshold_pct: 90.0
  # 儲存檢查點後等待幾分鐘再自動繼續（0 = 立即繼續）
  resume_delay_minutes: 30
  # true = 等待後自動繼續；false = 退出並讓使用者手動重啟
  auto_resume: true
  # 單次 Playbook 執行最多允許幾次自動恢復（防止無限迴圈）
  max_auto_resumes: 10
  # 從 Claude Code 輸出中偵測 context 使用率的 regex patterns（可自訂）
  context_patterns:
    - "(\\d+(?:\\.\\d+)?)\\s*%\\s*(?:context|token)"
    - "(?:context|token)\\w*[\\s:]+(\\d+(?:\\.\\d+)?)\\s*%"
    - "(\\d+)\\s*/\\s*(\\d+)\\s*tokens?"
    - "\\[CONTEXT_USAGE:\\s*(\\d+(?:\\.\\d+)?)%\\]"

notification:
  enabled: true                     # 完成或需要人工介入時彈出桌面通知

log_dir: logs
backup_dir: backups
scripts_dir: scripts
checkpoint_dir: checkpoints

# 工作流程自動偵測搜尋路徑（workflow_type: auto 且 playbook 未指定 workflow_path 時使用）
# 依序嘗試，找到符合的工作流程標記即回傳；皆無則以 CWD 兜底。
# 此處留空，個人環境請於 config.local.yaml 中覆寫此欄位（gitignore）。
# 範例：
#   workflow_search_paths:
#     - "/path/to/AISDLC_SDD"
#     - "/path/to/AISDLC"
workflow_search_paths: []
