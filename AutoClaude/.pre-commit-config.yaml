# ⚠️ 警告：monorepo 下「不支援」pre-commit 框架路徑 —— 本檔僅存檔備考
# ===========================================================================
# 兩個原因（缺一即壞）：
#   1. 本檔位於子目錄 AutoClaude/，不在 git 根 —— `pre-commit install` 要求
#      config 位於 repo 根，monorepo 下無法直接安裝。
#   2. pre-commit 框架的 shim 會「消化」pre-push 的 stdin（推送 ref 清單），
#      根層 dispatcher pre-push 收到空 stdin 只能 fail-safe 兩子專案閘門全跑，
#      精準分流失效。
# 單一真相（SSOT）為「根層 dispatcher hooks」（monorepo 根 tools/git-hooks/）：
#   一律使用安裝腳本 tools/install_git_hooks.ps1 或 tools/install_git_hooks.sh
#   （任一支即可，兩子專案閘門同時生效）。請勿執行 `pre-commit install`。
# ---------------------------------------------------------------------------
repos:
  - repo: local
    hooks:
      - id: autoclaude-pre-commit
        name: AutoClaude pre-commit（ruff / LOC / CLAUDE.md / .sh EOL）
        entry: bash tools/git-hooks/pre-commit
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: autoclaude-pre-push
        name: AutoClaude pre-push（pytest / import-linter / snapshot 本機 CI 閘門）
        entry: bash tools/git-hooks/pre-push
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
