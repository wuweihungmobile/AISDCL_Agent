# pre-commit 框架設定（選用）—— 與 tools/git-hooks/ 原生 hook 等價，二擇一即可
# ===========================================================================
# 推薦：Windows 用 tools/install_git_hooks.ps1（零依賴、設 core.hooksPath）。
# 本檔給偏好 pre-commit 框架者：
#   pip install pre-commit
#   pre-commit install --hook-type pre-commit --hook-type pre-push
#
# 為維持單一真相（SSOT，取證紀律 #4），本設定直接委派至 tools/git-hooks/ 內的
# 原生 hook，避免兩套檢查邏輯 drift。
# ---------------------------------------------------------------------------
repos:
  - repo: local
    hooks:
      - id: autoclaude-pre-commit
        name: AutoClaude pre-commit（ruff / LOC / CLAUDE.md / .sh EOL）
        entry: bash tools/git-hooks/pre-commit
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: autoclaude-pre-push
        name: AutoClaude pre-push（pytest / import-linter / snapshot 本機 CI 閘門）
        entry: bash tools/git-hooks/pre-push
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
