# F-SBR-001 真跑用 config 範本（SDD 橋接鏈：TEST-CONTRACT-SPEC → sdd_compile → python -m autoclaude）。
# 用法：把 __RUN_DIR__ 換成本次 run 的絕對路徑（建議＝與專案根同層的獨立目錄），再以 --config 傳入。
# 刻意不列任何額度／context 門檻（*_pct）：守衛的訊息就是答案，真跑一律沿用出廠預設，不為了跑而調門檻。
claude:
  command: claude
  # PRD §12：不用「完全跳過權限」——引擎開機自檢（不變式 8）在非容器環境會拒絕 bypassPermissions。
  # 改走 acceptEdits＋工具白名單：Edit／Write 在 acceptEdits 下免提示、唯讀工具本來就放行，
  # 白名單只多開一條 pytest（prompt 的驗收閘與 evaluator 都叫它）；白名單外的動作在 headless
  # 下沒有人可按同意、會被自動拒絕。2026-10-11 的 C1～C4 真跑用的是 bypassPermissions；本組旗標
  # 已由 2026-10-12 的 r5 真跑驗過一次（n=1：rc=0、3/3 步通過；巢狀 claude 用 Write／Edit／Bash，
  # 逐字稿唯一帶拒絕字樣的是 `echo "exit=$?"`，模型自行改寫重試）——單次樣本，不宣稱失敗率。
  # 僅 macOS 取證，Windows 的 shell 工具是 PowerShell，白名單規則名需另寫 PowerShell(...)（未驗證）。
  # 模型一律 haiku（測試鎖 extra_args 末兩項）。
  extra_args: ["--permission-mode", "acceptEdits", "--allowedTools", "Read,Edit,Write,Bash(pytest:*)", "--model", "haiku"]
minimax:
  enable_kernel_brain: false   # Brain 關閉 ⇒ 無 CORRECTION，重試重送同一 prompt；也不設 api_key
executor:
  backend: pty                 # macOS 無 wexpect ⇒ 自動 subprocess 模式
storage:
  mode: yaml_only              # 純檔案 backend，零 PG
playbook:
  goal_synthesis_enabled: false  # 不呼叫 Brain 合成目標
token_guard:
  enabled: true
  auto_resume: false           # 證據跑：halt 時直接退出，不在行程內空等
notification:
  enabled: false               # 不彈桌面通知
log_dir: __RUN_DIR__/logs
checkpoint_dir: __RUN_DIR__/checkpoints
