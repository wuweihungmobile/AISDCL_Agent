# correction_loop_smoke.yaml — self-correction 閉環「故意第一次失敗」真跑載具（improving_87 W-87-1）
#
# 用途：驗證「Brain 指揮 Claude Code」的 self-correction 閉環端到端真的串起來：
#   ①真 Claude 執行失敗 → ②Kernel 呼叫 Brain → ③Brain 回 CORRECTION 修正 prompt →
#   ④Kernel 把修正 prompt 餵回 Executor → ⑤真 Claude 改行為重試 → 成功。
#
# 設計（保證 attempt 0 失敗、attempt 1 必改對，降 flaky）：
#   - S02 要求 Claude 先寫「佔位 stub」`def multiply(a,b): return 0`（TDD red 階段刻意未完成
#     實作，自然指令、非要求寫錯誤邏輯）→ evaluator pytest 必失敗（0 != 12）→ 觸發 CORRECTION。
#   - 修正方向明確（multiply 應為乘法、pytest 已明示三組期望值）+ maintain_context=true
#     （--continue 帶上一輪失敗脈絡）→ attempt 1 改 `return a*b` 必過。
#
# 執行（於 AutoClaude/ 目錄；須搭配 enable_kernel_brain:true 的 config）：
#   W-87-1（mock brain × 真 Claude）：tools/correction_loop_verify.py --mock
#   W-87-2（真 Minimax × 真 Claude）：先匯入 .env，再
#     autoclaude scripts/correction_loop_smoke.yaml --config scripts/ab_configs/correction_real_config.yaml --fresh
version: "1.0"
project: "Correction_Loop_Smoke"
workflow_type: "auto"

global_goal: |
  以 TDD 方式完成純函式 multiply(a, b)：先寫測試、再實作至 pytest 全綠。
  本載具刻意讓第一次實作為佔位 stub（會被 evaluator 擋下），用以真跑驗證
  Brain 指揮 Executor 的 self-correction 修正閉環。

global_invariants:
  max_retries_per_step: 3
  auto_compact_interval: 5

tasks:
  - step_id: "S01"
    name: "TDD First — 撰寫規格測試（先測後實作）"
    prompt: |
      請在當前工作目錄建立 `calc_test.py`，內含 pytest 測試（from calc import multiply）：
        - test_multiply_basic：assert multiply(3, 4) == 12
        - test_multiply_zero：assert multiply(0, 7) == 0
        - test_multiply_negative：assert multiply(-2, 5) == -10
      此步驟**先不要**建立 calc.py（規格先行：測試先於實作）。
      完成後請嚴格輸出 Keyword：[TEST_READY]
    expected_output_regex: "\\[TEST_READY\\]"
    maintain_context: false

  - step_id: "S02"
    name: "TDD red→green — Evaluator 權威閘（第一次刻意 stub 失敗，修正後綠）"
    prompt: |
      請建立 `calc.py`。**這一步請先只寫一個 TDD red 階段的佔位 stub**：
        def multiply(a, b):
            return 0
      此 stub 刻意未完成（會讓 calc_test.py 失敗），用以驗證修正閉環。
    # 🔴 刻意「不設」expected_output_regex：Brain 的修正 prompt 會整個取代 task.prompt（kernel.py:259-260），
    #    若同時以 keyword regex 把關，修正後 claude 不再複述 keyword → regex 永遠失敗 → 無法收斂
    #    （W-87-1 首跑實證 DEF-87-002）。故 self-correction 閉環載具以 evaluator_command（pytest）為
    #    唯一權威閘：stub return 0 → pytest 必失敗 → 觸發 CORRECTION → 修正後 pytest 過 → 收斂成功。
    evaluator_command: "pytest calc_test.py -q"
    evaluator_timeout_seconds: 60
    maintain_context: true
