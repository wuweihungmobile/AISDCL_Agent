[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autoclaude"
version = "0.1.0"
description = "Claude Code 閉環自動化代理"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "wexpect>=4.0; sys_platform == 'win32'",
    "keyboard>=0.13",
]

[project.optional-dependencies]
dev = [
    # DEF-101-006 鎖版：dev 工具鏈未鎖版致 fresh bootstrap 漂移 —
    # pytest 鎖 9.1.1 與 AISDLC_SDD/AISDLC_SDD_v0.01/requirements-ci.txt 一致
    # （鎖版消除 fresh bootstrap 的安裝順序漂移）；
    # ruff 鎖 0.15.21（QA 實測 fresh bootstrap 安裝版、baseline 1,339 筆一致，
    # 未鎖版曾致 baseline 漂移）。升版規則比照 requirements-ci.txt：本機先升跑全綠再回寫釘選。
    # pytest 釘選與 requirements-ci.txt 的一致性由根層 tools/check_script_parity.py 機械比對（root-infra-ci）。
    "pytest==9.1.1",
    "pytest-mock>=3.14",
    "ruff==0.15.21",
    "cachetools>=5.3",
    "hypothesis>=6.0",
    # tools/ 開發腳本（run_bridge_e2e / migrate_yaml_to_db / three_tier_to_playbook）
    # 使用 click；其單元測試 tests/tools/test_run_bridge_e2e.py 於 collection 期即 import。
    # 原先未宣告、靠環境 ambient 安裝，fresh clone 會 ModuleNotFoundError（跨平台重現性缺口）。
    "click>=8.0",
]
# Mutation testing（SD_08 W3 / ADR-SD08-002 — TokenGuardPlugin pilot）
# 鎖 2.4.3：mutmut 3.x CLI 重寫不支援 --paths-to-mutate / --tests-dir，
# 與 monorepo 根層 .github/workflows/autoclaude-ci.yml mutation-test-*-nightly + tools/run_mutmut_in_docker.sh 一致。
# 安裝：pip install autoclaude[mutation]（僅在 Linux container 內安裝）
mutation = [
    "mutmut==2.4.3",
]
# 架構約束檢查（Plugin 互引用 / Layered architecture，搭配 .importlinter）：
#   pip install autoclaude[lint]
#   lint-imports
lint = [
    "import-linter>=2.0",
]
# 桌面通知後端（任選其一即可）：
#   pip install autoclaude[notifications]
notifications = [
    "plyer>=2.1",
    "win10toast>=0.9; sys_platform == 'win32'",
]
# PostgreSQL 後端（Phase 6 選配，需 docker-compose 起 postgres:17）：
#   pip install autoclaude[postgres]
# 注意：runtime PgStateRepository 走 async asyncpg；但 alembic 只支援同步連線，
# alembic/env.py:42 會 strip `+asyncpg` 改用 psycopg2 → 故 migration 工具需 psycopg2。
# 缺 psycopg2 時 `alembic upgrade head` 報 ModuleNotFoundError（SD_09 R56 揪修：CI
# pg-contract / pg-e2e-nightly job 的 alembic 步驟因此失敗）。psycopg2-binary 為預編譯 wheel，
# 免 CI 安裝 build 依賴。
postgres = [
    "sqlalchemy>=2.0",
    "asyncpg>=0.29",
    "psycopg2-binary>=2.9",
    "alembic>=1.13",
    "tenacity>=8.2",
    "cachetools>=5.3",
]
# pgvector 向量查詢（需 DB 安裝 pgvector extension）：
#   pip install autoclaude[postgres,pgvector]
pgvector = [
    "pgvector>=0.3",
]
# Claude Agent SDK 執行器後端（improving_68 W-68-3 選配）：
#   pip install autoclaude[sdk]
# 啟用 config executor.backend="sdk"（SdkExecutorAdapter）以 JSON-over-stdio 驅動
# Claude Code，取代 PtyExecutor 的 PTY 文字流。預設後端仍 pty，未裝本 extra 零影響。
sdk = [
    "claude-agent-sdk>=0.2.110",
]

[project.scripts]
autoclaude = "autoclaude.main:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# prompt 模板長行為「資料內容」：三引號模板內斷行會改變送往 LLM 的 prompt 語意，
# E501 對其無意義（Improving_012 Phase 1 ruff 觸碰檔清理決議）
"autoclaude/decision/prompt_builder.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# legacy / xunit1 允許 record_property 寫入 <property> 元素（xunit2 不支援）
# ac4_nightly_collector.py 依賴 <property name="recall_at_10"> / <property name="p95_ms">
junit_family = "legacy"
# SD_Improving_04 W3 三方審查（Arch-W3-Min-3 / Dev-W3-Maj-2）：
# 抑制 _runner_compat 內部模組層 DeprecationWarning，避免 playbook_runner /
# _runner_internals 頂層 import 引發的噪音；針對性測試（test_runner_compat_deprecated）
# 仍可透過 monkeypatch.delitem + importlib.reload + warnings.catch_warnings 捕獲。
filterwarnings = [
    "ignore::DeprecationWarning:autoclaude.execution._runner_compat",
    "ignore:_runner_compat.*W5.*過渡模組.*:DeprecationWarning",
]
# SD_Improving_07 W2 T2-3：opt-in marker — 真實 PG e2e（PM #2）
# 啟用條件：SD07_REAL_PG_E2E_ENABLED=true + AUTOCLAUDE_TEST_PG_DSN
# 本地預設 skip；CI nightly 啟用。
markers = [
    "pg_real: 需要真實 PG + pgvector 的 e2e 測試（SD_07 T2-3 / PM #2）",
    "perf: 性能 baseline 測試（SD_08 W5 / ADR-SD08-003）；perf-baseline-nightly job 啟用",
    "benchmark: pytest-benchmark 入口（SD_08 W5 / ADR-SD08-003 §3）",
]
