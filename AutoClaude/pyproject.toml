[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autoclaude"
version = "0.1.0"
description = "Claude Code 閉環自動化代理"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "wexpect>=4.0; sys_platform == 'win32'",
    # 跨平台複審修復：wexpect/__init__.py 內部無條件 `import pkg_resources`，但其
    # PyPI METADATA 未將 pkg_resources／setuptools 宣告為 runtime 依賴。
    # setuptools>=81 起已從 site-packages 移除 pkg_resources 子套件（僅保留
    # deprecation 警告訊息本身建議「pin to Setuptools<81」），uv venv 官方
    # bootstrap 路徑預設安裝最新 setuptools（實測 83.0.0）導致
    # `ModuleNotFoundError: No module named 'pkg_resources'`，使 wexpect 在
    # Windows 上恆無法 import、PtyWrapper 全數退回 subprocess fallback。
    # 顯式鎖 setuptools<81 以確保 pkg_resources 隨 uv venv/pip 安裝存在。
    "setuptools<81; sys_platform == 'win32'",
    # R76（R76-17／R68-67，open 跨 8 輪）：`keyboard` 已移出核心相依，改為 `[hotkey]`
    # 選配 extra（見下方 optional-dependencies）。WHY 與消費面現況見那一段。
]

[project.optional-dependencies]
dev = [
    # DEF-101-006 鎖版：dev 工具鏈未鎖版致 fresh bootstrap 漂移 —
    # pytest 鎖 9.1.1 與 AISDLC_SDD/AISDLC_SDD_v0.01/requirements-ci.txt 一致
    # （鎖版消除 fresh bootstrap 的安裝順序漂移）；
    # ruff 鎖 0.15.21（QA 實測 fresh bootstrap 安裝版；未鎖版曾致存量筆數 baseline 漂移）。
    # 升版規則比照 requirements-ci.txt：本機先升跑全綠再回寫釘選。
    # 🔴 R76（DEF-101-018／R76-47）：**存量筆數刻意不登載於此**。原文寫死「1,147 筆一致
    # 〔原 1,339 筆為舊測值〕」，八輪無人重量、今日實測任一讀法下都失實 —— 一個沒有量測
    # 配方的數字只會愈放愈久愈假。改記**配方**：
    #     ruff check . --statistics      # 總筆數＝各列計數相加
    # 並且**必須同時記 cwd**：`AutoClaude/` 與 monorepo 根是**兩個不同的量**（ruff 逐檔
    # 往上找設定，兩處適用的規則集與掃描面都不同），混用兩個數字就是製造下一筆 stale。
    # pytest 釘選與 requirements-ci.txt 的一致性由根層 tools/check_script_parity.py 機械比對（root-infra-ci）。
    "pytest==9.1.1",
    "pytest-mock>=3.14",
    "ruff==0.15.21",
    "cachetools>=5.3",
    # DEF-101-058 鎖版：原建議「加 <7 上限」經 SA/SD 四方複審獨立複核證實無效——
    # PyPI 從未發布過 hypothesis 7.x（現行最新即 6.156.6），<7 上限不改變任何解析
    # 結果，且今日已無法重現當初宣稱的 19 個測試失敗。比照同區塊 pytest/ruff 的
    # 精確鎖版慣例（DEF-101-006）改為精確版號：本機以全新 venv 驗證
    # hypothesis==6.156.6 下全套測試綠燈（3,566 passed / 196 skipped，含全部
    # property-based 測試），才回寫釘選，防止未來全新環境再度浮動安裝到未經驗證的版本。
    "hypothesis==6.156.6",
    # tools/ 開發腳本（run_bridge_e2e / migrate_yaml_to_db / three_tier_to_playbook）
    # 使用 click；其單元測試 tests/tools/test_run_bridge_e2e.py 於 collection 期即 import。
    # 原先未宣告、靠環境 ambient 安裝，fresh clone 會 ModuleNotFoundError（跨平台重現性缺口）。
    "click>=8.0",
]
# Mutation testing（SD_08 W3 / ADR-SD08-002 — TokenGuardPlugin pilot）
# 鎖 2.4.3：mutmut 3.x CLI 重寫不支援 --paths-to-mutate / --tests-dir，
# 與 monorepo 根層 .github/workflows/autoclaude-ci.yml mutation-test-*-nightly + tools/run_mutmut_in_docker.sh 一致。
# 安裝：pip install 'autoclaude[mutation]'（僅在 Linux container 內安裝）
mutation = [
    "mutmut==2.4.3",
]
# 架構約束檢查（Plugin 互引用 / Layered architecture，搭配 .importlinter）：
#   pip install 'autoclaude[lint]'
#   lint-imports
lint = [
    "import-linter>=2.0",
]
# 全域熱鍵（ESC+F12 乾淨 checkpoint 退出）選配後端：
#   uv pip install -e '.[hotkey]'
#
# R76（R76-17；R68-67 open 跨 8 輪）為何從核心相依移出來：
#   · `keyboard` 0.13.5 自己的 metadata 逐字是 `Requires-Dist: pyobjc ;
#     sys_platform == "darwin"` ⇒ 它就是 macOS 側被拖進 pyobjc 傘包的**成因**，
#     而 pyobjc 是一整批發行版、不是一個套件。
#   · 而它在 macOS 上**根本不生效**：真正擋路的是 `_darwinkeyboard.listen()` 首行的
#     `os.geteuid() != 0`（見 autoclaude/perception/hotkey_handler.py 的 R68 真機取證
#     註記）⇒ 非 root 的 mac 使用者付了整個安裝面卻拿不到任何功能。
#   · 刻意**不寫** `sys_platform == 'win32'`：Linux 的 root 使用者仍可用，寫死 win32
#     等於製造一個新的單平台判準（根 CLAUDE.md 鐵律三的形態）。用 extra 表達「這是
#     選配能力」比用平台 marker 表達「這是某個 OS 的東西」誠實。
#   · 消費面本來就已為缺席設計：`hotkey_handler.py` 的 `_KEYBOARD_AVAILABLE` 旗標在
#     ImportError 時降級為 warning log，`register()` 直接回 False；
#     `tests/test_perception_platform_honesty.py` 亦以 skipif 處理缺席。
#   🔴 **未同步的消費面（本包無權改，交收斂包／R77）**：`tools/bootstrap_core.py`
#      裝的是 `.[dev,notifications,lint]`（不含 hotkey）⇒ 走 bootstrap 的環境自本次起
#      **預設不再有** ESC+F12；`docs/AISDLC_Agent_UserGuide.md:369` 仍寫「已含於 core
#      依賴」、`ONBOARDING.md:529` 仍把 macOS 失效歸因於「輔助使用權限」（實為 euid）。
hotkey = [
    "keyboard>=0.13,<0.14",
]
# 桌面通知後端（任選其一即可）：
#   pip install 'autoclaude[notifications]'
notifications = [
    "plyer>=2.1",
    "win10toast>=0.9; sys_platform == 'win32'",
]
# PostgreSQL 後端（Phase 6 選配，需 docker-compose 起 postgres:17）：
#   pip install 'autoclaude[postgres]'
# 注意：runtime PgStateRepository 走 async asyncpg；但 alembic 只支援同步連線，
# alembic/env.py:42 會 strip `+asyncpg` 改用 psycopg2 → 故 migration 工具需 psycopg2。
# 缺 psycopg2 時 `alembic upgrade head` 報 ModuleNotFoundError（SD_09 R56 揪修：CI
# pg-contract / pg-e2e-nightly job 的 alembic 步驟因此失敗）。psycopg2-binary 為預編譯 wheel，
# 免 CI 安裝 build 依賴。
postgres = [
    "sqlalchemy>=2.0",
    "asyncpg>=0.29",
    "psycopg2-binary>=2.9",
    "alembic>=1.13",
    # 🔴 R76（DEF-101-838；根治位置）：Mako 1.4.0 的 wheel 誤打包了一個**頂層**
    # `tools/` 套件（RECORD 逐字含 `tools/__init__.py`／`tools/toxnox.py`／
    # `tools/warn_tox.py`）。`AutoClaude/tools/` 沒有 `__init__.py` ⇒ regular package
    # 恆勝 namespace package，**與 sys.path 順序無關**，於是凡裝了本 extra 的環境
    # `import tools.*` 全被遮蔽（R76 實測：5 支模組 ImportError rc=2 ＋ 1 支子行程
    # ModuleNotFoundError；釘 1.3.12 後全消）。mako 是 alembic 的相依，故約束下在這裡。
    # CI 端 autoclaude-ci.yml 亦就地帶同一個約束（那是**第二道**，不是唯一一道——
    # 只釘 CI 會讓本機 `uv pip install -e '.[dev,postgres]'` 的人照樣踩到）。
    "mako<1.4",
    "tenacity>=8.2",
    "cachetools>=5.3",
]
# pgvector 向量查詢（需 DB 安裝 pgvector extension）：
#   pip install 'autoclaude[postgres,pgvector]'
pgvector = [
    "pgvector>=0.3",
]
# Claude Agent SDK 執行器後端（improving_68 W-68-3 選配）：
#   pip install 'autoclaude[sdk]'
# 啟用 config executor.backend="sdk"（SdkExecutorAdapter）以 JSON-over-stdio 驅動
# Claude Code，取代 PtyExecutor 的 PTY 文字流。預設後端仍 pty，未裝本 extra 零影響。
sdk = [
    "claude-agent-sdk>=0.2.110",
]

[project.scripts]
autoclaude = "autoclaude.main:main"
# Mac/Windows 相容性 R52 修復（P1）：doc/spec 產檔步 artifact-existence evaluator 專用
# console script——取代舊有 `python -m autoclaude.artifact_check` 教學形態（裸 `python`
# 在 macOS /usr/bin 與多數現代 Linux distro 的乾淨 PATH 上不存在、rc=127），比照既有
# `pytest` console script（sdd_to_playbook_adapter.py 同輪修復採同一手法）：pip
# console_scripts 安裝時的 shim 已內嵌正確直譯器路徑，evaluator_command 免猜 python/python3。
autoclaude-artifact-check = "autoclaude.artifact_check:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# R60 QA-R60-05：`W` 於本輪補入。WHY＝`W605`（invalid-escape-sequence）此前結構上
# 無人看得到：本輪在 tools/local_ci_gate.py（本機 CI 閘門唯一核心）的 docstring 引述
# Windows 路徑 `.\local_ci_gate.ps1` 引入非法轉義 `\l`，Python 3.11 只印
# DeprecationWarning、3.12 起升 SyntaxWarning、CPython 已宣告未來改 SyntaxError，
# 而 `ruff check`（select 無 W）與 pre-commit ruff leg 全綠 ⇒ 只能靠人眼。
# 加入成本實測（AutoClaude/.venv ruff，修完該檔後）：`ruff check --extend-select W
# --statistics .` 的 W 類命中數＝0（含 W291/W293/W391 皆零），即**零存量債**，
# 無需任何 per-file-ignores。
#
# 🔴 `S102`（R116／monorepo 根層 ADR-XPLAT-013 Phase2 D-3，DEF-200-209／DEF-200-217 E2）：
# 根層 `tools/ruff.toml` 的 select 逐字同步本清單（`TestRootToolsLintPolicy::
# test_rule_set_is_identical_to_the_autoclaude_side` 機械鎖住兩邊一致），根層新增了
# 這一條 bandit 規則（只選這一條字面，不選整個 `S` 家族——射程與理由見根層 tools/ruff.toml
# 檔頭），本檔需同步跟上，否則兩邊漂移即紅。落地前現查 `ruff check --select S102 .`：
# 零命中（AutoClaude 側本來就沒有裸 `exec(` 呼叫）。
select = ["E", "F", "I", "UP", "W", "S102"]

[tool.ruff.lint.per-file-ignores]
# prompt 模板長行為「資料內容」：三引號模板內斷行會改變送往 LLM 的 prompt 語意，
# E501 對其無意義（Improving_012 Phase 1 ruff 觸碰檔清理決議）
"autoclaude/decision/prompt_builder.py" = ["E501"]
# 同一理由（R16 跨平台複審 SA 一審發現的既有債，同輪一併清理）：
# build_skeleton() 回傳的三引號模板是寫入 sprint_history.md 的實際 markdown
# 內容，模板內斷行會改變產出檔案語意，E501 對其無意義。
"tools/scaffold_sprint_section.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# legacy / xunit1 允許 record_property 寫入 <property> 元素（xunit2 不支援）
# ac4_nightly_collector.py 依賴 <property name="recall_at_10"> / <property name="p95_ms">
junit_family = "legacy"
# SD_Improving_04 W3 三方審查（Arch-W3-Min-3 / Dev-W3-Maj-2）：
# 抑制 _runner_compat 內部模組層 DeprecationWarning，避免 playbook_runner /
# _runner_internals 頂層 import 引發的噪音；針對性測試（test_runner_compat_deprecated）
# 仍可透過 monkeypatch.delitem + importlib.reload + warnings.catch_warnings 捕獲。
filterwarnings = [
    "ignore::DeprecationWarning:autoclaude.execution._runner_compat",
    "ignore:_runner_compat.*W5.*過渡模組.*:DeprecationWarning",
]
# SD_Improving_07 W2 T2-3：opt-in marker — 真實 PG e2e（PM #2）
# 啟用條件：SD07_REAL_PG_E2E_ENABLED=true + AUTOCLAUDE_TEST_PG_DSN
# 本地預設 skip；CI nightly 啟用。
markers = [
    "pg_real: 需要真實 PG + pgvector 的 e2e 測試（SD_07 T2-3 / PM #2）",
    "perf: 性能 baseline 測試（SD_08 W5 / ADR-SD08-003）；perf-baseline-nightly job 啟用",
    "benchmark: pytest-benchmark 入口（SD_08 W5 / ADR-SD08-003 §3）",
]
